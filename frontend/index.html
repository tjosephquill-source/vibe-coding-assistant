function buildClassMethodGraph(classNode) {
  const classId = classNode.id;
  const contains = fullGraphData.edges.filter(e => e.kind === "contains" && _nid(e.source) === classId);
  const methodIds = new Set(contains.map(e => _nid(e.target)));
  const nodes = fullGraphData.nodes.filter(n => n.kind === "method" && methodIds.has(n.id));
  const nodeIds = new Set(nodes.map(n => n.id));
  const edges = fullGraphData.edges.filter(e => {
    const s = _nid(e.source), t = _nid(e.target);
    return nodeIds.has(s) && nodeIds.has(t);
  });
  return { nodes, edges };
}

function buildIslandChainGraph(metaNode) {
  // The member_ids list contains the IDs of the nodes this island chain replaced.
  // Those members may be classes, other island chains, or group nodes from any
  // hierarchy level.  We look them up across all available data sources:
  //   1. fullGraphData     — original classes and methods
  //   2. rootGraphData     — top-level island chains / groups
  //   3. intermediateGraphData — collapsed intermediate-level nodes
  const memberIds = new Set((metaNode.member_ids || []));

  // Build a comprehensive lookup of all known nodes across all levels
  const allAvailableNodes = new Map();

  // Full graph has all original classes and methods
  fullGraphData.nodes.forEach(n => allAvailableNodes.set(n.id, n));

  // Overview graph has top-level island chains
  rootGraphData.nodes.forEach(n => allAvailableNodes.set(n.id, n));

  // Intermediate graph has collapsed nodes from all hierarchy levels
  intermediateGraphData.nodes.forEach(n => allAvailableNodes.set(n.id, n));

  const nodes = [];
  memberIds.forEach(mid => {
    const n = allAvailableNodes.get(mid);
    if (n) nodes.push(n);
  });

  // If we found no nodes, the members might have been further collapsed.
  // Try to find them by scanning all island chains for matching member_ids.
  if (nodes.length === 0 && memberIds.size > 0) {
    // Fallback: look for any node whose id matches
    fullGraphData.nodes.forEach(n => {
      if (memberIds.has(n.id) && !nodes.find(x => x.id === n.id)) {
        nodes.push(n);
      }
    });
  }

  const nodeIds = new Set(nodes.map(n => n.id));

  // Collect edges between members from all graph sources
  const edgeKey = e => `${_nid(e.source)}|${_nid(e.target)}|${e.kind}`;
  const seenEdges = new Set();
  const edges = [];

  function addEdgesFrom(sourceEdges) {
    sourceEdges.forEach(e => {
      const s = _nid(e.source), t = _nid(e.target);
      if (nodeIds.has(s) && nodeIds.has(t) && e.kind !== "contains") {
        const key = edgeKey(e);
        if (!seenEdges.has(key)) {
          seenEdges.add(key);
          edges.push(e);
        }
      }
    });
  }

  addEdgesFrom(rootGraphData.edges);
  addEdgesFrom(fullGraphData.edges);
  addEdgesFrom(intermediateGraphData.edges);

  return { nodes, edges };
}

function buildGroupGraph(groupNode) {
  // Heuristic group nodes (Tests, Data Models, etc.) hold member_ids
  // pointing to nodes that may live in fullGraphData, rootGraphData,
  // or intermediateGraphData (if they were collapsed at a higher level).
  const memberIds = new Set((groupNode.member_ids || []));

  const allAvailableNodes = new Map();
  fullGraphData.nodes.forEach(n => allAvailableNodes.set(n.id, n));
  rootGraphData.nodes.forEach(n => allAvailableNodes.set(n.id, n));
  intermediateGraphData.nodes.forEach(n => allAvailableNodes.set(n.id, n));

  const nodes = [];
  memberIds.forEach(mid => {
    const n = allAvailableNodes.get(mid);
    if (n) nodes.push(n);
  });

  const nodeIds = new Set(nodes.map(n => n.id));

  const edgeKey = e => `${_nid(e.source)}|${_nid(e.target)}|${e.kind}`;
  const seenEdges = new Set();
  const edges = [];

  function addEdgesFrom(sourceEdges) {
    sourceEdges.forEach(e => {
      const s = _nid(e.source), t = _nid(e.target);
      if (nodeIds.has(s) && nodeIds.has(t) && e.kind !== "contains") {
        const key = edgeKey(e);
        if (!seenEdges.has(key)) {
          seenEdges.add(key);
          edges.push(e);
        }
      }
    });
  }

  addEdgesFrom(fullGraphData.edges);
  addEdgesFrom(rootGraphData.edges);
  addEdgesFrom(intermediateGraphData.edges);

  return { nodes, edges };
}

const _GROUP_KINDS = new Set(["group"]);

function drillIntoNode(d) {
  _inspectorPinned = false;
  if (d.kind === "class") {
    // Don't drill into classes with no methods — nothing to show
    if (!d.methods || d.methods.length === 0) { selectNode(d); return; }
    const sub = buildClassMethodGraph(d);
    graphStack.push({ graph: graphData, label: currentGraphLabel });
    _setGraphView(sub, `Class: ${d.name}`);
    return;
  }
  if (d.kind === "island_chain") {
    const sub = buildIslandChainGraph(d);
    graphStack.push({ graph: graphData, label: currentGraphLabel });
    _setGraphView(sub, `Island Chain: ${d.name}`);
    return;
  }
  if (_GROUP_KINDS.has(d.kind)) {
    const sub = buildGroupGraph(d);
    graphStack.push({ graph: graphData, label: currentGraphLabel });
    _setGraphView(sub, d.name);
    return;
  }
  selectNode(d);
}

// ── Geometry helpers ───────────────────────────────────────────────
function getRectIntersection(x1, y1, x2, y2, rw, rh) {
  const dx = x2 - x1, dy = y2 - y1;
  if (dx === 0 && dy === 0) return { x: x2, y: y2 };
  const hw = rw / 2, hh = rh / 2;
  const absDx = Math.abs(dx), absDy = Math.abs(dy);
  let t;
  if (absDx * hh > absDy * hw) { t = hw / absDx; }
  else { t = hh / absDy; }
  return { x: x2 - dx * t, y: y2 - dy * t };
}

function pullBack(px, py, fromX, fromY, offset) {
  const dx = px - fromX, dy = py - fromY;
  const len = Math.hypot(dx, dy) || 1;
  return { x: px - (dx / len) * offset, y: py - (dy / len) * offset };
}

/**
 * Test whether a line segment from (x1,y1)→(x2,y2) intersects an
 * axis-aligned rectangle centered at (cx,cy) with full dimensions w×h.
 * Uses Liang–Barsky clipping.
 */
function segmentIntersectsRect(x1, y1, x2, y2, cx, cy, w, h) {
  const hw = w / 2, hh = h / 2;
  const left = cx - hw, right = cx + hw, top = cy - hh, bottom = cy + hh;
  let tMin = 0, tMax = 1;
  const dx = x2 - x1, dy = y2 - y1;
  const clips = [
    { p: -dx, q: x1 - left },
    { p:  dx, q: right - x1 },
    { p: -dy, q: y1 - top },
    { p:  dy, q: bottom - y1 },
  ];
  for (const { p, q } of clips) {
    if (p === 0) { if (q < 0) return false; }
    else {
      const r = q / p;
      if (p < 0) { if (r > tMax) return false; if (r > tMin) tMin = r; }
      else       { if (r < tMin) return false; if (r < tMax) tMax = r; }
    }
  }
  return tMin <= tMax;
}

/**
 * After grid placement, globally optimise node positions so that edges
 * do not pass through unconnected nodes and connected nodes stay close.
 *
 * Uses a two-phase approach:
 *   Phase 1 – best pairwise swap: each iteration evaluates EVERY pair
 *             of nodes, picks the swap with the largest score improvement,
 *             and applies it.  Repeats until no swap helps.
 *   Phase 2 – relocate to empty cells: tries moving each node to nearby
 *             empty grid cells, picks the best move each iteration.
 *
 * The global scoring function weighs edge-node collisions very heavily
 * (10 000 per collision) and adds total edge length as a tiebreaker so
 * that, among collision-free layouts, the one with shorter edges wins.
 */
function resolveEdgeNodeCollisions(nodeData, linkData, colGap, rowGap) {
  if (!linkData || linkData.length === 0 || nodeData.length < 2) return;

  const edgePairs = [];
  linkData.forEach(e => {
    const s = typeof e.source === "object" ? e.source.id : e.source;
    const t = typeof e.target === "object" ? e.target.id : e.target;
    edgePairs.push([s, t]);
  });

  const nodeById = new Map(nodeData.map(n => [n.id, n]));
  const PAD = 12;
  const N = nodeData.length;

  // ── Global scoring function ──────────────────────────────────────
  function layoutScore() {
    let collisions = 0, edgeLen = 0;
    for (const [sid, tid] of edgePairs) {
      const src = nodeById.get(sid), tgt = nodeById.get(tid);
      if (!src || !tgt) continue;
      edgeLen += Math.hypot(src.x - tgt.x, src.y - tgt.y);
      for (const n of nodeData) {
        if (n.id === sid || n.id === tid) continue;
        const sz = NODE_SIZE[n.kind] || { w: 160, h: 60 };
        if (segmentIntersectsRect(src.x, src.y, tgt.x, tgt.y,
                                  n.x, n.y, sz.w + PAD, sz.h + PAD)) {
          collisions++;
        }
      }
    }
    return collisions * 10000 + edgeLen;
  }

  function swap(a, b) {
    const tx = a.x, ty = a.y;
    a.x = b.x; a.y = b.y;
    b.x = tx; b.y = ty;
  }

  // ── Phase 1: best pairwise swap ──────────────────────────────────
  const SWAP_LIMIT = N > 40 ? 8 : 25;
  for (let iter = 0; iter < SWAP_LIMIT; iter++) {
    const base = layoutScore();
    if (base === 0) return;                       // perfect layout
    let bestDelta = 0, bestI = -1, bestJ = -1;

    for (let i = 0; i < N; i++) {
      for (let j = i + 1; j < N; j++) {
        swap(nodeData[i], nodeData[j]);
        const delta = base - layoutScore();
        swap(nodeData[i], nodeData[j]);           // undo
        if (delta > bestDelta) { bestDelta = delta; bestI = i; bestJ = j; }
      }
    }
    if (bestI < 0) break;                         // no improving swap
    swap(nodeData[bestI], nodeData[bestJ]);
  }

  // ── Phase 2: relocate to empty cells ─────────────────────────────
  const posKey = (x, y) => x + "|" + y;
  const occ = new Set(nodeData.map(n => posKey(n.x, n.y)));
  const empties = [];
  const seen = new Set();
  for (const n of nodeData) {
    for (let dr = -3; dr <= 3; dr++) {
      for (let dc = -3; dc <= 3; dc++) {
        if (dr === 0 && dc === 0) continue;
        const ex = n.x + dc * colGap, ey = n.y + dr * rowGap;
        const k = posKey(ex, ey);
        if (!occ.has(k) && !seen.has(k)) { seen.add(k); empties.push({ x: ex, y: ey }); }
      }
    }
  }

  const MOVE_LIMIT = N > 40 ? 6 : 15;
  for (let iter = 0; iter < MOVE_LIMIT; iter++) {
    const base = layoutScore();
    if (base === 0) return;
    let bestDelta = 0, bestIdx = -1, bestCell = null;

    for (let i = 0; i < N; i++) {
      const ox = nodeData[i].x, oy = nodeData[i].y;
      for (const cell of empties) {
        if (occ.has(posKey(cell.x, cell.y))) continue;
        nodeData[i].x = cell.x; nodeData[i].y = cell.y;
        const delta = base - layoutScore();
        nodeData[i].x = ox; nodeData[i].y = oy;
        if (delta > bestDelta) { bestDelta = delta; bestIdx = i; bestCell = cell; }
      }
    }

    if (bestIdx >= 0) {
      occ.delete(posKey(nodeData[bestIdx].x, nodeData[bestIdx].y));
      nodeData[bestIdx].x = bestCell.x;
      nodeData[bestIdx].y = bestCell.y;
      occ.add(posKey(bestCell.x, bestCell.y));
    } else {
      break;
    }
  }
}

function edgePath(d) {
  const src = (typeof d.source === "object" && d.source !== null) ? d.source : window._nodeData?.find(n => n.id === d.source);
  const tgt = (typeof d.target === "object" && d.target !== null) ? d.target : window._nodeData?.find(n => n.id === d.target);
  if (!src || !tgt || src.x == null || src.y == null || tgt.x == null || tgt.y == null) return "M0,0";

  const srcSize = NODE_SIZE[src.kind] || { w: 160, h: 60 };
  const tgtSize = NODE_SIZE[tgt.kind] || { w: 160, h: 60 };
  const dx = tgt.x - src.x, dy = tgt.y - src.y;
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  const offset = d._curve || 0;
  const sx = src.x + nx * offset, sy = src.y + ny * offset;
  const tx = tgt.x + nx * offset, ty = tgt.y + ny * offset;
  const rawStart = getRectIntersection(tx, ty, sx, sy, srcSize.w, srcSize.h);
  const rawEnd   = getRectIntersection(sx, sy, tx, ty, tgtSize.w, tgtSize.h);
  const markerOff = MARKER_OFFSET[d.kind] || 14;
  const end = pullBack(rawEnd.x, rawEnd.y, sx, sy, markerOff);
  const start = d.kind === "contains"
    ? pullBack(rawStart.x, rawStart.y, tx, ty, markerOff)
    : rawStart;
  return `M${start.x},${start.y} L${end.x},${end.y}`;
}

/** Compute the midpoint position for an edge label. */
function _edgeLabelPos(d) {
  const src = (typeof d.source === "object" && d.source !== null) ? d.source : window._nodeData?.find(n => n.id === d.source);
  const tgt = (typeof d.target === "object" && d.target !== null) ? d.target : window._nodeData?.find(n => n.id === d.target);
  if (!src || !tgt || src.x == null || tgt.x == null) return { x: 0, y: 0 };
  const dx = tgt.x - src.x, dy = tgt.y - src.y;
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  const offset = d._curve || 0;
  // Stagger along the edge direction so parallel labels don't overlap
  const along = offset * 0.6;
  return {
    x: (src.x + tgt.x) / 2 + nx * offset + (dx / len) * along,
    y: (src.y + tgt.y) / 2 + ny * offset + (dy / len) * along - 6,
  };
}

// ── Initial layout helpers ─────────────────────────────────────────
function buildAdjacency(nodes, links) {
  const adj = new Map(nodes.map(n => [n.id, new Set()]));
  links.forEach(e => {
    const s = typeof e.source === "object" ? e.source.id : e.source;
    const t = typeof e.target === "object" ? e.target.id : e.target;
    if (adj.has(s) && adj.has(t)) { adj.get(s).add(t); adj.get(t).add(s); }
  });
  return adj;
}

function connectedComponents(nodes, links) {
  const byId = new Map(nodes.map(n => [n.id, n]));
  const adj = buildAdjacency(nodes, links);
  const seen = new Set();
  const comps = [];
  for (const n of nodes) {
    if (seen.has(n.id)) continue;
    const q = [n.id]; seen.add(n.id); const comp = [];
    while (q.length) {
      const id = q.pop(); comp.push(byId.get(id));
      for (const nxt of adj.get(id) || []) { if (!seen.has(nxt)) { seen.add(nxt); q.push(nxt); } }
    }
    comps.push(comp);
  }
  return comps.sort((a, b) => b.length - a.length);
}

function seedPositions(nodes, links, width, height) {
  const comps = connectedComponents(nodes, links);
  const isolatedComps = comps.filter(c => c.length === 1);
  const connectedComps = comps.filter(c => c.length > 1);
  const compCols = Math.max(1, Math.ceil(Math.sqrt(connectedComps.length)));
  const compRows = Math.max(1, Math.ceil(connectedComps.length / compCols));
  const startX = width / 2 - ((compCols - 1) * COMPONENT_GAP_X) / 2;
  const startY = height / 2 - ((compRows - 1) * COMPONENT_GAP_Y) / 2;
  const degree = new Map(nodes.map(n => [n.id, 0]));
  links.forEach(e => {
    const s = typeof e.source === "object" ? e.source.id : e.source;
    const t = typeof e.target === "object" ? e.target.id : e.target;
    if (degree.has(s)) degree.set(s, degree.get(s) + 1);
    if (degree.has(t)) degree.set(t, degree.get(t) + 1);
  });
  connectedComps.forEach((comp, i) => {
    const col = i % compCols; const row = Math.floor(i / compCols);
    const cx = startX + col * COMPONENT_GAP_X; const cy = startY + row * COMPONENT_GAP_Y;
    const sorted = [...comp].sort((a, b) => (degree.get(b.id) || 0) - (degree.get(a.id) || 0));
    const coreCount = Math.max(1, Math.floor(sorted.length * 0.2));
    sorted.forEach((n, idx) => {
      if (idx < coreCount) {
        const a = (2 * Math.PI * idx) / coreCount; n.x = cx + Math.cos(a) * 40; n.y = cy + Math.sin(a) * 40;
      } else {
        const ringIdx = idx - coreCount; const ring = Math.floor(ringIdx / 8) + 1;
        const inRing = ringIdx % 8; const countInRing = Math.min(8, sorted.length - coreCount - (ring - 1) * 8);
        const a = (2 * Math.PI * inRing) / Math.max(1, countInRing); const r = 90 + ring * 70;
        n.x = cx + Math.cos(a) * r; n.y = cy + Math.sin(a) * r;
      }
    });
  });
  const bottomY = startY + compRows * COMPONENT_GAP_Y + ISOLATED_ROW_Y_OFFSET;
  const isoColGap = isolatedComps.length > 12 ? 300 : ISOLATED_COL_GAP;
  const isoRowGap = isolatedComps.length > 12 ? 260 : GRID_SNAP_ROW_GAP;
  const isoCols = Math.max(1, Math.min(isolatedComps.length, Math.ceil(Math.sqrt(isolatedComps.length * 1.4))));
  const totalIsolatedW = (isoCols - 1) * isoColGap;
  const isolatedStartX = width / 2 - totalIsolatedW / 2;
  isolatedComps.forEach((comp, i) => {
    const col = i % isoCols;
    const row = Math.floor(i / isoCols);
    comp[0].x = isolatedStartX + col * isoColGap; comp[0].y = bottomY + row * isoRowGap; comp[0]._isolated = true; comp[0]._isolatedTargetY = bottomY + row * isoRowGap;
  });
}

function makeIsolatedBottomForce(isolatedY, strength = 0.15) {
  let nodes = [];
  function force(alpha) { for (const n of nodes) { if (!n._isolated) continue; const targetY = n._isolatedTargetY || isolatedY; n.vy += (targetY - n.y) * strength * alpha; } }
  force.initialize = (_nodes) => { nodes = _nodes || []; };
  return force;
}

function gridLayout(nodeData, width, height) {
  // Lay out nodes in a simple grid centered in the viewport
  const count = nodeData.length;
  if (count === 0) return;
  const cols = Math.max(1, Math.ceil(Math.sqrt(count * 1.8)));
  const colGap = count > 20 ? 340 : count > 12 ? 420 : GRID_SNAP_COL_GAP;
  const rowGap = count > 20 ? 260 : count > 12 ? 310 : GRID_SNAP_ROW_GAP;
  const rows = Math.ceil(count / cols);
  const gridW = (cols - 1) * colGap;
  const gridH = (rows - 1) * rowGap;
  const originX = width / 2 - gridW / 2;
  const originY = height / 2 - gridH / 2;
  nodeData.forEach(function(n, i) {
    const col = i % cols;
    const row = Math.floor(i / cols);
    n.x = originX + col * colGap;
    n.y = originY + row * rowGap;
    n.fx = null;
    n.fy = null;
  });
}

// ── Render ─────────────────────────────────────────────────────────
// Height of the breadcrumb bar (used to offset the fit area)
const _BREADCRUMB_H = 30;
// Height of the description bar at the bottom
const _DESC_BAR_H = 0;

function fitGraphToViewport(svg, zoomBehavior, nodeData, width, height, padding, animate) {
  if (padding === undefined) padding = 40;
  if (animate === undefined) animate = true;
  if (!nodeData || nodeData.length === 0) return;
  if (width <= 0 || height <= 0) return;

  // Extra top padding so nodes don't hide behind the breadcrumb
  var padTop = padding + _BREADCRUMB_H;
  var padSide = padding;
  var padBottom = padding + _DESC_BAR_H;

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  nodeData.forEach(n => {
    const s = NODE_SIZE[n.kind] || { w: 160, h: 60 };
    const x1 = n.x - s.w / 2, x2 = n.x + s.w / 2;
    const y1 = n.y - s.h / 2, y2 = n.y + s.h / 2;
    if (x1 < minX) minX = x1; if (y1 < minY) minY = y1;
    if (x2 > maxX) maxX = x2; if (y2 > maxY) maxY = y2;
  });
  const graphW = Math.max(1, maxX - minX);
  const graphH = Math.max(1, maxY - minY);
  const availW = Math.max(1, width - padSide * 2);
  const availH = Math.max(1, height - padTop - padBottom);
  // Don't clamp to a max — allow arbitrarily small scales so all nodes fit
  const scale = Math.min(availW / graphW, availH / graphH);
  const tx = (width - graphW * scale) / 2 - minX * scale;
  const ty = padTop + (availH - graphH * scale) / 2 - minY * scale;
  const t = d3.zoomIdentity.translate(tx, ty).scale(scale);
  if (animate) { svg.transition().duration(250).call(zoomBehavior.transform, t); }
  else { svg.call(zoomBehavior.transform, t); }
}

function snapNodesToGrid(nodeData, svg, g, node, link, edgeLabel, linkData, zoomBehavior) {
  if (!nodeData || nodeData.length === 0) return;

  const container = document.getElementById("graph-container");
  if (!container) return;
  const width = container.clientWidth;
  const height = container.clientHeight;

  nodeData.forEach(n => { n.fx = null; n.fy = null; });

  // ── Separate connected vs edgeless nodes ─────────────────────────
  const connectedIds = new Set();
  if (linkData && linkData.length > 0) {
    linkData.forEach(e => {
      const s = typeof e.source === "object" ? e.source.id : e.source;
      const t = typeof e.target === "object" ? e.target.id : e.target;
      connectedIds.add(s); connectedIds.add(t);
    });
  }
  const connectedNodes = nodeData.filter(n => connectedIds.has(n.id));
  const edgelessNodes  = nodeData.filter(n => !connectedIds.has(n.id));

  // ── Helper: compute grid dimensions (horizontal-biased) ──────────
  function gridDims(count) {
    const colGap = count > 20 ? 340 : count > 12 ? 420 : GRID_SNAP_COL_GAP;
    const rowGap = count > 20 ? 260 : count > 12 ? 310 : GRID_SNAP_ROW_GAP;
    // Use higher aspect multiplier for stronger horizontal bias
    const cols = Math.max(1, Math.ceil(Math.sqrt(count * 1.8)));
    const rows = Math.max(1, Math.ceil(count / cols));
    return { cols, rows, colGap, rowGap };
  }

  // ── Place connected nodes via BFS topology-aware placement ───────
  const cCount = connectedNodes.length || 1;
  const cGrid = gridDims(cCount);
  const cTotalW = (cGrid.cols - 1) * cGrid.colGap;
  const cTotalH = (cGrid.rows - 1) * cGrid.rowGap;
  const cOriginX = width / 2 - cTotalW / 2;
  const cOriginY = height / 2 - cTotalH / 2;

  if (connectedNodes.length > 0) {
    // Build adjacency
    const _adj = new Map();
    const _nodeById = new Map();
    connectedNodes.forEach(n => { _adj.set(n.id, new Set()); _nodeById.set(n.id, n); });
    linkData.forEach(e => {
      const s = typeof e.source === "object" ? e.source.id : e.source;
      const t = typeof e.target === "object" ? e.target.id : e.target;
      if (_adj.has(s)) _adj.get(s).add(t);
      if (_adj.has(t)) _adj.get(t).add(s);
    });
    const _deg = new Map();
    connectedNodes.forEach(n => _deg.set(n.id, _adj.get(n.id)?.size || 0));

    // BFS ordering
    const _bfs = [];
    const _vis = new Set();
    while (_vis.size < connectedNodes.length) {
      let best = null, bestD = -1;
      for (const n of connectedNodes) {
        if (!_vis.has(n.id) && (_deg.get(n.id) || 0) > bestD) {
          bestD = _deg.get(n.id) || 0; best = n;
        }
      }
      if (!best) break;
      const q = [best]; _vis.add(best.id);
      while (q.length > 0) {
        const cur = q.shift();
        _bfs.push(cur);
        const nbrs = [...(_adj.get(cur.id) || [])].sort(
          (a, b) => (_deg.get(b) || 0) - (_deg.get(a) || 0)
        );
        for (const nid of nbrs) {
          if (!_vis.has(nid)) { _vis.add(nid); const nb = _nodeById.get(nid); if (nb) q.push(nb); }
        }
      }
    }

    // Grid cells for connected nodes
    const _cells = [];
    for (let r = 0; r < cGrid.rows; r++) {
      for (let c = 0; c < cGrid.cols; c++) {
        _cells.push({ x: cOriginX + c * cGrid.colGap, y: cOriginY + r * cGrid.rowGap });
      }
    }
    while (_cells.length < connectedNodes.length) {
      const r = Math.floor(_cells.length / cGrid.cols);
      const c = _cells.length % cGrid.cols;
      _cells.push({ x: cOriginX + c * cGrid.colGap, y: cOriginY + r * cGrid.rowGap });
    }

    const _used = new Set();
    const _placedPos = new Map();
    // Place first node at center of grid
    const midIdx = Math.min(
      Math.floor(cGrid.rows / 2) * cGrid.cols + Math.floor(cGrid.cols / 2),
      _cells.length - 1
    );
    const _midCell = _cells[midIdx];

    // Row-major index as tiebreaker: prefer top-left cells when costs are equal
    _bfs.forEach(n => {
      const nbrs = [...(_adj.get(n.id) || [])]
        .filter(nid => _placedPos.has(nid))
        .map(nid => _placedPos.get(nid));

      let bestIdx = -1, bestCost = Infinity;
      for (let ci = 0; ci < _cells.length; ci++) {
        if (_used.has(ci)) continue;
        const cell = _cells[ci];
        let cost;
        if (nbrs.length > 0) {
          cost = 0;
          for (const p of nbrs) {
            cost += Math.abs(cell.x - p.x) + Math.abs(cell.y - p.y) * 1.5;
          }
        } else {
          cost = Math.abs(cell.x - _midCell.x) + Math.abs(cell.y - _midCell.y) * 1.5;
        }
        // Tiny row-major tiebreaker so equal costs prefer top-left (horizontal first)
        cost += ci * 0.001;
        if (cost < bestCost) { bestCost = cost; bestIdx = ci; }
      }
      if (bestIdx >= 0) {
        n.x = _cells[bestIdx].x;
        n.y = _cells[bestIdx].y;
        _used.add(bestIdx);
        _placedPos.set(n.id, { x: n.x, y: n.y });
      }
    });
  }

  // ── Resolve edge-through-node collisions (connected nodes only) ──
  // Run BEFORE placing edgeless nodes so that any connected-node
  // relocations are accounted for when computing maxConnectedY.
  if (linkData && linkData.length > 0 && connectedNodes.length > 1) {
    resolveEdgeNodeCollisions(connectedNodes, linkData, cGrid.colGap, cGrid.rowGap);
  }

  // ── Place edgeless nodes in a row-major grid BELOW connected nodes ──
  if (edgelessNodes.length > 0) {
    const eGrid = gridDims(edgelessNodes.length);
    const eTotalW = (eGrid.cols - 1) * eGrid.colGap;

    // Compute bottom of connected region (after collision resolution)
    let maxConnectedY = cOriginY;
    if (connectedNodes.length > 0) {
      connectedNodes.forEach(n => { if (n.y > maxConnectedY) maxConnectedY = n.y; });
    }
    const eOriginY = maxConnectedY + ISOLATED_ROW_Y_OFFSET;
    const eOriginX = width / 2 - eTotalW / 2;

    // Strict row-major fill: left-to-right, top-to-bottom
    edgelessNodes.forEach((n, i) => {
      const col = i % eGrid.cols;
      const row = Math.floor(i / eGrid.cols);
      n.x = eOriginX + col * eGrid.colGap;
      n.y = eOriginY + row * eGrid.rowGap;
    });
  }


  node.attr("transform", d => `translate(${d.x ?? 0},${d.y ?? 0})`);
  link.attr("d", edgePath);
    edgeLabel.attr("x", d => _edgeLabelPos(d).x).attr("y", d => _edgeLabelPos(d).y);
  // Fit immediately (no animation) then animate a refined fit
  fitGraphToViewport(svg, zoomBehavior, nodeData, width, height, 20, false);
  setTimeout(function() {
    const c = document.getElementById("graph-container");
    if (!c) return;
    fitGraphToViewport(svg, zoomBehavior, nodeData, c.clientWidth, c.clientHeight, 20, true);
  }, 50);
}

/**
 * After layout/snap settles, verify every node is on-screen in the
 * overview (top) panel.  If any node is clipped, refit with generous padding.
 */
function ensureAllNodesVisible(svg, zoomBehavior, nodeData) {
  if (!nodeData || nodeData.length === 0) return;

  const container = document.getElementById("graph-container");
  if (!container) return;
  const width = container.clientWidth;
  const height = container.clientHeight;

  // Re-read the current transform and check if all node bounding boxes are inside
  const t = d3.zoomTransform(svg.node());
  let allVisible = true;
  for (let i = 0; i < nodeData.length; i++) {
    const n = nodeData[i];
    const s = NODE_SIZE[n.kind] || { w: 160, h: 60 };
    const sx1 = t.applyX(n.x - s.w / 2);
    const sy1 = t.applyY(n.y - s.h / 2);
    const sx2 = t.applyX(n.x + s.w / 2);
    const sy2 = t.applyY(n.y + s.h / 2);
    if (sx1 < -10 || sy1 < -10 || sx2 > width + 10 || sy2 > height + 10) {
      allVisible = false;
      break;
    }
  }
  if (!allVisible) {
    fitGraphToViewport(svg, zoomBehavior, nodeData, width, height, 20, true);
  }
}

function centerDetailOnGraphPoint(graphX, graphY, animate) {
  if (animate === undefined) animate = true;
  if (!_zoomSvg || !_zoomDetailBehavior) return;
  const zoomContainer = document.getElementById("zoom-container");
  if (!zoomContainer) return;
  const zw = zoomContainer.clientWidth;
  const zh = zoomContainer.clientHeight;
  const fallbackScale = (_overviewTransform ? _overviewTransform.k : 1) * DETAIL_ZOOM_SCALE;
  const detailScale = _zoomDetailTransform ? _zoomDetailTransform.k : fallbackScale;
  const dtx = zw / 2 - graphX * detailScale;
  const dty = zh / 2 - graphY * detailScale;
  const t = d3.zoomIdentity.translate(dtx, dty).scale(detailScale);
  if (animate) { _zoomSvg.transition().duration(250).call(_zoomDetailBehavior.transform, t); }
  else { _zoomSvg.call(_zoomDetailBehavior.transform, t); }
}

function updateViewportIndicator() {
  if (!_viewportRect || !_zoomDetailTransform || !_overviewTransform) return;

  const zoomContainer = document.getElementById("zoom-container");
  if (!zoomContainer) return;
  const zw = zoomContainer.clientWidth;
  const zh = zoomContainer.clientHeight;

  const detailInv = _zoomDetailTransform.invert([0, 0]);
  const detailInv2 = _zoomDetailTransform.invert([zw, zh]);

  const gx1 = detailInv[0], gy1 = detailInv[1];
  const gx2 = detailInv2[0], gy2 = detailInv2[1];

  const ox1 = _overviewTransform.applyX(gx1);
  const oy1 = _overviewTransform.applyY(gy1);
  const ox2 = _overviewTransform.applyX(gx2);
  const oy2 = _overviewTransform.applyY(gy2);

  _viewportRect
    .attr("x", ox1)
    .attr("y", oy1)
    .attr("width", ox2 - ox1)
    .attr("height", oy2 - oy1)
    .attr("visibility", "visible");
}

function initDetailView(overviewSvg, overviewG, overviewZoomBehavior, nodeData) {
  cleanupDetailView();

  const zoomSvg = d3.select("#zoom-svg");
  if (zoomSvg.empty()) return;  // detail-view panel not mounted
  _zoomSvg = zoomSvg;
  _overviewSvgRef = overviewSvg;

  const zoomContainer = document.getElementById("zoom-container");
  if (!zoomContainer) return;
  const zw = zoomContainer.clientWidth;
  const zh = zoomContainer.clientHeight;

  // Clone the overview <g> contents into the detail SVG
  // First, copy the <defs> for markers
  const overviewDefs = overviewSvg.select("defs").node();
  if (overviewDefs) {
    zoomSvg.node().appendChild(overviewDefs.cloneNode(true));
  }

  const zoomG = zoomSvg.append("g");

  const overviewGNode = overviewG.node();
  if (overviewGNode) {
    const clone = overviewGNode.cloneNode(true);
    zoomG.node().appendChild(clone);
    const inner = zoomG.select("g");
    if (inner.node()) {
      while (inner.node().firstChild) {
        zoomG.node().appendChild(inner.node().firstChild);
      }
      inner.remove();
    }
  }

  // Set up zoom/pan on the detail SVG
  _zoomDetailBehavior = d3.zoom()
    .scaleExtent([0.1, 10])
    .on("zoom", function(event) {
      zoomG.attr("transform", event.transform);
      _zoomDetailTransform = event.transform;
      updateViewportIndicator();
    });

  zoomSvg.call(_zoomDetailBehavior);

  const currentOverview = d3.zoomTransform(overviewSvg.node());
  _overviewTransform = currentOverview;

  // Default: fit all nodes in view (zoomed out, same as Overview)
  if (nodeData && nodeData.length > 0) {
    let dMinX = Infinity, dMinY = Infinity, dMaxX = -Infinity, dMaxY = -Infinity;
    nodeData.forEach(n => {
      const s = NODE_SIZE[n.kind] || { w: 160, h: 60 };
      const x1 = n.x - s.w / 2, x2 = n.x + s.w / 2;
      const y1 = n.y - s.h / 2, y2 = n.y + s.h / 2;
      if (x1 < dMinX) dMinX = x1; if (y1 < dMinY) dMinY = y1;
      if (x2 > dMaxX) dMaxX = x2; if (y2 > dMaxY) dMaxY = y2;
    });
    const dGraphW = Math.max(1, dMaxX - dMinX);
    const dGraphH = Math.max(1, dMaxY - dMinY);
    const dPad = 40;
    const dAvailW = Math.max(1, zw - dPad * 2);
    const dAvailH = Math.max(1, zh - dPad * 2);
    const dScale = Math.min(dAvailW / dGraphW, dAvailH / dGraphH);
    const dtx = (zw - dGraphW * dScale) / 2 - dMinX * dScale;
    const dty = (zh - dGraphH * dScale) / 2 - dMinY * dScale;
    const initTransform = d3.zoomIdentity.translate(dtx, dty).scale(dScale);

    zoomSvg.call(_zoomDetailBehavior.transform, initTransform);
    _zoomDetailTransform = initTransform;
  }

  // Add clickable/hoverable node hit-layer in detail view (bottom): hover highlights, click drills
  const hitLayer = zoomG.append("g").attr("class", "detail-hit-layer");

  const SCROLLABLE_KINDS = ["class", "method", "island_chain", "group"];
  const HEADER_H = 38; // height of the title+kind header area above the scrollable content

  const hitGroups = hitLayer.selectAll("g")
    .data(nodeData || [])
    .join("g")
    .attr("transform", d => `translate(${d.x ?? 0},${d.y ?? 0})`);

  // For nodes with scrollable content: header-only hit rect (top 38px)
  // Build a map of node-id → cloned .node-group DOM element for auto-scroll
  const _detailNodeEls = {};
  zoomG.selectAll(".node-group").each(function() {
    const nid = d3.select(this).attr("data-node-id");
    if (nid) _detailNodeEls[nid] = this;
  });

  hitGroups.filter(d => SCROLLABLE_KINDS.includes(d.kind))
    .append("rect")
    .attr("x", d => -(NODE_SIZE[d.kind]?.w || 160) / 2)
    .attr("y", d => -(NODE_SIZE[d.kind]?.h || 60) / 2)
    .attr("width", d => NODE_SIZE[d.kind]?.w || 160)
    .attr("height", HEADER_H)
    .attr("fill", "transparent")
    .style("pointer-events", "all")
    .style("cursor", "pointer")
    .on("mouseenter", function(event,d) {
      event.stopPropagation();
      highlightConnected(d);
      if (_detailNodeEls[d.id]) _startAutoScroll(_detailNodeEls[d.id], "detail_" + d.id);
    })
    .on("mouseleave", function(event,d) {
      clearHighlight();
      _deferStopAutoScroll("detail_" + d.id);
    })
    .on("click", function(event,d) {
      event.stopPropagation();
      drillIntoNode(d);
    })
    .on("contextmenu", function(event,d) {
      showNodeContextMenu(event, d);
    });

  // For simple nodes (method, etc.): full-size hit rect
  hitGroups.filter(d => !SCROLLABLE_KINDS.includes(d.kind))
    .append("rect")
    .attr("x", d => -(NODE_SIZE[d.kind]?.w || 160) / 2)
    .attr("y", d => -(NODE_SIZE[d.kind]?.h || 60) / 2)
    .attr("width", d => NODE_SIZE[d.kind]?.w || 160)
    .attr("height", d => NODE_SIZE[d.kind]?.h || 60)
    .attr("fill", "transparent")
    .style("pointer-events", "all")
    .style("cursor", "pointer")
    .on("mouseenter", function(event, d) {
      event.stopPropagation();
      highlightConnected(d);
    })
    .on("mouseleave", function() {
      clearHighlight();
    })
    .on("click", function(event, d) {
      event.stopPropagation();
      drillIntoNode(d);
    })
    .on("contextmenu", function(event, d) {
      showNodeContextMenu(event, d);
    });

  // Wire up events on cloned foreignObjects so scrollable body area is also interactive
  const nodeDataById = {};
  (nodeData || []).forEach(function(n) { nodeDataById[n.id] = n; });
  zoomG.selectAll(".node-group").each(function() {
    const el = d3.select(this);
    const nid = el.attr("data-node-id");
    const nd = nodeDataById[nid];
    if (!nd) return;
    const groupEl = this;
    el.selectAll(".node-methods-fo")
      .on("mouseenter", function(event) { event.stopPropagation(); highlightConnected(nd); _startAutoScroll(groupEl, "detail_" + nd.id); })
      .on("mouseleave", function(event) { clearHighlight(); _deferStopAutoScroll("detail_" + nd.id); })
      .on("click", function(event) { event.stopPropagation(); drillIntoNode(nd); })
      .on("contextmenu", function(event) { showNodeContextMenu(event, nd); });
  });

  // Add the viewport indicator rect to the overview SVG (on top of everything)
  _viewportRect = overviewSvg.append("rect").attr("class", "viewport-rect");
  updateViewportIndicator();

  // Click on detail background clears highlight
  zoomSvg.on("click.clearhighlight", function() { _inspectorPinned = false; clearHighlight(); });

  // Click on overview background to recenter the detail view
  overviewSvg.on("click.detailnav", function(event) {
    const [mx, my] = d3.pointer(event, this);
    const overviewT = d3.zoomTransform(overviewSvg.node());
    _overviewTransform = overviewT;
    centerDetailOnGraphPoint(overviewT.invertX(mx), overviewT.invertY(my), true);
  });

  // Drag on overview to pan the detail view
  overviewSvg.on("mousedown.detailnav", function(event) {
    if (event.button !== 0) return;
    _detailIsDragging = true;
  });
  overviewSvg.on("mousemove.detailnav", function(event) {
    if (!_detailIsDragging) return;
    const [mx, my] = d3.pointer(event, this);
    const overviewT = d3.zoomTransform(overviewSvg.node());
    _overviewTransform = overviewT;
    centerDetailOnGraphPoint(overviewT.invertX(mx), overviewT.invertY(my), false);
  });
  d3.select(window).on("mouseup.detailnav", function() { _detailIsDragging = false; });
}

    .append("foreignObject").attr("class","node-methods-fo")
    .attr("x",d=>-(NODE_SIZE[d.kind].w/2)).attr("y",d=>-(NODE_SIZE[d.kind].h/2)+38)
    .attr("width",d=>NODE_SIZE[d.kind].w).attr("height",d=>NODE_SIZE[d.kind].h-40)
    .html(d=>{const classes=(d.members||[]).map(m=>`<div>${m}</div>`).join("");const methods=(d.member_methods||[]).map(m=>`<div>${m}()</div>`).join("");let body="";if(classes)body+=`<div class="node-methods-label">Members (${(d.members||[]).length})</div><div class="node-methods-scroll">${classes}</div>`;if(methods)body+=`<div class="node-methods-label">Methods (${(d.member_methods||[]).length})</div><div class="node-methods-scroll">${methods}</div>`;if(!body)body='<div>(none)</div>';return`<div xmlns="http://www.w3.org/1999/xhtml" class="node-methods-box">${body}</div>`;});
  groupFo.on("mouseenter",function(event,d){ event.stopPropagation(); highlightConnected(d); _startAutoScroll(this.parentNode, d.id); })
    .on("mouseleave",function(event,d){ if (_ctxMenuNode) return; clearHighlight(); _deferStopAutoScroll(d.id); })
    .on("click",function(event,d){
    event.stopPropagation();
    centerDetailOnGraphPoint(d.x, d.y, true);
  }).on("contextmenu",function(event,d){ showNodeContextMenu(event,d); });

  function _initDetail() {
    _pendingDetailTimeout = setTimeout(function() {
      _pendingDetailTimeout = null;
      _overviewTransform = d3.zoomTransform(svg.node());
      initDetailView(svg, g, zoomBehavior, nodeData);
    }, 350);
  }

  // Helper: apply positions map to nodeData, render, and save to both caches
  function _applyPositionsAndRender(posMap) {
    nodeData.forEach(n => {
      const pos = posMap[n.id] || posMap.get?.(n.id);
      if (pos) { n.x = pos.x; n.y = pos.y; }
    });
    window._nodes = node; window._links = link; window._edgeLabels = edgeLabel; window._nodeData = nodeData; window._linkData = linkData;
    const nodeMap = new Map(nodeData.map(n => [n.id, n]));
    linkData.forEach(d => {
      if (typeof d.source === "string") d.source = nodeMap.get(d.source) || d.source;
      if (typeof d.target === "string") d.target = nodeMap.get(d.target) || d.target;
    });
    node.attr("transform", d => `translate(${d.x ?? 0},${d.y ?? 0})`);
    link.attr("d", edgePath);
    edgeLabel.attr("x", d => _edgeLabelPos(d).x).attr("y", d => _edgeLabelPos(d).y);

    const ctr = document.getElementById("graph-container");
    if (ctr) fitGraphToViewport(svg, zoomBehavior, nodeData, ctr.clientWidth, ctr.clientHeight, 20, false);
    var eid1 = setTimeout(function() {
      ensureAllNodesVisible(svg, zoomBehavior, nodeData);
    }, 100);
    _pendingEnsureTimeouts.push(eid1);
    svg.on("click", function() { selectedNode = null; _inspectorPinned = false; clearHighlight(); });
    // Save to memory cache
    const memMap = new Map(nodeData.map(n => [n.id, { x: n.x, y: n.y }]));
    _positionCache.set(cacheKey, memMap);
    _initDetail();
  }

  // ── Restore from memory cache ──────────────────────────────────
  if (cachedPositions) {
    const posObj = {};
    cachedPositions.forEach(function(v, k) { posObj[k] = v; });
    _applyPositionsAndRender(posObj);
    return;
  }

  // ── Try disk cache (async) ─────────────────────────────────────
  // We set up the graph scaffolding first, then check disk cache.
  // If disk has positions, apply them. Otherwise run the simulation.
  window._nodes = node; window._links = link; window._edgeLabels = edgeLabel; window._nodeData = nodeData; window._linkData = linkData;

  _loadPositionsFromDisk(nodeData).then(function(diskPositions) {
    if (diskPositions) {
      _applyPositionsAndRender(diskPositions);
      return;
    }

    // ── Fresh layout (no cache hit) ──────────────────────────────

    // Determine which nodes have edges
    const connectedNodeIds = new Set();
    linkData.forEach(function(e) {
      const s = typeof e.source === "object" ? e.source.id : e.source;
      const t = typeof e.target === "object" ? e.target.id : e.target;
      connectedNodeIds.add(s);
      connectedNodeIds.add(t);
    });

    const hasAnyEdges = connectedNodeIds.size > 0;

    // If no nodes have edges, skip the simulation entirely — just grid-layout
    if (!hasAnyEdges) {
      gridLayout(nodeData, width, height);
      window._nodes = node; window._links = link; window._edgeLabels = edgeLabel; window._nodeData = nodeData; window._linkData = linkData;
      node.attr("transform", d => `translate(${d.x ?? 0},${d.y ?? 0})`);
      link.attr("d", edgePath);
    edgeLabel.attr("x", d => _edgeLabelPos(d).x).attr("y", d => _edgeLabelPos(d).y);
      const ctr = document.getElementById("graph-container");
      if (ctr) fitGraphToViewport(svg, zoomBehavior, nodeData, ctr.clientWidth, ctr.clientHeight, 20, false);
      var eidGrid = setTimeout(function() {
        ensureAllNodesVisible(svg, zoomBehavior, nodeData);
      }, 100);
      _pendingEnsureTimeouts.push(eidGrid);
      svg.on("click", function() { selectedNode = null; _inspectorPinned = false; clearHighlight(); });
      const posMap = new Map(nodeData.map(n => [n.id, { x: n.x, y: n.y }]));
      _positionCache.set(cacheKey, posMap);
      _savePositionsToDisk(nodeData);
      _initDetail();
      return;
    }

    // Separate edgeless nodes — they'll be grid-positioned after simulation
    const edgelessNodes = nodeData.filter(n => !connectedNodeIds.has(n.id));
    const simulatedNodes = nodeData.filter(n => connectedNodeIds.has(n.id));

    // Give edgeless nodes temporary positions so the D3 tick handler
    // never encounters undefined x/y (they are repositioned properly
    // in _saveAndSnap after the simulation finishes).
    edgelessNodes.forEach(n => {
      if (n.x == null) n.x = -9999;
      if (n.y == null) n.y = -9999;
    });
    // Only edges referencing simulated nodes
    const simulatedLinks = linkData.filter(function(e) {
      const s = typeof e.source === "object" ? e.source.id : e.source;
      const t = typeof e.target === "object" ? e.target.id : e.target;
      return connectedNodeIds.has(s) && connectedNodeIds.has(t);
    });

    seedPositions(simulatedNodes, simulatedLinks, width, height);

    const connectedYs = simulatedNodes.filter(n => !n._isolated).map(n => n.y);
    const maxConnectedY = connectedYs.length ? Math.max(...connectedYs) : height / 2;
    const isolatedTargetY = maxConnectedY + ISOLATED_ROW_Y_OFFSET;

    simulation = d3.forceSimulation(simulatedNodes)
      .alpha(1).alphaDecay(0.03).velocityDecay(0.35)
      .force("link", d3.forceLink(simulatedLinks).id(d=>d.id).distance(d=>EDGE_DISTANCE[d.kind]||240).strength(d=>d.kind==="contains"?0.35:0.2).iterations(3))
      .force("charge", d3.forceManyBody().strength(d=>NODE_CHARGE[d.kind]||-500))
      .force("center", d3.forceCenter(width/2,height/2))
      .force("collision", d3.forceCollide().radius(d=>{const s=NODE_SIZE[d.kind]||{w:160,h:60};return Math.sqrt(s.w*s.w+s.h*s.h)/2+COLLISION_PAD;}))
      .force("isolatedBottom", makeIsolatedBottomForce(isolatedTargetY, ISOLATED_FORCE_STRENGTH))
      .force("x", d3.forceX(width/2).strength(0.025))
      .force("y", d3.forceY(height/2).strength(0.025));

    simulation.on("tick", function() {
      link.attr("d", edgePath);
    edgeLabel.attr("x", d => _edgeLabelPos(d).x).attr("y", d => _edgeLabelPos(d).y);
      node.attr("transform", d => `translate(${d.x ?? 0},${d.y ?? 0})`);
      if (autoFitActive) {
        const now = performance.now();
        if (now - lastAutoFitTs >= AUTO_FIT_INTERVAL_MS) {
          lastAutoFitTs = now;
          fitGraphToViewport(svg, zoomBehavior, nodeData, width, height, 56, false);
        }
        if (simulation.alpha() < 0.12) autoFitActive = false;
      }
    });

    function _saveAndSnap() {
      autoFitActive = false;

      // Position edgeless nodes in a grid below the simulated graph
      if (edgelessNodes.length > 0) {
        const simYs = simulatedNodes.map(n => n.y);
        const simXs = simulatedNodes.map(n => n.x);
        const bottomY = (simYs.length ? Math.max(...simYs) : height / 2) + ISOLATED_ROW_Y_OFFSET;
        const centerX = simXs.length ? (Math.min(...simXs) + Math.max(...simXs)) / 2 : width / 2;
        const edgelessColGap = edgelessNodes.length > 12 ? 300 : ISOLATED_COL_GAP;
        const edgelessRowGap = edgelessNodes.length > 12 ? 260 : GRID_SNAP_ROW_GAP;
        const gridCols = Math.max(1, Math.min(edgelessNodes.length, Math.ceil(Math.sqrt(edgelessNodes.length * 1.4))));
        const gridRows = Math.ceil(edgelessNodes.length / gridCols);
        const totalW = (gridCols - 1) * edgelessColGap;
        const startX = centerX - totalW / 2;
        edgelessNodes.forEach(function(n, i) {
          const col = i % gridCols;
          const row = Math.floor(i / gridCols);
          n.x = startX + col * edgelessColGap;
          n.y = bottomY + row * edgelessRowGap;
          n.fx = null; n.fy = null;
        });
      }

      snapNodesToGrid(nodeData, svg, g, node, link, edgeLabel, linkData, zoomBehavior);
      // Final safety check after grid snap animation
      var eid2 = setTimeout(function() {
        ensureAllNodesVisible(svg, zoomBehavior, nodeData);
      }, GRID_SNAP_DURATION + 100);
      _pendingEnsureTimeouts.push(eid2);
      // Save to memory cache
      const posMap = new Map(nodeData.map(n => [n.id, { x: n.x, y: n.y }]));
      _positionCache.set(cacheKey, posMap);
      // Save to disk cache
      _savePositionsToDisk(nodeData);
      _initDetail();
    }

    simulation.on("end", function() {
      if (didInitialFit) return;
      didInitialFit = true;
      _saveAndSnap();
    });

    setTimeout(function() {
      if (didInitialFit) return;
      didInitialFit = true;
      simulation.stop();
      _saveAndSnap();
    }, 4000);
  });

  svg.on("click", function() { selectedNode = null; _inspectorPinned = false; clearHighlight(); });
}

// ── Context menu for nodes ─────────────────────────────────────────
var _ctxMenuNode = null;        // the node data object the menu was opened for
var _inspectorPinned = false;   // when true, hover won't overwrite the inspector

var _DRILLABLE_KINDS = new Set(["class", "island_chain", "group"]);

function _canDrill(d) {
  if (!_DRILLABLE_KINDS.has(d.kind)) return false;
  // Classes without methods have nothing to drill into
  if (d.kind === "class" && (!d.methods || d.methods.length === 0)) return false;
  return true;
}

function _hasSourceFile(d) {
  // Island Chain / group nodes set file_path to a directory (no extension) and line_start=0.
  // Only enable "View Code" when the path looks like an actual file.
  if (!d.file_path) return false;
  // Must contain a dot (file extension) somewhere in the basename
  var base = d.file_path.split('/').pop() || '';
  return base.indexOf('.') !== -1;
}

function showNodeContextMenu(event, d) {
  event.preventDefault();
  event.stopPropagation();
  _ctxMenuNode = d;

  var menu = document.getElementById("node-ctx-menu");
  var digItem = document.getElementById("ctx-dig-down");
  var codeItem = document.getElementById("ctx-view-code");
  var revealItem = document.getElementById("ctx-reveal-file");

  // Enable / disable "Dig Down"
  if (_canDrill(d)) {
    digItem.classList.remove("disabled");
  } else {
    digItem.classList.add("disabled");
  }

  // Enable / disable "View Code" — need a real file path, not a directory
  if (_hasSourceFile(d)) {
    codeItem.classList.remove("disabled");
  } else {
    codeItem.classList.add("disabled");
  }

  // Enable / disable "Reveal in Files" — need any file_path at all
  if (d.file_path) {
    revealItem.classList.remove("disabled");
  } else {
    revealItem.classList.add("disabled");
  }

  // Position near cursor but keep on-screen
  var mx = event.clientX, my = event.clientY;
  menu.classList.add("open");
  var mw = menu.offsetWidth, mh = menu.offsetHeight;
  if (mx + mw > window.innerWidth)  mx = window.innerWidth - mw - 4;
  if (my + mh > window.innerHeight) my = window.innerHeight - mh - 4;
  menu.style.left = mx + "px";
  menu.style.top  = my + "px";
}

function hideNodeContextMenu() {
  var menu = document.getElementById("node-ctx-menu");
  if (menu) menu.classList.remove("open");
  var hadNode = _ctxMenuNode;
  _ctxMenuNode = null;
  // Reset highlights when the menu closes (unless an action pinned the inspector)
  if (hadNode && !_inspectorPinned) {
    clearHighlight();
  }
}

/** Navigate to a node by its ID — highlight it in the graph and show its info. */
function _navigateToNode(nodeId) {
  var node = null;
  if (window._nodeData) {
    node = window._nodeData.find(function(n) { return n.id === nodeId; });
  }
  if (!node) {
    // Node might not be in the current view — try finding it in graphData
    node = graphData && graphData.nodes.find(function(n) { return n.id === nodeId; });
  }
  if (!node) return;
  _inspectorPinned = true;
  highlightConnected(node);
  populatePanel(node);
  // Set up Tab navigation
  _selectedNavNode = node;
  _neighborList = _buildNeighborList(node);
  _neighborIndex = -1;
  if (node.x != null && node.y != null) {
    centerDetailOnGraphPoint(node.x, node.y, true);
  }
}

function _buildInspectorHtml(d) {
  const incoming = graphData.edges.filter(e => (_nid(e.target) === d.id));
  const outgoing = graphData.edges.filter(e => (_nid(e.source) === d.id));
  const findNode = function(id) { return graphData.nodes.find(n => n.id === _nid(id)); };
  const findNodeName = function(id) { const n = findNode(id); return n ? n.name : _nid(id); };
  const edgeColor = { inherits: "#d44a32", imports: "#5a6348", contains: "#3d4a2e", calls: "#e8a824", instantiates: "#b8a878", uses_type: "#6dbd4a" };

  let html = `<h2>${_contentIcon(d)} ${d.name}</h2><div class="kind-tag ${d.kind}">${_nodeKindLabel(d)}</div><div class="detail-section"><h3>Location</h3><div class="detail-row"><span>File:</span> ${d.file_path}</div><div class="detail-row"><span>Lines:</span> ${d.line_start}–${d.line_end}</div><div class="detail-row"><span>Qualified:</span> ${d.qualified_name}</div></div>`;
  if (d.docstring) { html += `<div class="detail-section"><h3>Description</h3><div class="docstring">${d.docstring}</div></div>`; }
  if (d.bases && d.bases.length > 0) { html += `<div class="detail-section"><h3>Inherits from</h3><div class="detail-row">${d.bases.join(", ")}</div></div>`; }
  if (d.variables && d.variables.length > 0) { html += `<div class="detail-section"><h3>Variables (${d.variables.length})</h3><ul class="methods-list">${d.variables.map(v => `<li>${v.name}<span class="var-type">: ${v.type}</span></li>`).join("")}</ul></div>`; }
  if (d.methods && d.methods.length > 0) { html += `<div class="detail-section"><h3>Methods (${d.methods.length})</h3><ul class="methods-list">${d.methods.map(m => `<li>${m}()</li>`).join("")}</ul></div>`; }
  if (d.members && d.members.length > 0) { html += `<div class="detail-section"><h3>Grouped Classes (${d.members.length})</h3><ul class="methods-list">${d.members.map(m => `<li>${m}</li>`).join("")}</ul></div>`; }
  if (d.member_methods && d.member_methods.length > 0) { html += `<div class="detail-section"><h3>Grouped Methods (${d.member_methods.length})</h3><ul class="methods-list">${d.member_methods.map(m => `<li>${m}()</li>`).join("")}</ul></div>`; }
  if (outgoing.length > 0) {
    html += `<div class="detail-section"><h3>Outgoing (${outgoing.length})</h3><ul class="rel-list">${outgoing.map(e => {
      const targetId = _nid(e.target);
      const targetNode = findNode(e.target);
      const name = targetNode ? targetNode.name : _nid(e.target);
      const icon = targetNode ? _nodeIcon(targetNode) : '';
      const col = edgeColor[e.kind] || '#8b949e';
      return `<li><div class="rel-dot" style="background:${col}"></div><span style="color:${col}">${e.kind}</span> → <span class="rel-node-link" data-node-id="${targetId}">${icon} ${name}</span></li>`;
    }).join("")}</ul></div>`;
  }
  if (incoming.length > 0) {
    html += `<div class="detail-section"><h3>Incoming (${incoming.length})</h3><ul class="rel-list">${incoming.map(e => {
      const sourceId = _nid(e.source);
      const sourceNode = findNode(e.source);
      const name = sourceNode ? sourceNode.name : _nid(e.source);
      const icon = sourceNode ? _nodeIcon(sourceNode) : '';
      const col = edgeColor[e.kind] || '#8b949e';
      return `<li><div class="rel-dot" style="background:${col}"></div><span class="rel-node-link" data-node-id="${sourceId}">${icon} ${name}</span> <span style="color:${col}">${e.kind}</span> →</li>`;
    }).join("")}</ul></div>`;
  }
  return html;
}

function _attachRelLinks(container) {
  container.querySelectorAll(".rel-node-link").forEach(function(el) {
    el.addEventListener("click", function(e) {
      e.stopPropagation();
      var nodeId = this.getAttribute("data-node-id");
      if (nodeId) _navigateToNode(nodeId);
    });
  });
}

function selectNode(d) {
  selectedNode = d;
  highlightConnected(d);
  const content = document.getElementById("detail-content");
  if (!content) return;
  content.innerHTML = _buildInspectorHtml(d);

}

function showPlaceholder() {
  var el = document.getElementById("detail-content");

function populatePanel(d) {
  const content = document.getElementById("detail-content");

}


// ── Node description bar (AI hover descriptions) ───────────────────

// Cache: nodeId → { description, contentHash }
const _nodeDescCache = new Map();
let _nodeDescAbort = null;   // current AbortController
let _nodeDescHoverId = null; // node ID currently being described

// ── Hierarchical descriptions (bottom-up LLM-generated) ────────────
var _hierDescriptions = {};        // node_id → {name, kind, description, level, ...}
var _hierDescLoading = false;
var _hierDescLoaded = false;
var _hierDescPollTimer = null;

/**
 * Load hierarchical descriptions from disk cache (GET) or
 * trigger generation (POST) in the background.
 * Non-blocking — descriptions are used opportunistically when available.
 */
function _loadHierarchicalDescriptions() {
  if (_hierDescLoading) return;

  // First try to load from cache (fast GET)
  fetch(API_BASE + '/api/describe')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.descriptions && Object.keys(data.descriptions).length > 0) {
        _hierDescriptions = data.descriptions;
        _hierDescLoaded = true;
        _prefillNodeDescCache();
      }
      // If already generating in background, just start polling
      if (data.generating) {
        _hierDescLoading = true;
        _pollDescriptionStatus();
        return;
      }
      // Kick off generation (POST returns immediately now)
      _generateHierarchicalDescriptions(false);
    })
    .catch(function() {
      _generateHierarchicalDescriptions(false);
    });
}

function _generateHierarchicalDescriptions(force) {
  if (_hierDescLoading) return;
  _hierDescLoading = true;

  fetch(API_BASE + '/api/describe', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ force: !!force }),
  })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.status === 'started' || data.status === 'already_running') {
        // Poll for completion
        _pollDescriptionStatus();
      } else {
        _hierDescLoading = false;
      }
    })
    .catch(function() {
      _hierDescLoading = false;
    });
}

function _pollDescriptionStatus() {
  if (_hierDescPollTimer) clearTimeout(_hierDescPollTimer);
  _updateAIStatus('Generating descriptions…');

  _hierDescPollTimer = setTimeout(function _poll() {
    fetch(API_BASE + '/api/describe/status')
      .then(function(r) { return r.json(); })
      .then(function(status) {
        if (status.status === 'done') {
          // Generation finished — fetch the results
          _hierDescLoading = false;
          _hierDescPollTimer = null;
          _updateAIStatus(null);
          fetch(API_BASE + '/api/describe')
            .then(function(r) { return r.json(); })
            .then(function(data) {
              if (data.descriptions && Object.keys(data.descriptions).length > 0) {
                _hierDescriptions = data.descriptions;
                _hierDescLoaded = true;
                _prefillNodeDescCache();
              }
            })
            .catch(function() {});
        } else if (status.status === 'error') {
          console.error('Description generation failed:', status.error);
          _hierDescLoading = false;
          _hierDescPollTimer = null;
          _updateAIStatus(null);
        } else {
          // Still running — update status and fetch incremental results
          if (status.total > 0) {
            _updateAIStatus('Describing ' + status.done + '/' + status.total);
          }
          fetch(API_BASE + '/api/describe')
            .then(function(r) { return r.json(); })
            .then(function(data) {
              if (data.descriptions && Object.keys(data.descriptions).length > 0) {
                var newCount = Object.keys(data.descriptions).length;
                var oldCount = Object.keys(_hierDescriptions).length;
                if (newCount > oldCount) {
                  _hierDescriptions = data.descriptions;
                  _hierDescLoaded = true;
                  _prefillNodeDescCache();
                }
              }
            })
            .catch(function() {});
          // Poll again
          _hierDescPollTimer = setTimeout(_poll, 2000);
        }
      })
      .catch(function() {
        // Network error — retry after longer delay
        _hierDescPollTimer = setTimeout(_poll, 5000);
      });
  }, 1500);
}

/** Pre-fill the node description cache with hierarchical descriptions. */
function _prefillNodeDescCache() {
  Object.keys(_hierDescriptions).forEach(function(nid) {
    var entry = _hierDescriptions[nid];
    if (!entry || !entry.description || nid === '__root__') return;
    // Always overwrite with hierarchical descriptions — they are richer
    _nodeDescCache.set(nid, {
      description: entry.description,
      contentHash: entry.hash || 'hier',
      fromHier: true,
    });
  });
}

function _contentHashForNode(d) {
  // Simple hash from node identity + code location + membership
  var raw = (d.file_path || '') + ':' + (d.line_start || 0) + ':' + (d.line_end || 0) + ':' + d.name;
  if (d.members && d.members.length > 0) raw += ':' + d.members.join(',');
  // FNV-1a-ish quick hash
  var h = 0x811c9dc5;
  for (var i = 0; i < raw.length; i++) { h ^= raw.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(16);
}

function _descBarHtml(d, bodyHtml) {
  var contentIcon = _contentIcon(d);
  var m = NODE_KIND_META[d.kind];
  var kindLabel = m ? (m.icon + ' ' + m.label) : (d.kind || '').replace(/_/g, ' ');
  return '<div class="desc-header"><span class="desc-node-name">' + contentIcon + ' ' + _escHtml(d.name) + '</span><span class="desc-kind">' + _escHtml(kindLabel) + '</span></div>' + bodyHtml;
}

function _showNodeDesc(d) {
  // Don't overwrite the narration while a preview walkthrough is active
  if (_previewScenes.length > 0) return;
  var bar = document.getElementById('node-desc-bar');
  if (!bar) return;
  _nodeDescHoverId = d.id;

  // 1. Check hierarchical descriptions (most detailed, pre-generated)
  var hierEntry = _hierDescriptions[d.id];
  if (hierEntry && hierEntry.description) {
    bar.className = '';
    bar.innerHTML = _descBarHtml(d, '<span class="desc-text">' + _escHtml(hierEntry.description) + '</span>');
    _fitNodeDescFontSize();
    return;
  }

  // 2. Check local cache (both hier-prefilled and per-node API results)
  var hash = _contentHashForNode(d);
  var cached = _nodeDescCache.get(d.id);
  if (cached && (cached.fromHier || cached.contentHash === hash)) {
    bar.className = '';
    bar.innerHTML = _descBarHtml(d, '<span class="desc-text">' + _escHtml(cached.description) + '</span>');
    _fitNodeDescFontSize();
    return;
  }

  // 3. Show loading state and fetch from per-node API
  bar.className = '';
  bar.innerHTML = _descBarHtml(d, '<span class="desc-text desc-loading">Generating description…</span>');
  _fitNodeDescFontSize();

  // Abort previous request
  if (_nodeDescAbort) { _nodeDescAbort.abort(); _nodeDescAbort = null; }

  var controller = new AbortController();
  _nodeDescAbort = controller;

  var body = {
    node_name: d.name,
    node_kind: d.kind,
    file_path: d.file_path || '',
    line_start: d.line_start || 0,
    line_end: d.line_end || 0,
  };
  if (d.members && d.members.length > 0) body.members = d.members;
  if (d.member_methods && d.member_methods.length > 0) body.member_methods = d.member_methods;
  if (d._edges_summary) body.edges_summary = d._edges_summary;

  fetch(API_BASE + '/api/node-description', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
    signal: controller.signal,
  })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (_nodeDescHoverId !== d.id) return; // stale
      if (data.error) {
        bar.innerHTML = _descBarHtml(d, '<span class="desc-text desc-loading">' + _escHtml(data.error) + '</span>');
        _fitNodeDescFontSize();
        return;
      }
      _nodeDescCache.set(d.id, { description: data.description, contentHash: hash });
      bar.innerHTML = _descBarHtml(d, '<span class="desc-text">' + _escHtml(data.description) + '</span>');
      _fitNodeDescFontSize();
    })
    .catch(function(err) {
      if (err.name === 'AbortError') return;
      if (_nodeDescHoverId !== d.id) return;
      bar.innerHTML = _descBarHtml(d, '<span class="desc-text desc-loading">Failed to load description</span>');
      _fitNodeDescFontSize();
    });
}

function _hideNodeDesc() {
  _nodeDescHoverId = null;
  if (_nodeDescAbort) { _nodeDescAbort.abort(); _nodeDescAbort = null; }
  // Don't reset if a preview walkthrough is active
  if (_previewScenes.length > 0) return;
  _clearNodeDesc();
}

/** Reset the description bar to its empty placeholder state. */
function _clearNodeDesc() {
  var bar = document.getElementById('node-desc-bar');
  if (!bar) return;
  bar.className = 'empty';
  bar.innerHTML = '<span class="desc-placeholder">Hover over a node to see its description</span>';
}

/** Show a description of the current graph view (when no node is hovered). */
function _showGraphOverviewDesc() {
  var bar = document.getElementById('node-desc-bar');
  if (!bar) return;

  if (!graphData || !graphData.nodes || graphData.nodes.length === 0) {
    bar.className = 'empty';
    bar.innerHTML = '<span class="desc-placeholder">No graph loaded</span>';
    return;
  }

  // Check if we have a hierarchical root description
  var rootDesc = _hierDescriptions['__root__'];
  if (rootDesc && rootDesc.description && currentGraphLabel === 'Overview') {
    bar.className = '';
    var d = { id: '__root__', name: 'Codebase Overview', kind: 'root' };
    bar.innerHTML = _descBarHtml(d, '<span class="desc-text">' + _escHtml(rootDesc.description) + '</span>');
    _fitNodeDescFontSize();
    return;
  }

  // Check for a hierarchical description matching a drilled-in node
  if (currentGraphLabel && currentGraphLabel !== 'Overview') {
    // Try to find a matching node in hierarchical descriptions
    var matchingHier = null;
    Object.keys(_hierDescriptions).forEach(function(nid) {
      var entry = _hierDescriptions[nid];
      if (entry && entry.name === currentGraphLabel && entry.description) {
        matchingHier = entry;
      }
    });
    if (matchingHier) {
      bar.className = '';
      var d2 = { id: matchingHier.name, name: matchingHier.name, kind: matchingHier.kind || 'group' };
      bar.innerHTML = _descBarHtml(d2, '<span class="desc-text">' + _escHtml(matchingHier.description) + '</span>');
      _fitNodeDescFontSize();
      return;
    }
  }

  var nodes = graphData.nodes;
  var edges = graphData.edges || [];
  var label = currentGraphLabel || 'Overview';

  // Separate class-like nodes from methods for the members list
  var classLike = nodes.filter(function(n) { return n.kind !== 'method'; });
  var methods = nodes.filter(function(n) { return n.kind === 'method'; });
  var memberNames = classLike.map(function(n) { return n.name; });
  var methodNames = methods.map(function(n) { return n.name; });

  // Build edge summary string
  var edgeKindCounts = {};
  edges.forEach(function(e) {
    var k = (e.kind || 'unknown').replace(/_/g, ' ');
    edgeKindCounts[k] = (edgeKindCounts[k] || 0) + 1;
  });
  var edgeParts = [];
  Object.keys(edgeKindCounts).forEach(function(k) {
    edgeParts.push(edgeKindCounts[k] + ' ' + k);
  });
  var edgeSummary = edgeParts.join(', ');

  // Build a virtual node representing the current graph view
  var virtualNode = {
    id: '__graph_overview__' + label,
    name: label,
    kind: 'graph_overview',
    file_path: '',
    line_start: 0,
    line_end: 0,
    members: memberNames.slice(0, 30),
    member_methods: methodNames.slice(0, 20),
    _edges_summary: edgeSummary
  };

  _showNodeDesc(virtualNode);
}

/** Shrink the font size of #node-desc-bar until its content fits without overflow.
 *  Called after every content update and on container resize. */
function _fitNodeDescFontSize() {
  var bar = document.getElementById('node-desc-bar');
  if (!bar) return;
  var container = bar.parentElement;
  if (!container) return;
  var cw = container.clientWidth;
  var ch = container.clientHeight;
  if (cw <= 0 || ch <= 0) return;

  // Start from a generous base derived from the container dimensions
  var maxBase = Math.min(cw, ch) * 0.09;
  maxBase = Math.max(10, Math.min(maxBase, 40));

  var base = maxBase;
  var minBase = 8;

  var kindEl = bar.querySelector('.desc-kind');

  // Iteratively shrink until the content fits within the bar's client area
  for (var attempts = 0; attempts < 20; attempts++) {
    bar.style.fontSize = base + 'px';
    if (kindEl) kindEl.style.fontSize = (base * 0.45) + 'px';
    // scrollHeight > clientHeight means content overflows vertically
    if (bar.scrollHeight <= bar.clientHeight + 1) {
      break; // fits
    }
    // Shrink by 10%
    base = base * 0.9;
    if (base < minBase) {
      base = minBase;
      bar.style.fontSize = base + 'px';
      if (kindEl) kindEl.style.fontSize = (base * 0.45) + 'px';
      break;
    }
  }
}

/** Observe the panel container and re-fit on resize. */
function _nodeDescResizeObserver(container) {
  if (!window.ResizeObserver) return;
  var ro = new ResizeObserver(function() {
    _fitNodeDescFontSize();
  });
  ro.observe(container);
}

/* ── Flow-dot helpers ──────────────────────────────────────────────── */
var _EDGE_FLOW_COLORS = {
  inherits: "#d44a32", imports: "#5a6348", contains: "#3d4a2e",
  calls: "#e8a824", instantiates: "#b8a878", uses_type: "#6dbd4a"
};

/** Spawn a small circle that travels along each highlighted edge path. */
function _addFlowDots(svgSel) {
  // Find the <g> that holds edge paths (first child <g> of svg, then its first child <g>)
  var edgeContainer = svgSel.select("g");
  if (edgeContainer.empty()) return;

  // Create a layer for the dots (or reuse)
  var layer = edgeContainer.select(".edge-flow-layer");
  if (layer.empty()) {
    layer = edgeContainer.append("g").attr("class", "edge-flow-layer")
      .style("pointer-events", "none");
  }

  edgeContainer.selectAll("path.edge.edge-highlighted").each(function() {
    var pathEl = this;
    var pathLen = pathEl.getTotalLength();
    if (pathLen < 10) return;
    var kind = "";
    var cl = pathEl.classList;
    for (var k in _EDGE_FLOW_COLORS) { if (cl.contains(k)) { kind = k; break; } }
    var color = _EDGE_FLOW_COLORS[kind] || "#e8a824";
    var pathD = pathEl.getAttribute("d");
    if (!pathD) return;

    var dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    dot.setAttribute("r", "3.5");
    dot.setAttribute("fill", color);
    dot.setAttribute("class", "edge-flow-dot");

    var anim = document.createElementNS("http://www.w3.org/2000/svg", "animateMotion");
    anim.setAttribute("dur", Math.max(0.6, pathLen / 200) + "s");
    anim.setAttribute("repeatCount", "indefinite");
    anim.setAttribute("path", pathD);
    dot.appendChild(anim);
    layer.node().appendChild(dot);
  });
}

/** Remove all flow dots from both SVG panels. */
function _clearFlowDots() {
  d3.selectAll(".edge-flow-layer").remove();
}


function highlightConnected(d) {
  _showNodeDesc(d);
  const connectedIds = new Set([d.id]);
  window._linkData.forEach(e => {
    const sid = _nid(e.source), tid = _nid(e.target);
    if (sid === d.id) connectedIds.add(tid);
    if (tid === d.id) connectedIds.add(sid);
  });

  // ── Overview panel (top) ──────────────────────────────────────
  window._nodes.selectAll(".node-rect")
    .style("opacity", n => connectedIds.has(n.id) ? 1 : 0.15)
    .style("filter", n => n.id === d.id ? null : null)
    .classed("node-focused", n => n.id === d.id);
  window._nodes.selectAll(".node-title").style("opacity", n => connectedIds.has(n.id) ? 1 : 0.15);
  window._nodes.selectAll(".node-kind-inside").style("opacity", n => connectedIds.has(n.id) ? 1 : 0.15);
  window._links
    .style("opacity", e => {
      const sid = _nid(e.source), tid = _nid(e.target);
      return (sid === d.id || tid === d.id) ? 0.95 : 0.05;
    })
    .classed("edge-highlighted", e => {
      const sid = _nid(e.source), tid = _nid(e.target);
      return sid === d.id || tid === d.id;
    });

  // Show labels on connected edges
  if (window._edgeLabels) {
    window._edgeLabels.classed("visible", e => {
      const sid = _nid(e.source), tid = _nid(e.target);
      return (sid === d.id || tid === d.id);
    });
  }

  // ── Detail panel (bottom) — cloned DOM, no D3 data ────────────
  const zoomSvg = d3.select("#zoom-svg");
  zoomSvg.selectAll(".node-group").each(function() {
    const el = d3.select(this);
    const nid = el.attr("data-node-id");
    if (!nid) return;
    const isConn = connectedIds.has(nid);
    const isFocus = nid === d.id;
    el.selectAll(".node-rect")
      .style("opacity", isConn ? 1 : 0.15)
      .classed("node-focused", isFocus);
    el.selectAll(".node-title").style("opacity", isConn ? 1 : 0.15);
    el.selectAll(".node-kind-inside").style("opacity", isConn ? 1 : 0.15);
  });
  zoomSvg.selectAll("path[data-edge-src]").each(function() {
    const el = d3.select(this);
    const sid = el.attr("data-edge-src"), tid = el.attr("data-edge-tgt");
    const isConn = sid === d.id || tid === d.id;
    el.style("opacity", isConn ? 0.95 : 0.05)
      .classed("edge-highlighted", isConn);
  });
  zoomSvg.selectAll(".edge-label").each(function() {
    const el = d3.select(this);
    const sid = el.attr("data-edge-src"), tid = el.attr("data-edge-tgt");
    el.classed("visible", sid === d.id || tid === d.id);
  });

  // Spawn animated flow dots on highlighted edges in both panels
  _clearFlowDots();
  _addFlowDots(d3.select("#graph-container svg"));
  _addFlowDots(zoomSvg);

  // Don't overwrite the inspector when it's pinned by "Get Info"
  if (!_inspectorPinned) {
    populatePanel(d);
  }
}

function clearHighlight() {
  _hideNodeDesc();
  _clearFlowDots();

  if (!window._nodes || !window._links) return;

  // ── Overview panel (top) ──────────────────────────────────────
  window._nodes.selectAll(".node-rect").style("filter", null).style("opacity", 1).classed("node-focused", false);
  window._nodes.selectAll(".node-title").style("opacity", 1);
  window._nodes.selectAll(".node-kind-inside").style("opacity", 1);
  window._links
    .style("opacity", 0.5)
    .classed("edge-highlighted", false);

  // Hide all edge labels
  if (window._edgeLabels) {
    window._edgeLabels.classed("visible", false);
  }

  // ── Detail panel (bottom) ─────────────────────────────────────
  const zoomSvg = d3.select("#zoom-svg");
  zoomSvg.selectAll(".node-group").each(function() {
    const el = d3.select(this);
    el.selectAll(".node-rect").style("filter", null).style("opacity", 1).classed("node-focused", false);
    el.selectAll(".node-title").style("opacity", 1);
    el.selectAll(".node-kind-inside").style("opacity", 1);
  });
  zoomSvg.selectAll("path[data-edge-src]")
    .style("opacity", 0.5)
    .classed("edge-highlighted", false);
  zoomSvg.selectAll(".edge-label").classed("visible", false);

  // Don't overwrite the inspector when it's pinned
  if (!_inspectorPinned) {
    showPlaceholder();
    // Clear Tab-navigation state
    _selectedNavNode = null;
    _neighborList = [];
    _neighborIndex = -1;
  }
}

function _populateProjectSelect() {
  var sel = document.getElementById('project-select');
  sel.innerHTML = '';

  if (_projectsList.length === 0) {
    var opt = document.createElement('option');
    opt.value = '';
    opt.textContent = '(no projects)';
    sel.appendChild(opt);
  } else {
    _projectsList.forEach(function (p) {
      var opt = document.createElement('option');
      opt.value = p.project_id;
      opt.textContent = p.name;
      if (p.project_id === _currentProjectId) opt.selected = true;
      sel.appendChild(opt);
    });
  }

  // Sentinel: add new project option
  var addOpt = document.createElement('option');
  addOpt.value = '__new__';
  addOpt.textContent = '＋ New Project…';
  sel.appendChild(addOpt);
}

document.getElementById('project-select').addEventListener('change', function () {
  var val = this.value;
  if (val === '__new__') {
    _openNewProjectModal();
    // Reset select to current project
    this.value = _currentProjectId || '';
    return;
  }
  if (!val || val === _currentProjectId) return;
  _switchProject(val);
});

  fetch(API_BASE + '/api/projects/select', {

    .then(function (r) { return r.json(); })

function _browseDir(dirPath) {
  var browser = document.getElementById('np-browser');
  browser.classList.add('open');
  browser.innerHTML = '<div class="browser-empty">Loading…</div>';

  fetch(API_BASE + '/api/browse?path=' + encodeURIComponent(dirPath))
    .then(function (r) {

function _renderBrowser(container, data) {
  container.innerHTML = '';

  // Navigation bar: current path + up button + new folder button
  var bar = document.createElement('div');
  bar.className = 'browser-bar';

  var upBtn = document.createElement('button');
  upBtn.className = 'browser-up';
  upBtn.textContent = '↑ Up';
  upBtn.disabled = !data.parent;
  upBtn.addEventListener('click', function () {
    if (data.parent) _browseDir(data.parent);
  });
  bar.appendChild(upBtn);

  var pathLabel = document.createElement('span');
  pathLabel.className = 'browser-bar-path';
  pathLabel.textContent = data.current;
  pathLabel.title = data.current;
  bar.appendChild(pathLabel);

  var newFolderBtn = document.createElement('button');
  newFolderBtn.className = 'browser-up';
  newFolderBtn.textContent = '+ New Folder';
  newFolderBtn.style.marginLeft = '4px';
  newFolderBtn.addEventListener('click', function () {
    _showNewFolderRow(container, data.current);
  });
  bar.appendChild(newFolderBtn);

  container.appendChild(bar);

  // Directory list
  var list = document.createElement('div');
  list.style.maxHeight = '180px';
  list.style.overflowY = 'auto';

  if (data.dirs.length === 0) {
    list.innerHTML = '<div class="browser-empty">No subdirectories</div>';
  } else {
    data.dirs.forEach(function (d) {
      var item = document.createElement('div');
      item.className = 'browser-item';

      var icon = document.createElement('span');
      icon.className = 'b-icon';
      icon.textContent = '📁';

      var name = document.createElement('span');
      name.className = 'b-name';
      name.textContent = d.name;

      item.appendChild(icon);
      item.appendChild(name);

      // Double-click navigates into the folder
      item.addEventListener('dblclick', function () {
        _browseDir(d.path);
      });
      // Single click navigates into the folder
      item.addEventListener('click', function () {
        _browseDir(d.path);
      });

      list.appendChild(item);
    });
  }

  container.appendChild(list);

// ── Filesystem change poller ───────────────────────────────────────
// Polls /api/fs/checksum to detect external file changes (files
// created, edited, or deleted outside the app) and triggers a graph
// refresh + file tree reload when the checksum changes.

var _fsPollerTimer = null;
var _fsLastChecksum = null;
var _fsPollerInterval = 3000;  // ms between polls
var _fsPollInFlight = false;

function _startFsPoller() {
  _stopFsPoller();
  _fsLastChecksum = null;
  // Seed the initial checksum
  _fsPollOnce(true);
  _fsPollerTimer = setInterval(function() { _fsPollOnce(false); }, _fsPollerInterval);
}

function _stopFsPoller() {
  if (_fsPollerTimer) { clearInterval(_fsPollerTimer); _fsPollerTimer = null; }
  _fsLastChecksum = null;
}

function _fsPollOnce(seedOnly) {
  if (_fsPollInFlight) return;
  _fsPollInFlight = true;
  fetch(API_BASE + '/api/fs/checksum')
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(data) {
      _fsPollInFlight = false;
      if (!data || !data.checksum) return;
      var prev = _fsLastChecksum;
      _fsLastChecksum = data.checksum;
      // On first poll just record the baseline; don't trigger a refresh
      if (seedOnly || prev === null) return;
      // If checksum changed, the filesystem was modified externally
      if (data.checksum !== prev) {
        _onExternalFsChange();
      }
    })
    .catch(function() { _fsPollInFlight = false; });
}

function _onExternalFsChange() {
  // Same pipeline as agent file changes: refresh file tree + re-analyze graph
  // Use the existing debounced flush so multiple rapid changes collapse
  _fileChangePending.push({ changeType: 'external', path: '*' });
  if (_fileChangeRefreshTimer) clearTimeout(_fileChangeRefreshTimer);
  _fileChangeRefreshTimer = setTimeout(function () {
    _fileChangeRefreshTimer = null;
    _flushFileChangeRefresh();
  }, 400);
}
