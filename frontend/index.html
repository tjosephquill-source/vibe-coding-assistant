// Holds pending node context for the next query send
var _chatQueryNodeContext = null;

// ================================================================
// TRIE-BASED PREDICTIVE SEARCH
// ================================================================

function TrieNode() {
  this.children = {};
  this.items = [];  // leaf entries at or below this node
}

function Trie() {
  this.root = new TrieNode();
}

Trie.prototype.insert = function(key, item) {
  var node = this.root;
  for (var i = 0; i < key.length; i++) {
    var ch = key[i];
    if (!node.children[ch]) node.children[ch] = new TrieNode();
    node = node.children[ch];
    node.items.push(item);
  }
};

Trie.prototype.search = function(prefix, maxResults) {
  maxResults = maxResults || 20;
  var node = this.root;
  for (var i = 0; i < prefix.length; i++) {
    var ch = prefix[i];
    if (!node.children[ch]) return [];
    node = node.children[ch];
  }
  // Return items at this node (all items whose key starts with prefix)
  // Deduplicate by id
  var seen = {};
  var results = [];
  for (var j = 0; j < node.items.length && results.length < maxResults; j++) {
    var item = node.items[j];
    if (!seen[item.id]) {
      seen[item.id] = true;
      results.push(item);
    }
  }
  return results;
};

var _searchTrie = null;
var _searchActiveIndex = -1;

var _KIND_ICONS = {
  "class": "◼", "method": "◆", "metaclass": "◈",
  "test_group": "⬡", "model_group": "⬡", "config_group": "⬡",
  "handler_group": "⬡", "utility_group": "⬡",
  "exception_group": "⬡", "event_group": "⬡"
};

function buildSearchIndex() {
  _searchTrie = new Trie();
  if (!fullGraphData || !rootGraphData) return;

  // Collect all unique nodes from every data source
  var allNodes = new Map();
  fullGraphData.nodes.forEach(function(n) { allNodes.set(n.id, n); });
  rootGraphData.nodes.forEach(function(n) { allNodes.set(n.id, n); });
  if (intermediateGraphData && intermediateGraphData.nodes) {
    intermediateGraphData.nodes.forEach(function(n) { allNodes.set(n.id, n); });
  }

  allNodes.forEach(function(n) {
    var entry = {
      id: n.id, name: n.name, kind: n.kind,
      qualified_name: n.qualified_name || '',
      file_path: n.file_path || '',
      line_start: n.line_start, line_end: n.line_end,
      methods: n.methods, members: n.members, member_ids: n.member_ids,
      bases: n.bases, docstring: n.docstring,
      // Store references for navigation
      _node: n
    };

    // Index by name (lowercase)
    var nameLower = n.name.toLowerCase();
    _searchTrie.insert(nameLower, entry);

    // Also index by each word segment (e.g. "ArrayBase" → "array", "base")
    var segments = n.name.replace(/([a-z])([A-Z])/g, '$1 $2')
                         .replace(/[_\-./]/g, ' ')
                         .toLowerCase().split(/\s+/);
    for (var s = 0; s < segments.length; s++) {
      if (segments[s] && segments[s] !== nameLower) {
        _searchTrie.insert(segments[s], entry);
      }
    }

    // Index by qualified name segments
    if (n.qualified_name) {
      var qParts = n.qualified_name.replace(/::/g, '.').split('.');
      for (var q = 0; q < qParts.length; q++) {
        var part = qParts[q].toLowerCase();
        if (part && part !== nameLower) {
          _searchTrie.insert(part, entry);
        }
      }
    }
  });
}

function _highlightMatch(text, query) {
  if (!query) return _escHtml(text);
  var idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return _escHtml(text);
  return _escHtml(text.substring(0, idx)) +
    '<mark>' + _escHtml(text.substring(idx, idx + query.length)) + '</mark>' +
    _escHtml(text.substring(idx + query.length));
}

function _renderSearchResults(query) {
  var container = document.getElementById('search-results');
  if (!container) return;

  if (!query || query.length === 0) {
    container.classList.remove('open');
    _searchActiveIndex = -1;
    return;
  }

  if (!_searchTrie) {
    container.innerHTML = '<div class="search-empty">Index not ready</div>';
    container.classList.add('open');
    return;
  }

  var results = _searchTrie.search(query.toLowerCase(), 20);

  if (results.length === 0) {
    container.innerHTML = '<div class="search-empty">No results</div>';
    container.classList.add('open');
    _searchActiveIndex = -1;
    return;
  }

  var html = '';
  for (var i = 0; i < results.length; i++) {
    var r = results[i];
    var icon = _KIND_ICONS[r.kind] || '●';
    var filePart = r.file_path ? r.file_path.split('/').pop() : '';
    html += '<div class="search-result" data-index="' + i + '">' +
      '<span class="search-result-icon">' + icon + '</span>' +
      '<span class="search-result-name">' + _highlightMatch(r.name, query) + '</span>' +
      '<span class="search-result-kind">' + r.kind + '</span>' +
      (filePart ? '<span class="search-result-file">' + _escHtml(filePart) + '</span>' : '') +
      '</div>';
  }
  container.innerHTML = html;
  container.classList.add('open');
  _searchActiveIndex = -1;

  // Store results for keyboard nav
  container._results = results;

  // Click handlers
  container.querySelectorAll('.search-result').forEach(function(el) {
    el.addEventListener('mousedown', function(e) {
      e.preventDefault();
      var idx = parseInt(el.dataset.index, 10);
      _selectSearchResult(container._results[idx]);
    });
  });
}

function _setActiveSearchResult(index) {
  var container = document.getElementById('search-results');
  if (!container) return;
  var items = container.querySelectorAll('.search-result');
  items.forEach(function(el) { el.classList.remove('active'); });
  _searchActiveIndex = index;
  if (index >= 0 && index < items.length) {
    items[index].classList.add('active');
    items[index].scrollIntoView({ block: 'nearest' });
  }
}

/**
 * Find the chain of container (metaclass / group) nodes that must be
 * drilled into to reach `targetId`, starting from the root overview graph.
 *
 * Returns an array of node objects: [topLevelContainer, ..., immediateParent]
 * where each entry is a metaclass/group node whose member_ids include the
 * next entry (or the target itself for the last element).
 *
 * Returns [] if the target lives directly in the root graph (no drilling needed),
 * or null if the target can't be located at all.
 */
function _findContainerChain(targetId) {
  if (!rootGraphData || !fullGraphData) return null;

  // Quick check: is it already a top-level node?
  if (rootGraphData.nodes.find(function(n) { return n.id === targetId; })) {
    return [];
  }

  // Build a lookup of ALL container nodes (metaclass / group) across every level
  var allContainers = [];  // { node, source }
  var _containerKinds = new Set(["metaclass", "test_group", "model_group",
    "config_group", "handler_group", "utility_group", "exception_group", "event_group"]);

  rootGraphData.nodes.forEach(function(n) {
    if (_containerKinds.has(n.kind) && n.member_ids && n.member_ids.length > 0) {
      allContainers.push(n);
    }
  });
  if (intermediateGraphData && intermediateGraphData.nodes) {
    intermediateGraphData.nodes.forEach(function(n) {
      if (_containerKinds.has(n.kind) && n.member_ids && n.member_ids.length > 0) {
        // Avoid duplicates
        if (!allContainers.find(function(c) { return c.id === n.id; })) {
          allContainers.push(n);
        }
      }
    });
  }

  // Build a map: childId → parentContainerNode
  var childToParent = new Map();
  allContainers.forEach(function(container) {
    (container.member_ids || []).forEach(function(mid) {
      // If multiple containers claim the same child, prefer the one
      // that is itself contained in another (= deeper in hierarchy)
      if (!childToParent.has(mid)) {
        childToParent.set(mid, container);
      }
    });
  });

  // Walk up from target to root
  var chain = [];
  var current = targetId;
  var visited = new Set();
  var maxDepth = 20;
  while (maxDepth-- > 0) {
    var parent = childToParent.get(current);
    if (!parent) break;
    if (visited.has(parent.id)) break;  // cycle guard
    visited.add(parent.id);
    chain.unshift(parent);  // prepend
    // Is this parent a top-level node in rootGraphData?
    if (rootGraphData.nodes.find(function(n) { return n.id === parent.id; })) {
      return chain;
    }
    current = parent.id;
  }

  // Fallback: target might be a method inside a class
  // Check if targetId is a method and find its parent class
  var targetNode = null;
  if (fullGraphData) {
    targetNode = fullGraphData.nodes.find(function(n) { return n.id === targetId; });
  }
  if (targetNode && targetNode.kind === "method") {
    // Find the parent class via contains edge
    var parentClassId = null;
    fullGraphData.edges.forEach(function(e) {
      if (e.kind === "contains" && _nid(e.target) === targetId) {
        parentClassId = _nid(e.source);
      }
    });
    if (parentClassId) {
      var parentChain = _findContainerChain(parentClassId);
      if (parentChain !== null) {
        var parentClassNode = fullGraphData.nodes.find(function(n) { return n.id === parentClassId; });
        if (parentClassNode) {
          parentChain.push(parentClassNode);
          return parentChain;
        }
      }
    }
  }

  // Could not find a path — return the chain we have (might be partial)
  return chain.length > 0 ? chain : null;
}

/**
 * After a graph re-render, wait for layout to settle then center + highlight
 * the target node.  Polls until the node has x/y coordinates.
 */
function _focusNodeAfterRender(targetId, entry) {
  var attempts = 0;
  var maxAttempts = 60;  // up to 3 seconds
  var poller = setInterval(function() {
    attempts++;
    // Find the node in current graphData with x/y set by the layout engine
    var node = null;
    if (window._nodeData) {
      node = window._nodeData.find(function(n) { return n.id === targetId; });
    }
    if (node && node.x != null && node.y != null) {
      clearInterval(poller);
      centerDetailOnGraphPoint(node.x, node.y, true);
      highlightConnected(node);
      _inspectorPinned = true;
      populatePanel(node);
    } else if (attempts >= maxAttempts) {
      clearInterval(poller);
      // Couldn't find positioned node — at least show info
      _inspectorPinned = true;
      populatePanel(entry);
    }
  }, 50);
}

function _selectSearchResult(entry) {
  if (!entry) return;

  // Close search
  var input = document.getElementById('search-input');
  var container = document.getElementById('search-results');
  if (input) input.value = '';
  if (container) container.classList.remove('open');
  if (input) input.blur();

  var targetId = entry.id;

  // 1. Check if node is in the current graph view and already positioned
  var node = null;
  if (window._nodeData) {
    node = window._nodeData.find(function(n) { return n.id === targetId; });
  }
  if (node && node.x != null && node.y != null) {
    centerDetailOnGraphPoint(node.x, node.y, true);
    highlightConnected(node);
    _inspectorPinned = true;
    populatePanel(node);
    return;
  }

  // 2. Node is not in the current view — find the drill-down path
  var chain = _findContainerChain(targetId);

  if (chain === null || chain.length === 0) {
    // Can't find a path — reset to root overview and try there
    if (currentGraphLabel !== "Overview" && rootGraphData) {
      graphStack = [];
      _setGraphView(rootGraphData, "Overview");
      _focusNodeAfterRender(targetId, entry);
    } else {
      // Last resort: just show info
      _inspectorPinned = true;
      populatePanel(entry);
    }
    return;
  }

  // 3. Reset to root overview first, then drill down the chain
  graphStack = [];
  _setGraphView(rootGraphData, "Overview");

  // Drill down through each container in the chain
  // We need to do this sequentially since each drill changes graphData
  function drillStep(idx) {
    if (idx >= chain.length) {
      // We've drilled to the deepest container — target should now be visible
      _focusNodeAfterRender(targetId, entry);
      return;
    }

    var containerNode = chain[idx];

    // Wait for current graph to finish rendering so nodes have positions
    var attempts = 0;
    var poller = setInterval(function() {
      attempts++;
      // Find the container in the current graphData
      var gNode = null;
      if (window._nodeData) {
        gNode = window._nodeData.find(function(n) { return n.id === containerNode.id; });
      }
      if (!gNode && graphData && graphData.nodes) {
        gNode = graphData.nodes.find(function(n) { return n.id === containerNode.id; });
      }

      if (gNode || attempts >= 40) {
        clearInterval(poller);
        // Drill into this container
        if (gNode) {
          drillIntoNode(gNode);
        } else {
          // Container not found in current view — use the data we have
          drillIntoNode(containerNode);
        }
        // Continue to next level after a brief delay for render
        setTimeout(function() { drillStep(idx + 1); }, 100);
      }
    }, 50);
  }

  // Start drilling from the first container
  drillStep(0);
}

// Wire up search input
(function() {
  var input = document.getElementById('search-input');
  var container = document.getElementById('search-results');
  if (!input || !container) return;

  var debounceTimer = null;

  input.addEventListener('input', function() {
    clearTimeout(debounceTimer);
    var q = input.value.trim();
    debounceTimer = setTimeout(function() { _renderSearchResults(q); }, 60);
  });

  input.addEventListener('keydown', function(e) {
    var items = container.querySelectorAll('.search-result');
    var count = items.length;

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      _setActiveSearchResult(Math.min(_searchActiveIndex + 1, count - 1));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      _setActiveSearchResult(Math.max(_searchActiveIndex - 1, 0));
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (_searchActiveIndex >= 0 && container._results) {
        _selectSearchResult(container._results[_searchActiveIndex]);
      } else if (container._results && container._results.length > 0) {
        _selectSearchResult(container._results[0]);
      }
    } else if (e.key === 'Escape') {
      input.value = '';
      container.classList.remove('open');
      input.blur();
    }
  });

  input.addEventListener('focus', function() {
    var q = input.value.trim();
    if (q.length > 0) _renderSearchResults(q);
  });

  input.addEventListener('blur', function() {
    // Delay to allow click on result
    setTimeout(function() { container.classList.remove('open'); }, 150);
  });

  // Global "/" shortcut to focus search
  document.addEventListener('keydown', function(e) {
    if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey) {
      var tag = (document.activeElement || {}).tagName;
      if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
        e.preventDefault();
        input.focus();
        input.select();
      }
    }
  });
})();

// ── Position cache ─────────────────────────────────────────────────
const _positionCache = new Map();

function _graphCacheKey(nodes) {
  return nodes.map(n => n.id).sort().join("|");
}

// Stable short hash of the graph cache key for the server endpoint
function _graphCacheKeyHash(nodes) {
  const raw = nodes.map(n => n.id).sort().join("|");
  let h = 0;
  for (let i = 0; i < raw.length; i++) {
    h = ((h << 5) - h + raw.charCodeAt(i)) | 0;
  }
  return "gk_" + Math.abs(h).toString(36);
}

// Save node positions to the server disk cache
function _savePositionsToDisk(nodeData) {
  if (!nodeData || nodeData.length === 0) return;
  const key = _graphCacheKeyHash(nodeData);
  const positions = {};
  nodeData.forEach(n => {
    if (n.x != null && n.y != null) {
      positions[n.id] = { x: n.x, y: n.y };
    }
  });
  if (Object.keys(positions).length === 0) return;
  fetch(`${API_BASE}/api/positions`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ graph_key: key, positions: positions }),
  }).catch(function() { /* ignore */ });
}

// Load node positions from the server disk cache. Returns positions map or null.
async function _loadPositionsFromDisk(nodeData) {
  const key = _graphCacheKeyHash(nodeData);
  try {
    const resp = await fetch(`${API_BASE}/api/positions?graph_key=${encodeURIComponent(key)}`);
    if (!resp.ok) return null;
    const data = await resp.json();
    if (!data.positions) return null;
    // Validate: every node in nodeData must have a saved position
    const pos = data.positions;
    for (let i = 0; i < nodeData.length; i++) {
      if (!pos[nodeData[i].id]) return null;
    }
    return pos;
  } catch (e) {
    return null;
  }
}

  nodeSelection.each(function(d) {

    const w = (NODE_SIZE[d.kind]?.w || 160);

async function loadGraph() {
  try {
    const [overviewResp, fullResp] = await Promise.all([
      fetch(`${API_BASE}/api/graph?abstract=${ABSTRACT_NODES ? "true" : "false"}`),
      fetch(`${API_BASE}/api/graph?abstract=false`)
    ]);
    if (!overviewResp.ok) throw new Error(`HTTP ${overviewResp.status}`);
    if (!fullResp.ok) throw new Error(`HTTP ${fullResp.status}`);

    rootGraphData = await overviewResp.json();
    fullGraphData = await fullResp.json();

    // Extract intermediate nodes/edges for multi-depth drill-down
    intermediateGraphData = {
      nodes: rootGraphData.intermediate_nodes || [],
      edges: rootGraphData.intermediate_edges || [],
    };

    document.querySelectorAll('[data-loading]').forEach(function(el) { el.style.display = 'none'; });
    updateLegend(rootGraphData);
    buildSearchIndex();
    _setGraphView(rootGraphData, "Overview");
  } catch (err) {
    document.querySelectorAll('[data-loading]').forEach(function(el) { el.textContent = 'Error: ' + err.message; });
  }
}

// ── Node auto-scroll on hover ─────────────────────────────────────
var _autoScrollAnimations = new Map(); // nodeId → { raf, el, ... }
var _mouseX = 0, _mouseY = 0;
document.addEventListener("mousemove", function(e) { _mouseX = e.clientX; _mouseY = e.clientY; }, true);

function _isMouseOverElement(el) {
  // Check the foreignObject or the node-group's first rect
  var rect = el.getBoundingClientRect();
  if (!rect || rect.width === 0) return false;
  return _mouseX >= rect.left && _mouseX <= rect.right && _mouseY >= rect.top && _mouseY <= rect.bottom;
}

function _startAutoScroll(nodeGroup, nodeId) {
  var existing = _autoScrollAnimations.get(nodeId);
  if (existing) {
    // Cancel any pending deferred stop (mouse moved back onto element)
    if (existing.stopTimeout) { clearTimeout(existing.stopTimeout); existing.stopTimeout = null; }
    return; // already running
  }

  var fo = nodeGroup.querySelector && nodeGroup.querySelector(".node-methods-fo");
  if (!fo) return;
  var box = fo.querySelector(".node-methods-box");
  if (!box) return;
  if (box.scrollHeight - box.clientHeight <= 2) return; // nothing to scroll

  var speed = 0.5;
  var direction = 1;     // 1 = down, -1 = up
  var pauseFrames = 0;
  var PAUSE_DURATION = 50;
  var alive = true;

  function tick() {
    if (!alive) return;

    var maxScroll = box.scrollHeight - box.clientHeight;
    if (maxScroll <= 0) {
      _autoScrollAnimations.get(nodeId).raf = requestAnimationFrame(tick);
      return;
    }

    if (pauseFrames > 0) {
      pauseFrames--;
    } else {
      box.scrollTop += speed * direction;
      if (direction === 1 && box.scrollTop >= maxScroll) {
        box.scrollTop = maxScroll;
        direction = -1;
        pauseFrames = PAUSE_DURATION;
      } else if (direction === -1 && box.scrollTop <= 0) {
        box.scrollTop = 0;
        direction = 1;
        pauseFrames = PAUSE_DURATION;
      }
    }
    _autoScrollAnimations.get(nodeId).raf = requestAnimationFrame(tick);
  }

  // Delay start to avoid triggering on quick pass-throughs
  var startTimeout = setTimeout(function() {
    var entry = _autoScrollAnimations.get(nodeId);
    if (!entry || !alive) return;
    entry.raf = requestAnimationFrame(tick);
  }, 350);
  _autoScrollAnimations.set(nodeId, { raf: null, el: box, timeout: startTimeout, stopTimeout: null, kill: function() { alive = false; } });
}

function _stopAutoScroll(nodeId) {
  var anim = _autoScrollAnimations.get(nodeId);
  if (!anim) return;
  if (anim.timeout) clearTimeout(anim.timeout);
  if (anim.stopTimeout) clearTimeout(anim.stopTimeout);
  if (anim.kill) anim.kill();
  if (anim.raf) cancelAnimationFrame(anim.raf);
  if (anim.el) anim.el.scrollTop = 0;
  _autoScrollAnimations.delete(nodeId);
}

function _deferStopAutoScroll(nodeId) {
  var anim = _autoScrollAnimations.get(nodeId);
  if (!anim) return;
  // Short delay so that if the mouse re-enters a child element, _startAutoScroll
  // can cancel this pending stop before it fires.
  if (anim.stopTimeout) clearTimeout(anim.stopTimeout);
  anim.stopTimeout = setTimeout(function() {
    _stopAutoScroll(nodeId);
  }, 150);
}

  crumbs.forEach(function(label, i) {
    if (i > 0) {
      const sep = document.createElement("span");
      sep.className = "breadcrumb-sep";
      sep.textContent = "›";
      el.appendChild(sep);
    }
    const span = document.createElement("span");
    span.className = "breadcrumb-item";
    span.textContent = label;
    if (i === crumbs.length - 1) {
      span.classList.add("active");
    } else {
      span.addEventListener("click", function() {
        if (i === 0) {
          graphStack = [];
          _setGraphView(rootGraphData, "Overview");
        } else {
          var target = graphStack[i];
          graphStack = graphStack.slice(0, i);
          _setGraphView(target.graph, target.label);
        }
      });
    }
    el.appendChild(span);
  });
}

function _setGraphView(nextGraph, label) {
  graphData = nextGraph;
  currentGraphLabel = label || "Overview";
  updateBreadcrumb();
  updateLegend(graphData);
  var dp = document.getElementById("detail-panel");
  if (dp) dp.classList.remove("open");
  renderGraph();
}

function buildClassMethodGraph(classNode) {
  const classId = classNode.id;
  const contains = fullGraphData.edges.filter(e => e.kind === "contains" && _nid(e.source) === classId);
  const methodIds = new Set(contains.map(e => _nid(e.target)));
  const nodes = fullGraphData.nodes.filter(n => n.kind === "method" && methodIds.has(n.id));
  const nodeIds = new Set(nodes.map(n => n.id));
  const edges = fullGraphData.edges.filter(e => {
    const s = _nid(e.source), t = _nid(e.target);
    return nodeIds.has(s) && nodeIds.has(t);
  });
  return { nodes, edges };
}

function buildMetaclassClassGraph(metaNode) {
  // The member_ids list contains the IDs of the nodes this metaclass replaced.
  // Those members may be classes, other metaclasses, or group nodes from any
  // hierarchy level.  We look them up across all available data sources:
  //   1. fullGraphData     — original classes and methods
  //   2. rootGraphData     — top-level metaclasses / groups
  //   3. intermediateGraphData — collapsed intermediate-level nodes
  const memberIds = new Set((metaNode.member_ids || []));

  // Build a comprehensive lookup of all known nodes across all levels
  const allAvailableNodes = new Map();

  // Full graph has all original classes and methods
  fullGraphData.nodes.forEach(n => allAvailableNodes.set(n.id, n));

  // Overview graph has top-level metaclasses
  rootGraphData.nodes.forEach(n => allAvailableNodes.set(n.id, n));

  // Intermediate graph has collapsed nodes from all hierarchy levels
  intermediateGraphData.nodes.forEach(n => allAvailableNodes.set(n.id, n));

  const nodes = [];
  memberIds.forEach(mid => {
    const n = allAvailableNodes.get(mid);
    if (n) nodes.push(n);
  });

  // If we found no nodes, the members might have been further collapsed.
  // Try to find them by scanning all metaclasses for matching member_ids.
  if (nodes.length === 0 && memberIds.size > 0) {
    // Fallback: look for any node whose id matches
    fullGraphData.nodes.forEach(n => {
      if (memberIds.has(n.id) && !nodes.find(x => x.id === n.id)) {
        nodes.push(n);
      }
    });
  }

  const nodeIds = new Set(nodes.map(n => n.id));

  // Collect edges between members from all graph sources
  const edgeKey = e => `${_nid(e.source)}|${_nid(e.target)}|${e.kind}`;
  const seenEdges = new Set();
  const edges = [];

  function addEdgesFrom(sourceEdges) {
    sourceEdges.forEach(e => {
      const s = _nid(e.source), t = _nid(e.target);
      if (nodeIds.has(s) && nodeIds.has(t) && e.kind !== "contains") {
        const key = edgeKey(e);
        if (!seenEdges.has(key)) {
          seenEdges.add(key);
          edges.push(e);
        }
      }
    });
  }

  addEdgesFrom(rootGraphData.edges);
  addEdgesFrom(fullGraphData.edges);
  addEdgesFrom(intermediateGraphData.edges);

  return { nodes, edges };
}

function buildGroupGraph(groupNode) {
  // Heuristic group nodes (Tests, Data Models, etc.) hold member_ids
  // pointing to nodes that may live in fullGraphData, rootGraphData,
  // or intermediateGraphData (if they were collapsed at a higher level).
  const memberIds = new Set((groupNode.member_ids || []));

  const allAvailableNodes = new Map();
  fullGraphData.nodes.forEach(n => allAvailableNodes.set(n.id, n));
  rootGraphData.nodes.forEach(n => allAvailableNodes.set(n.id, n));
  intermediateGraphData.nodes.forEach(n => allAvailableNodes.set(n.id, n));

  const nodes = [];
  memberIds.forEach(mid => {
    const n = allAvailableNodes.get(mid);
    if (n) nodes.push(n);
  });

  const nodeIds = new Set(nodes.map(n => n.id));

  const edgeKey = e => `${_nid(e.source)}|${_nid(e.target)}|${e.kind}`;
  const seenEdges = new Set();
  const edges = [];

  function addEdgesFrom(sourceEdges) {
    sourceEdges.forEach(e => {
      const s = _nid(e.source), t = _nid(e.target);
      if (nodeIds.has(s) && nodeIds.has(t) && e.kind !== "contains") {
        const key = edgeKey(e);
        if (!seenEdges.has(key)) {
          seenEdges.add(key);
          edges.push(e);
        }
      }
    });
  }

  addEdgesFrom(fullGraphData.edges);
  addEdgesFrom(rootGraphData.edges);
  addEdgesFrom(intermediateGraphData.edges);

  return { nodes, edges };
}

const _GROUP_KINDS = new Set(["test_group", "model_group", "config_group", "handler_group", "utility_group", "exception_group", "event_group"]);

function drillIntoNode(d) {
  _inspectorPinned = false;
  if (d.kind === "class") {
    // Don't drill into classes with no methods — nothing to show
    if (!d.methods || d.methods.length === 0) { selectNode(d); return; }
    const sub = buildClassMethodGraph(d);
    graphStack.push({ graph: graphData, label: currentGraphLabel });
    _setGraphView(sub, `Class: ${d.name}`);
    return;
  }
  if (d.kind === "metaclass") {
    const sub = buildMetaclassClassGraph(d);
    graphStack.push({ graph: graphData, label: currentGraphLabel });
    _setGraphView(sub, `Metaclass: ${d.name}`);
    return;
  }
  if (_GROUP_KINDS.has(d.kind)) {
    const sub = buildGroupGraph(d);
    graphStack.push({ graph: graphData, label: currentGraphLabel });
    _setGraphView(sub, d.name);
    return;
  }
  selectNode(d);
}

// ── Geometry helpers ───────────────────────────────────────────────
function getRectIntersection(x1, y1, x2, y2, rw, rh) {
  const dx = x2 - x1, dy = y2 - y1;
  if (dx === 0 && dy === 0) return { x: x2, y: y2 };
  const hw = rw / 2, hh = rh / 2;
  const absDx = Math.abs(dx), absDy = Math.abs(dy);
  let t;
  if (absDx * hh > absDy * hw) { t = hw / absDx; }
  else { t = hh / absDy; }
  return { x: x2 - dx * t, y: y2 - dy * t };
}

function pullBack(px, py, fromX, fromY, offset) {
  const dx = px - fromX, dy = py - fromY;
  const len = Math.hypot(dx, dy) || 1;
  return { x: px - (dx / len) * offset, y: py - (dy / len) * offset };
}

function edgePath(d) {
  const src = (typeof d.source === "object" && d.source !== null) ? d.source : window._nodeData?.find(n => n.id === d.source);
  const tgt = (typeof d.target === "object" && d.target !== null) ? d.target : window._nodeData?.find(n => n.id === d.target);
  if (!src || !tgt || src.x == null || src.y == null || tgt.x == null || tgt.y == null) return "M0,0";

  const srcSize = NODE_SIZE[src.kind] || { w: 160, h: 60 };
  const tgtSize = NODE_SIZE[tgt.kind] || { w: 160, h: 60 };
  const dx = tgt.x - src.x, dy = tgt.y - src.y;
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  const offset = d._curve || 0;
  const sx = src.x + nx * offset, sy = src.y + ny * offset;
  const tx = tgt.x + nx * offset, ty = tgt.y + ny * offset;
  const rawStart = getRectIntersection(tx, ty, sx, sy, srcSize.w, srcSize.h);
  const rawEnd   = getRectIntersection(sx, sy, tx, ty, tgtSize.w, tgtSize.h);
  const markerOff = MARKER_OFFSET[d.kind] || 14;
  const end = pullBack(rawEnd.x, rawEnd.y, sx, sy, markerOff);
  const start = d.kind === "contains"
    ? pullBack(rawStart.x, rawStart.y, tx, ty, markerOff)
    : rawStart;
  return `M${start.x},${start.y} L${end.x},${end.y}`;
}

/** Compute the midpoint position for an edge label. */
function _edgeLabelPos(d) {
  const src = (typeof d.source === "object" && d.source !== null) ? d.source : window._nodeData?.find(n => n.id === d.source);
  const tgt = (typeof d.target === "object" && d.target !== null) ? d.target : window._nodeData?.find(n => n.id === d.target);
  if (!src || !tgt || src.x == null || tgt.x == null) return { x: 0, y: 0 };
  const dx = tgt.x - src.x, dy = tgt.y - src.y;
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  const offset = d._curve || 0;
  // Stagger along the edge direction so parallel labels don't overlap
  const along = offset * 0.6;
  return {
    x: (src.x + tgt.x) / 2 + nx * offset + (dx / len) * along,
    y: (src.y + tgt.y) / 2 + ny * offset + (dy / len) * along - 6,
  };
}

// ── Initial layout helpers ─────────────────────────────────────────
function buildAdjacency(nodes, links) {
  const adj = new Map(nodes.map(n => [n.id, new Set()]));
  links.forEach(e => {
    const s = typeof e.source === "object" ? e.source.id : e.source;
    const t = typeof e.target === "object" ? e.target.id : e.target;
    if (adj.has(s) && adj.has(t)) { adj.get(s).add(t); adj.get(t).add(s); }
  });
  return adj;
}

function connectedComponents(nodes, links) {
  const byId = new Map(nodes.map(n => [n.id, n]));
  const adj = buildAdjacency(nodes, links);
  const seen = new Set();
  const comps = [];
  for (const n of nodes) {
    if (seen.has(n.id)) continue;
    const q = [n.id]; seen.add(n.id); const comp = [];
    while (q.length) {
      const id = q.pop(); comp.push(byId.get(id));
      for (const nxt of adj.get(id) || []) { if (!seen.has(nxt)) { seen.add(nxt); q.push(nxt); } }
    }
    comps.push(comp);
  }
  return comps.sort((a, b) => b.length - a.length);
}

function seedPositions(nodes, links, width, height) {
  const comps = connectedComponents(nodes, links);
  const isolatedComps = comps.filter(c => c.length === 1);
  const connectedComps = comps.filter(c => c.length > 1);
  const compCols = Math.max(1, Math.ceil(Math.sqrt(connectedComps.length)));
  const compRows = Math.max(1, Math.ceil(connectedComps.length / compCols));
  const startX = width / 2 - ((compCols - 1) * COMPONENT_GAP_X) / 2;
  const startY = height / 2 - ((compRows - 1) * COMPONENT_GAP_Y) / 2;
  const degree = new Map(nodes.map(n => [n.id, 0]));
  links.forEach(e => {
    const s = typeof e.source === "object" ? e.source.id : e.source;
    const t = typeof e.target === "object" ? e.target.id : e.target;
    if (degree.has(s)) degree.set(s, degree.get(s) + 1);
    if (degree.has(t)) degree.set(t, degree.get(t) + 1);
  });
  connectedComps.forEach((comp, i) => {
    const col = i % compCols; const row = Math.floor(i / compCols);
    const cx = startX + col * COMPONENT_GAP_X; const cy = startY + row * COMPONENT_GAP_Y;
    const sorted = [...comp].sort((a, b) => (degree.get(b.id) || 0) - (degree.get(a.id) || 0));
    const coreCount = Math.max(1, Math.floor(sorted.length * 0.2));
    sorted.forEach((n, idx) => {
      if (idx < coreCount) {
        const a = (2 * Math.PI * idx) / coreCount; n.x = cx + Math.cos(a) * 40; n.y = cy + Math.sin(a) * 40;
      } else {
        const ringIdx = idx - coreCount; const ring = Math.floor(ringIdx / 8) + 1;
        const inRing = ringIdx % 8; const countInRing = Math.min(8, sorted.length - coreCount - (ring - 1) * 8);
        const a = (2 * Math.PI * inRing) / Math.max(1, countInRing); const r = 90 + ring * 70;
        n.x = cx + Math.cos(a) * r; n.y = cy + Math.sin(a) * r;
      }
    });
  });
  const bottomY = startY + compRows * COMPONENT_GAP_Y + ISOLATED_ROW_Y_OFFSET;
  const isoColGap = isolatedComps.length > 12 ? 300 : ISOLATED_COL_GAP;
  const isoRowGap = isolatedComps.length > 12 ? 260 : GRID_SNAP_ROW_GAP;
  const isoCols = Math.max(1, Math.min(isolatedComps.length, Math.ceil(Math.sqrt(isolatedComps.length * 1.4))));
  const totalIsolatedW = (isoCols - 1) * isoColGap;
  const isolatedStartX = width / 2 - totalIsolatedW / 2;
  isolatedComps.forEach((comp, i) => {
    const col = i % isoCols;
    const row = Math.floor(i / isoCols);
    comp[0].x = isolatedStartX + col * isoColGap; comp[0].y = bottomY + row * isoRowGap; comp[0]._isolated = true; comp[0]._isolatedTargetY = bottomY + row * isoRowGap;
  });
}

function makeIsolatedBottomForce(isolatedY, strength = 0.15) {
  let nodes = [];
  function force(alpha) { for (const n of nodes) { if (!n._isolated) continue; const targetY = n._isolatedTargetY || isolatedY; n.vy += (targetY - n.y) * strength * alpha; } }
  force.initialize = (_nodes) => { nodes = _nodes || []; };
  return force;
}

function gridLayout(nodeData, width, height) {
  // Lay out nodes in a simple grid centered in the viewport
  const count = nodeData.length;
  if (count === 0) return;
  const cols = Math.max(1, Math.ceil(Math.sqrt(count * 1.4)));
  const colGap = count > 20 ? 340 : count > 12 ? 420 : GRID_SNAP_COL_GAP;
  const rowGap = count > 20 ? 260 : count > 12 ? 310 : GRID_SNAP_ROW_GAP;
  const rows = Math.ceil(count / cols);
  const gridW = (cols - 1) * colGap;
  const gridH = (rows - 1) * rowGap;
  const originX = width / 2 - gridW / 2;
  const originY = height / 2 - gridH / 2;
  nodeData.forEach(function(n, i) {
    const col = i % cols;
    const row = Math.floor(i / cols);
    n.x = originX + col * colGap;
    n.y = originY + row * rowGap;
    n.fx = null;
    n.fy = null;
  });
}

// ── Render ─────────────────────────────────────────────────────────
// Height of the breadcrumb bar (used to offset the fit area)
const _BREADCRUMB_H = 30;
// Height of the description bar at the bottom
const _DESC_BAR_H = 0;

function fitGraphToViewport(svg, zoomBehavior, nodeData, width, height, padding, animate) {
  if (padding === undefined) padding = 40;
  if (animate === undefined) animate = true;
  if (!nodeData || nodeData.length === 0) return;
  if (width <= 0 || height <= 0) return;

  // Extra top padding so nodes don't hide behind the breadcrumb
  var padTop = padding + _BREADCRUMB_H;
  var padSide = padding;
  var padBottom = padding + _DESC_BAR_H;

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  nodeData.forEach(n => {
    const s = NODE_SIZE[n.kind] || { w: 160, h: 60 };
    const x1 = n.x - s.w / 2, x2 = n.x + s.w / 2;
    const y1 = n.y - s.h / 2, y2 = n.y + s.h / 2;
    if (x1 < minX) minX = x1; if (y1 < minY) minY = y1;
    if (x2 > maxX) maxX = x2; if (y2 > maxY) maxY = y2;
  });
  const graphW = Math.max(1, maxX - minX);
  const graphH = Math.max(1, maxY - minY);
  const availW = Math.max(1, width - padSide * 2);
  const availH = Math.max(1, height - padTop - padBottom);
  // Don't clamp to a max — allow arbitrarily small scales so all nodes fit
  const scale = Math.min(availW / graphW, availH / graphH);
  const tx = (width - graphW * scale) / 2 - minX * scale;
  const ty = padTop + (availH - graphH * scale) / 2 - minY * scale;
  const t = d3.zoomIdentity.translate(tx, ty).scale(scale);
  if (animate) { svg.transition().duration(250).call(zoomBehavior.transform, t); }
  else { svg.call(zoomBehavior.transform, t); }
}

function snapNodesToGrid(nodeData, svg, g, node, link, edgeLabel) {
  if (!nodeData || nodeData.length === 0) return;

  const container = document.getElementById("graph-container");
  if (!container) return;
  const width = container.clientWidth;
  const height = container.clientHeight;

  // Adaptive grid gaps: shrink for large node counts so the grid fits
  const count = nodeData.length;
  const colGap = count > 20 ? 340 : count > 12 ? 420 : GRID_SNAP_COL_GAP;
  const rowGap = count > 20 ? 260 : count > 12 ? 310 : GRID_SNAP_ROW_GAP;
  const cols = Math.max(1, Math.ceil(Math.sqrt(nodeData.length * 1.4)));
  const rows = Math.ceil(nodeData.length / cols);
  const totalW = (cols - 1) * colGap;
  const totalH = (rows - 1) * rowGap;
  const centerX = width / 2;
  const centerY = height / 2;

  // Snap each node to its grid cell, centered
  nodeData.forEach(n => {
    const col = Math.round((n.x - centerX + totalW / 2) / colGap);
    const row = Math.round((n.y - centerY + totalH / 2) / rowGap);
    n.x = centerX + (col * colGap - totalW / 2);
    n.y = centerY + (row * rowGap - totalH / 2);
    n.fx = null;
    n.fy = null;
  });
  node.attr("transform", d => `translate(${d.x ?? 0},${d.y ?? 0})`);
  link.attr("d", edgePath);
    edgeLabel.attr("x", d => _edgeLabelPos(d).x).attr("y", d => _edgeLabelPos(d).y);
  // Fit immediately (no animation) then animate a refined fit
  fitGraphToViewport(svg, zoomBehavior, nodeData, width, height, 20, false);
  setTimeout(function() {
    const c = document.getElementById("graph-container");
    if (!c) return;
    fitGraphToViewport(svg, zoomBehavior, nodeData, c.clientWidth, c.clientHeight, 20, true);
  }, 50);
}

/**
 * After layout/snap settles, verify every node is on-screen in the
 * overview (top) panel.  If any node is clipped, refit with generous padding.
 */
function ensureAllNodesVisible(svg, zoomBehavior, nodeData) {
  if (!nodeData || nodeData.length === 0) return;

  const container = document.getElementById("graph-container");
  if (!container) return;
  const width = container.clientWidth;
  const height = container.clientHeight;

  // Re-read the current transform and check if all node bounding boxes are inside
  const t = d3.zoomTransform(svg.node());
  let allVisible = true;
  for (let i = 0; i < nodeData.length; i++) {
    const n = nodeData[i];
    const s = NODE_SIZE[n.kind] || { w: 160, h: 60 };
    const sx1 = t.applyX(n.x - s.w / 2);
    const sy1 = t.applyY(n.y - s.h / 2);
    const sx2 = t.applyX(n.x + s.w / 2);
    const sy2 = t.applyY(n.y + s.h / 2);
    if (sx1 < -10 || sy1 < -10 || sx2 > width + 10 || sy2 > height + 10) {
      allVisible = false;
      break;
    }
  }
  if (!allVisible) {
    fitGraphToViewport(svg, zoomBehavior, nodeData, width, height, 20, true);
  }
}

// ── Zoom detail view helpers ───────────────────────────────────────
function centerDetailOnGraphPoint(graphX, graphY, animate) {
  if (animate === undefined) animate = true;
  if (!_zoomSvg || !_zoomDetailBehavior) return;
  const zoomContainer = document.getElementById("zoom-container");
  if (!zoomContainer) return;
  const zw = zoomContainer.clientWidth;
  const zh = zoomContainer.clientHeight;
  const fallbackScale = (_overviewTransform ? _overviewTransform.k : 1) * DETAIL_ZOOM_SCALE;
  const detailScale = _zoomDetailTransform ? _zoomDetailTransform.k : fallbackScale;
  const dtx = zw / 2 - graphX * detailScale;
  const dty = zh / 2 - graphY * detailScale;
  const t = d3.zoomIdentity.translate(dtx, dty).scale(detailScale);
  if (animate) { _zoomSvg.transition().duration(250).call(_zoomDetailBehavior.transform, t); }
  else { _zoomSvg.call(_zoomDetailBehavior.transform, t); }
}

function updateViewportIndicator() {
  if (!_viewportRect || !_zoomDetailTransform || !_overviewTransform) return;

  const zoomContainer = document.getElementById("zoom-container");
  if (!zoomContainer) return;
  const zw = zoomContainer.clientWidth;
  const zh = zoomContainer.clientHeight;

  const detailInv = _zoomDetailTransform.invert([0, 0]);
  const detailInv2 = _zoomDetailTransform.invert([zw, zh]);

  const gx1 = detailInv[0], gy1 = detailInv[1];
  const gx2 = detailInv2[0], gy2 = detailInv2[1];

  const ox1 = _overviewTransform.applyX(gx1);
  const oy1 = _overviewTransform.applyY(gy1);
  const ox2 = _overviewTransform.applyX(gx2);
  const oy2 = _overviewTransform.applyY(gy2);

  _viewportRect
    .attr("x", ox1)
    .attr("y", oy1)
    .attr("width", ox2 - ox1)
    .attr("height", oy2 - oy1)
    .attr("visibility", "visible");
}

function initDetailView(overviewSvg, overviewG, overviewZoomBehavior, nodeData) {
  cleanupDetailView();

  const zoomSvg = d3.select("#zoom-svg");
  if (zoomSvg.empty()) return;  // detail-view panel not mounted
  _zoomSvg = zoomSvg;
  _overviewSvgRef = overviewSvg;

  const zoomContainer = document.getElementById("zoom-container");
  if (!zoomContainer) return;
  const zw = zoomContainer.clientWidth;
  const zh = zoomContainer.clientHeight;

  // Clone the overview <g> contents into the detail SVG
  // First, copy the <defs> for markers
  const overviewDefs = overviewSvg.select("defs").node();
  if (overviewDefs) {
    zoomSvg.node().appendChild(overviewDefs.cloneNode(true));
  }

  const zoomG = zoomSvg.append("g");

  const overviewGNode = overviewG.node();
  if (overviewGNode) {
    const clone = overviewGNode.cloneNode(true);
    zoomG.node().appendChild(clone);
    const inner = zoomG.select("g");
    if (inner.node()) {
      while (inner.node().firstChild) {
        zoomG.node().appendChild(inner.node().firstChild);
      }
      inner.remove();
    }
  }

  // Set up zoom/pan on the detail SVG
  _zoomDetailBehavior = d3.zoom()
    .scaleExtent([0.1, 10])
    .on("zoom", function(event) {
      zoomG.attr("transform", event.transform);
      _zoomDetailTransform = event.transform;
      updateViewportIndicator();
    });

  zoomSvg.call(_zoomDetailBehavior);

  const currentOverview = d3.zoomTransform(overviewSvg.node());
  _overviewTransform = currentOverview;

  // Default: fit all nodes in view (zoomed out, same as Overview)
  if (nodeData && nodeData.length > 0) {
    let dMinX = Infinity, dMinY = Infinity, dMaxX = -Infinity, dMaxY = -Infinity;
    nodeData.forEach(n => {
      const s = NODE_SIZE[n.kind] || { w: 160, h: 60 };
      const x1 = n.x - s.w / 2, x2 = n.x + s.w / 2;
      const y1 = n.y - s.h / 2, y2 = n.y + s.h / 2;
      if (x1 < dMinX) dMinX = x1; if (y1 < dMinY) dMinY = y1;
      if (x2 > dMaxX) dMaxX = x2; if (y2 > dMaxY) dMaxY = y2;
    });
    const dGraphW = Math.max(1, dMaxX - dMinX);
    const dGraphH = Math.max(1, dMaxY - dMinY);
    const dPad = 40;

      return;
    }

    // Separate edgeless nodes — they'll be grid-positioned after simulation
    const edgelessNodes = nodeData.filter(n => !connectedNodeIds.has(n.id));
    const simulatedNodes = nodeData.filter(n => connectedNodeIds.has(n.id));

    // Give edgeless nodes temporary positions so the D3 tick handler
    // never encounters undefined x/y (they are repositioned properly
    // in _saveAndSnap after the simulation finishes).
    edgelessNodes.forEach(n => {
      if (n.x == null) n.x = -9999;
      if (n.y == null) n.y = -9999;
    });
    // Only edges referencing simulated nodes
    const simulatedLinks = linkData.filter(function(e) {
      const s = typeof e.source === "object" ? e.source.id : e.source;
      const t = typeof e.target === "object" ? e.target.id : e.target;
      return connectedNodeIds.has(s) && connectedNodeIds.has(t);
    });

    seedPositions(simulatedNodes, simulatedLinks, width, height);

    const connectedYs = simulatedNodes.filter(n => !n._isolated).map(n => n.y);
    const maxConnectedY = connectedYs.length ? Math.max(...connectedYs) : height / 2;
    const isolatedTargetY = maxConnectedY + ISOLATED_ROW_Y_OFFSET;

    simulation = d3.forceSimulation(simulatedNodes)
      .alpha(1).alphaDecay(0.03).velocityDecay(0.35)
      .force("link", d3.forceLink(simulatedLinks).id(d=>d.id).distance(d=>EDGE_DISTANCE[d.kind]||240).strength(d=>d.kind==="contains"?0.35:0.2).iterations(3))
      .force("charge", d3.forceManyBody().strength(d=>NODE_CHARGE[d.kind]||-500))
      .force("center", d3.forceCenter(width/2,height/2))
      .force("collision", d3.forceCollide().radius(d=>{const s=NODE_SIZE[d.kind]||{w:160,h:60};return Math.sqrt(s.w*s.w+s.h*s.h)/2+COLLISION_PAD;}))
      .force("isolatedBottom", makeIsolatedBottomForce(isolatedTargetY, ISOLATED_FORCE_STRENGTH))
      .force("x", d3.forceX(width/2).strength(0.025))
      .force("y", d3.forceY(height/2).strength(0.025));

    simulation.on("tick", function() {
      link.attr("d", edgePath);
    edgeLabel.attr("x", d => _edgeLabelPos(d).x).attr("y", d => _edgeLabelPos(d).y);
      node.attr("transform", d => `translate(${d.x ?? 0},${d.y ?? 0})`);
      if (autoFitActive) {
        const now = performance.now();
        if (now - lastAutoFitTs >= AUTO_FIT_INTERVAL_MS) {
          lastAutoFitTs = now;
          fitGraphToViewport(svg, zoomBehavior, nodeData, width, height, 56, false);
        }
        if (simulation.alpha() < 0.12) autoFitActive = false;
      }
    });

    function _saveAndSnap() {
      autoFitActive = false;

      // Position edgeless nodes in a grid below the simulated graph
      if (edgelessNodes.length > 0) {
        const simYs = simulatedNodes.map(n => n.y);
        const simXs = simulatedNodes.map(n => n.x);
        const bottomY = (simYs.length ? Math.max(...simYs) : height / 2) + ISOLATED_ROW_Y_OFFSET;
        const centerX = simXs.length ? (Math.min(...simXs) + Math.max(...simXs)) / 2 : width / 2;
        const edgelessColGap = edgelessNodes.length > 12 ? 300 : ISOLATED_COL_GAP;
        const edgelessRowGap = edgelessNodes.length > 12 ? 260 : GRID_SNAP_ROW_GAP;
        const gridCols = Math.max(1, Math.min(edgelessNodes.length, Math.ceil(Math.sqrt(edgelessNodes.length * 1.4))));
        const gridRows = Math.ceil(edgelessNodes.length / gridCols);
        const totalW = (gridCols - 1) * edgelessColGap;
        const startX = centerX - totalW / 2;
        edgelessNodes.forEach(function(n, i) {
          const col = i % gridCols;
          const row = Math.floor(i / gridCols);
          n.x = startX + col * edgelessColGap;
          n.y = bottomY + row * edgelessRowGap;
          n.fx = null; n.fy = null;
        });
      }

      snapNodesToGrid(nodeData, svg, g, node, link, edgeLabel);
      // Final safety check after grid snap animation
      var eid2 = setTimeout(function() {
        ensureAllNodesVisible(svg, zoomBehavior, nodeData);
      }, GRID_SNAP_DURATION + 100);
      _pendingEnsureTimeouts.push(eid2);
      // Save to memory cache
      const posMap = new Map(nodeData.map(n => [n.id, { x: n.x, y: n.y }]));
      _positionCache.set(cacheKey, posMap);
      // Save to disk cache
      _savePositionsToDisk(nodeData);
      _initDetail();
    }

    simulation.on("end", function() {
      if (didInitialFit) return;
      didInitialFit = true;
      _saveAndSnap();
    });

    setTimeout(function() {
      if (didInitialFit) return;
      didInitialFit = true;
      simulation.stop();
      _saveAndSnap();
    }, 4000);
  });

  svg.on("click", function() { selectedNode = null; _inspectorPinned = false; clearHighlight(); });
}

// ── Context menu for nodes ─────────────────────────────────────────
var _ctxMenuNode = null;        // the node data object the menu was opened for
var _inspectorPinned = false;   // when true, hover won't overwrite the inspector

var _DRILLABLE_KINDS = new Set(["class", "metaclass", "test_group", "model_group",
  "config_group", "handler_group", "utility_group", "exception_group", "event_group"]);

function _canDrill(d) {
  if (!_DRILLABLE_KINDS.has(d.kind)) return false;
  // Classes without methods have nothing to drill into
  if (d.kind === "class" && (!d.methods || d.methods.length === 0)) return false;
  return true;
}

function _hasSourceFile(d) {
  // Metaclass / group nodes set file_path to a directory (no extension) and line_start=0.
  // Only enable "View Code" when the path looks like an actual file.
  if (!d.file_path) return false;
  // Must contain a dot (file extension) somewhere in the basename
  var base = d.file_path.split('/').pop() || '';
  return base.indexOf('.') !== -1;
}

function showNodeContextMenu(event, d) {
  event.preventDefault();
  event.stopPropagation();
  _ctxMenuNode = d;

  var menu = document.getElementById("node-ctx-menu");
  var digItem = document.getElementById("ctx-dig-down");
  var codeItem = document.getElementById("ctx-view-code");
  var revealItem = document.getElementById("ctx-reveal-file");

  // Enable / disable "Dig Down"
  if (_canDrill(d)) {
    digItem.classList.remove("disabled");
  } else {
    digItem.classList.add("disabled");
  }

  // Enable / disable "View Code" — need a real file path, not a directory
  if (_hasSourceFile(d)) {
    codeItem.classList.remove("disabled");
  } else {
    codeItem.classList.add("disabled");
  }

  // Enable / disable "Reveal in Files" — need any file_path at all
  if (d.file_path) {
    revealItem.classList.remove("disabled");
  } else {
    revealItem.classList.add("disabled");
  }

  // Position near cursor but keep on-screen
  var mx = event.clientX, my = event.clientY;
  menu.classList.add("open");
  var mw = menu.offsetWidth, mh = menu.offsetHeight;
  if (mx + mw > window.innerWidth)  mx = window.innerWidth - mw - 4;
  if (my + mh > window.innerHeight) my = window.innerHeight - mh - 4;
  menu.style.left = mx + "px";
  menu.style.top  = my + "px";
}

function hideNodeContextMenu() {
  var menu = document.getElementById("node-ctx-menu");
  if (menu) menu.classList.remove("open");
  _ctxMenuNode = null;
}

// ── Node description bar (AI hover descriptions) ───────────────────

// Cache: nodeId → { description, contentHash }
const _nodeDescCache = new Map();
let _nodeDescAbort = null;   // current AbortController
let _nodeDescHoverId = null; // node ID currently being described

function _contentHashForNode(d) {
  // Simple hash from node identity + code location
  var raw = (d.file_path || '') + ':' + (d.line_start || 0) + ':' + (d.line_end || 0) + ':' + d.name;
  // FNV-1a-ish quick hash
  var h = 0x811c9dc5;
  for (var i = 0; i < raw.length; i++) { h ^= raw.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(16);
}

function _descBarHtml(d, bodyHtml) {
  var kindLabel = (d.kind || '').replace(/_/g, ' ');
  return '<div class="desc-header"><span class="desc-node-name">' + _escHtml(d.name) + '</span><span class="desc-kind">' + _escHtml(kindLabel) + '</span></div>' + bodyHtml;
}

function _showNodeDesc(d) {
  var bar = document.getElementById('node-desc-bar');
  if (!bar) return;
  _nodeDescHoverId = d.id;
  var hash = _contentHashForNode(d);
  var cached = _nodeDescCache.get(d.id);

  // If cached and hash matches, show immediately
  if (cached && cached.contentHash === hash) {
    bar.className = '';
    bar.innerHTML = _descBarHtml(d, '<span class="desc-text">' + _escHtml(cached.description) + '</span>');
    return;
  }

  // Show loading state
  bar.className = '';
  bar.innerHTML = _descBarHtml(d, '<span class="desc-text desc-loading">Generating description…</span>');

  // Abort previous request
  if (_nodeDescAbort) { _nodeDescAbort.abort(); _nodeDescAbort = null; }

  var controller = new AbortController();
  _nodeDescAbort = controller;

  var body = {
    node_name: d.name,
    node_kind: d.kind,
    file_path: d.file_path || '',
    line_start: d.line_start || 0,
    line_end: d.line_end || 0,
  };
  if (d.members && d.members.length > 0) body.members = d.members;

  fetch(API_BASE + '/api/node-description', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
    signal: controller.signal,
  })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (_nodeDescHoverId !== d.id) return; // stale
      if (data.error) {
        bar.innerHTML = _descBarHtml(d, '<span class="desc-text desc-loading">' + _escHtml(data.error) + '</span>');
        return;
      }
      _nodeDescCache.set(d.id, { description: data.description, contentHash: hash });
      bar.innerHTML = _descBarHtml(d, '<span class="desc-text">' + _escHtml(data.description) + '</span>');
    })
    .catch(function(err) {
      if (err.name === 'AbortError') return;
      if (_nodeDescHoverId !== d.id) return;
      bar.innerHTML = _descBarHtml(d, '<span class="desc-text desc-loading">Failed to load description</span>');
    });
}

function _hideNodeDesc() {
  _nodeDescHoverId = null;
  if (_nodeDescAbort) { _nodeDescAbort.abort(); _nodeDescAbort = null; }
  var bar = document.getElementById('node-desc-bar');
  if (bar) {
    bar.className = 'empty';
    bar.innerHTML = '<span class="desc-placeholder">Hover over a node to see its description</span>';
  }
}

function _escHtml(s) {
  var d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

/** Observe the panel container and scale the desc bar font size to fit. */
function _nodeDescResizeObserver(container) {
  if (!window.ResizeObserver) return;
  var ro = new ResizeObserver(function(entries) {
    var entry = entries[0];
    if (!entry) return;
    var w = entry.contentRect.width;
    var h = entry.contentRect.height;
    var bar = document.getElementById('node-desc-bar');
    if (!bar) return;
    // Base font size on the smaller dimension, clamped
    var base = Math.min(w, h) * 0.09;
    base = Math.max(10, Math.min(base, 40));
    bar.style.fontSize = base + 'px';
    // Kind tag stays proportionally smaller
    var kindEl = bar.querySelector('.desc-kind');
    if (kindEl) kindEl.style.fontSize = (base * 0.45) + 'px';
  });
  ro.observe(container);
}


function highlightConnected(d) {
  _showNodeDesc(d);
  const connectedIds = new Set([d.id]);
  window._linkData.forEach(e => {
    const sid = _nid(e.source), tid = _nid(e.target);
    if (sid === d.id) connectedIds.add(tid);
    if (tid === d.id) connectedIds.add(sid);
  });

  // ── Overview panel (top) ──────────────────────────────────────
  window._nodes.selectAll(".node-rect")
    .style("opacity", n => connectedIds.has(n.id) ? 1 : 0.15)
    .style("filter", n => n.id === d.id ? "brightness(1.2) drop-shadow(0 0 8px)" : null);
  window._nodes.selectAll(".node-title").style("opacity", n => connectedIds.has(n.id) ? 1 : 0.15);
  window._nodes.selectAll(".node-kind-inside").style("opacity", n => connectedIds.has(n.id) ? 1 : 0.15);
  window._links.style("opacity", e => {
    const sid = _nid(e.source), tid = _nid(e.target);
    return (sid === d.id || tid === d.id) ? 0.9 : 0.05;
  });

  // Show labels on connected edges
  if (window._edgeLabels) {
    window._edgeLabels.classed("visible", e => {
      const sid = _nid(e.source), tid = _nid(e.target);
      return (sid === d.id || tid === d.id);
    });
  }

  // ── Detail panel (bottom) — cloned DOM, no D3 data ────────────
  const zoomSvg = d3.select("#zoom-svg");
  zoomSvg.selectAll(".node-group").each(function() {
    const el = d3.select(this);
    const nid = el.attr("data-node-id");
    if (!nid) return;
    const isConn = connectedIds.has(nid);
    const isFocus = nid === d.id;
    el.selectAll(".node-rect")
      .style("opacity", isConn ? 1 : 0.15)
      .style("filter", isFocus ? "brightness(1.2) drop-shadow(0 0 8px)" : null);
    el.selectAll(".node-title").style("opacity", isConn ? 1 : 0.15);
    el.selectAll(".node-kind-inside").style("opacity", isConn ? 1 : 0.15);
  });
  zoomSvg.selectAll("path[data-edge-src]").each(function() {
    const el = d3.select(this);
    const sid = el.attr("data-edge-src"), tid = el.attr("data-edge-tgt");
    el.style("opacity", (sid === d.id || tid === d.id) ? 0.9 : 0.05);
  });
  zoomSvg.selectAll(".edge-label").each(function() {
    const el = d3.select(this);
    const sid = el.attr("data-edge-src"), tid = el.attr("data-edge-tgt");
    el.classed("visible", sid === d.id || tid === d.id);
  });

  // Don't overwrite the inspector when it's pinned by "Get Info"
  if (!_inspectorPinned) {
    populatePanel(d);
  }
}

function clearHighlight() {
  _hideNodeDesc();

  if (!window._nodes || !window._links) return;


  // ── Overview panel (top) ──────────────────────────────────────
  window._nodes.selectAll(".node-rect").style("filter", null).style("opacity", 1);
  window._nodes.selectAll(".node-title").style("opacity", 1);
  window._nodes.selectAll(".node-kind-inside").style("opacity", 1);
  window._links.style("opacity", 0.5);

  // Hide all edge labels
  if (window._edgeLabels) {
    window._edgeLabels.classed("visible", false);
  }

  // ── Detail panel (bottom) ─────────────────────────────────────
  const zoomSvg = d3.select("#zoom-svg");
  zoomSvg.selectAll(".node-group").each(function() {
    const el = d3.select(this);
    el.selectAll(".node-rect").style("filter", null).style("opacity", 1);
    el.selectAll(".node-title").style("opacity", 1);
    el.selectAll(".node-kind-inside").style("opacity", 1);
  });
  zoomSvg.selectAll("path[data-edge-src]").style("opacity", 0.5);
  zoomSvg.selectAll(".edge-label").classed("visible", false);

  // Don't overwrite the inspector when it's pinned
  if (!_inspectorPinned) {
    showPlaceholder();
  }
}

// Drill navigation is now handled by the breadcrumb (see updateBreadcrumb)

// ── Resize ─────────────────────────────────────────────────────────
var _wmResizeDebounce = null;
function _handleResize() {
  if (_wmResizeDebounce) clearTimeout(_wmResizeDebounce);
  _wmResizeDebounce = setTimeout(function () {
    if (graphData) renderGraph();
  }, 150);
}
window.addEventListener("resize", _handleResize);

// ── Boot ───────────────────────────────────────────────────────────

// ── Project management ─────────────────────────────────────────────

var _projectsList = [];
var _currentProjectId = null;

function loadProjects(thenBoot) {
  fetch(API_BASE + '/api/projects')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      _projectsList = data.projects || [];
      _currentProjectId = data.current_id || null;
      _populateProjectSelect();
      if (thenBoot) _bootApp();
    })
    .catch(function () {
      // Couldn't reach the server — boot anyway with fallback
      if (thenBoot) _bootApp();
    });
}

function _populateProjectSelect() {
  var sel = document.getElementById('project-select');
  sel.innerHTML = '';

  if (_projectsList.length === 0) {
    var opt = document.createElement('option');
    opt.value = '';
    opt.textContent = '(no projects)';
    sel.appendChild(opt);
  } else {
    _projectsList.forEach(function (p) {
      var opt = document.createElement('option');
      opt.value = p.project_id;
      opt.textContent = p.name;
      if (p.project_id === _currentProjectId) opt.selected = true;
      sel.appendChild(opt);
    });
  }

  // Sentinel: add new project option
  var addOpt = document.createElement('option');
  addOpt.value = '__new__';
  addOpt.textContent = '＋ New Project…';
  sel.appendChild(addOpt);
}

document.getElementById('project-select').addEventListener('change', function () {
  var val = this.value;
  if (val === '__new__') {
    _openNewProjectModal();
    // Reset select to current project
    this.value = _currentProjectId || '';
    return;
  }
  if (!val || val === _currentProjectId) return;
  _switchProject(val);
});

function _switchProject(projectId) {
  fetch(API_BASE + '/api/projects/select', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ project_id: projectId }),
  })
    .then(function (r) { return r.json(); })
    .then(function () {
      _currentProjectId = projectId;
      _reloadAllData();
    });
}

function _reloadAllData() {
  // Clear all caches
  _dirTreeCache = null;
  _dirTreeLoading = false;
  _insightsData = null;
  _insightsLoading = false;
  _codeEditorCurrentPath = null;
  rootGraphData = null;
  fullGraphData = null;
  graphData = null;
  intermediateGraphData = { nodes: [], edges: [] };
  graphStack = [];
  _positionCache.clear();
  _nodeDescCache.clear();
  currentGraphLabel = "Overview";
  updateBreadcrumb();

  // Reset graph visuals
  var graphSvg = document.getElementById('graph-svg');
  if (graphSvg) graphSvg.innerHTML = '';
  var zoomSvg = document.getElementById('zoom-svg');
  if (zoomSvg) zoomSvg.innerHTML = '';

  // Show loading indicators
  document.querySelectorAll('[data-loading]').forEach(function (el) {
    el.style.display = '';
    el.textContent = 'Analyzing codebase…';
  });

  // Reload everything
  loadGraph();
  loadDirectoryTree();
  // Insights will reload when the panel is next opened (cached data cleared)
}

// ── New-project modal ──────────────────────────────────────────────

function _openNewProjectModal() {
  document.getElementById('np-name').value = '';
  document.getElementById('np-path').value = '';
  document.getElementById('np-error').textContent = '';
  _closeBrowser();
  document.getElementById('new-project-modal').classList.add('open');
  setTimeout(function () { document.getElementById('np-path').focus(); }, 80);
}

function _closeNewProjectModal() {
  _closeBrowser();
  document.getElementById('new-project-modal').classList.remove('open');
}

document.getElementById('np-cancel').addEventListener('click', _closeNewProjectModal);

document.getElementById('new-project-modal').addEventListener('click', function (e) {
  if (e.target === this) _closeNewProjectModal();
});

// ── Folder browser ─────────────────────────────────────────────────

var _browserCurrentPath = null;

function _closeBrowser() {
  var el = document.getElementById('np-browser');
  el.classList.remove('open');
  el.innerHTML = '';
  _browserCurrentPath = null;
}

document.getElementById('np-browse-btn').addEventListener('click', function () {
  var browser = document.getElementById('np-browser');
  if (browser.classList.contains('open')) {
    _closeBrowser();
    return;
  }
  // Start from the value in the path input, or home dir
  var startPath = document.getElementById('np-path').value.trim() || '';
  _browseDir(startPath);
});

function _browseDir(dirPath) {
  var browser = document.getElementById('np-browser');
  browser.classList.add('open');
  browser.innerHTML = '<div class="browser-empty">Loading…</div>';

  fetch(API_BASE + '/api/browse?path=' + encodeURIComponent(dirPath))
    .then(function (r) {
      if (!r.ok) return r.json().then(function (d) { throw new Error(d.error || 'Error'); });
      return r.json();
    })
    .then(function (data) {
      _browserCurrentPath = data.current;
      _renderBrowser(browser, data);
    })
    .catch(function (err) {
      browser.innerHTML = '<div class="browser-empty" style="color:var(--red)">' + err.message + '</div>';
    });
}

function _renderBrowser(container, data) {
  container.innerHTML = '';

  // Navigation bar: current path + up button
  var bar = document.createElement('div');
  bar.className = 'browser-bar';

  var upBtn = document.createElement('button');
  upBtn.className = 'browser-up';
  upBtn.textContent = '↑ Up';
  upBtn.disabled = !data.parent;
  upBtn.addEventListener('click', function () {
    if (data.parent) _browseDir(data.parent);
  });
  bar.appendChild(upBtn);

  var pathLabel = document.createElement('span');
  pathLabel.className = 'browser-bar-path';
  pathLabel.textContent = data.current;
  pathLabel.title = data.current;
  bar.appendChild(pathLabel);

  container.appendChild(bar);

  // Directory list
  var list = document.createElement('div');
  list.style.maxHeight = '180px';
  list.style.overflowY = 'auto';

  if (data.dirs.length === 0) {
    list.innerHTML = '<div class="browser-empty">No subdirectories</div>';
  } else {
    data.dirs.forEach(function (d) {
      var item = document.createElement('div');
      item.className = 'browser-item';

      var icon = document.createElement('span');
      icon.className = 'b-icon';
      icon.textContent = '📁';

      var name = document.createElement('span');
      name.className = 'b-name';
      name.textContent = d.name;

      item.appendChild(icon);
      item.appendChild(name);

      // Double-click navigates into the folder
      item.addEventListener('dblclick', function () {
        _browseDir(d.path);
      });
      // Single click navigates into the folder
      item.addEventListener('click', function () {
        _browseDir(d.path);
      });

      list.appendChild(item);
    });
  }

  container.appendChild(list);

  // Select bar: pick the current directory
  var selectRow = document.createElement('div');
  selectRow.className = 'browser-select-row';

  var selBtn = document.createElement('button');
  selBtn.className = 'modal-btn primary';
  selBtn.style.fontSize = '11px';
  selBtn.style.padding = '3px 14px';
  selBtn.textContent = 'Select This Folder';
  selBtn.addEventListener('click', function () {
    document.getElementById('np-path').value = data.current;
    // Auto-fill name if empty
    var nameInput = document.getElementById('np-name');
    if (!nameInput.value.trim()) {
      var parts = data.current.replace(/\/+$/, '').split('/');
      nameInput.value = parts[parts.length - 1] || '';
    }
    _closeBrowser();
  });
  selectRow.appendChild(selBtn);

  container.appendChild(selectRow);
}

document.getElementById('np-create').addEventListener('click', function () {
  var name = document.getElementById('np-name').value.trim();
  var path = document.getElementById('np-path').value.trim();
  var errEl = document.getElementById('np-error');
  errEl.textContent = '';

  if (!path) { errEl.textContent = 'Path is required.'; return; }

  var btn = this;
  btn.disabled = true;
  btn.textContent = 'Creating…';

  fetch(API_BASE + '/api/projects', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: name || undefined, path: path }),
  })
    .then(function (r) {
      if (!r.ok) return r.json().then(function (d) { throw new Error(d.error || 'Failed'); });
      return r.json();
    })
    .then(function (proj) {
      _closeNewProjectModal();
      _currentProjectId = proj.project_id;
      // Reload project list and data
      loadProjects(false);
      _reloadAllData();
    })
    .catch(function (err) {
      errEl.textContent = err.message;
    })
    .finally(function () {
      btn.disabled = false;
      btn.textContent = 'Create';
    });
});

// Allow Enter key in the path input to submit
document.getElementById('np-path').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') document.getElementById('np-create').click();
});

// Global "?" key toggles the shortcuts panel
document.addEventListener("keydown", function(e) {
  var tag = (document.activeElement || {}).tagName;
  var isTyping = (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT");
  if (e.key === "?" && !isTyping && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault();
    var inLayout = WindowManager.layout.hasPanelInTree('shortcuts');
    var isFloat  = WindowManager.floating.floatingPanels.has('shortcuts');
    if (inLayout || isFloat) {
      if (isFloat) WindowManager.floating.dockBack('shortcuts', WindowManager.layout);
      WindowManager.closePanel('shortcuts');
    } else {
      WindowManager.openPanel('shortcuts');
    }
  }
});

// Global Space key resets the camera to fit all nodes in view
document.addEventListener("keydown", function(e) {
  if (e.key !== " " && e.key !== "Spacebar") return;
  var tag = (document.activeElement || {}).tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  e.preventDefault();

  var svg = d3.select("#graph-svg");
  if (svg.empty() || !window._zoomBehavior || !window._nodeData || window._nodeData.length === 0) return;

  var container = document.getElementById("graph-container");
  if (!container) return;

  fitGraphToViewport(svg, window._zoomBehavior, window._nodeData,
    container.clientWidth, container.clientHeight, 20, true);

  // Also fit the detail view to capture the entire graph, centered
  if (_zoomSvg && _zoomDetailBehavior && window._nodeData.length > 0) {
    var zoomContainer = document.getElementById("zoom-container");
    if (zoomContainer) {
      var zw = zoomContainer.clientWidth;
      var zh = zoomContainer.clientHeight;
      if (zw > 0 && zh > 0) {
        var dMinX = Infinity, dMinY = Infinity, dMaxX = -Infinity, dMaxY = -Infinity;
        window._nodeData.forEach(function(n) {
          var s = NODE_SIZE[n.kind] || { w: 160, h: 60 };
          var x1 = n.x - s.w / 2, x2 = n.x + s.w / 2;
          var y1 = n.y - s.h / 2, y2 = n.y + s.h / 2;
          if (x1 < dMinX) dMinX = x1; if (y1 < dMinY) dMinY = y1;
          if (x2 > dMaxX) dMaxX = x2; if (y2 > dMaxY) dMaxY = y2;
        });
        var dGraphW = Math.max(1, dMaxX - dMinX);
        var dGraphH = Math.max(1, dMaxY - dMinY);
        var dPad = 40;
        var dAvailW = Math.max(1, zw - dPad * 2);
        var dAvailH = Math.max(1, zh - dPad * 2);
        var dScale = Math.min(dAvailW / dGraphW, dAvailH / dGraphH);
        var dtx = (zw - dGraphW * dScale) / 2 - dMinX * dScale;
        var dty = (zh - dGraphH * dScale) / 2 - dMinY * dScale;
        var dt = d3.zoomIdentity.translate(dtx, dty).scale(dScale);
        _zoomSvg.transition().duration(250).call(_zoomDetailBehavior.transform, dt);
      }
    }
  }
});

// ── Label mode (go-to-node) ─────────────────────────────────────────
var _labelModeActive = false;
var _labelMap = new Map();       // label string → node datum
var _labelTyped = "";            // chars typed so far
var _labelOverlayGroup = null;   // d3 selection of badge <g>
var _labelToast = null;          // DOM element for the bottom toast

var _LABEL_ALPHABET = "ASDFGHJKLQWERTYUIOPZXCVBNM";

function _generateLabels(count) {
  var chars = _LABEL_ALPHABET;
  var labels = [];
  if (count <= chars.length) {
    for (var i = 0; i < count; i++) labels.push(chars[i]);
  } else {
    // two-character labels
    for (var a = 0; a < chars.length && labels.length < count; a++) {
      for (var b = 0; b < chars.length && labels.length < count; b++) {
        labels.push(chars[a] + chars[b]);
      }
    }
  }
  return labels;
}

function _showLabelToast(text) {
  _removeLabelToast();
  var el = document.createElement("div");
  el.className = "label-mode-toast";
  el.textContent = text;
  document.body.appendChild(el);
  _labelToast = el;
}

function _removeLabelToast() {
  if (_labelToast) { _labelToast.remove(); _labelToast = null; }
}

function _enterLabelMode() {
  if (_labelModeActive) return;
  if (!window._nodeData || window._nodeData.length === 0) return;
  var gEl = d3.select("#graph-svg > g");
  if (gEl.empty()) return;

  _labelModeActive = true;
  _labelTyped = "";
  _labelMap.clear();

  var nodes = window._nodeData.filter(function(n) { return n.x != null && n.y != null; });
  if (nodes.length === 0) { _exitLabelMode(); return; }

  var labels = _generateLabels(nodes.length);
  for (var i = 0; i < nodes.length; i++) {
    _labelMap.set(labels[i], nodes[i]);
  }

  // Compute counter-scale so badges stay a fixed screen size
  var svg = d3.select("#graph-svg");
  var currentK = 1;
  if (!svg.empty()) {
    var zt = d3.zoomTransform(svg.node());
    if (zt && zt.k) currentK = zt.k;
  }
  var invK = 1 / currentK;

  // Draw badges
  _labelOverlayGroup = gEl.append("g").attr("class", "label-mode-overlay");
  _labelOverlayGroup.selectAll("g.label-mode-badge")
    .data(labels.map(function(l, idx) { return { label: l, node: nodes[idx] }; }))
    .join("g")
    .attr("class", "label-mode-badge")
    .attr("transform", function(d) {
      return "translate(" + d.node.x + "," + d.node.y + ") scale(" + invK + ")";
    })
    .each(function(d) {
      var g = d3.select(this);
      var padX = 8, padY = 5;
      var charW = 14, charH = 22;
      var w = d.label.length * charW + padX * 2;
      var h = charH + padY * 2;
      g.append("rect")
        .attr("x", -w / 2).attr("y", -h / 2)
        .attr("width", w).attr("height", h)
        .attr("rx", 4).attr("ry", 4);
      g.append("text")
        .attr("x", 0).attr("y", 1)
        .text(d.label);
    });

  _showLabelToast("GO TO NODE ▸ type a label…");
}

function _exitLabelMode() {
  _labelModeActive = false;
  _labelTyped = "";
  _labelMap.clear();
  if (_labelOverlayGroup) { _labelOverlayGroup.remove(); _labelOverlayGroup = null; }
  _removeLabelToast();
}

function _updateLabelDimming() {
  if (!_labelOverlayGroup) return;
  _labelOverlayGroup.selectAll("g.label-mode-badge")
    .classed("dimmed", function(d) {
      return _labelTyped.length > 0 && d.label.indexOf(_labelTyped) !== 0;
    });
}

function _zoomToNode(node) {
  // Detail panel: zoom in close and center on the selected node
  if (_zoomSvg && _zoomDetailBehavior) {
    var zoomContainer = document.getElementById("zoom-container");
    if (zoomContainer) {
      var zw = zoomContainer.clientWidth;
      var zh = zoomContainer.clientHeight;
      var s = NODE_SIZE[node.kind] || { w: 160, h: 60 };
      // Scale so the node fills roughly 80% of the panel (close-up)
      var scaleW = (zw * 0.8) / s.w;
      var scaleH = (zh * 0.8) / s.h;
      var closeScale = Math.min(scaleW, scaleH, 6.0); // cap at 6× to avoid extreme zoom
      closeScale = Math.max(closeScale, 0.5);          // floor to stay readable
      var dtx = zw / 2 - node.x * closeScale;
      var dty = zh / 2 - node.y * closeScale;
      var t = d3.zoomIdentity.translate(dtx, dty).scale(closeScale);
      _zoomSvg.transition().duration(300).call(_zoomDetailBehavior.transform, t);
    }
  }

  // Highlight + inspect
  highlightConnected(node);
  _inspectorPinned = true;
  populatePanel(node);
}

// Key handler for label mode
document.addEventListener("keydown", function(e) {
  var tag = (document.activeElement || {}).tagName;
  var isTyping = (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT");

  // "G" enters label mode (only when not typing and mode is not active)
  if (!_labelModeActive) {
    if ((e.key === "g" || e.key === "G") && !isTyping && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault();
      _enterLabelMode();
    }
    return;
  }

  // In label mode:
  e.preventDefault();
  e.stopPropagation();

  if (e.key === "Escape") {
    _exitLabelMode();
    return;
  }

  // Only accept alphabet keys
  var ch = e.key.toUpperCase();
  if (ch.length === 1 && _LABEL_ALPHABET.indexOf(ch) !== -1) {
    _labelTyped += ch;
    _showLabelToast("GO TO NODE ▸ " + _labelTyped + "…");
    _updateLabelDimming();

    // Check for exact match
    if (_labelMap.has(_labelTyped)) {
      var targetNode = _labelMap.get(_labelTyped);
      _exitLabelMode();
      _zoomToNode(targetNode);
    } else {
      // Check if any labels still start with what was typed
      var anyMatch = false;
      _labelMap.forEach(function(v, k) {
        if (k.indexOf(_labelTyped) === 0) anyMatch = true;
      });
      if (!anyMatch) {
        // No possible match — exit
        _exitLabelMode();
      }
    }
  }
}, true);  // useCapture = true so it intercepts before other handlers

WindowManager.init(document.getElementById("wm-root"));
loadProjects(true);
