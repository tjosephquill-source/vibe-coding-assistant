<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeCodingAssistant — Architecture Graph</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-muted: #8b949e;
    --accent: #58a6ff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
  }

  /* Floating drill navigation */
  #back-btn {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 9999;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
    display: none;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }
  #back-btn.visible { display: inline-flex; align-items: center; }
  #back-btn:hover { border-color: var(--accent); }

  /* Graph panels wrapper */
  #graph-panels {
    position: fixed;
    top: 0; left: 0;
    right: 340px;
    bottom: 0;
    display: flex;
    flex-direction: column;
  }

  #graph-container {
    position: relative;
    flex: 0 0 40%;
    border-bottom: 2px solid var(--border);
    overflow: hidden;
  }

  #graph-container .panel-label {
    position: absolute;
    top: 8px;
    right: 12px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-muted);
    background: var(--surface);
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
    z-index: 10;
    pointer-events: none;
  }

  #zoom-container {
    position: relative;
    flex: 1 1 60%;
    overflow: hidden;
  }

  #zoom-container .panel-label {
    position: absolute;
    top: 8px;
    right: 12px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-muted);
    background: var(--surface);
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
    z-index: 10;
    pointer-events: none;
  }

  svg { width: 100%; height: 100%; }

  /* Viewport indicator on overview */
  .viewport-rect {
    fill: rgba(88, 166, 255, 0.08);
    stroke: var(--accent);
    stroke-width: 2;
    stroke-dasharray: 6,3;
    pointer-events: none;
  }

  /* Edges */
  .edge {
    fill: none;
    stroke-width: 2;
    opacity: 0.7;
  }
  .edge.inherits     { stroke: #f97583; }
  .edge.imports      { stroke: #8b949e; stroke-dasharray: 8,4; }
  .edge.contains     { stroke: #484f58; stroke-dasharray: 3,3; }
  .edge.calls        { stroke: #58a6ff; }
  .edge.instantiates { stroke: #d2a8ff; stroke-dasharray: 6,3; }
  .edge.uses_type    { stroke: #7ee787; stroke-dasharray: 4,2; }

  /* Nodes */
  .node-group { cursor: pointer; }
  .node-group:hover .node-rect { filter: brightness(1.15); }

  .node-rect {
    stroke-width: 2;
    rx: 10px;
    ry: 10px;
  }
  .node-rect.class  { fill: #1f6feb; stroke: #58a6ff; }
  .node-rect.method { fill: #8957e5; stroke: #b392f0; }
  .node-rect.metaclass { fill: #b08900; stroke: #e3b341; }
  .node-rect.test_group { fill: #196c2e; stroke: #3fb950; }
  .node-rect.semantic_group { fill: #553098; stroke: #a371f7; }

  .node-title {
    font-size: 15px;
    fill: #ffffff;
    font-weight: 700;
    pointer-events: none;
  }

  .node-kind-inside {
    font-size: 12px;
    fill: #e6edf3;
    opacity: 0.95;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    pointer-events: none;
  }

  .node-methods-fo { pointer-events: auto; }
  .node-methods-box {
    color: #c9d1d9;
    font-size: 12px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    line-height: 1.4;
    width: 100%;
    height: 100%;
    padding: 0 8px 8px;
  }

  .node-methods-label {
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 4px;
    padding-top: 4px;
    border-top: 1px solid #ffffff33;
  }

  .node-methods-scroll {
    max-height: 82px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .node-methods-scroll div {
    white-space: nowrap;
  }

  /* Detail panel */
  #detail-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: 340px;
    bottom: 0;
    background: var(--surface);
    border-left: 1px solid var(--border);
    padding: 20px;
    overflow-y: auto;
    z-index: 90;
  }

  #detail-panel h2 {
    font-size: 16px;
    color: var(--accent);
    margin-bottom: 4px;
  }

  #detail-panel .kind-tag {
    display: inline-block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 2px 8px;
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .kind-tag.class    { background: #58a6ff33; color: #58a6ff; }
  .kind-tag.method   { background: #d2a8ff33; color: #d2a8ff; }
  .kind-tag.metaclass { background: #e3b34133; color: #e3b341; }
  .kind-tag.test_group    { background: #3fb95033; color: #3fb950; }
  .kind-tag.model_group   { background: #388bfd33; color: #388bfd; }
  .kind-tag.config_group  { background: #d4a72c33; color: #d4a72c; }
  .kind-tag.handler_group { background: #f4706733; color: #f47067; }
  .kind-tag.utility_group { background: #39d3bb33; color: #39d3bb; }

  #detail-panel .detail-section {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  #detail-panel .detail-section h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  #detail-panel .detail-row {
    font-size: 12px;
    color: var(--text);
    margin-bottom: 4px;
    word-break: break-all;
  }
  #detail-panel .detail-row span {
    color: var(--text-muted);
  }

  #detail-panel .methods-list {
    list-style: none;
    padding: 0;
  }
  #detail-panel .methods-list li {
    font-size: 12px;
    color: var(--text);
    padding: 2px 0;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  #detail-panel .methods-list li::before {
    content: "ƒ ";
    color: var(--accent);
  }

  #detail-panel .docstring {
    font-size: 12px;
    color: var(--text-muted);
    font-style: italic;
    white-space: pre-wrap;
  }

  #detail-placeholder {
    color: var(--text-muted);
    font-size: 13px;
    margin-top: 40px;
    text-align: center;
    line-height: 1.6;
  }

  .rel-list { list-style: none; padding: 0; }
  .rel-list li {
    font-size: 12px;
    padding: 3px 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .rel-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* Legend */
  #legend {
    position: fixed;
    bottom: 16px;
    left: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 11px;
    z-index: 90;
  }
  #legend h4 {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .legend-node {
    width: 12px; height: 12px;
    border-radius: 50%;
    border: 2px solid;
  }
  .legend-edge {
    width: 24px; height: 0;
    border-top: 2px solid;
  }
  .legend-edge.dashed { border-top-style: dashed; }
  .legend-edge.dotted { border-top-style: dotted; }

  /* Loading */
  .loading-indicator {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 14px;
    color: var(--text-muted);
    z-index: 20;
    pointer-events: none;
  }

  /* Overview cursor */
  #graph-container svg { cursor: crosshair; }
</style>
</head>
<body>

<button id="back-btn">← Back</button>

<div id="graph-panels">
  <div id="graph-container">
    <div class="panel-label">Overview</div>
    <div class="loading-indicator">Analyzing codebase…</div>
    <svg id="graph-svg"></svg>
  </div>
  <div id="zoom-container">
    <div class="panel-label">Detail View — click overview to navigate</div>
    <div class="loading-indicator">Analyzing codebase…</div>
    <svg id="zoom-svg"></svg>
  </div>
</div>

<div id="detail-panel">
  <div id="detail-content">
    <div id="detail-placeholder">Hover over a node<br>to see details</div>
  </div>
</div>

<div id="legend">
  <!-- populated dynamically by updateLegend() -->
</div>


<script>
const API_BASE = window.location.origin;
const ABSTRACT_NODES = true;

// ── Position cache ─────────────────────────────────────────────────
const _positionCache = new Map();

function _graphCacheKey(nodes) {
  return nodes.map(n => n.id).sort().join("|");
}

// Stable short hash of the graph cache key for the server endpoint
function _graphCacheKeyHash(nodes) {
  const raw = nodes.map(n => n.id).sort().join("|");
  let h = 0;
  for (let i = 0; i < raw.length; i++) {
    h = ((h << 5) - h + raw.charCodeAt(i)) | 0;
  }
  return "gk_" + Math.abs(h).toString(36);
}

// Save node positions to the server disk cache
function _savePositionsToDisk(nodeData) {
  if (!nodeData || nodeData.length === 0) return;
  const key = _graphCacheKeyHash(nodeData);
  const positions = {};
  nodeData.forEach(n => {
    if (n.x != null && n.y != null) {
      positions[n.id] = { x: n.x, y: n.y };
    }
  });
  if (Object.keys(positions).length === 0) return;
  fetch(`${API_BASE}/api/positions`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ graph_key: key, positions: positions }),
  }).catch(function() { /* ignore */ });
}

// Load node positions from the server disk cache. Returns positions map or null.
async function _loadPositionsFromDisk(nodeData) {
  const key = _graphCacheKeyHash(nodeData);
  try {
    const resp = await fetch(`${API_BASE}/api/positions?graph_key=${encodeURIComponent(key)}`);
    if (!resp.ok) return null;
    const data = await resp.json();
    if (!data.positions) return null;
    // Validate: every node in nodeData must have a saved position
    const pos = data.positions;
    for (let i = 0; i < nodeData.length; i++) {
      if (!pos[nodeData[i].id]) return null;
    }
    return pos;
  } catch (e) {
    return null;
  }
}

const NODE_SIZE = {
  class: { w: 240, h: 158 },
  method: { w: 190, h: 70 },
  metaclass: { w: 300, h: 210 },
  test_group:      { w: 240, h: 160 },
  model_group:     { w: 240, h: 160 },
  config_group:    { w: 240, h: 160 },
  handler_group:   { w: 240, h: 160 },
  utility_group:   { w: 240, h: 160 },
  exception_group: { w: 240, h: 160 },
  event_group:     { w: 240, h: 160 },
};
const NODE_CHARGE = {
  class: -950, method: -420, metaclass: -1300,
  test_group: -700, model_group: -700, config_group: -700,
  handler_group: -700, utility_group: -700,
  exception_group: -700, event_group: -700,
};
const EDGE_DISTANCE = {
  contains: 130,
  inherits: 260,
  instantiates: 260,
  uses_type: 240,
  calls: 230,
  imports: 210
};
const COMPONENT_GAP_X = 520;
const COMPONENT_GAP_Y = 420;
const COLLISION_PAD = 30;

const ISOLATED_ROW_Y_OFFSET = 420;
const ISOLATED_COL_GAP = 280;
const ISOLATED_FORCE_STRENGTH = 0.18;

const GRID_SNAP_COL_GAP = 560;
const GRID_SNAP_ROW_GAP = 380;
const PARALLEL_EDGE_SPACING = 28;

const MARKER_OFFSET = {
  inherits:     18,
  calls:        14,
  imports:      14,
  instantiates: 18,
  uses_type:    14,
  contains:     14,
};

const GRID_SNAP_DURATION = 600;

let graphData = null;
let rootGraphData = null;
let fullGraphData = null;
let intermediateGraphData = { nodes: [], edges: [] };  // multi-depth intermediates
let graphStack = [];
let currentGraphLabel = "Overview";
let simulation = null;
let selectedNode = null;

const activeNodeKinds = new Set(["class", "method", "metaclass", "test_group", "model_group", "config_group", "handler_group", "utility_group", "exception_group", "event_group"]);
const activeEdgeKinds = new Set(["inherits", "imports", "contains", "instantiates", "uses_type", "calls"]);

// ── Legend metadata ────────────────────────────────────────────────
const NODE_KIND_META = {
  class:           { label: "Class",                 border: "#58a6ff", bg: "#58a6ff22" },
  method:          { label: "Method",                border: "#d2a8ff", bg: "#d2a8ff22" },
  metaclass:       { label: "Metaclass",             border: "#e3b341", bg: "#e3b34122" },
  test_group:      { label: "Tests",                 border: "#3fb950", bg: "#3fb95022" },
  model_group:     { label: "Data Models",           border: "#388bfd", bg: "#388bfd22" },
  config_group:    { label: "Configuration",         border: "#d4a72c", bg: "#d4a72c22" },
  handler_group:   { label: "Services & Handlers",   border: "#f47067", bg: "#f4706722" },
  utility_group:   { label: "Utilities",             border: "#39d3bb", bg: "#39d3bb22" },
  exception_group: { label: "Exceptions & Warnings", border: "#f0883e", bg: "#f0883e22" },
  event_group:     { label: "Events & Signals",      border: "#6e7cf7", bg: "#6e7cf722" },
};
const NODE_KIND_ORDER = ["class", "method", "metaclass", "test_group", "model_group", "config_group", "handler_group", "utility_group", "exception_group", "event_group"];

function updateLegend(graphData) {
  const presentKinds = new Set((graphData.nodes || []).map(n => n.kind));
  let html = "<h4>Nodes</h4>";
  for (const kind of NODE_KIND_ORDER) {
    if (!presentKinds.has(kind)) continue;
    const m = NODE_KIND_META[kind];
    if (!m) continue;
    html += `<div class="legend-item"><div class="legend-node" style="border-color:${m.border}; background:${m.bg}"></div> ${m.label}</div>`;
  }
  html += `<h4 style="margin-top:10px">Edges</h4>
  <div class="legend-item"><div class="legend-edge" style="border-color:#f97583"></div> Inherits</div>
  <div class="legend-item"><div class="legend-edge dashed" style="border-color:#8b949e"></div> Imports</div>
  <div class="legend-item"><div class="legend-edge dotted" style="border-color:#484f58"></div> Contains</div>
  <div class="legend-item"><div class="legend-edge" style="border-color:#d2a8ff"></div> Instantiates</div>
  <div class="legend-item"><div class="legend-edge dashed" style="border-color:#7ee787"></div> Uses Type</div>`;
  document.getElementById("legend").innerHTML = html;
}

// ── Zoom detail view state ─────────────────────────────────────────
let _zoomDetailTransform = null;
let _overviewTransform = null;
let _viewportRect = null;
let _zoomDetailBehavior = null;
let _zoomSvg = null;
let _overviewSvgRef = null;
let _detailIsDragging = false;
const DETAIL_ZOOM_SCALE = 2.5;

// Pending timeout IDs for cancellation on re-render
let _pendingDetailTimeout = null;
let _pendingEnsureTimeouts = [];

// ── Cleanup helper for detail view state ───────────────────────────
function cleanupDetailView() {
  // Cancel any pending init/ensure timeouts from previous render
  if (_pendingDetailTimeout != null) {
    clearTimeout(_pendingDetailTimeout);
    _pendingDetailTimeout = null;
  }
  _pendingEnsureTimeouts.forEach(function(tid) { clearTimeout(tid); });
  _pendingEnsureTimeouts = [];

  if (_viewportRect) {
    _viewportRect.remove();
    _viewportRect = null;
  }
  if (_overviewSvgRef) {
    _overviewSvgRef.on("click.detailnav", null);
    _overviewSvgRef.on("mousedown.detailnav", null);
    _overviewSvgRef.on("mousemove.detailnav", null);
  }
  d3.select(window).on("mouseup.detailnav", null);

  // Always clean the zoom-svg DOM element, even if _zoomSvg ref is stale/null
  var zoomSvgEl = d3.select("#zoom-svg");
  zoomSvgEl.on(".zoom", null);
  zoomSvgEl.selectAll("*").remove();

  if (_zoomSvg) {
    _zoomSvg.on(".zoom", null);
    _zoomSvg.selectAll("*").remove();
  }
  _zoomDetailTransform = null;
  _zoomDetailBehavior = null;
  _zoomSvg = null;
  _overviewSvgRef = null;
  _detailIsDragging = false;
}

// ── Fetch graph data ──────────────────────────────────────────────
async function loadGraph() {
  try {
    const [overviewResp, fullResp] = await Promise.all([
      fetch(`${API_BASE}/api/graph?abstract=${ABSTRACT_NODES ? "true" : "false"}`),
      fetch(`${API_BASE}/api/graph?abstract=false`)
    ]);
    if (!overviewResp.ok) throw new Error(`HTTP ${overviewResp.status}`);
    if (!fullResp.ok) throw new Error(`HTTP ${fullResp.status}`);

    rootGraphData = await overviewResp.json();
    fullGraphData = await fullResp.json();

    // Extract intermediate nodes/edges for multi-depth drill-down
    intermediateGraphData = {
      nodes: rootGraphData.intermediate_nodes || [],
      edges: rootGraphData.intermediate_edges || [],
    };

    document.querySelectorAll(".loading-indicator").forEach(el => el.style.display = "none");
    updateLegend(rootGraphData);
    _setGraphView(rootGraphData, "Overview");
  } catch (err) {
    document.querySelectorAll(".loading-indicator").forEach(el => el.textContent = `Error: ${err.message}`);
  }
}

function _nid(v) { return typeof v === "object" ? v.id : v; }

function updateBackButton() {
  const backBtn = document.getElementById("back-btn");
  backBtn.classList.toggle("visible", graphStack.length > 0);
}

function _setGraphView(nextGraph, label) {
  graphData = nextGraph;
  currentGraphLabel = label || "Overview";
  updateBackButton();
  updateLegend(graphData);
  document.getElementById("detail-panel").classList.remove("open");
  renderGraph();
}

function buildClassMethodGraph(classNode) {
  const classId = classNode.id;
  const contains = fullGraphData.edges.filter(e => e.kind === "contains" && _nid(e.source) === classId);
  const methodIds = new Set(contains.map(e => _nid(e.target)));
  const nodes = fullGraphData.nodes.filter(n => n.kind === "method" && methodIds.has(n.id));
  const nodeIds = new Set(nodes.map(n => n.id));
  const edges = fullGraphData.edges.filter(e => {
    const s = _nid(e.source), t = _nid(e.target);
    return nodeIds.has(s) && nodeIds.has(t);
  });
  return { nodes, edges };
}

function buildMetaclassClassGraph(metaNode) {
  // The member_ids list contains the IDs of the nodes this metaclass replaced.
  // Those members may be classes, other metaclasses, or group nodes from any
  // hierarchy level.  We look them up across all available data sources:
  //   1. fullGraphData     — original classes and methods
  //   2. rootGraphData     — top-level metaclasses / groups
  //   3. intermediateGraphData — collapsed intermediate-level nodes
  const memberIds = new Set((metaNode.member_ids || []));

  // Build a comprehensive lookup of all known nodes across all levels
  const allAvailableNodes = new Map();

  // Full graph has all original classes and methods
  fullGraphData.nodes.forEach(n => allAvailableNodes.set(n.id, n));

  // Overview graph has top-level metaclasses
  rootGraphData.nodes.forEach(n => allAvailableNodes.set(n.id, n));

  // Intermediate graph has collapsed nodes from all hierarchy levels
  intermediateGraphData.nodes.forEach(n => allAvailableNodes.set(n.id, n));

  const nodes = [];
  memberIds.forEach(mid => {
    const n = allAvailableNodes.get(mid);
    if (n) nodes.push(n);
  });

  // If we found no nodes, the members might have been further collapsed.
  // Try to find them by scanning all metaclasses for matching member_ids.
  if (nodes.length === 0 && memberIds.size > 0) {
    // Fallback: look for any node whose id matches
    fullGraphData.nodes.forEach(n => {
      if (memberIds.has(n.id) && !nodes.find(x => x.id === n.id)) {
        nodes.push(n);
      }
    });
  }

  const nodeIds = new Set(nodes.map(n => n.id));

  // Collect edges between members from all graph sources
  const edgeKey = e => `${_nid(e.source)}|${_nid(e.target)}|${e.kind}`;
  const seenEdges = new Set();
  const edges = [];

  function addEdgesFrom(sourceEdges) {
    sourceEdges.forEach(e => {
      const s = _nid(e.source), t = _nid(e.target);
      if (nodeIds.has(s) && nodeIds.has(t) && e.kind !== "contains") {
        const key = edgeKey(e);
        if (!seenEdges.has(key)) {
          seenEdges.add(key);
          edges.push(e);
        }
      }
    });
  }

  addEdgesFrom(rootGraphData.edges);
  addEdgesFrom(fullGraphData.edges);
  addEdgesFrom(intermediateGraphData.edges);

  return { nodes, edges };
}

function buildGroupGraph(groupNode) {
  // Heuristic group nodes (Tests, Data Models, etc.) hold member_ids
  // pointing to nodes that may live in fullGraphData, rootGraphData,
  // or intermediateGraphData (if they were collapsed at a higher level).
  const memberIds = new Set((groupNode.member_ids || []));

  const allAvailableNodes = new Map();
  fullGraphData.nodes.forEach(n => allAvailableNodes.set(n.id, n));
  rootGraphData.nodes.forEach(n => allAvailableNodes.set(n.id, n));
  intermediateGraphData.nodes.forEach(n => allAvailableNodes.set(n.id, n));

  const nodes = [];
  memberIds.forEach(mid => {
    const n = allAvailableNodes.get(mid);
    if (n) nodes.push(n);
  });

  const nodeIds = new Set(nodes.map(n => n.id));

  const edgeKey = e => `${_nid(e.source)}|${_nid(e.target)}|${e.kind}`;
  const seenEdges = new Set();
  const edges = [];

  function addEdgesFrom(sourceEdges) {
    sourceEdges.forEach(e => {
      const s = _nid(e.source), t = _nid(e.target);
      if (nodeIds.has(s) && nodeIds.has(t) && e.kind !== "contains") {
        const key = edgeKey(e);
        if (!seenEdges.has(key)) {
          seenEdges.add(key);
          edges.push(e);
        }
      }
    });
  }

  addEdgesFrom(fullGraphData.edges);
  addEdgesFrom(rootGraphData.edges);
  addEdgesFrom(intermediateGraphData.edges);

  return { nodes, edges };
}

const _GROUP_KINDS = new Set(["test_group", "model_group", "config_group", "handler_group", "utility_group", "exception_group", "event_group"]);

function drillIntoNode(d) {
  if (d.kind === "class") {
    const sub = buildClassMethodGraph(d);
    graphStack.push({ graph: graphData, label: currentGraphLabel });
    updateBackButton();
    _setGraphView(sub, `Class: ${d.name}`);
    return;
  }
  if (d.kind === "metaclass") {
    const sub = buildMetaclassClassGraph(d);
    graphStack.push({ graph: graphData, label: currentGraphLabel });
    updateBackButton();
    _setGraphView(sub, `Metaclass: ${d.name}`);
    return;
  }
  if (_GROUP_KINDS.has(d.kind)) {
    const sub = buildGroupGraph(d);
    graphStack.push({ graph: graphData, label: currentGraphLabel });
    updateBackButton();
    _setGraphView(sub, d.name);
    return;
  }
  selectNode(d);
}

// ── Geometry helpers ───────────────────────────────────────────────
function getRectIntersection(x1, y1, x2, y2, rw, rh) {
  const dx = x2 - x1, dy = y2 - y1;
  if (dx === 0 && dy === 0) return { x: x2, y: y2 };
  const hw = rw / 2, hh = rh / 2;
  const absDx = Math.abs(dx), absDy = Math.abs(dy);
  let t;
  if (absDx * hh > absDy * hw) { t = hw / absDx; }
  else { t = hh / absDy; }
  return { x: x2 - dx * t, y: y2 - dy * t };
}

function pullBack(px, py, fromX, fromY, offset) {
  const dx = px - fromX, dy = py - fromY;
  const len = Math.hypot(dx, dy) || 1;
  return { x: px - (dx / len) * offset, y: py - (dy / len) * offset };
}

function edgePath(d) {
  const src = (typeof d.source === "object" && d.source !== null) ? d.source : window._nodeData?.find(n => n.id === d.source);
  const tgt = (typeof d.target === "object" && d.target !== null) ? d.target : window._nodeData?.find(n => n.id === d.target);
  if (!src || !tgt || src.x == null || src.y == null || tgt.x == null || tgt.y == null) return "M0,0";

  const srcSize = NODE_SIZE[src.kind] || { w: 160, h: 60 };
  const tgtSize = NODE_SIZE[tgt.kind] || { w: 160, h: 60 };
  const dx = tgt.x - src.x, dy = tgt.y - src.y;
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  const offset = d._curve || 0;
  const sx = src.x + nx * offset, sy = src.y + ny * offset;
  const tx = tgt.x + nx * offset, ty = tgt.y + ny * offset;
  const rawStart = getRectIntersection(tx, ty, sx, sy, srcSize.w, srcSize.h);
  const rawEnd   = getRectIntersection(sx, sy, tx, ty, tgtSize.w, tgtSize.h);
  const markerOff = MARKER_OFFSET[d.kind] || 14;
  const end = pullBack(rawEnd.x, rawEnd.y, sx, sy, markerOff);
  const start = d.kind === "contains"
    ? pullBack(rawStart.x, rawStart.y, tx, ty, markerOff)
    : rawStart;
  return `M${start.x},${start.y} L${end.x},${end.y}`;
}

// ── Initial layout helpers ─────────────────────────────────────────
function buildAdjacency(nodes, links) {
  const adj = new Map(nodes.map(n => [n.id, new Set()]));
  links.forEach(e => {
    const s = typeof e.source === "object" ? e.source.id : e.source;
    const t = typeof e.target === "object" ? e.target.id : e.target;
    if (adj.has(s) && adj.has(t)) { adj.get(s).add(t); adj.get(t).add(s); }
  });
  return adj;
}

function connectedComponents(nodes, links) {
  const byId = new Map(nodes.map(n => [n.id, n]));
  const adj = buildAdjacency(nodes, links);
  const seen = new Set();
  const comps = [];
  for (const n of nodes) {
    if (seen.has(n.id)) continue;
    const q = [n.id]; seen.add(n.id); const comp = [];
    while (q.length) {
      const id = q.pop(); comp.push(byId.get(id));
      for (const nxt of adj.get(id) || []) { if (!seen.has(nxt)) { seen.add(nxt); q.push(nxt); } }
    }
    comps.push(comp);
  }
  return comps.sort((a, b) => b.length - a.length);
}

function seedPositions(nodes, links, width, height) {
  const comps = connectedComponents(nodes, links);
  const isolatedComps = comps.filter(c => c.length === 1);
  const connectedComps = comps.filter(c => c.length > 1);
  const compCols = Math.max(1, Math.ceil(Math.sqrt(connectedComps.length)));
  const compRows = Math.max(1, Math.ceil(connectedComps.length / compCols));
  const startX = width / 2 - ((compCols - 1) * COMPONENT_GAP_X) / 2;
  const startY = height / 2 - ((compRows - 1) * COMPONENT_GAP_Y) / 2;
  const degree = new Map(nodes.map(n => [n.id, 0]));
  links.forEach(e => {
    const s = typeof e.source === "object" ? e.source.id : e.source;
    const t = typeof e.target === "object" ? e.target.id : e.target;
    if (degree.has(s)) degree.set(s, degree.get(s) + 1);
    if (degree.has(t)) degree.set(t, degree.get(t) + 1);
  });
  connectedComps.forEach((comp, i) => {
    const col = i % compCols; const row = Math.floor(i / compCols);
    const cx = startX + col * COMPONENT_GAP_X; const cy = startY + row * COMPONENT_GAP_Y;
    const sorted = [...comp].sort((a, b) => (degree.get(b.id) || 0) - (degree.get(a.id) || 0));
    const coreCount = Math.max(1, Math.floor(sorted.length * 0.2));
    sorted.forEach((n, idx) => {
      if (idx < coreCount) {
        const a = (2 * Math.PI * idx) / coreCount; n.x = cx + Math.cos(a) * 40; n.y = cy + Math.sin(a) * 40;
      } else {
        const ringIdx = idx - coreCount; const ring = Math.floor(ringIdx / 8) + 1;
        const inRing = ringIdx % 8; const countInRing = Math.min(8, sorted.length - coreCount - (ring - 1) * 8);
        const a = (2 * Math.PI * inRing) / Math.max(1, countInRing); const r = 90 + ring * 70;
        n.x = cx + Math.cos(a) * r; n.y = cy + Math.sin(a) * r;
      }
    });
  });
  const bottomY = startY + compRows * COMPONENT_GAP_Y + ISOLATED_ROW_Y_OFFSET;
  const isoColGap = isolatedComps.length > 12 ? 300 : ISOLATED_COL_GAP;
  const isoRowGap = isolatedComps.length > 12 ? 260 : GRID_SNAP_ROW_GAP;
  const isoCols = Math.max(1, Math.min(isolatedComps.length, Math.ceil(Math.sqrt(isolatedComps.length * 1.4))));
  const totalIsolatedW = (isoCols - 1) * isoColGap;
  const isolatedStartX = width / 2 - totalIsolatedW / 2;
  isolatedComps.forEach((comp, i) => {
    const col = i % isoCols;
    const row = Math.floor(i / isoCols);
    comp[0].x = isolatedStartX + col * isoColGap; comp[0].y = bottomY + row * isoRowGap; comp[0]._isolated = true; comp[0]._isolatedTargetY = bottomY + row * isoRowGap;
  });
}

function makeIsolatedBottomForce(isolatedY, strength = 0.15) {
  let nodes = [];
  function force(alpha) { for (const n of nodes) { if (!n._isolated) continue; const targetY = n._isolatedTargetY || isolatedY; n.vy += (targetY - n.y) * strength * alpha; } }
  force.initialize = (_nodes) => { nodes = _nodes || []; };
  return force;
}

function gridLayout(nodeData, width, height) {
  // Lay out nodes in a simple grid centered in the viewport
  const count = nodeData.length;
  if (count === 0) return;
  const cols = Math.max(1, Math.ceil(Math.sqrt(count * 1.4)));
  const colGap = count > 20 ? 340 : count > 12 ? 420 : GRID_SNAP_COL_GAP;
  const rowGap = count > 20 ? 260 : count > 12 ? 310 : GRID_SNAP_ROW_GAP;
  const rows = Math.ceil(count / cols);
  const gridW = (cols - 1) * colGap;
  const gridH = (rows - 1) * rowGap;
  const originX = width / 2 - gridW / 2;
  const originY = height / 2 - gridH / 2;
  nodeData.forEach(function(n, i) {
    const col = i % cols;
    const row = Math.floor(i / cols);
    n.x = originX + col * colGap;
    n.y = originY + row * rowGap;
    n.fx = null;
    n.fy = null;
  });
}

// ── Render ─────────────────────────────────────────────────────────
function fitGraphToViewport(svg, zoomBehavior, nodeData, width, height, padding, animate) {
  if (padding === undefined) padding = 40;
  if (animate === undefined) animate = true;
  if (!nodeData || nodeData.length === 0) return;
  if (width <= 0 || height <= 0) return;

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  nodeData.forEach(n => {
    const s = NODE_SIZE[n.kind] || { w: 160, h: 60 };
    const x1 = n.x - s.w / 2, x2 = n.x + s.w / 2;
    const y1 = n.y - s.h / 2, y2 = n.y + s.h / 2;
    if (x1 < minX) minX = x1; if (y1 < minY) minY = y1;
    if (x2 > maxX) maxX = x2; if (y2 > maxY) maxY = y2;
  });
  const graphW = Math.max(1, maxX - minX);
  const graphH = Math.max(1, maxY - minY);
  const availW = Math.max(1, width - padding * 2);
  const availH = Math.max(1, height - padding * 2);
  // Don't clamp to a max — allow arbitrarily small scales so all nodes fit
  const scale = Math.min(availW / graphW, availH / graphH);
  const tx = (width - graphW * scale) / 2 - minX * scale;
  const ty = (height - graphH * scale) / 2 - minY * scale;
  const t = d3.zoomIdentity.translate(tx, ty).scale(scale);
  if (animate) { svg.transition().duration(250).call(zoomBehavior.transform, t); }
  else { svg.call(zoomBehavior.transform, t); }
}

function snapNodesToGrid(nodeData, svg, g, node, link) {
  if (!nodeData || nodeData.length === 0) return;

  // Adaptive grid gaps: shrink for large node counts so the grid fits
  const count = nodeData.length;
  const colGap = count > 20 ? 340 : count > 12 ? 420 : GRID_SNAP_COL_GAP;
  const rowGap = count > 20 ? 260 : count > 12 ? 310 : GRID_SNAP_ROW_GAP;

  let minX = Infinity, minY = Infinity;
  nodeData.forEach(n => { if (n.x < minX) minX = n.x; if (n.y < minY) minY = n.y; });
  const sorted = [...nodeData].sort((a, b) =>
    Math.round((a.y - minY) / rowGap) - Math.round((b.y - minY) / rowGap) ||
    Math.round((a.x - minX) / colGap) - Math.round((b.x - minX) / colGap)
  );
  const totalCols = Math.max(1, Math.ceil(Math.sqrt(nodeData.length * 1.4)));
  const usedCells = new Set(); const cellOf = new Map();
  sorted.forEach(n => {
    let col = Math.max(0, Math.round((n.x - minX) / colGap));
    let row = Math.max(0, Math.round((n.y - minY) / rowGap));
    let found = false;
    for (let radius = 0; radius < totalCols * 2 && !found; radius++) {
      for (let dc = -radius; dc <= radius && !found; dc++) {
        for (let dr = -radius; dr <= radius && !found; dr++) {
          if (Math.abs(dc) !== radius && Math.abs(dr) !== radius) continue;
          const c = Math.max(0, col + dc); const r = Math.max(0, row + dr);
          const key = `${c},${r}`;
          if (!usedCells.has(key)) { usedCells.add(key); cellOf.set(n.id, { col: c, row: r }); found = true; }
        }
      }
    }
  });
  let cx = 0, cy = 0;
  nodeData.forEach(n => { cx += n.x; cy += n.y; }); cx /= nodeData.length; cy /= nodeData.length;
  const maxCol = Math.max(...[...cellOf.values()].map(c => c.col));
  const maxRow = Math.max(...[...cellOf.values()].map(c => c.row));
  const gridOriginX = cx - (maxCol * colGap) / 2;
  const gridOriginY = cy - (maxRow * rowGap) / 2;
  nodeData.forEach(n => {
    const cell = cellOf.get(n.id); if (!cell) return;
    n.x = gridOriginX + cell.col * colGap;
    n.y = gridOriginY + cell.row * rowGap;
    n.fx = null; n.fy = null;
  });
  node.attr("transform", d => `translate(${d.x},${d.y})`);
  link.attr("d", edgePath);
  // Fit immediately (no animation) then animate a refined fit
  const container = document.getElementById("graph-container");
  fitGraphToViewport(svg, window._zoomBehavior, nodeData, container.clientWidth, container.clientHeight, 20, false);
  setTimeout(function() {
    const c = document.getElementById("graph-container");
    fitGraphToViewport(svg, window._zoomBehavior, nodeData, c.clientWidth, c.clientHeight, 20, true);
  }, 50);
}

/**
 * After layout/snap settles, verify every node is on-screen in the
 * overview (top) panel.  If any node is clipped, refit with generous padding.
 */
function ensureAllNodesVisible(svg, zoomBehavior, nodeData) {
  if (!nodeData || nodeData.length === 0) return;

  const container = document.getElementById("graph-container");
  const width = container.clientWidth;
  const height = container.clientHeight;

  // Re-read the current transform and check if all node bounding boxes are inside
  const t = d3.zoomTransform(svg.node());
  let allVisible = true;
  for (let i = 0; i < nodeData.length; i++) {
    const n = nodeData[i];
    const s = NODE_SIZE[n.kind] || { w: 160, h: 60 };
    const sx1 = t.applyX(n.x - s.w / 2);
    const sy1 = t.applyY(n.y - s.h / 2);
    const sx2 = t.applyX(n.x + s.w / 2);
    const sy2 = t.applyY(n.y + s.h / 2);
    if (sx1 < -10 || sy1 < -10 || sx2 > width + 10 || sy2 > height + 10) {
      allVisible = false;
      break;
    }
  }
  if (!allVisible) {
    fitGraphToViewport(svg, zoomBehavior, nodeData, width, height, 20, true);
  }
}

// ── Zoom detail view helpers ───────────────────────────────────────
function centerDetailOnGraphPoint(graphX, graphY, animate) {
  if (animate === undefined) animate = true;
  if (!_zoomSvg || !_zoomDetailBehavior) return;
  const zoomContainer = document.getElementById("zoom-container");
  const zw = zoomContainer.clientWidth;
  const zh = zoomContainer.clientHeight;
  const fallbackScale = (_overviewTransform ? _overviewTransform.k : 1) * DETAIL_ZOOM_SCALE;
  const detailScale = _zoomDetailTransform ? _zoomDetailTransform.k : fallbackScale;
  const dtx = zw / 2 - graphX * detailScale;
  const dty = zh / 2 - graphY * detailScale;
  const t = d3.zoomIdentity.translate(dtx, dty).scale(detailScale);
  if (animate) { _zoomSvg.transition().duration(250).call(_zoomDetailBehavior.transform, t); }
  else { _zoomSvg.call(_zoomDetailBehavior.transform, t); }
}

function updateViewportIndicator() {
  if (!_viewportRect || !_zoomDetailTransform || !_overviewTransform) return;

  const zoomContainer = document.getElementById("zoom-container");
  const zw = zoomContainer.clientWidth;
  const zh = zoomContainer.clientHeight;

  const detailInv = _zoomDetailTransform.invert([0, 0]);
  const detailInv2 = _zoomDetailTransform.invert([zw, zh]);

  const gx1 = detailInv[0], gy1 = detailInv[1];
  const gx2 = detailInv2[0], gy2 = detailInv2[1];

  const ox1 = _overviewTransform.applyX(gx1);
  const oy1 = _overviewTransform.applyY(gy1);
  const ox2 = _overviewTransform.applyX(gx2);
  const oy2 = _overviewTransform.applyY(gy2);

  _viewportRect
    .attr("x", ox1)
    .attr("y", oy1)
    .attr("width", ox2 - ox1)
    .attr("height", oy2 - oy1)
    .attr("visibility", "visible");
}

function initDetailView(overviewSvg, overviewG, overviewZoomBehavior, nodeData) {
  cleanupDetailView();

  const zoomSvg = d3.select("#zoom-svg");
  _zoomSvg = zoomSvg;
  _overviewSvgRef = overviewSvg;

  const zoomContainer = document.getElementById("zoom-container");
  const zw = zoomContainer.clientWidth;
  const zh = zoomContainer.clientHeight;

  // Clone the overview <g> contents into the detail SVG
  // First, copy the <defs> for markers
  const overviewDefs = overviewSvg.select("defs").node();
  if (overviewDefs) {
    zoomSvg.node().appendChild(overviewDefs.cloneNode(true));
  }

  const zoomG = zoomSvg.append("g");

  const overviewGNode = overviewG.node();
  if (overviewGNode) {
    const clone = overviewGNode.cloneNode(true);
    zoomG.node().appendChild(clone);
    const inner = zoomG.select("g");
    if (inner.node()) {
      while (inner.node().firstChild) {
        zoomG.node().appendChild(inner.node().firstChild);
      }
      inner.remove();
    }
  }

  // Set up zoom/pan on the detail SVG
  _zoomDetailBehavior = d3.zoom()
    .scaleExtent([0.1, 10])
    .on("zoom", function(event) {
      zoomG.attr("transform", event.transform);
      _zoomDetailTransform = event.transform;
      updateViewportIndicator();
    });

  zoomSvg.call(_zoomDetailBehavior);

  const currentOverview = d3.zoomTransform(overviewSvg.node());
  _overviewTransform = currentOverview;

  // Focus on the most-connected node by default
  if (nodeData && nodeData.length > 0) {
    const degree = new Map(nodeData.map(n => [n.id, 0]));
    (window._linkData || []).forEach(e => {
      const s = _nid(e.source);
      const t = _nid(e.target);
      if (degree.has(s)) degree.set(s, degree.get(s) + 1);
      if (degree.has(t)) degree.set(t, degree.get(t) + 1);
    });

    let focusNode = nodeData[0];
    let maxDeg = degree.get(focusNode.id) || 0;
    nodeData.forEach(n => {
      const d = degree.get(n.id) || 0;
      if (d > maxDeg) { maxDeg = d; focusNode = n; }
    });

    const gcx = focusNode.x;
    const gcy = focusNode.y;

    const detailScale = currentOverview.k * DETAIL_ZOOM_SCALE;
    const dtx = zw / 2 - gcx * detailScale;
    const dty = zh / 2 - gcy * detailScale;
    const initTransform = d3.zoomIdentity.translate(dtx, dty).scale(detailScale);

    zoomSvg.call(_zoomDetailBehavior.transform, initTransform);
    _zoomDetailTransform = initTransform;
  }

  // Add clickable/hoverable node hit-layer in detail view (bottom): hover highlights, click drills
  const hitLayer = zoomG.append("g").attr("class", "detail-hit-layer");

  hitLayer.selectAll("g")
    .data(nodeData || [])
    .join("g")
    .attr("transform", d => `translate(${d.x},${d.y})`)
    .append("rect")
    .attr("x", d => -(NODE_SIZE[d.kind]?.w || 160) / 2)
    .attr("y", d => -(NODE_SIZE[d.kind]?.h || 60) / 2)
    .attr("width", d => NODE_SIZE[d.kind]?.w || 160)
    .attr("height", d => NODE_SIZE[d.kind]?.h || 60)
    .attr("fill", "transparent")
    .style("pointer-events", "all")
    .style("cursor", "pointer")
    .on("mouseenter", function(event, d) {
      event.stopPropagation();
      highlightConnected(d);
    })
    .on("mouseleave", function() {
      clearHighlight();
    })
    .on("click", function(event, d) {
      event.stopPropagation();
      drillIntoNode(d);
    });

  // Add the viewport indicator rect to the overview SVG (on top of everything)
  _viewportRect = overviewSvg.append("rect").attr("class", "viewport-rect");
  updateViewportIndicator();

  // Click on detail background clears highlight
  zoomSvg.on("click.clearhighlight", function() { clearHighlight(); });

  // Click on overview background to recenter the detail view
  overviewSvg.on("click.detailnav", function(event) {
    const [mx, my] = d3.pointer(event, this);
    const overviewT = d3.zoomTransform(overviewSvg.node());
    _overviewTransform = overviewT;
    centerDetailOnGraphPoint(overviewT.invertX(mx), overviewT.invertY(my), true);
  });

  // Drag on overview to pan the detail view
  overviewSvg.on("mousedown.detailnav", function(event) {
    if (event.button !== 0) return;
    _detailIsDragging = true;
  });
  overviewSvg.on("mousemove.detailnav", function(event) {
    if (!_detailIsDragging) return;
    const [mx, my] = d3.pointer(event, this);
    const overviewT = d3.zoomTransform(overviewSvg.node());
    _overviewTransform = overviewT;
    centerDetailOnGraphPoint(overviewT.invertX(mx), overviewT.invertY(my), false);
  });
  d3.select(window).on("mouseup.detailnav", function() { _detailIsDragging = false; });
}

function renderGraph() {
  // Full cleanup of previous detail view
  cleanupDetailView();

  const svg = d3.select("#graph-svg");
  svg.selectAll("*").remove();
  svg.on(".detailnav", null);

  const container = document.getElementById("graph-container");
  const width = container.clientWidth;
  const height = container.clientHeight;

  let didInitialFit = false;
  let autoFitActive = true;
  let lastAutoFitTs = 0;
  const AUTO_FIT_INTERVAL_MS = 120;

  const nodeById = new Map(graphData.nodes.map(n => [n.id, n]));
  const baseNodes = graphData.nodes.filter(n => activeNodeKinds.has(n.kind));
  const visibleClassIds = new Set(baseNodes.filter(n => n.kind === "class").map(n => n.id));
  const suppressedNodeIds = new Set();

  graphData.edges.forEach(e => {
    if (e.kind !== "contains") return;
    const sourceId = typeof e.source === "object" ? e.source.id : e.source;
    const targetId = typeof e.target === "object" ? e.target.id : e.target;
    const targetNode = nodeById.get(targetId);
    if (visibleClassIds.has(sourceId) && targetNode?.kind === "method") { suppressedNodeIds.add(targetId); }
  });

  const nodes = baseNodes.filter(n => !suppressedNodeIds.has(n.id));
  const nodeIds = new Set(nodes.map(n => n.id));

  const edges = graphData.edges.filter(e => {
    const s = typeof e.source === "object" ? e.source.id : e.source;
    const t = typeof e.target === "object" ? e.target.id : e.target;
    return activeEdgeKinds.has(e.kind) && nodeIds.has(s) && nodeIds.has(t);
  });

  const rawLinks = edges.map((e, i) => ({
    ...e, source: e.source, target: e.target, _pathId: `edge-path-${i}`, _curve: 0, _dirSign: 1,
  }));

  const pairGroups = new Map();
  rawLinks.forEach(e => {
    const a = typeof e.source === "object" ? e.source.id : e.source;
    const b = typeof e.target === "object" ? e.target.id : e.target;
    const key = a < b ? `${a}|${b}` : `${b}|${a}`;
    if (!pairGroups.has(key)) pairGroups.set(key, []);
    pairGroups.get(key).push(e);
  });
  pairGroups.forEach(group => {
    group.sort((e1, e2) => {
      const s1 = typeof e1.source === "object" ? e1.source.id : e1.source;
      const t1 = typeof e1.target === "object" ? e1.target.id : e1.target;
      const s2 = typeof e2.source === "object" ? e2.source.id : e2.source;
      const t2 = typeof e2.target === "object" ? e2.target.id : e2.target;
      return `${s1}|${t1}|${e1.kind}`.localeCompare(`${s2}|${t2}|${e2.kind}`);
    });
    const count = group.length;
    group.forEach((e, idx) => { e._curve = (idx - (count - 1) / 2) * PARALLEL_EDGE_SPACING; });
  });

  const linkData = rawLinks;
  const nodeData = nodes.map(n => ({ ...n }));

  const cacheKey = _graphCacheKey(nodeData);
  const cachedPositions = _positionCache.get(cacheKey);

  // Arrow markers
  const defs = svg.append("defs");
  defs.append("marker").attr("id","arrow-inherits").attr("viewBox","0 -9 18 18").attr("refX",18).attr("refY",0).attr("markerWidth",14).attr("markerHeight",14).attr("orient","auto").append("path").attr("d","M0,-9L18,0L0,9Z").attr("fill","none").attr("stroke","#f97583").attr("stroke-width",2.5);
  defs.append("marker").attr("id","arrow-calls").attr("viewBox","0 -6 12 12").attr("refX",12).attr("refY",0).attr("markerWidth",12).attr("markerHeight",12).attr("orient","auto").append("path").attr("d","M0,-6L12,0L0,6Z").attr("fill","#58a6ff");
  defs.append("marker").attr("id","arrow-imports").attr("viewBox","0 -6 12 12").attr("refX",12).attr("refY",0).attr("markerWidth",12).attr("markerHeight",12).attr("orient","auto").append("path").attr("d","M0,-6L12,0L0,6").attr("fill","none").attr("stroke","#8b949e").attr("stroke-width",2.5);
  defs.append("marker").attr("id","arrow-instantiates").attr("viewBox","-1 -7 18 14").attr("refX",17).attr("refY",0).attr("markerWidth",14).attr("markerHeight",14).attr("orient","auto").append("path").attr("d","M0,0L8,-6L16,0L8,6Z").attr("fill","none").attr("stroke","#d2a8ff").attr("stroke-width",2.5);
  defs.append("marker").attr("id","arrow-uses_type").attr("viewBox","0 -6 12 12").attr("refX",12).attr("refY",0).attr("markerWidth",12).attr("markerHeight",12).attr("orient","auto").append("path").attr("d","M0,-6L12,0L0,6").attr("fill","none").attr("stroke","#7ee787").attr("stroke-width",2.5);
  defs.append("marker").attr("id","diamond-contains-end").attr("viewBox","-1 -7 18 14").attr("refX",0).attr("refY",0).attr("markerWidth",14).attr("markerHeight",14).attr("orient","auto-start-reverse").append("path").attr("d","M0,0L8,-6L16,0L8,6Z").attr("fill","#8b949e").attr("stroke","#8b949e");

  const g = svg.append("g");
  const zoomBehavior = d3.zoom()
    .scaleExtent([0.01, 4])
    .on("zoom", function(event) {
      g.attr("transform", event.transform);
      _overviewTransform = event.transform;
      updateViewportIndicator();
    });

  svg.call(zoomBehavior);
  // Disable D3's default zoom gestures on the overview (it's a minimap)
  svg.on("wheel.zoom", null)
     .on("dblclick.zoom", null)
     .on("mousedown.zoom", null)
     .on("touchstart.zoom", null)
     .on("touchmove.zoom", null)
     .on("touchend.zoom", null);

  // Forward scroll-wheel on the overview to zoom the detail panel
  svg.on("wheel.forwardZoom", function(event) {
    if (!_zoomSvg || !_zoomDetailBehavior || !_zoomDetailTransform) return;
    event.preventDefault();

    // Convert mouse position to graph-space via the overview transform
    const overviewT = d3.zoomTransform(svg.node());
    const [mx, my] = d3.pointer(event, svg.node());
    const graphX = overviewT.invertX(mx);
    const graphY = overviewT.invertY(my);

    // Scale factor proportional to scroll magnitude (normalised across browsers)
    const delta = -event.deltaY * (event.deltaMode === 1 ? 40 : 1) / 300;
    const factor = Math.pow(2, delta);
    const newK = Math.min(10, Math.max(0.1, _zoomDetailTransform.k * factor));

    // Center the detail view on the graph point under the cursor
    const zoomContainer = document.getElementById("zoom-container");
    const zw = zoomContainer.clientWidth;
    const zh = zoomContainer.clientHeight;
    const dtx = zw / 2 - graphX * newK;
    const dty = zh / 2 - graphY * newK;
    const t = d3.zoomIdentity.translate(dtx, dty).scale(newK);

    // Apply instantly — no transition — for snappy response
    _zoomSvg.call(_zoomDetailBehavior.transform, t);
  });

  window._zoomBehavior = zoomBehavior;

  // Edges
  const link = g.append("g").selectAll("path")
    .data(linkData).join("path")
    .attr("id", d => d._pathId)
    .attr("class", d => `edge ${d.kind}`)
    .attr("data-edge-src", d => _nid(d.source))
    .attr("data-edge-tgt", d => _nid(d.target))
    .attr("marker-end", d => `url(#arrow-${d.kind})`)
    .attr("marker-start", d => d.kind === "contains" ? `url(#diamond-contains-end)` : null);

  // Nodes
  const node = g.append("g").selectAll("g")
    .data(nodeData).join("g")
    .attr("class", "node-group")
    .attr("data-node-id", d => d.id)
    .on("mouseenter", function(event, d) { event.stopPropagation(); highlightConnected(d); })
    .on("mouseleave", function() { clearHighlight(); })
    .on("click", function(event, d) {
      event.stopPropagation();
      centerDetailOnGraphPoint(d.x, d.y, true);
    });

  node.append("rect")
    .attr("class", d => `node-rect ${d.kind}`)
    .attr("x", d => -(NODE_SIZE[d.kind]?.w || 160) / 2)
    .attr("y", d => -(NODE_SIZE[d.kind]?.h || 60) / 2)
    .attr("width", d => NODE_SIZE[d.kind]?.w || 160)
    .attr("height", d => NODE_SIZE[d.kind]?.h || 60);

  node.append("text").attr("class","node-title").attr("x",d=>-(NODE_SIZE[d.kind]?.w||160)/2+10).attr("y",d=>-(NODE_SIZE[d.kind]?.h||60)/2+18).attr("text-anchor","start").text(d=>d.name);
  node.append("text").attr("class","node-kind-inside").attr("x",d=>-(NODE_SIZE[d.kind]?.w||160)/2+10).attr("y",d=>-(NODE_SIZE[d.kind]?.h||60)/2+34).attr("text-anchor","start").text(d=>d.kind);

  const classFo = node.filter(d => d.kind === "class")
    .append("foreignObject").attr("class","node-methods-fo")
    .attr("x",d=>-(NODE_SIZE[d.kind].w/2)).attr("y",d=>-(NODE_SIZE[d.kind].h/2)+38)
    .attr("width",d=>NODE_SIZE[d.kind].w).attr("height",d=>NODE_SIZE[d.kind].h-40)
    .html(d=>{const methods=(d.methods||[]).map(m=>`<div>${m}()</div>`).join("");return`<div xmlns="http://www.w3.org/1999/xhtml" class="node-methods-box"><div class="node-methods-label">Methods (${(d.methods||[]).length})</div><div class="node-methods-scroll">${methods||"<div>(none)</div>"}</div></div>`;});
  classFo.on("click",function(event,d){
    event.stopPropagation();
    centerDetailOnGraphPoint(d.x, d.y, true);
  });

  const metaFo = node.filter(d => d.kind === "metaclass")
    .append("foreignObject").attr("class","node-methods-fo")
    .attr("x",d=>-(NODE_SIZE[d.kind].w/2)).attr("y",d=>-(NODE_SIZE[d.kind].h/2)+38)
    .attr("width",d=>NODE_SIZE[d.kind].w).attr("height",d=>NODE_SIZE[d.kind].h-40)
    .html(d=>{const members=(d.members||[]).map(m=>`<div>${m}</div>`).join("");return`<div xmlns="http://www.w3.org/1999/xhtml" class="node-methods-box"><div class="node-methods-label">Classes (${(d.members||[]).length})</div><div class="node-methods-scroll">${members||"<div>(none)</div>"}</div></div>`;});
  metaFo.on("click",function(event,d){
    event.stopPropagation();
    centerDetailOnGraphPoint(d.x, d.y, true);
  });

  const GROUP_KINDS = ["test_group", "model_group", "config_group", "handler_group", "utility_group", "exception_group", "event_group"];
  const groupFo = node.filter(d => GROUP_KINDS.includes(d.kind))
    .append("foreignObject").attr("class","node-methods-fo")
    .attr("x",d=>-(NODE_SIZE[d.kind].w/2)).attr("y",d=>-(NODE_SIZE[d.kind].h/2)+38)
    .attr("width",d=>NODE_SIZE[d.kind].w).attr("height",d=>NODE_SIZE[d.kind].h-40)
    .html(d=>{const members=(d.members||[]).map(m=>`<div>${m}</div>`).join("");return`<div xmlns="http://www.w3.org/1999/xhtml" class="node-methods-box"><div class="node-methods-label">Members (${(d.members||[]).length})</div><div class="node-methods-scroll">${members||"<div>(none)</div>"}</div></div>`;});
  groupFo.on("click",function(event,d){
    event.stopPropagation();
    centerDetailOnGraphPoint(d.x, d.y, true);
  });

  function _initDetail() {
    _pendingDetailTimeout = setTimeout(function() {
      _pendingDetailTimeout = null;
      _overviewTransform = d3.zoomTransform(svg.node());
      initDetailView(svg, g, zoomBehavior, nodeData);
    }, 350);
  }

  // Helper: apply positions map to nodeData, render, and save to both caches
  function _applyPositionsAndRender(posMap) {
    nodeData.forEach(n => {
      const pos = posMap[n.id] || posMap.get?.(n.id);
      if (pos) { n.x = pos.x; n.y = pos.y; }
    });
    window._nodes = node; window._links = link; window._nodeData = nodeData; window._linkData = linkData;
    const nodeMap = new Map(nodeData.map(n => [n.id, n]));
    linkData.forEach(d => {
      if (typeof d.source === "string") d.source = nodeMap.get(d.source) || d.source;
      if (typeof d.target === "string") d.target = nodeMap.get(d.target) || d.target;
    });
    node.attr("transform", d => `translate(${d.x},${d.y})`);
    link.attr("d", edgePath);
    // Use current container dimensions, not the captured width/height
    const ctr = document.getElementById("graph-container");
    fitGraphToViewport(svg, zoomBehavior, nodeData, ctr.clientWidth, ctr.clientHeight, 20, false);
    var eid1 = setTimeout(function() {
      ensureAllNodesVisible(svg, zoomBehavior, nodeData);
    }, 100);
    _pendingEnsureTimeouts.push(eid1);
    svg.on("click", function() { selectedNode = null; clearHighlight(); });
    // Save to memory cache
    const memMap = new Map(nodeData.map(n => [n.id, { x: n.x, y: n.y }]));
    _positionCache.set(cacheKey, memMap);
    _initDetail();
  }

  // ── Restore from memory cache ──────────────────────────────────
  if (cachedPositions) {
    const posObj = {};
    cachedPositions.forEach(function(v, k) { posObj[k] = v; });
    _applyPositionsAndRender(posObj);
    return;
  }

  // ── Try disk cache (async) ─────────────────────────────────────
  // We set up the graph scaffolding first, then check disk cache.
  // If disk has positions, apply them. Otherwise run the simulation.
  window._nodes = node; window._links = link; window._nodeData = nodeData; window._linkData = linkData;

  _loadPositionsFromDisk(nodeData).then(function(diskPositions) {
    if (diskPositions) {
      _applyPositionsAndRender(diskPositions);
      return;
    }

    // ── Fresh layout (no cache hit) ──────────────────────────────

    // Determine which nodes have edges
    const connectedNodeIds = new Set();
    linkData.forEach(function(e) {
      const s = typeof e.source === "object" ? e.source.id : e.source;
      const t = typeof e.target === "object" ? e.target.id : e.target;
      connectedNodeIds.add(s);
      connectedNodeIds.add(t);
    });

    const hasAnyEdges = connectedNodeIds.size > 0;

    // If no nodes have edges, skip the simulation entirely — just grid-layout
    if (!hasAnyEdges) {
      gridLayout(nodeData, width, height);
      window._nodes = node; window._links = link; window._nodeData = nodeData; window._linkData = linkData;
      node.attr("transform", d => `translate(${d.x},${d.y})`);
      link.attr("d", edgePath);
      const ctr = document.getElementById("graph-container");
      fitGraphToViewport(svg, zoomBehavior, nodeData, ctr.clientWidth, ctr.clientHeight, 20, false);
      var eidGrid = setTimeout(function() {
        ensureAllNodesVisible(svg, zoomBehavior, nodeData);
      }, 100);
      _pendingEnsureTimeouts.push(eidGrid);
      svg.on("click", function() { selectedNode = null; clearHighlight(); });
      const posMap = new Map(nodeData.map(n => [n.id, { x: n.x, y: n.y }]));
      _positionCache.set(cacheKey, posMap);
      _savePositionsToDisk(nodeData);
      _initDetail();
      return;
    }

    // Separate edgeless nodes — they'll be grid-positioned after simulation
    const edgelessNodes = nodeData.filter(n => !connectedNodeIds.has(n.id));
    const simulatedNodes = nodeData.filter(n => connectedNodeIds.has(n.id));
    // Only edges referencing simulated nodes
    const simulatedLinks = linkData.filter(function(e) {
      const s = typeof e.source === "object" ? e.source.id : e.source;
      const t = typeof e.target === "object" ? e.target.id : e.target;
      return connectedNodeIds.has(s) && connectedNodeIds.has(t);
    });

    seedPositions(simulatedNodes, simulatedLinks, width, height);

    const connectedYs = simulatedNodes.filter(n => !n._isolated).map(n => n.y);
    const maxConnectedY = connectedYs.length ? Math.max(...connectedYs) : height / 2;
    const isolatedTargetY = maxConnectedY + ISOLATED_ROW_Y_OFFSET;

    simulation = d3.forceSimulation(simulatedNodes)
      .alpha(1).alphaDecay(0.03).velocityDecay(0.35)
      .force("link", d3.forceLink(simulatedLinks).id(d=>d.id).distance(d=>EDGE_DISTANCE[d.kind]||240).strength(d=>d.kind==="contains"?0.35:0.2).iterations(3))
      .force("charge", d3.forceManyBody().strength(d=>NODE_CHARGE[d.kind]||-500))
      .force("center", d3.forceCenter(width/2,height/2))
      .force("collision", d3.forceCollide().radius(d=>{const s=NODE_SIZE[d.kind]||{w:160,h:60};return Math.sqrt(s.w*s.w+s.h*s.h)/2+COLLISION_PAD;}))
      .force("isolatedBottom", makeIsolatedBottomForce(isolatedTargetY, ISOLATED_FORCE_STRENGTH))
      .force("x", d3.forceX(width/2).strength(0.025))
      .force("y", d3.forceY(height/2).strength(0.025));

    simulation.on("tick", function() {
      link.attr("d", edgePath);
      node.attr("transform", d => `translate(${d.x},${d.y})`);
      if (autoFitActive) {
        const now = performance.now();
        if (now - lastAutoFitTs >= AUTO_FIT_INTERVAL_MS) {
          lastAutoFitTs = now;
          fitGraphToViewport(svg, zoomBehavior, nodeData, width, height, 56, false);
        }
        if (simulation.alpha() < 0.12) autoFitActive = false;
      }
    });

    function _saveAndSnap() {
      autoFitActive = false;

      // Position edgeless nodes in a grid below the simulated graph
      if (edgelessNodes.length > 0) {
        const simYs = simulatedNodes.map(n => n.y);
        const simXs = simulatedNodes.map(n => n.x);
        const bottomY = (simYs.length ? Math.max(...simYs) : height / 2) + ISOLATED_ROW_Y_OFFSET;
        const centerX = simXs.length ? (Math.min(...simXs) + Math.max(...simXs)) / 2 : width / 2;
        const edgelessColGap = edgelessNodes.length > 12 ? 300 : ISOLATED_COL_GAP;
        const edgelessRowGap = edgelessNodes.length > 12 ? 260 : GRID_SNAP_ROW_GAP;
        const gridCols = Math.max(1, Math.min(edgelessNodes.length, Math.ceil(Math.sqrt(edgelessNodes.length * 1.4))));
        const gridRows = Math.ceil(edgelessNodes.length / gridCols);
        const totalW = (gridCols - 1) * edgelessColGap;
        const startX = centerX - totalW / 2;
        edgelessNodes.forEach(function(n, i) {
          const col = i % gridCols;
          const row = Math.floor(i / gridCols);
          n.x = startX + col * edgelessColGap;
          n.y = bottomY + row * edgelessRowGap;
          n.fx = null; n.fy = null;
        });
      }

      snapNodesToGrid(nodeData, svg, g, node, link);
      // Final safety check after grid snap animation
      var eid2 = setTimeout(function() {
        ensureAllNodesVisible(svg, zoomBehavior, nodeData);
      }, GRID_SNAP_DURATION + 100);
      _pendingEnsureTimeouts.push(eid2);
      // Save to memory cache
      const posMap = new Map(nodeData.map(n => [n.id, { x: n.x, y: n.y }]));
      _positionCache.set(cacheKey, posMap);
      // Save to disk cache
      _savePositionsToDisk(nodeData);
      _initDetail();
    }

    simulation.on("end", function() {
      if (didInitialFit) return;
      didInitialFit = true;
      _saveAndSnap();
    });

    setTimeout(function() {
      if (didInitialFit) return;
      didInitialFit = true;
      simulation.stop();
      _saveAndSnap();
    }, 4000);
  });

  svg.on("click", function() { selectedNode = null; clearHighlight(); });
}

function selectNode(d) {
  selectedNode = d;

  const content = document.getElementById("detail-content");
  const incoming = graphData.edges.filter(e => (_nid(e.target) === d.id));

  const findNodeName = function(id) { const realId = typeof id === "object" ? id.id : id; const n = graphData.nodes.find(n => n.id === realId); return n ? n.name : realId; };
  const edgeColor = { inherits: "#f97583", imports: "#8b949e", contains: "#484f58", calls: "#58a6ff", instantiates: "#d2a8ff", uses_type: "#7ee787" };

  let html = `<h2>${d.name}</h2><div class="kind-tag ${d.kind}">${d.kind}</div><div class="detail-section"><h3>Location</h3><div class="detail-row"><span>File:</span> ${d.file_path}</div><div class="detail-row"><span>Lines:</span> ${d.line_start}–${d.line_end}</div><div class="detail-row"><span>Qualified:</span> ${d.qualified_name}</div></div>`;

  if (d.methods && d.methods.length > 0) { html += `<div class="detail-section"><h3>Methods (${d.methods.length})</h3><ul class="methods-list">${d.methods.map(m => `<li>${m}()</li>`).join("")}</ul></div>`; }
  if (d.members && d.members.length > 0) { html += `<div class="detail-section"><h3>Grouped Classes (${d.members.length})</h3><ul class="methods-list">${d.members.map(m => `<li>${m}</li>`).join("")}</ul></div>`; }
  if (outgoing.length > 0) { html += `<div class="detail-section"><h3>Outgoing (${outgoing.length})</h3><ul class="rel-list">${outgoing.map(e => `<li><div class="rel-dot" style="background:${edgeColor[e.kind] || '#8b949e'}"></div><span style="color:${edgeColor[e.kind] || '#8b949e'}">${e.kind}</span> → ${findNodeName(e.target)}</li>`).join("")}</ul></div>`; }
  if (incoming.length > 0) { html += `<div class="detail-section"><h3>Incoming (${incoming.length})</h3><ul class="rel-list">${incoming.map(e => `<li><div class="rel-dot" style="background:${edgeColor[e.kind] || '#8b949e'}"></div>${findNodeName(e.source)} <span style="color:${edgeColor[e.kind] || '#8b949e'}">${e.kind}</span> →</li>`).join("")}</ul></div>`; }
  content.innerHTML = html;
}

function highlightConnected(d) {
  const connectedIds = new Set([d.id]);
  window._linkData.forEach(e => {
    const sid = _nid(e.source), tid = _nid(e.target);
    if (sid === d.id) connectedIds.add(tid);
    if (tid === d.id) connectedIds.add(sid);
  });

  // ── Overview panel (top) ──────────────────────────────────────
  window._nodes.selectAll(".node-rect")
    .style("opacity", n => connectedIds.has(n.id) ? 1 : 0.15)
    .style("filter", n => n.id === d.id ? "brightness(1.2) drop-shadow(0 0 8px)" : null);
  window._nodes.selectAll(".node-title").style("opacity", n => connectedIds.has(n.id) ? 1 : 0.15);
  window._nodes.selectAll(".node-kind-inside").style("opacity", n => connectedIds.has(n.id) ? 1 : 0.15);
  window._links.style("opacity", e => {
    const sid = _nid(e.source), tid = _nid(e.target);
    return (sid === d.id || tid === d.id) ? 0.9 : 0.05;
  });

  // ── Detail panel (bottom) — cloned DOM, no D3 data ────────────
  const zoomSvg = d3.select("#zoom-svg");
  zoomSvg.selectAll(".node-group").each(function() {
    const el = d3.select(this);
    const nid = el.attr("data-node-id");
    if (!nid) return;
    const isConn = connectedIds.has(nid);
    const isFocus = nid === d.id;
    el.selectAll(".node-rect")
      .style("opacity", isConn ? 1 : 0.15)
      .style("filter", isFocus ? "brightness(1.2) drop-shadow(0 0 8px)" : null);
    el.selectAll(".node-title").style("opacity", isConn ? 1 : 0.15);
    el.selectAll(".node-kind-inside").style("opacity", isConn ? 1 : 0.15);
  });
  zoomSvg.selectAll("[data-edge-src]").each(function() {
    const el = d3.select(this);
    const sid = el.attr("data-edge-src"), tid = el.attr("data-edge-tgt");
    el.style("opacity", (sid === d.id || tid === d.id) ? 0.9 : 0.05);
  });

  populatePanel(d);
}

function clearHighlight() {
  if (!window._nodes || !window._links) return;

  // ── Overview panel (top) ──────────────────────────────────────
  window._nodes.selectAll(".node-rect").style("filter", null).style("opacity", 1);
  window._nodes.selectAll(".node-title").style("opacity", 1);
  window._nodes.selectAll(".node-kind-inside").style("opacity", 1);
  window._links.style("opacity", 0.5);

  // ── Detail panel (bottom) ─────────────────────────────────────
  const zoomSvg = d3.select("#zoom-svg");
  zoomSvg.selectAll(".node-group").each(function() {
    const el = d3.select(this);
    el.selectAll(".node-rect").style("filter", null).style("opacity", 1);
    el.selectAll(".node-title").style("opacity", 1);
    el.selectAll(".node-kind-inside").style("opacity", 1);
  });
  zoomSvg.selectAll("[data-edge-src]").style("opacity", 0.5);

  showPlaceholder();
}

// Drill navigation
document.getElementById("back-btn").addEventListener("click", function() {
  if (graphStack.length) {
    const prev = graphStack.pop();
    updateBackButton();
    _setGraphView(prev.graph, prev.label);
    return;
  }
  if (rootGraphData && currentGraphLabel !== "Overview") {
    _setGraphView(rootGraphData, "Overview");
  }
  updateBackButton();
});

// ── Resize ─────────────────────────────────────────────────────────
window.addEventListener("resize", function() { if (graphData) renderGraph(); });

// ── Boot ───────────────────────────────────────────────────────────
loadGraph();
</script>

</body>
</html>
