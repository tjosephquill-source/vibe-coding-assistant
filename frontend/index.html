// Global Space key resets the camera to fit all nodes in view
document.addEventListener("keydown", function(e) {
  if (e.key !== " " && e.key !== "Spacebar") return;
  var tag = (document.activeElement || {}).tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  e.preventDefault();

  var svg = d3.select("#graph-svg");
  if (svg.empty() || !window._zoomBehavior || !window._nodeData || window._nodeData.length === 0) return;

  var container = document.getElementById("graph-container");
  if (!container) return;

  fitGraphToViewport(svg, window._zoomBehavior, window._nodeData,
    container.clientWidth, container.clientHeight, 20, true);

  // Also fit the detail view to capture the entire graph, centered
  if (_zoomSvg && _zoomDetailBehavior && window._nodeData.length > 0) {
    var zoomContainer = document.getElementById("zoom-container");
    if (zoomContainer) {
      var zw = zoomContainer.clientWidth;
      var zh = zoomContainer.clientHeight;
      if (zw > 0 && zh > 0) {
        var dMinX = Infinity, dMinY = Infinity, dMaxX = -Infinity, dMaxY = -Infinity;
        window._nodeData.forEach(function(n) {
          var s = NODE_SIZE[n.kind] || { w: 160, h: 60 };
          var x1 = n.x - s.w / 2, x2 = n.x + s.w / 2;
          var y1 = n.y - s.h / 2, y2 = n.y + s.h / 2;
          if (x1 < dMinX) dMinX = x1; if (y1 < dMinY) dMinY = y1;
          if (x2 > dMaxX) dMaxX = x2; if (y2 > dMaxY) dMaxY = y2;
        });
        var dGraphW = Math.max(1, dMaxX - dMinX);
        var dGraphH = Math.max(1, dMaxY - dMinY);
        var dPad = 40;
        var dAvailW = Math.max(1, zw - dPad * 2);
        var dAvailH = Math.max(1, zh - dPad * 2);
        var dScale = Math.min(dAvailW / dGraphW, dAvailH / dGraphH);
        var dtx = (zw - dGraphW * dScale) / 2 - dMinX * dScale;
        var dty = (zh - dGraphH * dScale) / 2 - dMinY * dScale;
        var dt = d3.zoomIdentity.translate(dtx, dty).scale(dScale);
        _zoomSvg.transition().duration(250).call(_zoomDetailBehavior.transform, dt);
      }
    }
  }
});

// ── Label mode (go-to-node) ─────────────────────────────────────────
var _labelModeActive = false;
var _labelMap = new Map();       // label string → node datum
var _labelTyped = "";            // chars typed so far
var _labelOverlayGroup = null;   // d3 selection of badge <g>
var _labelToast = null;          // DOM element for the bottom toast

var _LABEL_ALPHABET = "ASDFGHJKLQWERTYUIOPZXCVBNM";

function _generateLabels(count) {
  var chars = _LABEL_ALPHABET;
  var labels = [];
  if (count <= chars.length) {
    for (var i = 0; i < count; i++) labels.push(chars[i]);
  } else {
    // two-character labels
    for (var a = 0; a < chars.length && labels.length < count; a++) {
      for (var b = 0; b < chars.length && labels.length < count; b++) {
        labels.push(chars[a] + chars[b]);
      }
    }
  }
  return labels;
}

function _showLabelToast(text) {
  _removeLabelToast();
  var el = document.createElement("div");
  el.className = "label-mode-toast";
  el.textContent = text;
  document.body.appendChild(el);
  _labelToast = el;
}

function _removeLabelToast() {
  if (_labelToast) { _labelToast.remove(); _labelToast = null; }
}

function _enterLabelMode() {
  if (_labelModeActive) return;
  if (!window._nodeData || window._nodeData.length === 0) return;
  var gEl = d3.select("#graph-svg > g");
  if (gEl.empty()) return;

  _labelModeActive = true;
  _labelTyped = "";
  _labelMap.clear();

  var nodes = window._nodeData.filter(function(n) { return n.x != null && n.y != null; });
  if (nodes.length === 0) { _exitLabelMode(); return; }

  var labels = _generateLabels(nodes.length);
  for (var i = 0; i < nodes.length; i++) {
    _labelMap.set(labels[i], nodes[i]);
  }

  // Compute counter-scale so badges stay a fixed screen size
  var svg = d3.select("#graph-svg");
  var currentK = 1;
  if (!svg.empty()) {
    var zt = d3.zoomTransform(svg.node());
    if (zt && zt.k) currentK = zt.k;
  }
  var invK = 1 / currentK;

  // Draw badges
  _labelOverlayGroup = gEl.append("g").attr("class", "label-mode-overlay");
  _labelOverlayGroup.selectAll("g.label-mode-badge")
    .data(labels.map(function(l, idx) { return { label: l, node: nodes[idx] }; }))
    .join("g")
    .attr("class", "label-mode-badge")
    .attr("transform", function(d) {
      return "translate(" + d.node.x + "," + d.node.y + ") scale(" + invK + ")";
    })
    .each(function(d) {
      var g = d3.select(this);
      var padX = 8, padY = 5;
      var charW = 14, charH = 22;
      var w = d.label.length * charW + padX * 2;
      var h = charH + padY * 2;
      g.append("rect")
        .attr("x", -w / 2).attr("y", -h / 2)
        .attr("width", w).attr("height", h)
        .attr("rx", 4).attr("ry", 4);
      g.append("text")
        .attr("x", 0).attr("y", 1)
        .text(d.label);
    });

  _showLabelToast("GO TO NODE ▸ type a label…");
}

function _exitLabelMode() {
  _labelModeActive = false;
  _labelTyped = "";
  _labelMap.clear();
  if (_labelOverlayGroup) { _labelOverlayGroup.remove(); _labelOverlayGroup = null; }
  _removeLabelToast();
}

function _updateLabelDimming() {
  if (!_labelOverlayGroup) return;
  _labelOverlayGroup.selectAll("g.label-mode-badge")
    .classed("dimmed", function(d) {
      return _labelTyped.length > 0 && d.label.indexOf(_labelTyped) !== 0;
    });
}

function _zoomToNode(node) {
  // Detail panel: zoom in close and center on the selected node
  if (_zoomSvg && _zoomDetailBehavior) {
    var zoomContainer = document.getElementById("zoom-container");
    if (zoomContainer) {
      var zw = zoomContainer.clientWidth;
      var zh = zoomContainer.clientHeight;
      var s = NODE_SIZE[node.kind] || { w: 160, h: 60 };
      // Scale so the node fills roughly 80% of the panel (close-up)
      var scaleW = (zw * 0.8) / s.w;
      var scaleH = (zh * 0.8) / s.h;
      var closeScale = Math.min(scaleW, scaleH, 6.0); // cap at 6× to avoid extreme zoom
      closeScale = Math.max(closeScale, 0.5);          // floor to stay readable
      var dtx = zw / 2 - node.x * closeScale;
      var dty = zh / 2 - node.y * closeScale;
      var t = d3.zoomIdentity.translate(dtx, dty).scale(closeScale);
      _zoomSvg.transition().duration(300).call(_zoomDetailBehavior.transform, t);
    }
  }

  // Highlight + inspect
  highlightConnected(node);
  _inspectorPinned = true;
  populatePanel(node);
}

// ── Keyboard navigation between connected nodes ────────────────────
var _selectedNavNode = null;    // currently focused node for Tab navigation
var _neighborList = [];         // ordered list of connected node objects
var _neighborIndex = -1;        // current position in _neighborList

function _buildNeighborList(node) {
  if (!node || !window._linkData || !window._nodeData) return [];
  var connIds = new Set();
  window._linkData.forEach(function(e) {
    var sid = _nid(e.source), tid = _nid(e.target);
    if (sid === node.id && tid !== node.id) connIds.add(tid);
    if (tid === node.id && sid !== node.id) connIds.add(sid);
  });
  var nodeMap = {};
  window._nodeData.forEach(function(n) { nodeMap[n.id] = n; });
  var neighbors = [];
  connIds.forEach(function(id) {
    if (nodeMap[id]) neighbors.push(nodeMap[id]);
  });
  // Sort by name for consistent order
  neighbors.sort(function(a, b) { return a.name.localeCompare(b.name); });
  return neighbors;
}

function _tabToNeighbor(forward) {
  if (!_selectedNavNode) return false;
  if (_neighborList.length === 0) return false;
  if (forward) {
    _neighborIndex = (_neighborIndex + 1) % _neighborList.length;
  } else {
    _neighborIndex = (_neighborIndex - 1 + _neighborList.length) % _neighborList.length;
  }
  var target = _neighborList[_neighborIndex];
  if (!target) return false;

  // Navigate to the neighbor but keep the original node's neighbor list
  var prevNav = _selectedNavNode;
  var prevList = _neighborList;
  var prevIdx = _neighborIndex;

  _zoomToNode(target);
  // Restore navigation context so repeated Tab keeps cycling from same origin
  _selectedNavNode = prevNav;
  _neighborList = prevList;
  _neighborIndex = prevIdx;
  return true;
}

// Hook into _zoomToNode to track selected node for Tab navigation
var _origZoomToNode = _zoomToNode;
_zoomToNode = function(node) {
  _origZoomToNode(node);
  _selectedNavNode = node;
  _neighborList = _buildNeighborList(node);
  _neighborIndex = -1;
};

// Tab navigation keyboard handler
document.addEventListener("keydown", function(e) {

  e.preventDefault();

  styleEl.textContent = [

    '.node-rect { stroke-width:1.5; rx:2px; ry:2px; }',
    '.node-rect.class { fill:#1a2610; stroke:#6dbd4a; }',
    '.node-rect.method { fill:#1a1408; stroke:#e8a824; }',
    '.node-rect.island_chain { fill:#201a08; stroke:#b8a878; }',
    '.node-rect.group { fill:#14180e; stroke:#8c8460; }',
    '.node-title { font-size:15px; fill:#d4ccb4; font-weight:700; font-family:Rajdhani,sans-serif; }',
    '.node-kind-inside { font-size:11px; fill:#8c8460; font-family:Rajdhani,sans-serif; font-weight:600; }',
    'text { font-family:Rajdhani,sans-serif; }',
  ].join('\n');
  clone.insertBefore(styleEl, clone.firstChild);

  // Add dark background
  var bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  bg.setAttribute("width", "100%");
  bg.setAttribute("height", "100%");
  bg.setAttribute("fill", "#0a0c08");
  clone.insertBefore(bg, clone.firstChild);

  var svgData = new XMLSerializer().serializeToString(clone);
  var blob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
  var url = URL.createObjectURL(blob);

  var a = document.createElement("a");
  a.href = url;
  var projectName = (currentGraphLabel || "graph").replace(/[^a-zA-Z0-9_-]/g, "_");
  a.download = "vca_" + projectName + ".svg";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Wire up export button
document.getElementById("wm-export-btn").addEventListener("click", exportGraphSVG);

// Wire up re-analyze button
document.getElementById("wm-reanalyze-btn").addEventListener("click", async function() {
  var btn = document.getElementById("wm-reanalyze-btn");
  if (!btn || btn.disabled) return;
  btn.disabled = true;
  btn.textContent = '↻ Analyzing…';
  btn.style.color = 'var(--accent)';
  try {
    var resp = await fetch(API_BASE + '/api/reanalyze', { method: 'POST' });
    if (!resp.ok) {
      var errData = {};
      try { errData = await resp.json(); } catch(e) {}
      throw new Error(errData.error || 'HTTP ' + resp.status);
    }
    // Clear frontend caches
    _insightsData = null;
    _insightsLoading = false;
    _hierDescriptions = {};
    _hierDescLoaded = false;
    _hierDescLoading = false;
    if (_hierDescPollTimer) { clearTimeout(_hierDescPollTimer); _hierDescPollTimer = null; }
    _nodeDescCache.clear();
    _llmEnrichDone = false;
    _llmContentClassifications = {};
    // Reload the graph
    await loadGraph();
    btn.textContent = '✓ Done';
    setTimeout(function() { btn.textContent = '↻ Re-analyze'; btn.style.color = ''; }, 2000);
  } catch(err) {
    btn.textContent = '✗ Error';
    btn.style.color = 'var(--red)';
    console.error('Re-analyze failed:', err);
    setTimeout(function() { btn.textContent = '↻ Re-analyze'; btn.style.color = ''; }, 3000);
  } finally {
    btn.disabled = false;
  }
});

// Key handler for label mode
document.addEventListener("keydown", function(e) {
  var tag = (document.activeElement || {}).tagName;
  var isTyping = (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT");

  // "G" enters label mode (only when not typing and mode is not active)
  if (!_labelModeActive) {
    if ((e.key === "g" || e.key === "G") && !isTyping && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault();
      _enterLabelMode();
    }
    return;
  }

  // In label mode:
  e.preventDefault();
  e.stopPropagation();

  if (e.key === "Escape") {
    _exitLabelMode();
    return;
  }

  // Only accept alphabet keys
  var ch = e.key.toUpperCase();
  if (ch.length === 1 && _LABEL_ALPHABET.indexOf(ch) !== -1) {
    _labelTyped += ch;
    _showLabelToast("GO TO NODE ▸ " + _labelTyped + "…");
    _updateLabelDimming();

    // Check for exact match
    if (_labelMap.has(_labelTyped)) {
      var targetNode = _labelMap.get(_labelTyped);
      _exitLabelMode();
      _zoomToNode(targetNode);
    } else {
      // Check if any labels still start with what was typed
      var anyMatch = false;
      _labelMap.forEach(function(v, k) {
        if (k.indexOf(_labelTyped) === 0) anyMatch = true;
      });
      if (!anyMatch) {
        // No possible match — exit
        _exitLabelMode();
      }
    }
  }
}, true);  // useCapture = true so it intercepts before other handlers

WindowManager.init(document.getElementById("wm-root"));
loadProjects(true);
