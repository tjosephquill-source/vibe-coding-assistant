<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeCodingAssistant — Architecture Graph</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-muted: #8b949e;
    --accent: #58a6ff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
  }

  /* Floating drill navigation (replaces top bar) */
  #back-btn {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 9999; /* raised to ensure visibility */
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
    display: none;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }
  #back-btn.visible { display: inline-flex; align-items: center; }
  #back-btn:hover { border-color: var(--accent); }

  #graph-container {
    position: fixed;
    top: 0; left: 0;
    right: 340px;   /* leave room for always-visible panel */
    bottom: 0;
  }

  svg { width: 100%; height: 100%; }

  /* Edges */
  .edge {
    fill: none;
    stroke-width: 2;
    opacity: 0.7;
  }
  .edge.inherits     { stroke: #f97583; }
  .edge.imports      { stroke: #8b949e; stroke-dasharray: 8,4; }
  .edge.contains     { stroke: #484f58; stroke-dasharray: 3,3; }
  .edge.calls        { stroke: #58a6ff; }
  .edge.instantiates { stroke: #d2a8ff; stroke-dasharray: 6,3; }
  .edge.uses_type    { stroke: #7ee787; stroke-dasharray: 4,2; }

  /* Remove this rule — it was hiding marker strokes */
  /* marker path { stroke: none; } */

  /* Nodes */
  .node-group { cursor: pointer; }
  .node-group:hover .node-rect { filter: brightness(1.15); }

  .node-rect {
    stroke-width: 2;
    rx: 10px;
    ry: 10px;
  }
  .node-rect.class  { fill: #1f6feb; stroke: #58a6ff; }
  .node-rect.method { fill: #8957e5; stroke: #b392f0; }
  .node-rect.metaclass { fill: #b08900; stroke: #e3b341; }

  .node-title {
    font-size: 15px; /* was 12px */
    fill: #ffffff;
    font-weight: 700;
    pointer-events: none;
  }

  .node-kind-inside {
    font-size: 12px; /* was 10px */
    fill: #e6edf3;
    opacity: 0.95;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    pointer-events: none;
  }

  .node-methods-fo { pointer-events: auto; }
  .node-methods-box {
    color: #c9d1d9;
    font-size: 12px; /* was 11px */
    font-family: 'SF Mono', 'Fira Code', monospace;
    line-height: 1.4;
    width: 100%;
    height: 100%;
    padding: 0 8px 8px;
  }

  .node-methods-label {
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 11px; /* was 10px */
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 4px;
    padding-top: 4px;
    border-top: 1px solid #ffffff33;
  }

  .node-methods-scroll {
    max-height: 82px; /* was 64px */
    overflow-y: auto;
    padding-right: 4px;
  }

  .node-methods-scroll div {
    white-space: nowrap;
  }

  /* Detail panel */
  #detail-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: 340px;
    bottom: 0;
    background: var(--surface);
    border-left: 1px solid var(--border);
    padding: 20px;
    overflow-y: auto;
    z-index: 90;
    /* removed: transform + transition */
  }

  #detail-panel h2 {
    font-size: 16px;
    color: var(--accent);
    margin-bottom: 4px;
  }

  #detail-panel .kind-tag {
    display: inline-block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 2px 8px;
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .kind-tag.class    { background: #58a6ff33; color: #58a6ff; }
  .kind-tag.method   { background: #d2a8ff33; color: #d2a8ff; }
  .kind-tag.metaclass { background: #e3b34133; color: #e3b341; }

  #detail-panel .detail-section {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  #detail-panel .detail-section h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  #detail-panel .detail-row {
    font-size: 12px;
    color: var(--text);
    margin-bottom: 4px;
    word-break: break-all;
  }
  #detail-panel .detail-row span {
    color: var(--text-muted);
  }

  #detail-panel .methods-list {
    list-style: none;
    padding: 0;
  }
  #detail-panel .methods-list li {
    font-size: 12px;
    color: var(--text);
    padding: 2px 0;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  #detail-panel .methods-list li::before {
    content: "ƒ ";
    color: var(--accent);
  }

  #detail-panel .docstring {
    font-size: 12px;
    color: var(--text-muted);
    font-style: italic;
    white-space: pre-wrap;
  }

  #detail-placeholder {
    color: var(--text-muted);
    font-size: 13px;
    margin-top: 40px;
    text-align: center;
    line-height: 1.6;
  }

  .rel-list { list-style: none; padding: 0; }
  .rel-list li {
    font-size: 12px;
    padding: 3px 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .rel-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* Legend */
  #legend {
    position: fixed;
    bottom: 16px;
    left: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 11px;
    z-index: 90;
  }
  #legend h4 {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .legend-node {
    width: 12px; height: 12px;
    border-radius: 50%;
    border: 2px solid;
  }
  .legend-edge {
    width: 24px; height: 0;
    border-top: 2px solid;
  }
  .legend-edge.dashed { border-top-style: dashed; }
  .legend-edge.dotted { border-top-style: dotted; }

  /* Loading */
  #loading {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 14px;
    color: var(--text-muted);
  }
</style>
</head>
<body>

<button id="back-btn">← Back</button>

<div id="graph-container">
  <svg id="graph-svg"></svg>
</div>

<div id="detail-panel">
  <!-- removed: close button -->
  <div id="detail-content">
    <div id="detail-placeholder">Hover over a node<br>to see details</div>
  </div>
</div>

<div id="legend">
  <h4>Nodes</h4>
  <div class="legend-item"><div class="legend-node" style="border-color:#58a6ff; background:#58a6ff22"></div> Class</div>
  <div class="legend-item"><div class="legend-node" style="border-color:#d2a8ff; background:#d2a8ff22"></div> Method</div>
  <div class="legend-item"><div class="legend-node" style="border-color:#e3b341; background:#e3b34122"></div> Metaclass</div>
  <h4 style="margin-top: 10px">Edges</h4>
  <div class="legend-item"><div class="legend-edge" style="border-color:#f97583"></div> Inherits</div>
  <div class="legend-item"><div class="legend-edge dashed" style="border-color:#8b949e"></div> Imports</div>
  <div class="legend-item"><div class="legend-edge dotted" style="border-color:#484f58"></div> Contains</div>
  <div class="legend-item"><div class="legend-edge" style="border-color:#d2a8ff"></div> Instantiates</div>
  <div class="legend-item"><div class="legend-edge dashed" style="border-color:#7ee787"></div> Uses Type</div>
</div>

<div id="loading">Analyzing codebase…</div>

<script>
const API_BASE = window.location.origin;
const ABSTRACT_NODES = true;
const ABSTRACT_THRESHOLD = 6;

// ── Position cache ─────────────────────────────────────────────────
const _positionCache = new Map(); // cacheKey → Map<nodeId, {x, y}>

function _graphCacheKey(nodes) {
  return nodes.map(n => n.id).sort().join("|");
}

const NODE_SIZE = {
  class: { w: 240, h: 158 },
  method: { w: 190, h: 70 },
  metaclass: { w: 300, h: 210 }
};
const NODE_CHARGE = { class: -950, method: -420, metaclass: -1300 };
const EDGE_DISTANCE = {
  contains: 130,
  inherits: 260,
  instantiates: 260,
  uses_type: 240,
  calls: 230,
  imports: 210
};
const COMPONENT_GAP_X = 520;
const COMPONENT_GAP_Y = 420;
const COLLISION_PAD = 30;

const ISOLATED_ROW_Y_OFFSET = 420;
const ISOLATED_COL_GAP = 280;
const ISOLATED_FORCE_STRENGTH = 0.18;

const GRID_SNAP_COL_GAP = 560;   // increased: was 420
const GRID_SNAP_ROW_GAP = 380;   // increased: was 300
const PARALLEL_EDGE_SPACING = 28; // px between parallel edges

// How far to pull the path end back from the box edge per kind (px)
const MARKER_OFFSET = {
  inherits:     18,
  calls:        14,
  imports:      14,
  instantiates: 18,
  uses_type:    14,
  contains:     14,
};

const GRID_SNAP_DURATION = 600;  // ms for snap animation

let graphData = null;        // current visible graph
let rootGraphData = null;    // overview graph (possibly abstracted)
let fullGraphData = null;    // non-abstracted graph for drilldown
let graphStack = [];
let currentGraphLabel = "Overview";
let simulation = null;
let selectedNode = null;

// Active filters
const activeNodeKinds = new Set(["class", "method", "metaclass"]);
const activeEdgeKinds = new Set(["inherits", "imports", "contains", "instantiates", "uses_type", "calls"]);

// ── Fetch graph data ──────────────────────────────────────────────
async function loadGraph() {
  try {
    const [overviewResp, fullResp] = await Promise.all([
      fetch(`${API_BASE}/api/graph?abstract=${ABSTRACT_NODES ? "true" : "false"}&abstract_threshold=${ABSTRACT_THRESHOLD}`),
      fetch(`${API_BASE}/api/graph?abstract=false&abstract_threshold=${ABSTRACT_THRESHOLD}`)
    ]);
    if (!overviewResp.ok) throw new Error(`HTTP ${overviewResp.status}`);
    if (!fullResp.ok) throw new Error(`HTTP ${fullResp.status}`);

    rootGraphData = await overviewResp.json();
    fullGraphData = await fullResp.json();

    document.getElementById("loading").style.display = "none";
    _setGraphView(rootGraphData, "Overview");
  } catch (err) {
    document.getElementById("loading").textContent = `Error: ${err.message}`;
  }
}

function _nid(v) { return typeof v === "object" ? v.id : v; }

function updateBackButton() {
  const backBtn = document.getElementById("back-btn");
  backBtn.classList.toggle("visible", graphStack.length > 0);
}

function _setGraphView(nextGraph, label) {
  graphData = nextGraph;
  currentGraphLabel = label || "Overview";
  updateBackButton();
  document.getElementById("detail-panel").classList.remove("open");
  renderGraph();
}

function buildClassMethodGraph(classNode) {
  const classId = classNode.id;
  const contains = fullGraphData.edges.filter(e => e.kind === "contains" && _nid(e.source) === classId);
  const methodIds = new Set(contains.map(e => _nid(e.target)));

  const nodes = fullGraphData.nodes.filter(n => n.kind === "method" && methodIds.has(n.id));
  const nodeIds = new Set(nodes.map(n => n.id));

  const edges = fullGraphData.edges.filter(e => {
    const s = _nid(e.source), t = _nid(e.target);
    return nodeIds.has(s) && nodeIds.has(t);
  });

  return { nodes, edges };
}

function buildMetaclassClassGraph(metaNode) {
  const memberIds = new Set((metaNode.member_ids || []));
  const membersByName = new Set((metaNode.members || []));

  const nodes = fullGraphData.nodes.filter(n =>
    n.kind === "class" && (memberIds.has(n.id) || membersByName.has(n.name))
  );
  const nodeIds = new Set(nodes.map(n => n.id));

  const edges = fullGraphData.edges.filter(e => {
    const s = _nid(e.source), t = _nid(e.target);
    return nodeIds.has(s) && nodeIds.has(t) && e.kind !== "contains";
  });

  return { nodes, edges };
}

function drillIntoNode(d) {
  if (d.kind === "class") {
    const sub = buildClassMethodGraph(d);
    graphStack.push({ graph: graphData, label: currentGraphLabel });
    updateBackButton();
    _setGraphView(sub, `Class: ${d.name}`);
    return;
  }
  if (d.kind === "metaclass") {
    const sub = buildMetaclassClassGraph(d);
    graphStack.push({ graph: graphData, label: currentGraphLabel });
    updateBackButton();
    _setGraphView(sub, `Metaclass: ${d.name}`);
    return;
  }
  selectNode(d);
}

// ── Geometry helpers ───────────────────────────────────────────────
/**
 * Find the point where the line from (x1,y1) to (x2,y2)
 * intersects the border of a rectangle centred at (x2,y2).
 */
function getRectIntersection(x1, y1, x2, y2, rw, rh) {
  const dx = x2 - x1, dy = y2 - y1;
  if (dx === 0 && dy === 0) return { x: x2, y: y2 };
  const hw = rw / 2, hh = rh / 2;
  const absDx = Math.abs(dx), absDy = Math.abs(dy);
  let t;
  if (absDx * hh > absDy * hw) {
    t = hw / absDx;
  } else {
    t = hh / absDy;
  }
  return { x: x2 - dx * t, y: y2 - dy * t };
}

/**
 * Shorten a path endpoint by `offset` px, moving back toward the source.
 */
function pullBack(px, py, fromX, fromY, offset) {
  const dx = px - fromX, dy = py - fromY;
  const len = Math.hypot(dx, dy) || 1;
  return {
    x: px - (dx / len) * offset,
    y: py - (dy / len) * offset,
  };
}

function edgePath(d) {
  const src = (typeof d.source === "object" && d.source !== null) ? d.source : window._nodeData?.find(n => n.id === d.source);
  const tgt = (typeof d.target === "object" && d.target !== null) ? d.target : window._nodeData?.find(n => n.id === d.target);

  if (!src || !tgt || src.x == null || src.y == null || tgt.x == null || tgt.y == null) {
    return "M0,0";
  }

  const srcSize = NODE_SIZE[src.kind] || { w: 160, h: 60 };
  const tgtSize = NODE_SIZE[tgt.kind] || { w: 160, h: 60 };

  const dx = tgt.x - src.x, dy = tgt.y - src.y;
  const len = Math.hypot(dx, dy) || 1;
  // Perpendicular unit vector
  const nx = -dy / len, ny = dx / len;

  // Lateral offset for parallel edges
  const offset = d._curve || 0;

  // Shift both endpoints perpendicular to the edge direction
  const sx = src.x + nx * offset, sy = src.y + ny * offset;
  const tx = tgt.x + nx * offset, ty = tgt.y + ny * offset;

  const rawStart = getRectIntersection(tx, ty, sx, sy, srcSize.w, srcSize.h);
  const rawEnd   = getRectIntersection(sx, sy, tx, ty, tgtSize.w, tgtSize.h);

  const markerOff = MARKER_OFFSET[d.kind] || 14;
  const end = pullBack(rawEnd.x, rawEnd.y, sx, sy, markerOff);
  const start = d.kind === "contains"
    ? pullBack(rawStart.x, rawStart.y, tx, ty, markerOff)
    : rawStart;

  return `M${start.x},${start.y} L${end.x},${end.y}`;
}

// ── Deterministic hash ─────────────────────────────────────────────
function _stableHash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = ((h << 5) - h + str.charCodeAt(i)) | 0;
  }
  return Math.abs(h);
}

// ── Initial layout helpers ─────────────────────────────────────────
function buildAdjacency(nodes, links) {
  const adj = new Map(nodes.map(n => [n.id, new Set()]));
  links.forEach(e => {
    const s = typeof e.source === "object" ? e.source.id : e.source;
    const t = typeof e.target === "object" ? e.target.id : e.target;
    if (adj.has(s) && adj.has(t)) {
      adj.get(s).add(t);
      adj.get(t).add(s);
    }
  });
  return adj;
}

function connectedComponents(nodes, links) {
  const byId = new Map(nodes.map(n => [n.id, n]));
  const adj = buildAdjacency(nodes, links);
  const seen = new Set();
  const comps = [];

  for (const n of nodes) {
    if (seen.has(n.id)) continue;
    const q = [n.id];
    seen.add(n.id);
    const comp = [];
    while (q.length) {
      const id = q.pop();
      comp.push(byId.get(id));
      for (const nxt of adj.get(id) || []) {
        if (!seen.has(nxt)) {
          seen.add(nxt);
          q.push(nxt);
        }
      }
    }
    comps.push(comp);
  }
  return comps.sort((a, b) => b.length - a.length);
}

function seedPositions(nodes, links, width, height) {
  const comps = connectedComponents(nodes, links);

  // Separate isolated (single-node components) from connected
  const isolatedComps = comps.filter(c => c.length === 1);
  const connectedComps = comps.filter(c => c.length > 1);

  const compCols = Math.max(1, Math.ceil(Math.sqrt(connectedComps.length)));
  const compRows = Math.max(1, Math.ceil(connectedComps.length / compCols));
  const startX = width / 2 - ((compCols - 1) * COMPONENT_GAP_X) / 2;
  const startY = height / 2 - ((compRows - 1) * COMPONENT_GAP_Y) / 2;

  const degree = new Map(nodes.map(n => [n.id, 0]));
  links.forEach(e => {
    const s = typeof e.source === "object" ? e.source.id : e.source;
    const t = typeof e.target === "object" ? e.target.id : e.target;
    if (degree.has(s)) degree.set(s, degree.get(s) + 1);
    if (degree.has(t)) degree.set(t, degree.get(t) + 1);
  });

  // Place connected components as before
  connectedComps.forEach((comp, i) => {
    const col = i % compCols;
    const row = Math.floor(i / compCols);
    const cx = startX + col * COMPONENT_GAP_X;
    const cy = startY + row * COMPONENT_GAP_Y;

    const sorted = [...comp].sort((a, b) => (degree.get(b.id) || 0) - (degree.get(a.id) || 0));
    const coreCount = Math.max(1, Math.floor(sorted.length * 0.2));

    sorted.forEach((n, idx) => {
      if (idx < coreCount) {
        const a = (2 * Math.PI * idx) / coreCount;
        n.x = cx + Math.cos(a) * 40;
        n.y = cy + Math.sin(a) * 40;
      } else {
        const ringIdx = idx - coreCount;
        const ring = Math.floor(ringIdx / 8) + 1;
        const inRing = ringIdx % 8;
        const countInRing = Math.min(8, sorted.length - coreCount - (ring - 1) * 8);
        const a = (2 * Math.PI * inRing) / Math.max(1, countInRing);
        const r = 90 + ring * 70;
        n.x = cx + Math.cos(a) * r;
        n.y = cy + Math.sin(a) * r;
      }
    });
  });

  // Place isolated nodes in a single row at the bottom
  const bottomY = startY + compRows * COMPONENT_GAP_Y + ISOLATED_ROW_Y_OFFSET;
  const totalIsolatedW = (isolatedComps.length - 1) * ISOLATED_COL_GAP;
  const isolatedStartX = width / 2 - totalIsolatedW / 2;

  isolatedComps.forEach((comp, i) => {
    comp[0].x = isolatedStartX + i * ISOLATED_COL_GAP;
    comp[0].y = bottomY;
    comp[0]._isolated = true;  // tag for force targeting
  });
}

function makeIsolatedBottomForce(isolatedY, strength = 0.15) {
  let nodes = [];
  function force(alpha) {
    for (const n of nodes) {
      if (!n._isolated) continue;
      n.vy += (isolatedY - n.y) * strength * alpha;
    }
  }
  force.initialize = (_nodes) => { nodes = _nodes || []; };
  return force;
}

// ── Render ─────────────────────────────────────────────────────────
function fitGraphToViewport(svg, zoomBehavior, nodeData, width, height, padding = 40, animate = true) {
  if (!nodeData || nodeData.length === 0) return;

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  nodeData.forEach(n => {
    const s = NODE_SIZE[n.kind] || { w: 160, h: 60 };
    const x1 = n.x - s.w / 2, x2 = n.x + s.w / 2;
    const y1 = n.y - s.h / 2, y2 = n.y + s.h / 2;
    if (x1 < minX) minX = x1;
    if (y1 < minY) minY = y1;
    if (x2 > maxX) maxX = x2;
    if (y2 > maxY) maxY = y2;
  });

  const graphW = Math.max(1, maxX - minX);
  const graphH = Math.max(1, maxY - minY);

  const scale = Math.max(
    0.1,
    Math.min(4, Math.min((width - padding * 2) / graphW, (height - padding * 2) / graphH))
  );

  const tx = (width - graphW * scale) / 2 - minX * scale;
  const ty = (height - graphH * scale) / 2 - minY * scale;
  const t = d3.zoomIdentity.translate(tx, ty).scale(scale);

  if (animate) {
    svg.transition().duration(250).call(zoomBehavior.transform, t);
  } else {
    svg.call(zoomBehavior.transform, t);
  }
}

function snapNodesToGrid(nodeData, svg, g, node, link) {
  if (!nodeData || nodeData.length === 0) return;

  let minX = Infinity, minY = Infinity;
  nodeData.forEach(n => {
    if (n.x < minX) minX = n.x;
    if (n.y < minY) minY = n.y;
  });

  const sorted = [...nodeData].sort((a, b) =>
    Math.round((a.y - minY) / GRID_SNAP_ROW_GAP) - Math.round((b.y - minY) / GRID_SNAP_ROW_GAP) ||
    Math.round((a.x - minX) / GRID_SNAP_COL_GAP) - Math.round((b.x - minX) / GRID_SNAP_COL_GAP)
  );

  const totalCols = Math.max(1, Math.ceil(Math.sqrt(nodeData.length * 1.4)));
  const usedCells = new Set();
  const cellOf = new Map();

  sorted.forEach(n => {
    let col = Math.max(0, Math.round((n.x - minX) / GRID_SNAP_COL_GAP));
    let row = Math.max(0, Math.round((n.y - minY) / GRID_SNAP_ROW_GAP));

    let found = false;
    for (let radius = 0; radius < totalCols * 2 && !found; radius++) {
      for (let dc = -radius; dc <= radius && !found; dc++) {
        for (let dr = -radius; dr <= radius && !found; dr++) {
          if (Math.abs(dc) !== radius && Math.abs(dr) !== radius) continue;
          const c = Math.max(0, col + dc);
          const r = Math.max(0, row + dr);
          const key = `${c},${r}`;
          if (!usedCells.has(key)) {
            usedCells.add(key);
            cellOf.set(n.id, { col: c, row: r });
            found = true;
          }
        }
      }
    }
  });

  let cx = 0, cy = 0;
  nodeData.forEach(n => { cx += n.x; cy += n.y; });
  cx /= nodeData.length;
  cy /= nodeData.length;

  const maxCol = Math.max(...[...cellOf.values()].map(c => c.col));
  const maxRow = Math.max(...[...cellOf.values()].map(c => c.row));
  const gridOriginX = cx - (maxCol * GRID_SNAP_COL_GAP) / 2;
  const gridOriginY = cy - (maxRow * GRID_SNAP_ROW_GAP) / 2;

  // Assign positions instantly — no animation
  nodeData.forEach(n => {
    const cell = cellOf.get(n.id);
    if (!cell) return;
    n.x = gridOriginX + cell.col * GRID_SNAP_COL_GAP;
    n.y = gridOriginY + cell.row * GRID_SNAP_ROW_GAP;
    n.fx = null;
    n.fy = null;
  });

  // Single synchronous DOM update — use edgePath equivalent inline
  node.attr("transform", d => `translate(${d.x},${d.y})`);
  link.attr("d", edgePath);  // reuse edgePath directly

  // Fit viewport to snapped layout
  const container = document.getElementById("graph-container");
  fitGraphToViewport(svg, window._zoomBehavior, nodeData, container.clientWidth, container.clientHeight, 56, true);
}

function renderGraph() {
  const svg = d3.select("#graph-svg");
  svg.selectAll("*").remove();

  const container = document.getElementById("graph-container");
  const width = container.clientWidth;
  const height = container.clientHeight;

  let didInitialFit = false;
  let autoFitActive = true;
  let lastAutoFitTs = 0;
  const AUTO_FIT_INTERVAL_MS = 120;

  // Filter data (base)
  const nodeById = new Map(graphData.nodes.map(n => [n.id, n]));
  const baseNodes = graphData.nodes.filter(n => activeNodeKinds.has(n.kind));

  const visibleClassIds = new Set(baseNodes.filter(n => n.kind === "class").map(n => n.id));
  const suppressedNodeIds = new Set();

  graphData.edges.forEach(e => {
    if (e.kind !== "contains") return;
    const sourceId = typeof e.source === "object" ? e.source.id : e.source;
    const targetId = typeof e.target === "object" ? e.target.id : e.target;
    const targetNode = nodeById.get(targetId);
    if (visibleClassIds.has(sourceId) && targetNode?.kind === "method") {
      suppressedNodeIds.add(targetId);
    }
  });

  const nodes = baseNodes.filter(n => !suppressedNodeIds.has(n.id));
  const nodeIds = new Set(nodes.map(n => n.id));

  const edges = graphData.edges.filter(e => {
    const s = typeof e.source === "object" ? e.source.id : e.source;
    const t = typeof e.target === "object" ? e.target.id : e.target;
    return activeEdgeKinds.has(e.kind) && nodeIds.has(s) && nodeIds.has(t);
  });

  const rawLinks = edges.map((e, i) => ({
    ...e,
    source: e.source,
    target: e.target,
    _pathId: `edge-path-${i}`,
    _curve: 0,
    _dirSign: 1,
  }));

  const pairGroups = new Map();
  rawLinks.forEach(e => {
    const a = typeof e.source === "object" ? e.source.id : e.source;
    const b = typeof e.target === "object" ? e.target.id : e.target;
    const key = a < b ? `${a}|${b}` : `${b}|${a}`;
    if (!pairGroups.has(key)) pairGroups.set(key, []);
    pairGroups.get(key).push(e);
  });

  pairGroups.forEach(group => {
    group.sort((e1, e2) => {
      const s1 = typeof e1.source === "object" ? e1.source.id : e1.source;
      const t1 = typeof e1.target === "object" ? e1.target.id : e1.target;
      const s2 = typeof e2.source === "object" ? e2.source.id : e2.source;
      const t2 = typeof e2.target === "object" ? e2.target.id : e2.target;
      return `${s1}|${t1}|${e1.kind}`.localeCompare(`${s2}|${t2}|${e2.kind}`);
    });

    const count = group.length;
    group.forEach((e, idx) => {
      // Evenly space edges perpendicular to the line; centre the band
      e._curve = (idx - (count - 1) / 2) * PARALLEL_EDGE_SPACING;
    });
  });

  const linkData = rawLinks;
  const nodeData = nodes.map(n => ({ ...n }));

  // ── Check position cache ───────────────────────────────────────
  const cacheKey = _graphCacheKey(nodeData);
  const cachedPositions = _positionCache.get(cacheKey);

  // Arrow markers — refX=0 because paths now end at box edge
  const defs = svg.append("defs");
  defs.append("marker").attr("id","arrow-inherits").attr("viewBox","0 -9 18 18").attr("refX",18).attr("refY",0).attr("markerWidth",14).attr("markerHeight",14).attr("orient","auto").append("path").attr("d","M0,-9L18,0L0,9Z").attr("fill","none").attr("stroke","#f97583").attr("stroke-width",2.5);
  defs.append("marker").attr("id","arrow-calls").attr("viewBox","0 -6 12 12").attr("refX",12).attr("refY",0).attr("markerWidth",12).attr("markerHeight",12).attr("orient","auto").append("path").attr("d","M0,-6L12,0L0,6Z").attr("fill","#58a6ff");
  defs.append("marker").attr("id","arrow-imports").attr("viewBox","0 -6 12 12").attr("refX",12).attr("refY",0).attr("markerWidth",12).attr("markerHeight",12).attr("orient","auto").append("path").attr("d","M0,-6L12,0L0,6").attr("fill","none").attr("stroke","#8b949e").attr("stroke-width",2.5);
  defs.append("marker").attr("id","arrow-instantiates").attr("viewBox","-1 -7 18 14").attr("refX",17).attr("refY",0).attr("markerWidth",14).attr("markerHeight",14).attr("orient","auto").append("path").attr("d","M0,0L8,-6L16,0L8,6Z").attr("fill","none").attr("stroke","#d2a8ff").attr("stroke-width",2.5);
  defs.append("marker").attr("id","arrow-uses_type").attr("viewBox","0 -6 12 12").attr("refX",12).attr("refY",0).attr("markerWidth",12).attr("markerHeight",12).attr("orient","auto").append("path").attr("d","M0,-6L12,0L0,6").attr("fill","none").attr("stroke","#7ee787").attr("stroke-width",2.5);
  defs.append("marker").attr("id","diamond-contains-end").attr("viewBox","-1 -7 18 14").attr("refX",0).attr("refY",0).attr("markerWidth",14).attr("markerHeight",14).attr("orient","auto-start-reverse").append("path").attr("d","M0,0L8,-6L16,0L8,6Z").attr("fill","#8b949e").attr("stroke","#8b949e");

  // Zoom — programmatic only, disable all user interaction
  const g = svg.append("g");
  const zoomBehavior = d3.zoom()
    .scaleExtent([0.1, 4])
    .on("zoom", (event) => g.attr("transform", event.transform));

  svg.call(zoomBehavior);
  svg.on("wheel.zoom", null)
     .on("mousedown.zoom", null)
     .on("touchstart.zoom", null)
     .on("touchmove.zoom", null)
     .on("touchend.zoom", null)
     .on("dblclick.zoom", null);

  window._zoomBehavior = zoomBehavior;

  // Edges
  const link = g.append("g").selectAll("path")
    .data(linkData)
    .join("path")
    .attr("id", d => d._pathId)
    .attr("class", d => `edge ${d.kind}`)
    .attr("marker-end", d => `url(#arrow-${d.kind})`)
    .attr("marker-start", d => d.kind === "contains" ? `url(#diamond-contains-end)` : null);

  // Nodes — no drag
  const node = g.append("g").selectAll("g")
    .data(nodeData)
    .join("g")
    .attr("class", "node-group")
    .on("mouseenter", (event, d) => { event.stopPropagation(); highlightConnected(d); })
    .on("mouseleave", () => { clearHighlight(); })
    .on("click", (event, d) => { event.stopPropagation(); drillIntoNode(d); });

  node.append("rect")
    .attr("class", d => `node-rect ${d.kind}`)
    .attr("x", d => -(NODE_SIZE[d.kind]?.w || 160) / 2)
    .attr("y", d => -(NODE_SIZE[d.kind]?.h || 60) / 2)
    .attr("width", d => NODE_SIZE[d.kind]?.w || 160)
    .attr("height", d => NODE_SIZE[d.kind]?.h || 60);

  node.append("text").attr("class","node-title").attr("x",d=>-(NODE_SIZE[d.kind]?.w||160)/2+10).attr("y",d=>-(NODE_SIZE[d.kind]?.h||60)/2+18).attr("text-anchor","start").text(d=>d.name);
  node.append("text").attr("class","node-kind-inside").attr("x",d=>-(NODE_SIZE[d.kind]?.w||160)/2+10).attr("y",d=>-(NODE_SIZE[d.kind]?.h||60)/2+34).attr("text-anchor","start").text(d=>d.kind);

  const classFo = node.filter(d => d.kind === "class")
    .append("foreignObject").attr("class","node-methods-fo")
    .attr("x",d=>-(NODE_SIZE[d.kind].w/2)).attr("y",d=>-(NODE_SIZE[d.kind].h/2)+38)
    .attr("width",d=>NODE_SIZE[d.kind].w).attr("height",d=>NODE_SIZE[d.kind].h-40)
    .html(d=>{const methods=(d.methods||[]).map(m=>`<div>${m}()</div>`).join("");return`<div xmlns="http://www.w3.org/1999/xhtml" class="node-methods-box"><div class="node-methods-label">Methods (${(d.methods||[]).length})</div><div class="node-methods-scroll">${methods||"<div>(none)</div>"}</div></div>`;});
  classFo.on("click",(event,d)=>{event.stopPropagation();drillIntoNode(d);});

  const metaFo = node.filter(d => d.kind === "metaclass")
    .append("foreignObject").attr("class","node-methods-fo")
    .attr("x",d=>-(NODE_SIZE[d.kind].w/2)).attr("y",d=>-(NODE_SIZE[d.kind].h/2)+38)
    .attr("width",d=>NODE_SIZE[d.kind].w).attr("height",d=>NODE_SIZE[d.kind].h-40)
    .html(d=>{const members=(d.members||[]).map(m=>`<div>${m}</div>`).join("");return`<div xmlns="http://www.w3.org/1999/xhtml" class="node-methods-box"><div class="node-methods-label">Classes (${(d.members||[]).length})</div><div class="node-methods-scroll">${members||"<div>(none)</div>"}</div></div>`;});
  metaFo.on("click",(event,d)=>{event.stopPropagation();drillIntoNode(d);});

  // ── Restore from cache — skip simulation ──────────────────────
  if (cachedPositions) {
    nodeData.forEach(n => {
      const pos = cachedPositions.get(n.id);
      if (pos) { n.x = pos.x; n.y = pos.y; }
    });

    // MUST set window._nodeData before calling edgePath
    window._nodes = node;
    window._links = link;
    window._nodeData = nodeData;
    window._linkData = linkData;

    // Pre-resolve string source/target → node objects so edgePath works
    const nodeMap = new Map(nodeData.map(n => [n.id, n]));
    linkData.forEach(d => {
      if (typeof d.source === "string") d.source = nodeMap.get(d.source) || d.source;
      if (typeof d.target === "string") d.target = nodeMap.get(d.target) || d.target;
    });

    node.attr("transform", d => `translate(${d.x},${d.y})`);
    link.attr("d", edgePath);
    fitGraphToViewport(svg, zoomBehavior, nodeData, width, height, 56, false);
    svg.on("click", () => { selectedNode = null; clearHighlight(); });
    return;
  }

  // ── Fresh layout ───────────────────────────────────────────────

  // Set window._nodeData early so edgePath lookups work during simulation ticks
  window._nodes = node;
  window._links = link;
  window._nodeData = nodeData;
  window._linkData = linkData;

  seedPositions(nodeData, linkData, width, height);

  const connectedYs = nodeData.filter(n => !n._isolated).map(n => n.y);
  const maxConnectedY = connectedYs.length ? Math.max(...connectedYs) : height / 2;
  const isolatedTargetY = maxConnectedY + ISOLATED_ROW_Y_OFFSET;

  simulation = d3.forceSimulation(nodeData)
    .alpha(1).alphaDecay(0.03).velocityDecay(0.35)
    .force("link", d3.forceLink(linkData).id(d=>d.id).distance(d=>EDGE_DISTANCE[d.kind]||240).strength(d=>d.kind==="contains"?0.35:0.2).iterations(3))
    .force("charge", d3.forceManyBody().strength(d=>NODE_CHARGE[d.kind]||-500))
    .force("center", d3.forceCenter(width/2,height/2))
    .force("collision", d3.forceCollide().radius(d=>{const s=NODE_SIZE[d.kind]||{w:160,h:60};return Math.sqrt(s.w*s.w+s.h*s.h)/2+COLLISION_PAD;}))
    .force("isolatedBottom", makeIsolatedBottomForce(isolatedTargetY, ISOLATED_FORCE_STRENGTH))
    .force("x", d3.forceX(width/2).strength(0.025))
    .force("y", d3.forceY(height/2).strength(0.025));

  simulation.on("tick", () => {
    link.attr("d", edgePath);
    node.attr("transform", d => `translate(${d.x},${d.y})`);
    if (autoFitActive) {
      const now = performance.now();
      if (now - lastAutoFitTs >= AUTO_FIT_INTERVAL_MS) {
        lastAutoFitTs = now;
        fitGraphToViewport(svg, zoomBehavior, nodeData, width, height, 56, false);
      }
      if (simulation.alpha() < 0.12) autoFitActive = false;
    }
  });

  function _saveAndSnap() {
    autoFitActive = false;
    snapNodesToGrid(nodeData, svg, g, node, link);
    const posMap = new Map(nodeData.map(n => [n.id, { x: n.x, y: n.y }]));
    _positionCache.set(cacheKey, posMap);
  }

  simulation.on("end", () => {
    if (didInitialFit) return;
    didInitialFit = true;
    _saveAndSnap();
  });

  setTimeout(() => {
    if (didInitialFit) return;
    didInitialFit = true;
    simulation.stop();
    _saveAndSnap();
  }, 4000);

  svg.on("click", () => { selectedNode = null; clearHighlight(); });

  // NOTE: window._nodes/_links/_nodeData/_linkData already set above (before simulation)
}

// ── Node selection & detail panel ──────────────────────────────────
function selectNode(d) {
  selectedNode = d;
  highlightConnected(d);

  const panel = document.getElementById("detail-panel");
  const content = document.getElementById("detail-content");

  // Find connected edges
  const incoming = graphData.edges.filter(e => (e.target === d.id || e.target.id === d.id));
  const outgoing = graphData.edges.filter(e => (e.source === d.id || e.source.id === d.id));

  const findNodeName = (id) => {
    const realId = typeof id === "object" ? id.id : id;
    const n = graphData.nodes.find(n => n.id === realId);
    return n ? n.name : realId;
  };

  let html = `
    <h2>${d.name}</h2>
    <div class="kind-tag ${d.kind}">${d.kind}</div>
    <div class="detail-section">
      <h3>Location</h3>
      <div class="detail-row"><span>File:</span> ${d.file_path}</div>
      <div class="detail-row"><span>Lines:</span> ${d.line_start}–${d.line_end}</div>
      <div class="detail-row"><span>Qualified:</span> ${d.qualified_name}</div>
    </div>
  `;

  if (d.docstring) {
    html += `
      <div class="detail-section">
        <h3>Description</h3>
        <div class="docstring">${d.docstring}</div>
      </div>
    `;
  }

  if (d.bases && d.bases.length > 0) {
    html += `
      <div class="detail-section">
        <h3>Inherits from</h3>
        <div class="detail-row">${d.bases.join(", ")}</div>
      </div>
    `;
  }

  if (d.methods && d.methods.length > 0) {
    html += `
      <div class="detail-section">
        <h3>Methods (${d.methods.length})</h3>
        <ul class="methods-list">${d.methods.map(m => `<li>${m}()</li>`).join("")}</ul>
      </div>
    `;
  }

  if (d.members && d.members.length > 0) {
    html += `
      <div class="detail-section">
        <h3>Grouped Classes (${d.members.length})</h3>
        <ul class="methods-list">${d.members.map(m => `<li>${m}</li>`).join("")}</ul>
      </div>
    `;
  }

  const edgeColor = {
    inherits: "#f97583", imports: "#8b949e", contains: "#484f58",
    calls: "#58a6ff", instantiates: "#d2a8ff", uses_type: "#7ee787"
  };

  if (outgoing.length > 0) {
    html += `
      <div class="detail-section">
        <h3>Outgoing (${outgoing.length})</h3>
        <ul class="rel-list">${outgoing.map(e => `
          <li>
            <div class="rel-dot" style="background:${edgeColor[e.kind] || '#8b949e'}"></div>
            <span style="color:${edgeColor[e.kind] || '#8b949e'}">${e.kind}</span> → ${findNodeName(e.target)}
          </li>
        `).join("")}</ul>
      </div>
    `;
  }

  if (incoming.length > 0) {
    html += `
      <div class="detail-section">
        <h3>Incoming (${incoming.length})</h3>
        <ul class="rel-list">${incoming.map(e => `
          <li>
            <div class="rel-dot" style="background:${edgeColor[e.kind] || '#8b949e'}"></div>
            ${findNodeName(e.source)} <span style="color:${edgeColor[e.kind] || '#8b949e'}">${e.kind}</span> →
          </li>
        `).join("")}</ul>
      </div>
    `;
  }

  content.innerHTML = html;
}

  document.getElementById("detail-content").innerHTML =
    `<div id="detail-placeholder">Hover over a node<br>to see details</div>`;
}

        <div class="detail-row">${d.bases.join(", ")}</div>
      </div>
    `;

  if (d.methods && d.methods.length > 0) {

          <li>
            <div class="rel-dot" style="background:${edgeColor[e.kind] || '#8b949e'}"></div>
            ${findNodeName(e.source)} <span style="color:${edgeColor[e.kind] || '#8b949e'}">${e.kind}</span> →
          </li>`).join("")}</ul>
      </div>
    `;

  content.innerHTML = html;
}

function highlightConnected(d) {
  const connectedIds = new Set([d.id]);
  window._linkData.forEach(e => {
    const sid = _nid(e.source), tid = _nid(e.target);
    if (sid === d.id) connectedIds.add(tid);
    if (tid === d.id) connectedIds.add(sid);
  });

  window._nodes.selectAll(".node-rect")
    .style("opacity", n => connectedIds.has(n.id) ? 1 : 0.15)
    .style("filter", n => n.id === d.id ? "brightness(1.2) drop-shadow(0 0 8px)" : null);

  window._nodes.selectAll(".node-title")
    .style("opacity", n => connectedIds.has(n.id) ? 1 : 0.15);

  window._nodes.selectAll(".node-kind-inside")
    .style("opacity", n => connectedIds.has(n.id) ? 1 : 0.15);

  window._links
    .style("opacity", e => {
      const sid = _nid(e.source), tid = _nid(e.target);
      return (sid === d.id || tid === d.id) ? 0.9 : 0.05;
    });

  // Populate panel on hover
  populatePanel(d);
}

function clearHighlight() {
  if (!window._nodes || !window._links) return;
  window._nodes.selectAll(".node-rect").style("filter", null).style("opacity", 1);
  window._nodes.selectAll(".node-title").style("opacity", 1);
  window._nodes.selectAll(".node-kind-inside").style("opacity", 1);
  window._links.style("opacity", 0.5);
  showPlaceholder();
}
