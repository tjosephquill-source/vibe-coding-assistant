/* ── Main controls ──────────────────────────────────────────────── */

async function _previewStart(focusNodeId) {
  if (_previewPlaying) return;

  var level = document.getElementById('preview-level');
  var levelVal = level ? level.value : 'high';
  var playBtn = document.getElementById('preview-play');
  var pauseBtn = document.getElementById('preview-pause');
  var stopBtn = document.getElementById('preview-stop');

  _previewShowNarration('Generating walkthrough…', true);
  if (playBtn) playBtn.disabled = true;

  try {
    // Ensure hierarchical descriptions are available — walkthrough depends on them
    if (!_hierDescLoaded) {
      if (!_hierDescLoading) {
        _previewShowNarration('Generating descriptions…', true);
        // Kick off generation
        try {
          await fetch(API_BASE + '/api/describe', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ force: false }),
          });
        } catch(e) { /* will poll below */ }
      }
      // Poll until descriptions are ready (or timeout after 180s)
      _previewShowNarration('Waiting for descriptions…', true);
      var waited = 0;
      while (!_hierDescLoaded && waited < 180000) {
        await new Promise(function(r) { setTimeout(r, 2000); });
        waited += 2000;
        try {
          var statusResp = await fetch(API_BASE + '/api/describe/status');
          var status = await statusResp.json();
          if (status.total > 0) {
            _previewShowNarration('Generating descriptions… ' + status.done + '/' + status.total, true);
          }
          // Only break when explicitly done — 'idle' means the task hasn't started yet
          if (status.status === 'done') {
            // Fetch the results
            var descResp = await fetch(API_BASE + '/api/describe');
            var descData = await descResp.json();
            if (descData.descriptions && Object.keys(descData.descriptions).length > 0) {
              _hierDescriptions = descData.descriptions;
              _hierDescLoaded = true;
              _hierDescLoading = false;
              _prefillNodeDescCache();
            }
            break;
          }
          if (status.status === 'error') {
            throw new Error(status.error || 'Description generation failed');
          }
          // If status is 'idle' and not running, the task may not have started yet —
          // re-trigger it and keep polling
          if (status.status === 'idle' && !status.running && waited > 4000) {
            try {
              await fetch(API_BASE + '/api/describe', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ force: false }),
              });
            } catch(e2) { /* keep polling */ }
          }
        } catch(e) {
          if (e.message && e.message.indexOf('Description generation failed') !== -1) {
            throw e;
          }
          /* network error — retry */
        }
      }
      if (!_hierDescLoaded) {
        throw new Error('Timed out waiting for descriptions to generate');
      }
      _previewShowNarration('Generating walkthrough…', true);
    }

    var previewBody = { level: levelVal };
    if (focusNodeId) previewBody.focus_node_id = focusNodeId;

    var resp = await fetch(API_BASE + '/api/preview', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(previewBody),
    });
    if (!resp.ok) {
      var errData = {};
      try { errData = await resp.json(); } catch(e) {}
      throw new Error(errData.error || 'HTTP ' + resp.status);
    }
    var data = await resp.json();
    if (data.error) throw new Error(data.error);

    _previewScenes = data.scenes || [];
    if (_previewScenes.length === 0) {
      _previewShowNarration('No scenes generated', false);
      if (playBtn) playBtn.disabled = false;
      return;
    }

    _previewIndex = 0;
    _previewPlaying = true;
    if (playBtn) playBtn.style.display = 'none';
    if (pauseBtn) pauseBtn.style.display = '';
    if (stopBtn) stopBtn.disabled = false;
    _previewUpdateCounter();
    _previewUpdateSkipButtons();
    _previewPlayScene();

  } catch (err) {
    _previewShowNarration('Error: ' + err.message, false);
    if (playBtn) { playBtn.disabled = false; playBtn.style.display = ''; }
    if (pauseBtn) pauseBtn.style.display = 'none';
  }
}

function _previewPause() {
  if (!_previewPlaying) return;
  _previewPlaying = false;
  if (_previewTimer) { clearTimeout(_previewTimer); _previewTimer = null; }
  if (_previewProgressRAF) { cancelAnimationFrame(_previewProgressRAF); _previewProgressRAF = null; }
  if (_previewAudioEl) { _previewAudioEl.pause(); }

  var playBtn = document.getElementById('preview-play');
  var pauseBtn = document.getElementById('preview-pause');
  if (playBtn) { playBtn.style.display = ''; playBtn.disabled = false; playBtn.textContent = '▶'; }
  if (pauseBtn) pauseBtn.style.display = 'none';
}

function _previewResume() {
  if (_previewPlaying) return;
  if (_previewIndex >= _previewScenes.length) return;
  _previewPlaying = true;

  var playBtn = document.getElementById('preview-play');
  var pauseBtn = document.getElementById('preview-pause');
  if (playBtn) playBtn.style.display = 'none';
  if (pauseBtn) pauseBtn.style.display = '';

  _previewIndex++;
  if (_previewIndex < _previewScenes.length) {
    _previewUpdateCounter();
    _previewUpdateSkipButtons();
    _previewPlayScene();
  } else {
    _previewFinish();
  }
}

function _previewSkipForward() {
  if (_previewScenes.length === 0) return;
  if (_previewIndex >= _previewScenes.length - 1) return;
  if (_previewTimer) { clearTimeout(_previewTimer); _previewTimer = null; }
  if (_previewProgressRAF) { cancelAnimationFrame(_previewProgressRAF); _previewProgressRAF = null; }
  _previewStopAudio();
  _previewIndex++;
  _previewUpdateCounter();
  _previewUpdateSkipButtons();
  if (_previewPlaying) {
    _previewPlayScene();
  } else {
    // When paused, still show the scene but don't auto-advance
    _previewRenderSceneStatic();
  }
}

function _previewSkipBack() {
  if (_previewScenes.length === 0) return;
  if (_previewIndex <= 0) return;
  if (_previewTimer) { clearTimeout(_previewTimer); _previewTimer = null; }
  if (_previewProgressRAF) { cancelAnimationFrame(_previewProgressRAF); _previewProgressRAF = null; }
  _previewStopAudio();
  _previewIndex--;
  _previewUpdateCounter();
  _previewUpdateSkipButtons();
  if (_previewPlaying) {
    _previewPlayScene();
  } else {
    _previewRenderSceneStatic();
  }
}

function _previewStop() {
  _previewPlaying = false;
  if (_previewTimer) { clearTimeout(_previewTimer); _previewTimer = null; }
  if (_previewProgressRAF) { cancelAnimationFrame(_previewProgressRAF); _previewProgressRAF = null; }
  _previewStopAudio();
  _previewScenes = [];
  _previewIndex = 0;

  if (typeof clearHighlight === 'function') clearHighlight();

  var playBtn = document.getElementById('preview-play');
  var pauseBtn = document.getElementById('preview-pause');
  var stopBtn = document.getElementById('preview-stop');
  var progressFill = document.getElementById('preview-progress-fill');

  if (playBtn) { playBtn.style.display = ''; playBtn.disabled = false; playBtn.textContent = '▶'; }
  if (pauseBtn) pauseBtn.style.display = 'none';
  if (stopBtn) stopBtn.disabled = true;
  if (progressFill) progressFill.style.width = '0%';
  _previewUpdateCounter();
  _previewUpdateSkipButtons();

  // Restore the Node Description bar to its normal empty state
  if (typeof _clearNodeDesc === 'function') _clearNodeDesc();
}

function _previewFinish() {
  _previewPlaying = false;
  if (_previewTimer) { clearTimeout(_previewTimer); _previewTimer = null; }
  if (_previewProgressRAF) { cancelAnimationFrame(_previewProgressRAF); _previewProgressRAF = null; }
  _previewStopAudio();

  if (typeof clearHighlight === 'function') clearHighlight();

  var playBtn = document.getElementById('preview-play');
  var pauseBtn = document.getElementById('preview-pause');
  var stopBtn = document.getElementById('preview-stop');
  var progressFill = document.getElementById('preview-progress-fill');

  _previewShowNarration('✓ Walkthrough complete', false);

  if (playBtn) { playBtn.style.display = ''; playBtn.disabled = false; playBtn.textContent = '▶'; }
  if (pauseBtn) pauseBtn.style.display = 'none';
  if (stopBtn) stopBtn.disabled = true;
  if (progressFill) progressFill.style.width = '100%';
  _previewUpdateCounter();
  _previewUpdateSkipButtons();
}

/* ── Scene rendering (shared between play and static/skip) ──────── */

function _previewApplySceneHighlights(scene) {
  var focusIds = new Set(scene.focus_node_ids || []);
  var secondaryIds = new Set(scene.secondary_node_ids || []);
  var sceneEdges = scene.edge_ids || [];

  if (typeof clearHighlight === 'function') clearHighlight();

  // Overview panel nodes
  if (window._nodes) {
    window._nodes.selectAll(".node-rect")
      .style("opacity", function(n) { return focusIds.has(n.id) ? 1 : secondaryIds.has(n.id) ? 0.5 : 0.12; })
      .classed("node-focused", function(n) { return focusIds.has(n.id); });
    window._nodes.selectAll(".node-title")
      .style("opacity", function(n) { return focusIds.has(n.id) ? 1 : secondaryIds.has(n.id) ? 0.5 : 0.12; });
    window._nodes.selectAll(".node-kind-inside")
      .style("opacity", function(n) { return focusIds.has(n.id) ? 1 : secondaryIds.has(n.id) ? 0.5 : 0.12; });
  }

  // Overview panel edges
  if (window._links) {
    window._links
      .style("opacity", function(e) {
        var sid = _nid(e.source), tid = _nid(e.target);
        for (var i = 0; i < sceneEdges.length; i++) {
          if (sceneEdges[i].source === sid && sceneEdges[i].target === tid) return 0.95;
        }
        if (focusIds.has(sid) && focusIds.has(tid)) return 0.7;
        return 0.05;
      })
      .classed("edge-highlighted", function(e) {
        var sid = _nid(e.source), tid = _nid(e.target);
        for (var i = 0; i < sceneEdges.length; i++) {
          if (sceneEdges[i].source === sid && sceneEdges[i].target === tid) return true;
        }
        return focusIds.has(sid) && focusIds.has(tid);
      });
  }

  // Detail panel mirroring
  var zoomSvg = d3.select("#zoom-svg");
  if (!zoomSvg.empty()) {
    zoomSvg.selectAll(".node-group").each(function() {
      var el = d3.select(this);
      var nid = el.attr("data-node-id");
      if (!nid) return;
      var isFocus = focusIds.has(nid);
      var isSecondary = secondaryIds.has(nid);
      el.selectAll(".node-rect").style("opacity", isFocus ? 1 : isSecondary ? 0.5 : 0.12).classed("node-focused", isFocus);
      el.selectAll(".node-title").style("opacity", isFocus ? 1 : isSecondary ? 0.5 : 0.12);
      el.selectAll(".node-kind-inside").style("opacity", isFocus ? 1 : isSecondary ? 0.5 : 0.12);
    });
    zoomSvg.selectAll("path[data-edge-src]").each(function() {
      var el = d3.select(this);
      var sid = el.attr("data-edge-src"), tid = el.attr("data-edge-tgt");
      var isConn = false;
      for (var i = 0; i < sceneEdges.length; i++) {
        if (sceneEdges[i].source === sid && sceneEdges[i].target === tid) { isConn = true; break; }
      }
      if (!isConn) isConn = focusIds.has(sid) && focusIds.has(tid);
      el.style("opacity", isConn ? 0.95 : 0.05).classed("edge-highlighted", isConn);
    });
  }

  // Flow dots
  if (typeof _clearFlowDots === 'function') _clearFlowDots();
  if (typeof _addFlowDots === 'function') {
    _addFlowDots(d3.select("#graph-container svg"));
    _addFlowDots(d3.select("#zoom-svg"));
  }

  // Edge labels
  if (window._edgeLabels) {
    window._edgeLabels.classed("visible", function(e) {
      var sid = _nid(e.source), tid = _nid(e.target);
      for (var i = 0; i < sceneEdges.length; i++) {
        if (sceneEdges[i].source === sid && sceneEdges[i].target === tid) return true;
      }
      return false;
    });
  }

  return focusIds;
}

function _previewApplyCamera(camera, focusIds) {
  if (camera === 'zoom_out_all') {
    var container = document.getElementById("graph-container");
    if (container && window._zoomBehavior && window._nodeData) {
      fitGraphToViewport(d3.select("#graph-svg"), window._zoomBehavior,
        window._nodeData, container.clientWidth, container.clientHeight, 20, true);
    }
  } else if (camera === 'zoom_to_focus' || camera === 'pan_to_focus') {
    var focusNodes = (window._nodeData || []).filter(function(n) { return focusIds.has(n.id); });
    if (focusNodes.length > 0) {
      var cx = 0, cy = 0;
      focusNodes.forEach(function(n) { cx += n.x; cy += n.y; });
      cx /= focusNodes.length; cy /= focusNodes.length;
      if (typeof centerDetailOnGraphPoint === 'function') centerDetailOnGraphPoint(cx, cy, true);
      if (window._zoomBehavior) {
        var ovContainer = document.getElementById("graph-container");
        if (ovContainer) {
          var ovSvg = d3.select("#graph-svg");
          var ovW = ovContainer.clientWidth, ovH = ovContainer.clientHeight;
          var fMinX = Infinity, fMinY = Infinity, fMaxX = -Infinity, fMaxY = -Infinity;
          focusNodes.forEach(function(n) {
            var s = NODE_SIZE[n.kind] || { w: 160, h: 60 };
            fMinX = Math.min(fMinX, n.x - s.w); fMinY = Math.min(fMinY, n.y - s.h);
            fMaxX = Math.max(fMaxX, n.x + s.w); fMaxY = Math.max(fMaxY, n.y + s.h);
          });
          var pad = 80;
          var fw = Math.max(1, fMaxX - fMinX + pad * 2);
          var fh = Math.max(1, fMaxY - fMinY + pad * 2);
          var fscale = Math.min(ovW / fw, ovH / fh, 3);
          var fcx = (fMinX + fMaxX) / 2, fcy = (fMinY + fMaxY) / 2;
          var ftx = ovW / 2 - fcx * fscale;
          var fty = ovH / 2 - fcy * fscale;
          var ft = d3.zoomIdentity.translate(ftx, fty).scale(fscale);
          ovSvg.transition().duration(600).call(window._zoomBehavior.transform, ft);
        }
      }
    }
  }
}

/** Show a scene without auto-advance (used when skipping while paused). */
function _previewRenderSceneStatic() {
  var scene = _previewScenes[_previewIndex];
  if (!scene) return;
  _previewShowNarration(scene.narration || '', false);
  var focusIds = _previewApplySceneHighlights(scene);
  _previewApplyCamera(scene.camera || 'hold', focusIds);
}

/* ── TTS audio helper ────────────────────────────────────────────── */

function _previewStopAudio() {
  if (_previewAudioEl) {
    _previewAudioEl.pause();
    _previewAudioEl.onended = null;
    _previewAudioEl.onerror = null;
    if (_previewAudioEl._objectURL) {
      URL.revokeObjectURL(_previewAudioEl._objectURL);
    }
    _previewAudioEl = null;
  }
  _previewAudioLoading = false;
}

/**
 * Fetch TTS audio for the given text and play it.
 * Returns a Promise that resolves when audio finishes playing,
 * or rejects / resolves immediately if muted or on error.
 */
function _previewFetchAndPlayAudio(text) {
  return new Promise(function(resolve) {
    if (_previewAudioMuted || !text) { resolve(); return; }

    _previewAudioLoading = true;
    fetch(API_BASE + '/api/preview/audio', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ text: text }),
    })
    .then(function(resp) {
      _previewAudioLoading = false;
      if (!resp.ok) { resolve(); return; }
      return resp.blob();
    })
    .then(function(blob) {
      if (!blob) { resolve(); return; }
      // Don't play if user muted while we were fetching, or playback was stopped
      if (_previewAudioMuted || !_previewPlaying) { resolve(); return; }

      var url = URL.createObjectURL(blob);
      _previewStopAudio();
      _previewAudioEl = new Audio(url);
      _previewAudioEl._objectURL = url;
      _previewAudioEl.onended = function() {
        URL.revokeObjectURL(url);
        _previewAudioEl = null;
        resolve();
      };
      _previewAudioEl.onerror = function() {
        URL.revokeObjectURL(url);
        _previewAudioEl = null;
        resolve();
      };
      _previewAudioEl.play().catch(function() { resolve(); });
    })
    .catch(function() {
      _previewAudioLoading = false;
      resolve();
    });
  });
}

function _previewPlayScene() {
  if (!_previewPlaying || _previewIndex >= _previewScenes.length) {
    _previewFinish();
    return;
  }

  _previewStopAudio();

  var scene = _previewScenes[_previewIndex];
  var total = _previewScenes.length;

  // 1. Narration in the Node Description bar (instant)
  _previewShowNarration(scene.narration || '');
  _previewUpdateCounter();
  _previewUpdateSkipButtons();

  // 2. Highlights + camera
  var focusIds = _previewApplySceneHighlights(scene);
  _previewApplyCamera(scene.camera || 'hold', focusIds);

  // 3. Progress bar — use fallback duration; audio may override
  var fallbackDuration = (scene.duration_hint || 6) * 1000;
  _previewSceneStart = Date.now();
  _previewAnimateProgress(fallbackDuration, _previewIndex, total);

  // 4. Advance: audio-driven if not muted, timer-driven if muted
  var sceneIndexAtStart = _previewIndex;

  function _advanceToNext() {
    // Guard: only advance if we're still on the same scene
    if (_previewIndex !== sceneIndexAtStart || !_previewPlaying) return;
    if (_previewTimer) { clearTimeout(_previewTimer); _previewTimer = null; }
    _previewIndex++;
    if (_previewIndex < _previewScenes.length) {
      _previewUpdateCounter();
      _previewUpdateSkipButtons();
      _previewPlayScene();
    } else {
      _previewFinish();
    }
  }

  if (!_previewAudioMuted) {
    // Fire-and-forget: start audio, advance when it ends
    _previewFetchAndPlayAudio(scene.narration || '').then(function() {
      _advanceToNext();
    });
    // Safety fallback: if audio takes too long (network issue), advance after 30s
    _previewTimer = setTimeout(function() {
      if (_previewIndex === sceneIndexAtStart && _previewPlaying) {
        _previewStopAudio();
        _advanceToNext();
      }
    }, 30000);
  } else {
    // No audio — use fixed duration
    _previewTimer = setTimeout(function() {
      _advanceToNext();
    }, fallbackDuration);
  }
}

function _previewAnimateProgress(duration, sceneIdx, totalScenes) {
  if (_previewProgressRAF) cancelAnimationFrame(_previewProgressRAF);
  var progressFill = document.getElementById('preview-progress-fill');
  if (!progressFill) return;

  function tick() {
    if (!_previewPlaying) return;
    var elapsed = Date.now() - _previewSceneStart;
    var sceneProgress = Math.min(1, elapsed / duration);
    var overallProgress = ((sceneIdx + sceneProgress) / totalScenes) * 100;
    progressFill.style.width = overallProgress + '%';
    if (sceneProgress < 1) {
      _previewProgressRAF = requestAnimationFrame(tick);
    }
  }
  _previewProgressRAF = requestAnimationFrame(tick);
}

function _previewTypewriter(el, text) {
  if (!el) return;
  el.textContent = '';
  var i = 0;
  var speed = Math.max(15, Math.min(40, 1500 / (text.length || 1)));
  function type() {
    if (!_previewPlaying && i < text.length) { el.textContent = text; return; }
    if (i < text.length) {
      el.textContent += text.charAt(i);
      i++;
      _fitNodeDescFontSize();
      setTimeout(type, speed);
    }
  }
  type();
}

// Override resume on Play button when paused
(function() {
  var _origStart = _previewStart;
  _previewStart = async function(focusNodeId) {
    if (_previewScenes.length > 0 && _previewIndex < _previewScenes.length && !_previewPlaying) {
      _previewResume();
      return;
    }
    return _origStart(focusNodeId);
  };
})();


// ══════════════════════════════════════════════════════════════════
// LLM-BASED CONTENT CLASSIFICATION — replaces regex heuristics
// ══════════════════════════════════════════════════════════════════

var _llmContentClassifications = {};   // node_id → emoji icon
var _llmEnrichPending = false;
var _llmEnrichDone = false;

/**
 * Request LLM enrichment for all nodes in the current graph.
 * Fires once after graph load; results are merged into
 * _llmContentClassifications and used by _contentIcon().
 */
async function _enrichNodeClassifications() {
  if (_llmEnrichPending) return;

  var allNodes = [];
  // Collect from all graph levels
  [rootGraphData, fullGraphData, intermediateGraphData].forEach(function(gd) {
    if (!gd || !gd.nodes) return;
    gd.nodes.forEach(function(n) {
      if (!_llmContentClassifications[n.id]) {
        allNodes.push(n);
      }
    });
  });

  if (allNodes.length === 0) { _llmEnrichDone = true; return; }

  // Deduplicate
  var seen = new Set();
  var uniqueNodes = [];
  allNodes.forEach(function(n) {
    if (!seen.has(n.id)) { seen.add(n.id); uniqueNodes.push(n); }
  });

  // Batch into groups of 60
  var batches = [];
  for (var i = 0; i < uniqueNodes.length; i += 60) {
    batches.push(uniqueNodes.slice(i, i + 60));
  }

  _llmEnrichPending = true;
  _updateAIStatus('Classifying nodes…');

  for (var b = 0; b < batches.length; b++) {
    var batch = batches[b];
    var payload = batch.map(function(n) {
      var entry = { id: n.id, name: n.name, kind: n.kind };
      if (n.file_path) entry.file_path = n.file_path;
      if (n.methods && n.methods.length > 0) entry.methods = n.methods.slice(0, 8);
      if (n.members && n.members.length > 0) entry.members = n.members.slice(0, 8);
      if (n.member_methods && n.member_methods.length > 0) entry.member_methods = n.member_methods.slice(0, 8);
      if (n.docstring) entry.docstring = n.docstring.substring(0, 80);
      if (n.bases && n.bases.length > 0) entry.bases = n.bases.slice(0, 4);
      if (n.line_start) entry.line_start = n.line_start;
      if (n.line_end) entry.line_end = n.line_end;
      return entry;
    });

    try {
      var resp = await fetch(API_BASE + '/api/enrich', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ nodes: payload }),
      });
      if (resp.ok) {
        var data = await resp.json();
        var cls = data.classifications || {};
        for (var nodeId in cls) {
          _llmContentClassifications[nodeId] = cls[nodeId];
        }
      }
    } catch (e) {
      // Silently fall back to regex — enrichment is best-effort
      console.warn('Content enrichment batch failed:', e);
    }
  }

  _llmEnrichPending = false;
  _llmEnrichDone = true;
  _updateAIStatus(null);

  // Re-render the graph to apply new classifications
  if (graphData && typeof renderGraph === 'function') {
    renderGraph();
  }
  // Update legend
  if (graphData && typeof updateLegend === 'function') {
    updateLegend(graphData);
  }
}

/**
 * Ensure the AI Chat panel is open and its tab is active.
 */
function _ensureChatPanelOpen() {
  if (!WindowManager.layout.hasPanelInTree('llm-chat') &&
      !WindowManager.floating.floatingPanels.has('llm-chat')) {

    WindowManager._saveState();

/**
 * Build a concise context string describing a graph node for the LLM.
 */
function _buildNodeContext(d) {
  var parts = [];
  parts.push('Node: ' + d.name);
  parts.push('Kind: ' + d.kind);
  if (d.qualified_name) parts.push('Qualified name: ' + d.qualified_name);
  if (d.file_path) parts.push('File: ' + d.file_path);
  if (d.line_start && d.line_end) parts.push('Lines: ' + d.line_start + '–' + d.line_end);
  if (d.bases && d.bases.length > 0) parts.push('Inherits from: ' + d.bases.join(', '));
  if (d.docstring) parts.push('Docstring: ' + d.docstring);
  if (d.methods && d.methods.length > 0) parts.push('Methods (' + d.methods.length + '): ' + d.methods.slice(0, 15).join(', ') + (d.methods.length > 15 ? '…' : ''));
  if (d.members && d.members.length > 0) parts.push('Grouped classes (' + d.members.length + '): ' + d.members.slice(0, 15).join(', ') + (d.members.length > 15 ? '…' : ''));
  if (d.member_methods && d.member_methods.length > 0) parts.push('Grouped methods (' + d.member_methods.length + '): ' + d.member_methods.slice(0, 15).join(', ') + (d.member_methods.length > 15 ? '…' : ''));

  // Add relationship info from current graph
  if (graphData && graphData.edges) {
    var incoming = graphData.edges.filter(function(e) { return _nid(e.target) === d.id; });
    var outgoing = graphData.edges.filter(function(e) { return _nid(e.source) === d.id; });
    var findName = function(id) { var rid = typeof id === 'object' ? id.id : id; var n = graphData.nodes.find(function(n) { return n.id === rid; }); return n ? n.name : rid; };
    if (outgoing.length > 0) {
      parts.push('Outgoing edges: ' + outgoing.slice(0, 10).map(function(e) { return e.kind + ' → ' + findName(e.target); }).join(', ') + (outgoing.length > 10 ? '…' : ''));
    }
    if (incoming.length > 0) {
      parts.push('Incoming edges: ' + incoming.slice(0, 10).map(function(e) { return findName(e.source) + ' ' + e.kind + ' →'; }).join(', ') + (incoming.length > 10 ? '…' : ''));
    }
  }
  return parts.join('\n');
}

/**
 * Send a message to the AI Chat programmatically (not from the input field).
 * Opens the chat panel, renders the user message, and streams the response.
 */
async function _chatSendProgrammatic(text) {
  _ensureChatPanelOpen();

  // Small delay to let the panel DOM render if it was just opened
  await new Promise(function(r) { setTimeout(r, 80); });

  var panel = document.getElementById('chat-panel');
  if (!panel) return;
  var messagesEl = panel.querySelector('.chat-messages');
  var sendBtn = panel.querySelector('.chat-send-btn');
  var input = panel.querySelector('.chat-input');
  if (!messagesEl) return;

  if (_chatStreaming) return; // don't interrupt an active stream

  // Add user message
  _chatMessages.push({role: 'user', content: text});
  _chatRenderMessage({role: 'user', content: text}, messagesEl);
  if (input) { input.value = ''; input.style.height = 'auto'; }

  _chatStreaming = true;
  if (sendBtn) sendBtn.disabled = true;

  var typingDiv = document.createElement('div');
  typingDiv.className = 'chat-typing';
  typingDiv.textContent = 'Thinking…';
  messagesEl.appendChild(typingDiv);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  var assistantContent = '';
  var assistantDiv = null;

  try {
    var apiBase = window.location.origin;
    var resp = await fetch(apiBase + '/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ messages: _chatMessages, model: _chatModel, mode: _chatMode }),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);

    var reader = resp.body.getReader();
    var decoder = new TextDecoder();
    var buffer = '';

    while (true) {
      var chunk = await reader.read();
      if (chunk.done) break;
      buffer += decoder.decode(chunk.value, {stream: true});
      var lines = buffer.split('\n');
      buffer = lines.pop();

      for (var li = 0; li < lines.length; li++) {
        var line = lines[li].trim();
        if (!line) continue;
        try { var evt = JSON.parse(line); } catch (_) { continue; }

        if (evt.type === 'delta') {
          if (typingDiv.parentNode) typingDiv.remove();
          if (!assistantDiv) {
            assistantDiv = document.createElement('div');
            assistantDiv.className = 'chat-msg assistant';
            messagesEl.appendChild(assistantDiv);
          }
          assistantContent += evt.content;
          assistantDiv.innerHTML = _chatMarkdown(assistantContent);
          messagesEl.scrollTop = messagesEl.scrollHeight;
        } else if (evt.type === 'tool_call') {
          if (typingDiv.parentNode) typingDiv.remove();
          _chatRenderToolCall(evt.name, evt.args, messagesEl);
        } else if (evt.type === 'tool_result') {
          _chatHandleToolAction(evt.content);
          if (assistantDiv && assistantContent) {
            _chatMessages.push({role: 'assistant', content: assistantContent});
            assistantDiv = null;
            assistantContent = '';
          }
        } else if (evt.type === 'file_change') {
          _chatRenderFileChange(evt.change_type, evt.path, messagesEl);
        } else if (evt.type === 'error') {
          if (typingDiv.parentNode) typingDiv.remove();
          _chatRenderMessage({role: 'error', content: evt.content}, messagesEl);
        } else if (evt.type === 'done') {
          if (assistantContent) {
            _chatMessages.push({role: 'assistant', content: assistantContent});
          }
        }
      }
    }
  } catch (err) {
    if (typingDiv.parentNode) typingDiv.remove();
    _chatRenderMessage({role: 'error', content: 'Error: ' + err.message}, messagesEl);
  }

  _chatStreaming = false;
  if (sendBtn) sendBtn.disabled = false;
  if (typingDiv.parentNode) typingDiv.remove();
}

// Holds pending node context for the next query send
var _chatQueryNodeContext = null;

// ================================================================
// TRIE-BASED PREDICTIVE SEARCH
// ================================================================

function TrieNode() {
  this.children = {};
  this.items = [];  // leaf entries at or below this node
}

function Trie() {
  this.root = new TrieNode();
}

Trie.prototype.insert = function(key, item) {
  var node = this.root;
  for (var i = 0; i < key.length; i++) {
    var ch = key[i];
    if (!node.children[ch]) node.children[ch] = new TrieNode();
    node = node.children[ch];
    node.items.push(item);
  }
};

Trie.prototype.search = function(prefix, maxResults) {
  maxResults = maxResults || 20;
  var node = this.root;
  for (var i = 0; i < prefix.length; i++) {
    var ch = prefix[i];
    if (!node.children[ch]) return [];
    node = node.children[ch];
  }
  // Return items at this node (all items whose key starts with prefix)
  // Deduplicate by id
  var seen = {};
  var results = [];
  for (var j = 0; j < node.items.length && results.length < maxResults; j++) {
    var item = node.items[j];
    if (!seen[item.id]) {
      seen[item.id] = true;
      results.push(item);
    }
  }
  return results;
};

var _searchTrie = null;
var _searchActiveIndex = -1;

function buildSearchIndex() {
  _searchTrie = new Trie();
  if (!fullGraphData || !rootGraphData) return;

  // Collect all unique nodes from every data source
  var allNodes = new Map();
  fullGraphData.nodes.forEach(function(n) { allNodes.set(n.id, n); });
  rootGraphData.nodes.forEach(function(n) { allNodes.set(n.id, n); });
  if (intermediateGraphData && intermediateGraphData.nodes) {
    intermediateGraphData.nodes.forEach(function(n) { allNodes.set(n.id, n); });
  }

  allNodes.forEach(function(n) {
    var entry = {
      id: n.id, name: n.name, kind: n.kind,
      qualified_name: n.qualified_name || '',
      file_path: n.file_path || '',
      line_start: n.line_start, line_end: n.line_end,
      methods: n.methods, members: n.members, member_methods: n.member_methods, member_ids: n.member_ids,
      bases: n.bases, docstring: n.docstring,
      // Store references for navigation
      _node: n
    };

    // Index by name (lowercase)
    var nameLower = n.name.toLowerCase();
    _searchTrie.insert(nameLower, entry);

    // Also index by each word segment (e.g. "ArrayBase" → "array", "base")
    var segments = n.name.replace(/([a-z])([A-Z])/g, '$1 $2')
                         .replace(/[_\-./]/g, ' ')
                         .toLowerCase().split(/\s+/);
    for (var s = 0; s < segments.length; s++) {
      if (segments[s] && segments[s] !== nameLower) {
        _searchTrie.insert(segments[s], entry);
      }
    }

    // Index by qualified name segments
    if (n.qualified_name) {
      var qParts = n.qualified_name.replace(/::/g, '.').split('.');
      for (var q = 0; q < qParts.length; q++) {
        var part = qParts[q].toLowerCase();
        if (part && part !== nameLower) {
          _searchTrie.insert(part, entry);
        }
      }
    }
  });
}

function _highlightMatch(text, query) {
  if (!query) return _escHtml(text);
  var idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return _escHtml(text);
  return _escHtml(text.substring(0, idx)) +
    '<mark>' + _escHtml(text.substring(idx, idx + query.length)) + '</mark>' +
    _escHtml(text.substring(idx + query.length));
}

function _renderSearchResults(query) {
  var container = document.getElementById('search-results');
  if (!container) return;

  if (!query || query.length === 0) {
    container.classList.remove('open');
    _searchActiveIndex = -1;
    return;
  }

  if (!_searchTrie) {
    container.innerHTML = '<div class="search-empty">Index not ready</div>';
    container.classList.add('open');
    return;
  }

  var results = _searchTrie.search(query.toLowerCase(), 20);

  if (results.length === 0) {
    container.innerHTML = '<div class="search-empty">No results</div>';
    container.classList.add('open');
    _searchActiveIndex = -1;
    return;
  }

  var html = '';
  for (var i = 0; i < results.length; i++) {
    var r = results[i];
    var icon = _nodeIcon(r.kind);
    var kindMeta = NODE_KIND_META[r.kind];
    var kindLabel = kindMeta ? kindMeta.label : r.kind;
    var filePart = r.file_path ? r.file_path.split('/').pop() : '';
    html += '<div class="search-result" data-index="' + i + '">' +
      '<span class="search-result-icon">' + icon + '</span>' +
      '<span class="search-result-name">' + _highlightMatch(r.name, query) + '</span>' +
      '<span class="search-result-kind">' + kindLabel + '</span>' +
      (filePart ? '<span class="search-result-file">' + _escHtml(filePart) + '</span>' : '') +
      '</div>';
  }
  container.innerHTML = html;
  container.classList.add('open');
  _searchActiveIndex = -1;

  // Store results for keyboard nav
  container._results = results;

  // Click handlers
  container.querySelectorAll('.search-result').forEach(function(el) {
    el.addEventListener('mousedown', function(e) {
      e.preventDefault();
      var idx = parseInt(el.dataset.index, 10);
      _selectSearchResult(container._results[idx]);
    });
  });
}

function _setActiveSearchResult(index) {
  var container = document.getElementById('search-results');
  if (!container) return;
  var items = container.querySelectorAll('.search-result');
  items.forEach(function(el) { el.classList.remove('active'); });
  _searchActiveIndex = index;
  if (index >= 0 && index < items.length) {
    items[index].classList.add('active');
    items[index].scrollIntoView({ block: 'nearest' });
  }
}

/**
 * Find the chain of container (island chain / group) nodes that must be
 * drilled into to reach `targetId`, starting from the root overview graph.
 *
 * Returns an array of node objects: [topLevelContainer, ..., immediateParent]
 * where each entry is a island chain/group node whose member_ids include the
 * next entry (or the target itself for the last element).
 *
 * Returns [] if the target lives directly in the root graph (no drilling needed),
 * or null if the target can't be located at all.
 */
function _findContainerChain(targetId) {
  if (!rootGraphData || !fullGraphData) return null;

  // Quick check: is it already a top-level node?
  if (rootGraphData.nodes.find(function(n) { return n.id === targetId; })) {
    return [];
  }

  // Build a lookup of ALL container nodes (island chain / group) across every level
  var allContainers = [];  // { node, source }
  var _containerKinds = new Set(["island_chain", "group"]);

  rootGraphData.nodes.forEach(function(n) {
    if (_containerKinds.has(n.kind) && n.member_ids && n.member_ids.length > 0) {
      allContainers.push(n);
    }
  });
  if (intermediateGraphData && intermediateGraphData.nodes) {
    intermediateGraphData.nodes.forEach(function(n) {
      if (_containerKinds.has(n.kind) && n.member_ids && n.member_ids.length > 0) {
        // Avoid duplicates
        if (!allContainers.find(function(c) { return c.id === n.id; })) {
          allContainers.push(n);
        }
      }
    });
  }

  // Build a map: childId → parentContainerNode
  var childToParent = new Map();
  allContainers.forEach(function(container) {
    (container.member_ids || []).forEach(function(mid) {
      // If multiple containers claim the same child, prefer the one
      // that is itself contained in another (= deeper in hierarchy)
      if (!childToParent.has(mid)) {
        childToParent.set(mid, container);
      }
    });
  });

  // Walk up from target to root
  var chain = [];
  var current = targetId;
  var visited = new Set();
  var maxDepth = 20;
  while (maxDepth-- > 0) {
    var parent = childToParent.get(current);
    if (!parent) break;
    if (visited.has(parent.id)) break;  // cycle guard
    visited.add(parent.id);
    chain.unshift(parent);  // prepend
    // Is this parent a top-level node in rootGraphData?
    if (rootGraphData.nodes.find(function(n) { return n.id === parent.id; })) {
      return chain;
    }
    current = parent.id;
  }

  // Fallback: target might be a method inside a class
  // Check if targetId is a method and find its parent class
  var targetNode = null;
  if (fullGraphData) {
    targetNode = fullGraphData.nodes.find(function(n) { return n.id === targetId; });
  }
  if (targetNode && targetNode.kind === "method") {
    // Find the parent class via contains edge
    var parentClassId = null;
    fullGraphData.edges.forEach(function(e) {
      if (e.kind === "contains" && _nid(e.target) === targetId) {
        parentClassId = _nid(e.source);
      }
    });
    if (parentClassId) {
      var parentChain = _findContainerChain(parentClassId);
      if (parentChain !== null) {
        var parentClassNode = fullGraphData.nodes.find(function(n) { return n.id === parentClassId; });
        if (parentClassNode) {
          parentChain.push(parentClassNode);
          return parentChain;
        }
      }
    }
  }

  // Could not find a path — return the chain we have (might be partial)
  return chain.length > 0 ? chain : null;
}

/**
 * After a graph re-render, wait for layout to settle then center + highlight
 * the target node.  Polls until the node has x/y coordinates.
 */
function _focusNodeAfterRender(targetId, entry) {
  var attempts = 0;
  var maxAttempts = 60;  // up to 3 seconds
  var poller = setInterval(function() {
    attempts++;
    // Find the node in current graphData with x/y set by the layout engine
    var node = null;
    if (window._nodeData) {
      node = window._nodeData.find(function(n) { return n.id === targetId; });
    }
    if (node && node.x != null && node.y != null) {
      clearInterval(poller);
      centerDetailOnGraphPoint(node.x, node.y, true);
      highlightConnected(node);
      _inspectorPinned = true;
      populatePanel(node);
    } else if (attempts >= maxAttempts) {
      clearInterval(poller);
      // Couldn't find positioned node — at least show info
      _inspectorPinned = true;
      populatePanel(entry);
    }
  }, 50);
}

function _selectSearchResult(entry) {
  if (!entry) return;

  // Close search
  var input = document.getElementById('search-input');
  var container = document.getElementById('search-results');
  if (input) input.value = '';
  if (container) container.classList.remove('open');
  if (input) input.blur();

  var targetId = entry.id;

  // 1. Check if node is in the current graph view and already positioned
  var node = null;
  if (window._nodeData) {
    node = window._nodeData.find(function(n) { return n.id === targetId; });
  }
  if (node && node.x != null && node.y != null) {
    centerDetailOnGraphPoint(node.x, node.y, true);
    highlightConnected(node);
    _inspectorPinned = true;
    populatePanel(node);
    return;
  }

  // 2. Node is not in the current view — find the drill-down path
  var chain = _findContainerChain(targetId);

  if (chain === null || chain.length === 0) {
    // Can't find a path — reset to root overview and try there
    if (currentGraphLabel !== "Overview" && rootGraphData) {
      graphStack = [];
      _setGraphView(rootGraphData, "Overview");
      _focusNodeAfterRender(targetId, entry);
    } else {
      // Last resort: just show info
      _inspectorPinned = true;
      populatePanel(entry);
    }
    return;
  }

  // 3. Reset to root overview first, then drill down the chain
  graphStack = [];
  _setGraphView(rootGraphData, "Overview");

  // Drill down through each container in the chain
  // We need to do this sequentially since each drill changes graphData
  function drillStep(idx) {
    if (idx >= chain.length) {
      // We've drilled to the deepest container — target should now be visible
      _focusNodeAfterRender(targetId, entry);
      return;
    }

    var containerNode = chain[idx];

    // Wait for current graph to finish rendering so nodes have positions
    var attempts = 0;
    var poller = setInterval(function() {
      attempts++;
      // Find the container in the current graphData
      var gNode = null;
      if (window._nodeData) {
        gNode = window._nodeData.find(function(n) { return n.id === containerNode.id; });
      }
      if (!gNode && graphData && graphData.nodes) {
        gNode = graphData.nodes.find(function(n) { return n.id === containerNode.id; });
      }

      if (gNode || attempts >= 40) {
        clearInterval(poller);
        // Drill into this container
        if (gNode) {
          drillIntoNode(gNode);
        } else {
          // Container not found in current view — use the data we have
          drillIntoNode(containerNode);
        }
        // Continue to next level after a brief delay for render
        setTimeout(function() { drillStep(idx + 1); }, 100);
      }
    }, 50);
  }

  // Start drilling from the first container
  drillStep(0);
}

// Wire up search input
(function() {
  var input = document.getElementById('search-input');
  var container = document.getElementById('search-results');
  if (!input || !container) return;

  var debounceTimer = null;

  input.addEventListener('input', function() {
    clearTimeout(debounceTimer);
    var q = input.value.trim();
    debounceTimer = setTimeout(function() { _renderSearchResults(q); }, 60);
  });

  input.addEventListener('keydown', function(e) {
    var items = container.querySelectorAll('.search-result');
    var count = items.length;

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      _setActiveSearchResult(Math.min(_searchActiveIndex + 1, count - 1));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      _setActiveSearchResult(Math.max(_searchActiveIndex - 1, 0));
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (_searchActiveIndex >= 0 && container._results) {
        _selectSearchResult(container._results[_searchActiveIndex]);
      } else if (container._results && container._results.length > 0) {
        _selectSearchResult(container._results[0]);
      }
    } else if (e.key === 'Escape') {
      input.value = '';
      container.classList.remove('open');
      input.blur();
    }
  });

  input.addEventListener('focus', function() {
    var q = input.value.trim();
    if (q.length > 0) _renderSearchResults(q);
  });

  input.addEventListener('blur', function() {
    // Delay to allow click on result
    setTimeout(function() { container.classList.remove('open'); }, 150);
  });

  // Global "/" shortcut to focus search
  document.addEventListener('keydown', function(e) {
    if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey) {
      var tag = (document.activeElement || {}).tagName;
      if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
        e.preventDefault();
        input.focus();
        input.select();
      }
    }
  });
})();

const API_BASE = window.location.origin;

// ── Position cache ─────────────────────────────────────────────────
const _positionCache = new Map();

function _graphCacheKey(nodes) {
  return nodes.map(n => n.id).sort().join("|");
}

// Stable short hash of the graph cache key for the server endpoint
function _graphCacheKeyHash(nodes) {
  const raw = nodes.map(n => n.id).sort().join("|");
  let h = 0;
  for (let i = 0; i < raw.length; i++) {
    h = ((h << 5) - h + raw.charCodeAt(i)) | 0;
  }
  return "gk_" + Math.abs(h).toString(36);
}

// Save node positions to the server disk cache
function _savePositionsToDisk(nodeData) {
  if (!nodeData || nodeData.length === 0) return;
  const key = _graphCacheKeyHash(nodeData);
  const positions = {};
  nodeData.forEach(n => {
    if (n.x != null && n.y != null) {
      positions[n.id] = { x: n.x, y: n.y };
    }
  });
  if (Object.keys(positions).length === 0) return;
  fetch(`${API_BASE}/api/positions`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ graph_key: key, positions: positions }),
  }).catch(function() { /* ignore */ });
}

// Load node positions from the server disk cache. Returns positions map or null.
async function _loadPositionsFromDisk(nodeData) {
  const key = _graphCacheKeyHash(nodeData);
  try {
    const resp = await fetch(`${API_BASE}/api/positions?graph_key=${encodeURIComponent(key)}`);
    if (!resp.ok) return null;
    const data = await resp.json();
    if (!data.positions) return null;
    // Validate: every node in nodeData must have a saved position
    const pos = data.positions;
    for (let i = 0; i < nodeData.length; i++) {
      if (!pos[nodeData[i].id]) return null;
    }
    return pos;
  } catch (e) {
    return null;
  }
}

/**
 * Append language icon circles to a D3 selection of node <g> elements.
 * Each node datum must have a `languages` array (e.g. ["python","javascript"]).
 */
function _appendLangIcons(nodeSelection) {
  nodeSelection.each(function(d) {
    const langs = d.languages;
    if (!langs || langs.length === 0) return;

    const g = d3.select(this);
    const w = (NODE_SIZE[d.kind]?.w || 160);
    const h = (NODE_SIZE[d.kind]?.h || 60);
    const r = _LANG_ICON_R;
    const startX = w / 2 - r - 4;             // right edge inset
    const startY = h / 2 - r - 4;             // bottom edge inset

    langs.forEach(function(lang, i) {
      const def = _LANG_ICON[lang];
      if (!def) return;
      const cx = startX - i * (r * 2 + _LANG_ICON_GAP);
      const cy = startY;

      g.append("circle")
        .attr("class", "lang-icon-bg")
        .attr("cx", cx).attr("cy", cy).attr("r", r)
        .attr("fill", def.bg)
        .attr("stroke", "rgba(0,0,0,.35)")
        .attr("stroke-width", 1)
        .style("pointer-events", "none");

      if (lang === "python") {
        // Use the actual Python logo path
        g.append("path")
          .attr("d", _PY_LOGO_PATH)
          .attr("transform", "translate(" + (cx - r + 1) + "," + (cy - r + 1) + ") scale(" + ((r * 2 - 2) / 24) + ")")

          .attr("x", cx).attr("y", cy)

          .style("pointer-events", "none")

}

  var parts = [d.name || "", d.file_path || "", d.qualified_name || ""];
  if (d.members) parts = parts.concat(d.members);
  if (d.member_methods) parts = parts.concat(d.member_methods);
  if (d.methods) parts = parts.concat(d.methods);
  if (d.docstring) parts.push(d.docstring);
  var haystack = parts.join(" ");
  for (var i = 0; i < _CONTENT_PATTERNS.length; i++) {
    if (_CONTENT_PATTERNS[i].re.test(haystack)) return _CONTENT_PATTERNS[i].icon;
  }
  return ">_"; // generic fallback
}

function updateLegend(gData, legendEl) {
  if (!legendEl) legendEl = document.getElementById("legend");
  if (!legendEl) return;

  // Count nodes per kind
  var kindCounts = {};
  (gData.nodes || []).forEach(function(n) {
    kindCounts[n.kind] = (kindCounts[n.kind] || 0) + 1;
  });

  legendEl.innerHTML = "";

  // ── Node kind toggles ──
  var nodeHeader = document.createElement("h4");
  nodeHeader.textContent = "Nodes";
  legendEl.appendChild(nodeHeader);

  for (const kind of NODE_KIND_ORDER) {
    const m = NODE_KIND_META[kind];
    if (!m) continue;
    var count = kindCounts[kind] || 0;
    var isAbsent = count === 0;
    var item = document.createElement("div");
    item.className = "legend-item"
      + (activeNodeKinds.has(kind) ? "" : " inactive")
      + (isAbsent ? " absent" : "");
    item.dataset.kind = kind;
    item.dataset.type = "node";
    if (m.desc) item.dataset.desc = m.desc;
    item.innerHTML = '<div class="legend-node" style="border-color:' + m.border + '; background:' + m.bg + '"></div> '
      + (m.icon ? m.icon + ' ' : '') + m.label
      + '<span class="legend-count">' + count + '</span>';
    if (!isAbsent) {
      item.addEventListener("click", function() {
        var k = this.dataset.kind;
        if (activeNodeKinds.has(k)) {
          activeNodeKinds.delete(k);
          this.classList.add("inactive");
        } else {
          activeNodeKinds.add(k);
          this.classList.remove("inactive");
        }
        if (graphData) renderGraph();
      });
    }
    _bindLegendTip(item);
    legendEl.appendChild(item);
  }

  // ── Edge kind toggles ──
  var edgeHeader = document.createElement("h4");
  edgeHeader.textContent = "Edges";
  edgeHeader.style.marginTop = "10px";
  legendEl.appendChild(edgeHeader);

  for (const kind of EDGE_KIND_ORDER) {
    const m = EDGE_KIND_META[kind];
    if (!m) continue;
    var item = document.createElement("div");
    item.className = "legend-item" + (activeEdgeKinds.has(kind) ? "" : " inactive");
    item.dataset.kind = kind;
    item.dataset.type = "edge";
    if (m.desc) item.dataset.desc = m.desc;
    item.innerHTML = '<div class="legend-edge ' + m.style + '" style="border-color:' + m.border + '"></div> ' + m.label;
    item.addEventListener("click", function() {
      var k = this.dataset.kind;
      if (activeEdgeKinds.has(k)) {
        activeEdgeKinds.delete(k);
        this.classList.add("inactive");
      } else {
        activeEdgeKinds.add(k);
        this.classList.remove("inactive");
      }
      if (graphData) renderGraph();
    });
    _bindLegendTip(item);
    legendEl.appendChild(item);
  }

  // ── Content icon reference ──
  var contentHeader = document.createElement("h4");
  contentHeader.textContent = "Content";
  contentHeader.style.marginTop = "10px";
  legendEl.appendChild(contentHeader);

  // Count how many nodes map to each content icon
  var contentCounts = {};
  (gData.nodes || []).forEach(function(n) {
    var icon = _contentIcon(n);
    contentCounts[icon] = (contentCounts[icon] || 0) + 1;
  });

  // Sort: present items first, then alphabetically by label within each group
  var sortedContent = _CONTENT_ICON_LEGEND.slice().sort(function(a, b) {
    var aPresent = (contentCounts[a.icon] || 0) > 0 ? 0 : 1;
    var bPresent = (contentCounts[b.icon] || 0) > 0 ? 0 : 1;
    if (aPresent !== bPresent) return aPresent - bPresent;
    return a.label.localeCompare(b.label);
  });

  for (var ci = 0; ci < sortedContent.length; ci++) {
    var entry = sortedContent[ci];
    var cCount = contentCounts[entry.icon] || 0;
    var cItem = document.createElement("div");
    cItem.className = "legend-content-item" + (cCount === 0 ? " absent" : "");
    if (entry.desc) cItem.dataset.desc = entry.desc;
    cItem.innerHTML = '<span class="legend-content-icon">' + entry.icon + '</span>'
      + '<span class="legend-content-label">' + entry.label + '</span>'
      + '<span class="legend-count">' + cCount + '</span>';
    _bindLegendTip(cItem);
    legendEl.appendChild(cItem);
  }
}

var _legendTipTimer = null;

function _showLegendTip(target) {
  var tip = document.getElementById("legend-tooltip");
  if (!tip) return;
  var desc = target.dataset.desc;
  if (!desc) return;
  clearTimeout(_legendTipTimer);
  tip.textContent = desc;
  tip.classList.add("visible");

  // Position: prefer below the item, flip above if near viewport bottom
  var rect = target.getBoundingClientRect();
  tip.style.left = rect.left + "px";
  tip.style.top  = (rect.bottom + 6) + "px";

  requestAnimationFrame(function() {
    var tipRect = tip.getBoundingClientRect();
    if (tipRect.bottom > window.innerHeight - 8) {
      tip.style.top = (rect.top - tipRect.height - 6) + "px";
    }
    if (tipRect.right > window.innerWidth - 8) {
      tip.style.left = Math.max(8, window.innerWidth - tipRect.width - 8) + "px";
    }
  });
}

function _hideLegendTip() {
  _legendTipTimer = setTimeout(function() {
    var tip = document.getElementById("legend-tooltip");
    if (tip) tip.classList.remove("visible");
  }, 80);
}

function _bindLegendTip(el) {
  el.addEventListener("mouseenter", function() { _showLegendTip(this); });
  el.addEventListener("mouseleave", _hideLegendTip);
}

function cleanupDetailView() {

  // Stop all auto-scroll animations
  _autoScrollAnimations.forEach(function(anim, key) { _stopAutoScroll(key); });

  if (_pendingDetailTimeout != null) {
    clearTimeout(_pendingDetailTimeout);
    _pendingDetailTimeout = null;
  }
  _pendingEnsureTimeouts.forEach(function(tid) { clearTimeout(tid); });
  _pendingEnsureTimeouts = [];

  if (_viewportRect) {
    _viewportRect.remove();
    _viewportRect = null;

  if (_overviewSvgRef) {
    _overviewSvgRef.on("click.detailnav", null);
    _overviewSvgRef.on("mousedown.detailnav", null);
    _overviewSvgRef.on("mousemove.detailnav", null);
  }
  d3.select(window).on("mouseup.detailnav", null);

  // Always clean the zoom-svg DOM element, even if _zoomSvg ref is stale/null
  var zoomSvgEl = d3.select("#zoom-svg");
  zoomSvgEl.on(".zoom", null);
  zoomSvgEl.selectAll("*").remove();

  if (_zoomSvg) {
    _zoomSvg.on(".zoom", null);
    _zoomSvg.selectAll("*").remove();
  }
  _zoomDetailTransform = null;
  _zoomDetailBehavior = null;
  _zoomSvg = null;
  _overviewSvgRef = null;
  _detailIsDragging = false;
}

// ── Fetch graph data ──────────────────────────────────────────────
async function loadGraph() {
  try {
    const [overviewResp, fullResp] = await Promise.all([
      fetch(`${API_BASE}/api/graph?abstract=${ABSTRACT_NODES ? "true" : "false"}`),
      fetch(`${API_BASE}/api/graph?abstract=false`)
    ]);
    if (!overviewResp.ok) {
      if (overviewResp.status === 404) {
        var errData = await overviewResp.json().catch(function() { return {}; });
        throw new Error(errData.error || 'No project selected — use the Project dropdown to create one.');
      }
      throw new Error(`HTTP ${overviewResp.status}`);
    }
    if (!fullResp.ok) {
      if (fullResp.status === 404) {
        var errData2 = await fullResp.json().catch(function() { return {}; });
        throw new Error(errData2.error || 'No project selected.');
      }
      throw new Error(`HTTP ${fullResp.status}`);
    }

    rootGraphData = await overviewResp.json();
    fullGraphData = await fullResp.json();

    // Extract intermediate nodes/edges for multi-depth drill-down
    intermediateGraphData = {
      nodes: rootGraphData.intermediate_nodes || [],
      edges: rootGraphData.intermediate_edges || [],
    };

    document.querySelectorAll('[data-loading]').forEach(function(el) { el.style.display = 'none'; });
    updateLegend(rootGraphData);
    buildSearchIndex();
    _setGraphView(rootGraphData, "Overview");

    // Fire LLM content enrichment in the background (non-blocking)
    _llmEnrichDone = false;
    _llmContentClassifications = {};
    _enrichNodeClassifications();

    // Fire hierarchical description generation in the background (non-blocking)
    _hierDescriptions = {};
    _hierDescLoaded = false;
    _hierDescLoading = false;
    if (_hierDescPollTimer) { clearTimeout(_hierDescPollTimer); _hierDescPollTimer = null; }
    _loadHierarchicalDescriptions();
  } catch (err) {
    document.querySelectorAll('[data-loading]').forEach(function(el) { el.textContent = 'Error: ' + err.message; });
  }
}

function _nid(v) { return typeof v === "object" ? v.id : v; }

// ── Node auto-scroll on hover ─────────────────────────────────────
var _autoScrollAnimations = new Map(); // nodeId → { raf, el, ... }
var _mouseX = 0, _mouseY = 0;
document.addEventListener("mousemove", function(e) { _mouseX = e.clientX; _mouseY = e.clientY; }, true);

function _isMouseOverElement(el) {
  // Check the foreignObject or the node-group's first rect
  var rect = el.getBoundingClientRect();
  if (!rect || rect.width === 0) return false;
  return _mouseX >= rect.left && _mouseX <= rect.right && _mouseY >= rect.top && _mouseY <= rect.bottom;
}

function _startAutoScroll(nodeGroup, nodeId) {
  var existing = _autoScrollAnimations.get(nodeId);
  if (existing) {
    // Cancel any pending deferred stop (mouse moved back onto element)
    if (existing.stopTimeout) { clearTimeout(existing.stopTimeout); existing.stopTimeout = null; }
    return; // already running
  }

  var fo = nodeGroup.querySelector && nodeGroup.querySelector(".node-methods-fo");
  if (!fo) return;
  var box = fo.querySelector(".node-methods-box");
  if (!box) return;
  if (box.scrollHeight - box.clientHeight <= 2) return; // nothing to scroll

  var speed = 0.5;
  var direction = 1;     // 1 = down, -1 = up
  var pauseFrames = 0;
  var PAUSE_DURATION = 50;
  var alive = true;

  function tick() {
    if (!alive) return;

    var maxScroll = box.scrollHeight - box.clientHeight;
    if (maxScroll <= 0) {
      _autoScrollAnimations.get(nodeId).raf = requestAnimationFrame(tick);
      return;
    }

    if (pauseFrames > 0) {
      pauseFrames--;
    } else {
      box.scrollTop += speed * direction;
      if (direction === 1 && box.scrollTop >= maxScroll) {
        box.scrollTop = maxScroll;
        direction = -1;
        pauseFrames = PAUSE_DURATION;
      } else if (direction === -1 && box.scrollTop <= 0) {
        box.scrollTop = 0;
        direction = 1;
        pauseFrames = PAUSE_DURATION;
      }
    }
    _autoScrollAnimations.get(nodeId).raf = requestAnimationFrame(tick);
  }

  // Delay start to avoid triggering on quick pass-throughs
  var startTimeout = setTimeout(function() {
    var entry = _autoScrollAnimations.get(nodeId);
    if (!entry || !alive) return;
    entry.raf = requestAnimationFrame(tick);
  }, 350);
  _autoScrollAnimations.set(nodeId, { raf: null, el: box, timeout: startTimeout, stopTimeout: null, kill: function() { alive = false; } });
}

function _stopAutoScroll(nodeId) {
  var anim = _autoScrollAnimations.get(nodeId);
  if (!anim) return;
  if (anim.timeout) clearTimeout(anim.timeout);
  if (anim.stopTimeout) clearTimeout(anim.stopTimeout);
  if (anim.kill) anim.kill();
  if (anim.raf) cancelAnimationFrame(anim.raf);
  if (anim.el) anim.el.scrollTop = 0;
  _autoScrollAnimations.delete(nodeId);
}

function _deferStopAutoScroll(nodeId) {
  var anim = _autoScrollAnimations.get(nodeId);
  if (!anim) return;
  // Short delay so that if the mouse re-enters a child element, _startAutoScroll
  // can cancel this pending stop before it fires.
  if (anim.stopTimeout) clearTimeout(anim.stopTimeout);
  anim.stopTimeout = setTimeout(function() {
    _stopAutoScroll(nodeId);
  }, 150);
}
