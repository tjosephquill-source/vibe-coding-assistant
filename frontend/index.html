<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibe Coding Assistant — Tactical Architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="/static/wm.js"></script>
<style>
  :root {
    --bg: #0a0c08;
    --surface: #12160e;
    --surface-alt: #1a1f14;
    --border: #2a3020;
    --border-hi: #3d4a2e;
    --text: #d4ccb4;
    --text-muted: #6b7258;
    --accent: #e8a824;
    --accent-dim: #c4891a;
    --accent-glow: #e8a82466;
    --green: #6dbd4a;
    --green-dim: #4a8033;
    --red: #d44a32;
    --cyan: #5ab8a8;
    --tan: #b8a878;
    --khaki: #8c8460;
    --olive: #4a5430;
    --scanline: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px);
    --clip: polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
    --clip-sm: polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,6px 100%,0 calc(100% - 6px));
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Rajdhani', 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
  }
  /* Scan-line overlay */
  body::after {
    content:''; position:fixed; top:0; left:0; right:0; bottom:0;
    background: var(--scanline); pointer-events:none; z-index:99999; opacity:0.3;
  }

  /* ── Scrollbar ───────────────────────────────────────────── */
  ::-webkit-scrollbar { width:5px; height:5px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border-hi); }
  ::-webkit-scrollbar-thumb:hover { background: var(--olive); }

  /* ── Window Manager ──────────────────────────────────────── */
  #wm-toolbar {
    position:fixed; top:0; left:0; right:0; height:34px;
    background: linear-gradient(180deg,#1a1f14,#12160e);
    border-bottom:1px solid var(--border-hi);
    display:flex; align-items:center; padding:0 12px; gap:10px;
    z-index:9000; box-shadow:0 2px 12px rgba(0,0,0,.5);
  }
  #wm-toolbar::before { content:'◆'; color:var(--accent); font-size:10px; margin-right:2px; text-shadow:0 0 8px var(--accent-glow); }
  .wm-toolbar-group { position:relative; }
  #wm-view-btn, #wm-reset-btn {
    background:var(--surface-alt); border:1px solid var(--border); color:var(--text-muted);
    cursor:pointer; font-size:11px; padding:3px 10px;
    font-family:'Rajdhani',sans-serif; font-weight:600;
    text-transform:uppercase; letter-spacing:1px;
    clip-path:var(--clip-sm); transition:all .15s;
  }
  #wm-view-btn:hover, #wm-reset-btn:hover {
    background:var(--olive); color:var(--accent); border-color:var(--accent-dim);
    text-shadow:0 0 6px var(--accent-glow);
  }
  #wm-view-menu {
    display:none; position:absolute; top:100%; left:0; min-width:220px;
    background:var(--surface); border:1px solid var(--border-hi);
    padding:4px 0; z-index:9999;
    box-shadow:0 8px 28px rgba(0,0,0,.6); margin-top:4px;
    clip-path:var(--clip);
  }
  #wm-view-menu.open { display:block; }
  .wm-view-item {
    display:flex; align-items:center; gap:8px;
    padding:6px 14px; cursor:pointer; font-size:12px; color:var(--text-muted);
    font-weight:500; text-transform:uppercase; letter-spacing:.5px; transition:all .1s;
  }
  .wm-view-item:hover { background:var(--olive); color:var(--text); }
  .wm-view-item.active { color:var(--green); }
  .wm-view-check { width:16px; text-align:center; color:var(--green); font-weight:bold; }

  /* ── Search bar ──────────────────────────────────────────── */
  .search-container {
    position:relative; flex:1; max-width:360px; margin:0 8px;
  }
  .search-input-wrap {
    display:flex; align-items:center; gap:5px;
    background:var(--surface); border:1px solid var(--border);
    padding:2px 8px; clip-path:var(--clip-sm); transition:border-color .15s;
  }
  .search-input-wrap:focus-within {
    border-color:var(--accent-dim); box-shadow:0 0 8px var(--accent-glow);
  }
  .search-icon { color:var(--text-muted); font-size:11px; flex-shrink:0; }
  #search-input {
    background:none; border:none; outline:none;
    color:var(--text); font-family:'Share Tech Mono',monospace;
    font-size:11px; width:100%; padding:2px 0;
  }
  #search-input::placeholder { color:var(--text-muted); opacity:.6; }
  .search-kbd {
    font-size:9px; color:var(--text-muted); border:1px solid var(--border);
    padding:0 4px; border-radius:2px; flex-shrink:0; line-height:1.6;
    font-family:'Share Tech Mono',monospace;
  }
  #search-results {
    display:none; position:absolute; top:100%; left:0; right:0;
    margin-top:4px; max-height:340px; overflow-y:auto;
    background:var(--surface); border:1px solid var(--border-hi);
    box-shadow:0 8px 28px rgba(0,0,0,.65); z-index:9999;
    clip-path:var(--clip);
  }
  #search-results.open { display:block; }
  .search-result {
    display:flex; align-items:center; gap:8px;
    padding:6px 12px; cursor:pointer; font-size:12px;
    color:var(--text); transition:background .1s;
  }
  .search-result:hover, .search-result.active {
    background:var(--olive); color:var(--accent);
  }
  .search-result-icon { flex-shrink:0; font-size:10px; }
  .search-result-name {
    font-family:'Share Tech Mono',monospace; font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;
  }
  .search-result-name mark {
    background:none; color:var(--accent); font-weight:700;
  }
  .search-result-kind {
    font-size:9px; text-transform:uppercase; letter-spacing:1px;
    color:var(--text-muted); flex-shrink:0;
    padding:1px 5px; border:1px solid var(--border); border-radius:2px;
  }
  .search-result-file {
    font-size:9px; color:var(--text-muted); flex-shrink:0;
    max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .search-empty {
    padding:16px; text-align:center; color:var(--text-muted);
    font-size:11px; text-transform:uppercase; letter-spacing:1px;
  }

  #wm-root { position:fixed; top:34px; left:0; right:0; bottom:0; overflow:hidden; }

  .wm-split { display:flex; width:100%; height:100%; min-width:0; min-height:0; }
  .wm-split-horizontal { flex-direction:row; }
  .wm-split-vertical   { flex-direction:column; }
  .wm-split-pane { overflow:hidden; position:relative; min-width:0; min-height:0; }
  .wm-split-second { flex:1 1 auto; }

  .wm-splitter { flex-shrink:0; background:var(--border); transition:background .15s; z-index:10; }
  .wm-splitter-horizontal { width:3px; cursor:col-resize; }
  .wm-splitter-vertical   { height:3px; cursor:row-resize; }
  .wm-splitter:hover, body.wm-resizing .wm-splitter {
    background:var(--accent); box-shadow:0 0 8px var(--accent-glow);
  }

  .wm-panel {
    width:100%; height:100%; display:flex; flex-direction:column;
    min-width:0; min-height:0; background:var(--bg); border:1px solid var(--border);
  }
  .wm-panel-titlebar {
    display:flex; align-items:center; justify-content:space-between;
    padding:0 10px; height:28px; min-height:28px;
    background:linear-gradient(180deg,var(--surface-alt),var(--surface));
    border-bottom:1px solid var(--border-hi);
    font-size:11px; color:var(--text-muted); cursor:grab; user-select:none;
  }
  .wm-panel-titlebar::before { content:'▎'; color:var(--accent); margin-right:4px; font-size:14px; line-height:1; }
  .wm-panel-titlebar:active { cursor:grabbing; }
  .wm-panel-titlebar-left { display:flex; align-items:center; gap:5px; overflow:hidden; }
  .wm-panel-icon { font-size:11px; }
  .wm-panel-title {
    font-size:11px; text-transform:uppercase; letter-spacing:1.5px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    font-weight:600; color:var(--tan);
  }
  .wm-panel-actions { display:flex; gap:2px; flex-shrink:0; }
  .wm-panel-actions button {
    background:none; border:1px solid transparent; color:var(--text-muted); cursor:pointer;
    font-size:11px; padding:2px 5px; line-height:1; transition:all .15s;
  }
  .wm-panel-actions button:hover { background:var(--olive); color:var(--accent); border-color:var(--border-hi); }
  .wm-panel-content { flex:1 1 auto; overflow:hidden; position:relative; min-width:0; min-height:0; }

  .wm-tab-container { width:100%; height:100%; display:flex; flex-direction:column; min-width:0; min-height:0; }
  .wm-tab-bar {
    display:flex; background:var(--surface); border-bottom:1px solid var(--border-hi);
    overflow-x:auto; flex-shrink:0; min-height:28px;
  }
  .wm-tab {
    padding:5px 14px; font-size:11px; color:var(--text-muted); cursor:pointer;
    border-bottom:2px solid transparent; white-space:nowrap;
    display:flex; align-items:center; gap:6px;
    font-weight:600; text-transform:uppercase; letter-spacing:1px; transition:all .15s;
  }
  .wm-tab.active { color:var(--accent); border-bottom-color:var(--accent); text-shadow:0 0 6px var(--accent-glow); }
  .wm-tab:hover { color:var(--text); background:var(--surface-alt); }
  .wm-tab-close { font-size:10px; opacity:.4; cursor:pointer; margin-left:2px; }
  .wm-tab-close:hover { opacity:1; color:var(--red); }
  .wm-tab-content-area { flex:1 1 auto; overflow:hidden; position:relative; min-width:0; min-height:0; }

  .wm-floating-panel {
    position:fixed; z-index:8000; width:500px; height:400px;
    background:var(--surface); border:1px solid var(--accent-dim);
    box-shadow:0 0 20px rgba(232,168,36,.15),0 8px 32px rgba(0,0,0,.6);
    display:flex; flex-direction:column; overflow:hidden;
    resize:both; min-width:200px; min-height:120px;
    clip-path:var(--clip);
  }
  .wm-floating-titlebar { }
  .wm-floating-content { overflow:auto; }

  .wm-dock-ghost {
    position:fixed; z-index:10000; padding:6px 16px;
    background:var(--surface); border:1px solid var(--accent);
    font-size:12px; color:var(--accent);
    box-shadow:0 0 16px var(--accent-glow); pointer-events:none;
    white-space:nowrap; font-weight:600; text-transform:uppercase;
    letter-spacing:1px; clip-path:var(--clip-sm);
  }
  body.wm-resizing *, body.wm-resizing-horizontal *, body.wm-resizing-vertical *, body.wm-docking * { cursor:inherit !important; }
  body.wm-resizing-horizontal { cursor:col-resize !important; }
  body.wm-resizing-vertical   { cursor:row-resize !important; }
  body.wm-docking { cursor:grabbing; }

  /* ── Breadcrumb navigation ────────────────────────────────── */
  #graph-breadcrumb {
    position:absolute; top:8px; left:10px; z-index:10;
    display:flex; align-items:center; gap:0;
    font-size:11px; font-family:'Rajdhani',sans-serif; font-weight:600;
    text-transform:uppercase; letter-spacing:.8px;
    pointer-events:auto;
    background:rgba(18,22,14,.85);
    border:1px solid var(--border);
    clip-path:var(--clip-sm);
  }
  #graph-breadcrumb:empty { display:none; }
  .breadcrumb-sep {
    color:var(--border-hi); font-size:10px; padding:0 2px;
    pointer-events:none; user-select:none;
  }
  .breadcrumb-item {
    color:var(--text-muted); cursor:pointer; padding:3px 8px;
    white-space:nowrap;
    transition:color .15s;
  }
  .breadcrumb-item:hover:not(.active) { color:var(--accent); text-shadow:0 0 6px var(--accent-glow); }
  .breadcrumb-item.active { color:var(--tan); cursor:default; }

  /* ── Node description panel ──────────────────────────────── */
  #node-desc-container {
    position:relative; width:100%; height:100%; overflow:hidden;
    background:radial-gradient(ellipse at center,#10140c,#080a06);
  }
  #node-desc-bar {
    width:100%; height:100%; box-sizing:border-box;
    padding:5% 6%;
    background:none; border:none;
    font-family:'Rajdhani',sans-serif;
    color:var(--text-muted); line-height:1.45;
    display:flex; flex-direction:column; align-items:flex-start; justify-content:center;
    text-align:left; gap:0.4em;
    transition:opacity .2s;
  }
  #node-desc-bar .desc-header {
    display:flex; align-items:center; gap:0.4em;
  }
  #node-desc-bar .desc-node-name {
    color:var(--tan); font-weight:700;
    text-transform:uppercase; letter-spacing:.5px;
    font-size:1.3em;
  }
  #node-desc-bar .desc-kind {
    font-weight:600; text-transform:uppercase; letter-spacing:1px;
    padding:0.1em 0.4em; border-radius:3px;
    color:var(--text-muted); border:1px solid var(--border-hi);
    background:rgba(18,22,14,.7);
    font-size:0.45em;
  }
  #node-desc-bar .desc-text {
    color:#b8a878;
    white-space:normal; word-wrap:break-word;
    font-size:1em;
  }
  #node-desc-bar .desc-loading {
    color:var(--text-muted); font-style:italic;
  }
  #node-desc-bar.empty .desc-placeholder {
    display:block;
  }
  #node-desc-bar .desc-placeholder {
    display:none; color:var(--text-muted); font-style:italic;
    opacity:.6;
  }
  #node-desc-bar.empty .desc-header,
  #node-desc-bar.empty .desc-text { display:none; }

  /* ── Panels ──────────────────────────────────────────────── */
  #graph-container {
    position:relative; width:100%; height:100%; overflow:hidden;
    background:radial-gradient(ellipse at center,#10140c,#080a06);
  }
  #graph-container .panel-label,
  #zoom-container .panel-label {
    position:absolute; top:8px; right:12px;
    font-size:10px; text-transform:uppercase; letter-spacing:1.5px;
    color:var(--text-muted); background:rgba(18,22,14,.85);
    padding:3px 10px; border:1px solid var(--border);
    z-index:10; pointer-events:none; font-weight:600;
    clip-path:var(--clip-sm);
  }
  #zoom-container {
    position:relative; width:100%; height:100%; overflow:hidden;
    background:radial-gradient(ellipse at center,#10140c,#080a06);
  }

  svg { width:100%; height:100%; }

  .viewport-rect {
    fill:rgba(232,168,36,.06); stroke:var(--accent);
    stroke-width:2; stroke-dasharray:8,4; pointer-events:none;
  }

  /* ── Edges ───────────────────────────────────────────────── */
  .edge { fill:none, stroke-width:1.5, opacity:.6, }
  .edge.inherits     { stroke:#d44a32; }
  .edge.imports      { stroke:#5a6348; stroke-dasharray:8,4; }
  .edge.contains     { stroke:#3d4a2e; stroke-dasharray:3,3; }
  .edge.calls        { stroke:#e8a824; }
  .edge.instantiates { stroke:#b8a878; stroke-dasharray:6,3; }
  .edge.uses_type    { stroke:#6dbd4a; stroke-dasharray:4,2; }
  .edge-label {
    font-size:10px; font-family:'Rajdhani',sans-serif; font-weight:600;
    fill:var(--text); opacity:0; pointer-events:none;
    text-transform:uppercase; letter-spacing:.5px;
    paint-order:stroke; stroke:var(--bg); stroke-width:3px; stroke-linejoin:round;
  }
  .edge-label.visible { opacity:1; }


  /* ── Nodes ───────────────────────────────────────────────── */
  .node-group { cursor:pointer; }
  .node-group:hover .node-rect { filter:brightness(1.3) drop-shadow(0 0 6px rgba(232,168,36,.3)); }

  .node-rect { stroke-width:1.5; rx:2px; ry:2px; }
  .node-rect.class  { fill:#1a2610; stroke:#6dbd4a; }
  .node-rect.method { fill:#1a1408; stroke:#e8a824; }
  .node-rect.metaclass { fill:#201a08; stroke:#b8a878; }
  .node-rect.test_group { fill:#0e1a0a; stroke:#4a8033; }
  .node-rect.semantic_group { fill:#14180e; stroke:#5a6348; }

  .node-title {
    font-size:15px; fill:#d4ccb4; font-weight:700;
    font-family:'Rajdhani',sans-serif; pointer-events:none;
  }
  .node-kind-inside {
    font-size:11px; fill:#8c8460; opacity:.95;
    text-transform:uppercase; letter-spacing:1px;
    font-family:'Rajdhani',sans-serif; font-weight:600; pointer-events:none;
  }

  /* ── Language icons ─────────────────────────────────────── */
  .lang-icon-label {
    font-size:8px; font-weight:700; pointer-events:none;
    font-family:'Rajdhani',sans-serif; text-anchor:middle;
    dominant-baseline:central;
  }
  .node-methods-fo { pointer-events:auto; }
  .node-methods-box {
    color:#b8a878; font-size:11px;
    font-family:'Share Tech Mono','SF Mono',monospace;
    line-height:1.5; width:100%; height:100%; padding:0 8px 8px;
    overflow-y:auto;
    scrollbar-width:none;          /* Firefox */
  }
  .node-methods-box::-webkit-scrollbar { display:none; }  /* Chrome/Safari */
  .node-methods-label {
    color:#8c8460; font-family:'Rajdhani',sans-serif;
    font-size:10px; font-weight:600; text-transform:uppercase;
    letter-spacing:1px; margin-bottom:4px; padding-top:4px;
    border-top:1px solid rgba(180,160,120,.2);
  }
  .node-methods-scroll { padding-right:4px; }
  .node-methods-scroll div { white-space:nowrap; }

  /* ── Detail / Inspector panel ────────────────────────────── */
  #detail-panel { background:var(--surface); padding:20px; overflow-y:auto; width:100%; height:100%; }
  #detail-panel h2 {
    font-size:18px; color:var(--accent); margin-bottom:4px;
    font-weight:700; letter-spacing:1px; text-transform:uppercase;
    text-shadow:0 0 10px var(--accent-glow);
  }
  #detail-panel .kind-tag {
    display:inline-block; font-size:10px; text-transform:uppercase;
    letter-spacing:1.5px; padding:2px 10px; margin-bottom:12px;
    font-weight:600; border:1px solid; clip-path:var(--clip-sm);
  }
  .kind-tag.class    { background:#6dbd4a1a; color:#6dbd4a; border-color:#6dbd4a44; }
  .kind-tag.method   { background:#e8a8241a; color:#e8a824; border-color:#e8a82444; }
  .kind-tag.metaclass { background:#b8a8781a; color:#b8a878; border-color:#b8a87844; }
  .kind-tag.test_group    { background:#4a80331a; color:#4a8033; border-color:#4a803344; }
  .kind-tag.model_group   { background:#5ab8a81a; color:#5ab8a8; border-color:#5ab8a844; }
  .kind-tag.config_group  { background:#b8a8781a; color:#b8a878; border-color:#b8a87844; }
  .kind-tag.handler_group { background:#d44a321a; color:#d44a32; border-color:#d44a3244; }
  .kind-tag.utility_group { background:#6dbd4a1a; color:#6dbd4a; border-color:#6dbd4a44; }

  #detail-panel .detail-section { margin-top:14px; padding-top:14px; border-top:1px solid var(--border); }
  #detail-panel .detail-section h3 {
    font-size:11px; text-transform:uppercase; letter-spacing:1.5px;
    color:var(--khaki); margin-bottom:6px; font-weight:600;
  }
  #detail-panel .detail-row {
    font-size:12px; color:var(--text); margin-bottom:4px;
    word-break:break-all; font-family:'Share Tech Mono',monospace;
  }
  #detail-panel .detail-row span { color:var(--text-muted); }
  #detail-panel .methods-list { list-style:none; padding:0; }
  #detail-panel .methods-list li {
    font-size:12px; color:var(--text); padding:2px 0;
    font-family:'Share Tech Mono',monospace;
  }
  #detail-panel .methods-list li::before { content:"› "; color:var(--accent); font-weight:bold; }
  .var-type { color:#6dbd4a; opacity:0.7; font-style:italic; }
  .node-vars-label {
    color:#8c8460; font-family:'Rajdhani',sans-serif;
    font-size:10px; font-weight:600; text-transform:uppercase;
    letter-spacing:1px; margin-bottom:2px; margin-top:4px;
    padding-top:4px;
    border-top:1px solid rgba(180,160,120,.2);
  }
  .node-vars-scroll { padding-right:4px; }
  .node-vars-scroll div { white-space:nowrap; }
  .node-vars-scroll .nv-type { color:#6dbd4a; opacity:0.65; }
  #detail-panel .docstring {
    font-size:12px; color:var(--text-muted); font-style:italic;
    white-space:pre-wrap; font-family:'Share Tech Mono',monospace;
  }
  #detail-placeholder {
    color:var(--text-muted); font-size:14px; margin-top:40px;
    text-align:center; line-height:1.6;
    text-transform:uppercase; letter-spacing:2px; font-weight:600;
  }
  .rel-list { list-style:none; padding:0; }
  .rel-list li {
    font-size:12px; padding:3px 0; display:flex; align-items:center; gap:6px;
    font-family:'Share Tech Mono',monospace;
  }
  .rel-dot { width:8px; height:8px; flex-shrink:0; }

  /* ── Legend ───────────────────────────────────────────────── */
  #legend { background:var(--surface); padding:12px 16px; font-size:11px; overflow-y:auto; width:100%; height:100%; }
  #legend h4 {
    font-size:10px; text-transform:uppercase; letter-spacing:2px;
    color:var(--khaki); margin-bottom:8px; font-weight:700;
  }
  .legend-item {
    display:flex; align-items:center; gap:8px; margin-bottom:4px;
    font-weight:500; letter-spacing:.5px; color:var(--tan);
  }
  .legend-node { width:10px; height:10px; border:2px solid; }
  .legend-edge { width:24px; height:0; border-top:2px solid; }
  .legend-edge.dashed { border-top-style:dashed; }
  .legend-edge.dotted { border-top-style:dotted; }

  /* ── Directory tree ──────────────────────────────────────── */
  #dir-tree {
    background:var(--surface); padding:8px 0; font-size:12px;
    overflow-y:auto; overflow-x:hidden; width:100%; height:100%;
    font-family:'Share Tech Mono','SF Mono',monospace;
  }
  .dir-entry {
    display:flex; align-items:center; gap:4px;
    padding:2px 8px 2px 0; cursor:default; white-space:nowrap;
    color:var(--text); transition:background .1s;
  }
  .dir-entry:hover { background:var(--surface-alt); }
  .dir-entry.selected { background:var(--olive); color:var(--accent); }
  .dir-toggle {
    width:16px; text-align:center; flex-shrink:0;
    font-size:10px; color:var(--text-muted); cursor:pointer;
    user-select:none; transition:transform .15s;
  }
  .dir-toggle.open { transform:rotate(90deg); }
  .dir-toggle.leaf { visibility:hidden; }
  .dir-icon { flex-shrink:0; font-size:11px; }
  .dir-name { overflow:hidden; text-overflow:ellipsis; }
  .dir-children { display:none; }
  .dir-children.open { display:block; }

  /* ── Code editor panel ─────────────────────────────────── */
  #code-editor {
    background:var(--bg); width:100%; height:100%;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .code-editor-toolbar {
    display:flex; align-items:center; gap:8px;
    padding:4px 10px; min-height:26px;
    background:var(--surface); border-bottom:1px solid var(--border);
    font-size:11px; color:var(--text-muted); flex-shrink:0;
    overflow:hidden;
  }
  .code-editor-filepath {
    font-family:'Share Tech Mono',monospace; font-size:11px;
    color:var(--tan); white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; flex:1;
  }
  .code-editor-line-info {
    font-family:'Share Tech Mono',monospace; font-size:10px;
    color:var(--text-muted); white-space:nowrap; flex-shrink:0;
  }
  .code-editor-scroll {
    flex:1; overflow:auto; position:relative;
  }
  .code-editor-table {
    width:100%; border-collapse:collapse;
    font-family:'Share Tech Mono','SF Mono','Fira Code',monospace;
    font-size:12px; line-height:1.55;
  }
  .code-editor-table td {
    padding:0; vertical-align:top; white-space:pre;
  }
  .code-line-no {
    width:1px; white-space:nowrap; padding:0 10px 0 8px;
    text-align:right; color:var(--text-muted); opacity:.5;
    user-select:none; border-right:1px solid var(--border);
    background:var(--surface);
  }
  .code-line-text {
    padding:0 12px; color:var(--text);
  }
  .code-line-highlight td {
    background:rgba(232,168,36,.10);
  }
  .code-line-highlight .code-line-no {
    color:var(--accent); opacity:1;
    background:rgba(232,168,36,.12);
  }
  .code-editor-placeholder {
    color:var(--text-muted); font-size:13px;
    text-align:center; padding:40px 20px;
    text-transform:uppercase; letter-spacing:2px;
    font-weight:600; line-height:1.8;
  }

  /* ── Node context menu ──────────────────────────────────── */
  #node-ctx-menu {
    display:none; position:fixed; z-index:12000;
    min-width:180px; padding:4px 0;
    background:var(--surface); border:1px solid var(--border-hi);
    box-shadow:0 8px 28px rgba(0,0,0,.65), 0 0 12px rgba(232,168,36,.08);
    clip-path:var(--clip); font-family:'Rajdhani',sans-serif;
  }
  #node-ctx-menu.open { display:block; }
  .ctx-item {
    display:flex; align-items:center; gap:8px;
    padding:7px 16px; cursor:pointer; font-size:12px;
    color:var(--text); font-weight:600; text-transform:uppercase;
    letter-spacing:.8px; transition:background .1s, color .1s;
  }
  .ctx-item:hover { background:var(--olive); color:var(--accent); }
  .ctx-item.disabled {
    color:var(--text-muted); opacity:.45; pointer-events:none;
  }
  .ctx-icon { width:18px; text-align:center; font-size:13px; flex-shrink:0; }
  .ctx-sep {
    height:1px; margin:4px 12px;
    background:var(--border);
  }

  /* ── Loading overlays ────────────────────────────────────── */
  .panel-loading {
    position:absolute; top:0; left:0; right:0; bottom:0;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; color:var(--accent); z-index:20;
    pointer-events:none; letter-spacing:3px;
    text-transform:uppercase; font-weight:600;
    text-shadow:0 0 16px var(--accent-glow);
    animation:loadPulse 2s ease-in-out infinite;
  }
  @keyframes loadPulse { 0%,100%{opacity:.6} 50%{opacity:1} }

  /* Overview cursor */
  #graph-container svg { cursor:crosshair; }

  /* ── Insights panel ──────────────────────────────────────── */
  #insights-panel {
    background:var(--surface); padding:0; font-size:12px;
    overflow-y:auto; width:100%; height:100%;
  }
  .insights-header {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:2;
    background:var(--surface);
  }
  .insights-header h4 {
    font-size:10px; text-transform:uppercase; letter-spacing:2px;
    color:var(--khaki); margin:0; font-weight:700;
  }
  .insights-badge {
    display:inline-flex; align-items:center; justify-content:center;
    min-width:20px; height:18px; padding:0 5px;
    font-size:10px; font-weight:700; border-radius:9px;
    letter-spacing:0;
  }
  .insights-badge.error { background:#d44a3233; color:#d44a32; border:1px solid #d44a3244; }
  .insights-badge.warning { background:#e8a82433; color:#e8a824; border:1px solid #e8a82444; }
  .insights-badge.info { background:#5ab8a833; color:#5ab8a8; border:1px solid #5ab8a844; }
  .insights-badge.mixed { background:#b8a87833; color:#b8a878; border:1px solid #b8a87844; }
  .insights-summary {
    display:flex; gap:6px; padding:6px 14px;
    border-bottom:1px solid var(--border);
    font-size:10px;
  }
  .insights-summary-item {
    display:flex; align-items:center; gap:3px;
    color:var(--text-muted); font-weight:600;
    text-transform:uppercase; letter-spacing:.5px;
  }
  .insights-summary-dot {
    width:8px; height:8px; border-radius:50%;
  }
  .insights-list { padding:4px 0; }
  .insight-item {
    display:flex; align-items:flex-start; gap:10px;
    padding:8px 14px; cursor:pointer; transition:background .1s;
    border-bottom:1px solid rgba(42,48,32,.4);
  }
  .insight-item:hover { background:var(--surface-alt); }
  .insight-item.active { background:var(--olive); }
  .insight-severity-icon {
    width:20px; height:20px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; margin-top:1px;
  }
  .insight-body { flex:1; min-width:0; }
  .insight-title {
    font-size:12px; font-weight:700; color:var(--text);
    letter-spacing:.3px; margin-bottom:2px;
    word-break:break-word;
  }
  .insight-title.error { color:#d44a32; }
  .insight-title.warning { color:#e8a824; }
  .insight-title.info { color:#5ab8a8; }
  .insight-desc {
    font-size:11px; color:var(--text-muted);
    font-family:'Share Tech Mono',monospace;
    line-height:1.4; word-break:break-word;
  }
  .insight-rule {
    font-size:9px; color:var(--text-muted); opacity:.7;
    text-transform:uppercase; letter-spacing:1px;
    margin-top:3px;
  }
  .insights-empty {
    padding:30px 20px; text-align:center; color:var(--green);
    font-size:13px; text-transform:uppercase; letter-spacing:2px;
    font-weight:600; line-height:1.8;
  }
  .insights-empty::before {
    content:'✓'; display:block; font-size:24px; margin-bottom:8px;
    color:var(--green); text-shadow:0 0 12px rgba(109,189,74,.4);
  }
  .insights-loading {
    padding:30px 20px; text-align:center; color:var(--accent);
    font-size:12px; text-transform:uppercase; letter-spacing:2px;
    font-weight:600; animation:loadPulse 2s ease-in-out infinite;
  }
  .insights-error {
    padding:20px; text-align:center; color:var(--red); font-size:12px;
  }

  /* ── Chat panel ───────────────────────────────────────────── */
  #chat-panel {
    background:var(--bg); width:100%; height:100%;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .chat-toolbar {
    display:flex; align-items:center; gap:6px;
    padding:4px 10px; min-height:28px;
    background:var(--surface); border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .chat-model-select {
    background:var(--surface-alt); border:1px solid var(--border);
    color:var(--text); font-family:'Share Tech Mono',monospace;
    font-size:10px; padding:2px 6px; cursor:pointer;
    clip-path:var(--clip-sm);
  }
  .chat-model-select:focus { border-color:var(--accent-dim); outline:none; }
  .chat-clear-btn {
    background:var(--surface-alt); border:1px solid var(--border);
    color:var(--text-muted); font-size:10px; padding:2px 8px;
    cursor:pointer; font-family:'Rajdhani',sans-serif; font-weight:600;
    text-transform:uppercase; letter-spacing:.5px;
    clip-path:var(--clip-sm); transition:all .15s; margin-left:auto;
  }
  .chat-clear-btn:hover { background:var(--olive); color:var(--accent); border-color:var(--accent-dim); }
  .chat-api-status {
    font-size:9px; color:var(--text-muted); letter-spacing:.5px;
    text-transform:uppercase;
  }
  .chat-api-status.ok { color:var(--green); }
  .chat-api-status.missing { color:var(--red); }
  .chat-messages {
    flex:1; overflow-y:auto; padding:10px;
    display:flex; flex-direction:column; gap:8px;
  }
  .chat-msg {
    max-width:92%; padding:8px 12px; border-radius:2px;
    font-size:12px; line-height:1.5; word-break:break-word;
    clip-path:var(--clip-sm);
  }
  .chat-msg.user {
    align-self:flex-end;
    background:var(--olive); color:var(--text);
    border:1px solid var(--border-hi);
  }
  .chat-msg.assistant {
    align-self:flex-start;
    background:var(--surface-alt); color:var(--text);
    border:1px solid var(--border);
  }
  .chat-msg.assistant p { margin:0 0 6px 0; }
  .chat-msg.assistant p:last-child { margin-bottom:0; }
  .chat-msg.assistant code {
    background:var(--bg); padding:1px 4px; border-radius:2px;
    font-family:'Share Tech Mono',monospace; font-size:11px;
    color:var(--accent);
  }
  .chat-msg.assistant pre {
    background:var(--bg); padding:8px 10px; margin:6px 0;
    border:1px solid var(--border); border-radius:2px;
    overflow-x:auto; font-family:'Share Tech Mono',monospace;
    font-size:11px; line-height:1.4; color:var(--text);
  }
  .chat-msg.assistant pre code {
    background:none; padding:0; color:var(--text);
  }
  .chat-msg.assistant h1,.chat-msg.assistant h2,.chat-msg.assistant h3,
  .chat-msg.assistant h4,.chat-msg.assistant h5 {
    font-size:12px; font-weight:700; color:var(--accent);
    text-transform:uppercase; letter-spacing:1px;
    margin:8px 0 4px 0;
  }
  .chat-msg.assistant ul,.chat-msg.assistant ol {
    padding-left:18px; margin:4px 0;
  }
  .chat-msg.assistant li { margin:2px 0; }
  .chat-msg.assistant a {
    color:var(--cyan); text-decoration:underline;
    cursor:pointer;
  }
  .chat-msg.system {
    align-self:center; text-align:center;
    color:var(--text-muted); font-size:10px;
    text-transform:uppercase; letter-spacing:1px;
    padding:4px 12px;
  }
  .chat-msg.error {
    align-self:center;
    background:rgba(212,74,50,.12); color:var(--red);
    border:1px solid rgba(212,74,50,.25);
    font-size:11px; padding:6px 12px;
  }
  .chat-tool-call {
    font-size:10px; color:var(--text-muted);
    padding:4px 10px; margin:2px 0;
    border-left:2px solid var(--accent-dim);
    background:rgba(232,168,36,.04);
    font-family:'Share Tech Mono',monospace;
  }
  .chat-tool-call .tool-name { color:var(--accent); font-weight:700; }
  .chat-tool-call .tool-args { color:var(--tan); }
  .chat-tool-action {
    display:inline-block; margin-top:4px; padding:2px 8px;
    background:var(--surface-alt); border:1px solid var(--border);
    color:var(--cyan); font-size:10px; cursor:pointer;
    font-family:'Rajdhani',sans-serif; font-weight:600;
    text-transform:uppercase; letter-spacing:.5px;
    transition:all .15s; clip-path:var(--clip-sm);
  }
  .chat-tool-action:hover { background:var(--olive); color:var(--accent); border-color:var(--accent-dim); }
  .chat-typing {
    align-self:flex-start; padding:8px 14px;
    color:var(--accent); font-size:11px;
    text-transform:uppercase; letter-spacing:2px;
    animation:loadPulse 1.5s ease-in-out infinite;
  }
  .chat-input-wrap {
    display:flex; gap:0; padding:6px 8px;
    border-top:1px solid var(--border-hi);
    background:var(--surface); flex-shrink:0;
  }
  .chat-input {
    flex:1; background:var(--bg); border:1px solid var(--border);
    border-right:none; color:var(--text);
    font-family:'Share Tech Mono',monospace; font-size:12px;
    padding:8px 10px; outline:none; resize:none;
    min-height:36px; max-height:120px;
    line-height:1.4;
  }
  .chat-input:focus { border-color:var(--accent-dim); box-shadow:0 0 6px var(--accent-glow); }
  .chat-input::placeholder { color:var(--text-muted); opacity:.5; }
  .chat-send-btn {
    background:var(--olive); border:1px solid var(--border);
    color:var(--accent); padding:0 16px; cursor:pointer;
    font-family:'Rajdhani',sans-serif; font-size:12px;
    font-weight:700; text-transform:uppercase; letter-spacing:1px;
    transition:all .15s; flex-shrink:0;
  }
  .chat-send-btn:hover { background:var(--accent-dim); color:var(--bg); }
  .chat-send-btn:disabled { opacity:.3; cursor:default; }

  /* ── Project selector ─────────────────────────────────────── */
  .project-group { display:flex; align-items:center; gap:6px; margin-right:4px; }
  .project-group label {
    font-size:10px; color:var(--text-muted); text-transform:uppercase;
    letter-spacing:1px; font-weight:600; white-space:nowrap;
  }
  #project-select {
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    font-family:'Rajdhani',sans-serif; font-size:12px; font-weight:600;
    padding:2px 8px; max-width:180px; cursor:pointer;
    clip-path:var(--clip-sm); transition:all .15s;
  }
  #project-select:hover { border-color:var(--accent-dim); }
  #project-select:focus { outline:none; border-color:var(--accent); }

  /* ── New-project modal ────────────────────────────────────── */
  .modal-overlay {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.65);
    z-index:20000; align-items:center; justify-content:center;
  }
  .modal-overlay.open { display:flex; }
  .modal-box {
    background:var(--surface); border:1px solid var(--border-hi);
    padding:24px 28px; min-width:380px; max-width:480px;
    clip-path:var(--clip); box-shadow:0 12px 40px rgba(0,0,0,.7);
  }
  .modal-title {
    font-size:16px; font-weight:700; text-transform:uppercase;
    letter-spacing:2px; color:var(--accent); margin-bottom:18px;
  }
  .modal-field { margin-bottom:14px; }
  .modal-field label {
    display:block; font-size:11px; text-transform:uppercase;
    letter-spacing:1px; color:var(--text-muted); margin-bottom:4px; font-weight:600;
  }
  .modal-field input {
    width:100%; background:var(--bg); border:1px solid var(--border);
    color:var(--text); font-family:'Share Tech Mono',monospace;
    font-size:13px; padding:6px 10px; transition:border-color .15s;
  }
  .modal-field input:focus { outline:none; border-color:var(--accent); }
  .modal-error {
    color:var(--red); font-size:11px; margin-bottom:10px; min-height:16px;
    font-weight:600; letter-spacing:.5px;
  }
  .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }
  .modal-btn {
    background:var(--surface-alt); border:1px solid var(--border); color:var(--text-muted);
    cursor:pointer; font-family:'Rajdhani',sans-serif; font-size:12px;
    font-weight:700; text-transform:uppercase; letter-spacing:1px;
    padding:5px 18px; clip-path:var(--clip-sm); transition:all .15s;
  }
  .modal-btn:hover { background:var(--olive); color:var(--text); }
  .modal-btn.primary {
    background:var(--olive); color:var(--accent); border-color:var(--accent-dim);
  }
  .modal-btn.primary:hover { background:var(--accent-dim); color:var(--bg); }

  /* ── Folder browser (inside new-project modal) ────────────── */
  .modal-path-row {
    display:flex; gap:6px; align-items:stretch;
  }
  .modal-path-row input { flex:1; min-width:0; }
  .modal-btn-browse {
    background:var(--surface-alt); border:1px solid var(--border); color:var(--text-muted);
    cursor:pointer; font-family:'Rajdhani',sans-serif; font-size:11px;
    font-weight:700; text-transform:uppercase; letter-spacing:1px;
    padding:0 12px; white-space:nowrap; clip-path:var(--clip-sm); transition:all .15s;
  }
  .modal-btn-browse:hover { background:var(--olive); color:var(--accent); border-color:var(--accent-dim); }
  #np-browser {
    display:none; margin-top:10px; background:var(--bg); border:1px solid var(--border);
    max-height:260px; overflow-y:auto; padding:2px 0;
  }
  #np-browser.open { display:block; }
  .browser-bar {
    display:flex; align-items:center; gap:4px; padding:5px 8px;
    border-bottom:1px solid var(--border); background:var(--surface);
    font-size:11px; color:var(--text-muted); overflow:hidden;
  }
  .browser-bar-path {
    flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--text);
    direction:rtl; text-align:left;
  }
  .browser-up {
    background:none; border:1px solid var(--border); color:var(--text-muted);
    cursor:pointer; font-size:12px; padding:1px 6px; border-radius:2px;
    font-family:'Rajdhani',sans-serif; font-weight:700; transition:all .15s;
  }
  .browser-up:hover { color:var(--accent); border-color:var(--accent-dim); }
  .browser-up:disabled { opacity:.3; cursor:default; }
  .browser-item {
    display:flex; align-items:center; gap:6px; padding:4px 10px;
    cursor:pointer; font-size:12px; color:var(--text);
    font-family:'Share Tech Mono',monospace; transition:background .1s;
  }
  .browser-item:hover { background:var(--surface-alt); }
  .browser-item .b-icon { font-size:13px; flex-shrink:0; }
  .browser-item .b-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .browser-select-row {
    display:flex; justify-content:flex-end; gap:8px; padding:6px 8px;
    border-top:1px solid var(--border); background:var(--surface);
  }
  .browser-empty {
    padding:14px; text-align:center; color:var(--text-muted); font-size:11px;
    text-transform:uppercase; letter-spacing:1px;
  }

  /* ── Shortcuts panel ─────────────────────────────────────── */
  #shortcuts-panel {
    background:var(--surface); padding:16px 20px; font-size:12px;
    overflow-y:auto; width:100%; height:100%;
  }
  .shortcut-section {
    margin-bottom:14px;
  }
  .shortcut-section-title {
    font-size:10px; font-weight:700; text-transform:uppercase;
    letter-spacing:2px; color:var(--khaki); margin-bottom:6px;
    padding-bottom:4px; border-bottom:1px solid var(--border);
  }
  .shortcut-row {
    display:flex; align-items:center; justify-content:space-between;
    padding:4px 0; font-size:12px; color:var(--text);
  }
  .shortcut-row:hover { color:var(--accent); }
  .shortcut-label {
    font-weight:500; letter-spacing:.3px;
  }
  .shortcut-keys {
    display:flex; align-items:center; gap:3px; flex-shrink:0;
  }
  .shortcut-keys kbd {
    display:inline-flex; align-items:center; justify-content:center;
    min-width:22px; height:20px; padding:0 6px;
    background:var(--bg); border:1px solid var(--border-hi);
    border-bottom:2px solid var(--border-hi);
    border-radius:3px; font-family:'Share Tech Mono',monospace;
    font-size:11px; color:var(--text); line-height:1;
  }
  .shortcut-keys .key-plus {
    font-size:10px; color:var(--text-muted); padding:0 1px;
  }

  /* ── Label-mode (go-to-node) badges ─────────────────────── */
  .label-mode-badge rect {
    fill:#e8c547; rx:4; ry:4;
  }
  .label-mode-badge text {
    fill:#1a1e14; font-family:'Share Tech Mono',monospace;
    font-size:18px; font-weight:700; text-anchor:middle;
    dominant-baseline:central; pointer-events:none;
  }
  .label-mode-badge.dimmed rect { fill:#e8c54744; }
  .label-mode-badge.dimmed text { fill:#1a1e1466; }
  .label-mode-toast {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:#e8c547; color:#1a1e14; font-family:'Share Tech Mono',monospace;
    font-size:13px; font-weight:700; padding:6px 18px; border-radius:6px;
    z-index:99999; pointer-events:none; letter-spacing:1px;

<script>

// ── Directory tree helpers ─────────────────────────────────────────
var _dirTreeCache = null;   // cached API response
var _dirTreeLoading = false; // prevent duplicate fetches
var _dirEntryMap = {};       // path → { row: HTMLElement, toggle: HTMLElement, childContainer: HTMLElement|null, icon: HTMLElement }

function _renderDirNode(node, depth) {
  var el = document.createElement('div');

  var row = document.createElement('div');
  row.className = 'dir-entry';
  row.style.paddingLeft = (8 + depth * 14) + 'px';
  if (node.path) row.dataset.path = node.path;

  var toggle = document.createElement('span');
  toggle.className = 'dir-toggle' + (node.type === 'directory' ? '' : ' leaf');
  toggle.textContent = '▶';

  var icon = document.createElement('span');
  icon.className = 'dir-icon';
  icon.textContent = node.type === 'directory' ? '📂' : '📄';

  var name = document.createElement('span');
  name.className = 'dir-name';
  name.textContent = node.name;

  row.appendChild(toggle);
  row.appendChild(icon);
  row.appendChild(name);
  el.appendChild(row);

  // Click on a file opens it in the code editor
  if (node.type === 'file' && node.path) {
    row.style.cursor = 'pointer';
    row.addEventListener('click', function () {
      openSourceFile(node.path);
    });
  }

  var childContainer = null;

  if (node.type === 'directory' && node.children && node.children.length) {
    childContainer = document.createElement('div');
    childContainer.className = 'dir-children';

    node.children.forEach(function (child) {
      childContainer.appendChild(_renderDirNode(child, depth + 1));
    });

    el.appendChild(childContainer);

    toggle.addEventListener('click', function (e) {
      e.stopPropagation();
      var isOpen = childContainer.classList.toggle('open');
      toggle.classList.toggle('open', isOpen);
      icon.textContent = isOpen ? '📂' : '📁';
    });

    // Start top-level directories expanded
    if (depth === 0) {
      childContainer.classList.add('open');
      toggle.classList.add('open');
      icon.textContent = '📂';
    }
  }

  // Register in the lookup map
  if (node.path) {
    _dirEntryMap[node.path] = { row: row, toggle: toggle, childContainer: childContainer, icon: icon };
  }

  return el;
}

function _populateDirTree(container, tree) {
  _dirEntryMap = {};
  container.innerHTML = '';
  if (tree.children && tree.children.length) {
    tree.children.forEach(function (child) {
      container.appendChild(_renderDirNode(child, 0));
    });
  } else {
    container.innerHTML = '<div style="padding:12px;color:var(--text-muted);text-align:center;font-size:12px;text-transform:uppercase;letter-spacing:1px;">No files found</div>';
  }
}

function revealInFileTree(filePath) {
  if (!filePath) return;

  // Ensure the directory panel is open
  if (!WindowManager.layout.hasPanelInTree('directory') &&
      !WindowManager.floating.floatingPanels.has('directory')) {
    WindowManager.openPanel('directory');
  }
  // If it's in a tab group, switch to its tab
  if (WindowManager.layout.activateTab('directory')) {
    WindowManager.rebuildLayout();
    WindowManager._saveState();
  }

  // The tree may not have loaded yet — wait for it
  function _doReveal() {
    // Build the list of ancestor directory paths to expand
    var parts = filePath.split('/');
    var ancestors = [];
    for (var i = 1; i < parts.length; i++) {
      ancestors.push(parts.slice(0, i).join('/'));
    }

    // Expand each ancestor directory
    for (var j = 0; j < ancestors.length; j++) {
      var entry = _dirEntryMap[ancestors[j]];
      if (entry && entry.childContainer) {
        entry.childContainer.classList.add('open');
        entry.toggle.classList.add('open');
        entry.icon.textContent = '📂';
      }
    }

    // Clear any previous selection
    var prev = document.querySelector('.dir-entry.selected');
    if (prev) prev.classList.remove('selected');

    // Highlight and scroll to the target
    var target = _dirEntryMap[filePath];
    if (target) {
      target.row.classList.add('selected');
      // Scroll the file tree container so the entry is visible
      var treeContainer = document.getElementById('dir-tree');
      if (treeContainer) {
        setTimeout(function () {
          var rowTop = target.row.offsetTop;
          var containerH = treeContainer.clientHeight;
          treeContainer.scrollTop = Math.max(0, rowTop - containerH / 3);
        }, 60);
      }
    }
  }

  // If the tree hasn't loaded yet, wait for it, then reveal
  if (Object.keys(_dirEntryMap).length === 0) {
    // Tree not yet rendered — loadDirectoryTree is async. Poll briefly.
    var attempts = 0;
    var poller = setInterval(function () {
      attempts++;
      if (Object.keys(_dirEntryMap).length > 0 || attempts > 30) {
        clearInterval(poller);
        _doReveal();
      }
    }, 100);
  } else {
    _doReveal();
  }
}

function loadDirectoryTree(containerEl) {
  var container = containerEl || document.getElementById('dir-tree');
  if (!container) return;

  // If already cached, render immediately
  if (_dirTreeCache) {
    _populateDirTree(container, _dirTreeCache);
    return;
  }

  // If a fetch is already in flight, just wait — it will populate when done
  if (_dirTreeLoading) return;
  _dirTreeLoading = true;

  var apiBase = window.location.origin;
  fetch(apiBase + '/api/files')
    .then(function (resp) {
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return resp.json();
    })
    .then(function (tree) {
      _dirTreeCache = tree;
      _dirTreeLoading = false;
      // Re-grab the container — the panel may have been re-rendered while we waited
      var c = document.getElementById('dir-tree') || container;
      if (c) _populateDirTree(c, tree);
    })
    .catch(function (err) {
      _dirTreeLoading = false;
      var c = document.getElementById('dir-tree') || container;
      if (c) c.innerHTML = '<div style="padding:12px;color:var(--red);text-align:center;font-size:12px;">Error: ' + err.message + '</div>';
    });
}

PanelRegistry.register({
  id: 'directory',
  title: 'Files',
  icon: '📁',
  contentId: 'dir-tree',
  closable: true,
  floatable: true,
  render: function (content) {
    content.innerHTML = '<div class="panel-loading" data-loading-dir>Loading file tree…</div>';
    // Pass content element directly — it's not in the DOM yet during render
    loadDirectoryTree(content);
  },
});

// ── Code editor panel ──────────────────────────────────────────────
var _codeEditorCurrentPath = null;  // currently displayed file path
var _codeEditorLineStart = null;    // highlighted line range start
var _codeEditorLineEnd = null;      // highlighted line range end

function _renderCodeContent(container, path, content, lineStart, lineEnd) {
  var lines = content.split('\n');
  // If the file ends with a trailing newline, don't show the empty last line
  if (lines.length > 1 && lines[lines.length - 1] === '') lines.pop();

  var html = '<div class="code-editor-toolbar">' +
    '<span class="code-editor-filepath">' + _escHtml(path) + '</span>';
  if (lineStart && lineEnd) {
    html += '<span class="code-editor-line-info">Lines ' + lineStart + '–' + lineEnd + '</span>';
  }
  html += '</div><div class="code-editor-scroll" id="code-editor-scroll"><table class="code-editor-table"><tbody>';

  for (var i = 0; i < lines.length; i++) {
    var ln = i + 1;
    var isHighlight = (lineStart && lineEnd && ln >= lineStart && ln <= lineEnd);
    html += '<tr class="' + (isHighlight ? 'code-line-highlight' : '') + '" data-line="' + ln + '">' +
      '<td class="code-line-no">' + ln + '</td>' +
      '<td class="code-line-text">' + _escHtml(lines[i]) + '</td></tr>';
  }

  html += '</tbody></table></div>';
  container.innerHTML = html;

  // Scroll to the highlighted region
  if (lineStart) {
    setTimeout(function() {
      var scrollEl = document.getElementById('code-editor-scroll');
      var targetRow = scrollEl && scrollEl.querySelector('tr[data-line="' + lineStart + '"]');
      if (targetRow && scrollEl) {
        // Center the highlight in the viewport
        var scrollTop = targetRow.offsetTop - scrollEl.clientHeight / 3;
        scrollEl.scrollTop = Math.max(0, scrollTop);
      }
    }, 50);
  }
}

function _escHtml(str) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

function openSourceFile(filePath, lineStart, lineEnd, containerEl) {
  _codeEditorCurrentPath = filePath;
  _codeEditorLineStart = lineStart || null;
  _codeEditorLineEnd = lineEnd || null;

  // Ensure the code-editor panel is open
  if (!WindowManager.layout.hasPanelInTree('code-editor') &&
      !WindowManager.floating.floatingPanels.has('code-editor')) {
    WindowManager.openPanel('code-editor');
  }

  // If it's in a tab group, switch to its tab
  if (WindowManager.layout.activateTab('code-editor')) {
    WindowManager.rebuildLayout();
    WindowManager._saveState();
  }

  var container = containerEl || document.getElementById('code-editor');
  if (!container) return;
  container.innerHTML = '<div class="code-editor-placeholder">Loading…</div>';

  var apiBase = window.location.origin;
  fetch(apiBase + '/api/source?path=' + encodeURIComponent(filePath))
    .then(function(resp) {
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return resp.json();
    })
    .then(function(data) {
      var c = document.getElementById('code-editor') || container;
      if (!c) return;
      _renderCodeContent(c, data.path, data.content, lineStart, lineEnd);
    })
    .catch(function(err) {
      var c = document.getElementById('code-editor') || container;
      if (c) c.innerHTML = '<div class="code-editor-placeholder">Error: ' + err.message + '</div>';
    });
}

PanelRegistry.register({
  id: 'code-editor',
  title: 'Code',
  icon: '📝',
  contentId: 'code-editor',
  closable: true,
  floatable: true,
  render: function (content) {
    if (_codeEditorCurrentPath) {
      // Re-load current file (e.g. after panel re-mount)
      // Pass content directly — it's not in the DOM yet during render
      content.innerHTML = '<div class="code-editor-placeholder">Loading…</div>';
      openSourceFile(_codeEditorCurrentPath, _codeEditorLineStart, _codeEditorLineEnd, content);
    } else {
      content.innerHTML = '<div class="code-editor-placeholder">Right-click a node<br>and choose "View Code"</div>';
    }
  },
});

// ── Insights panel ─────────────────────────────────────────────────
var _insightsData = null;
var _insightsLoading = false;
var _activeInsightIndex = -1;

var _SEVERITY_ICONS = { error: '🔴', warning: '🟡', info: '🔵' };
var _SEVERITY_LABELS = { error: 'Error', warning: 'Warning', info: 'Info' };

function _renderInsightsPanel(container, insights) {
  if (!insights || insights.length === 0) {
    container.innerHTML = '<div class="insights-empty">No architectural issues detected<br>Codebase looks healthy</div>';
    return;
  }

  // Summary counts
  var counts = { error: 0, warning: 0, info: 0 };
  insights.forEach(function(i) { counts[i.severity] = (counts[i.severity] || 0) + 1; });

  var html = '<div class="insights-header"><h4>Insights</h4>';
  html += '<span class="insights-badge mixed">' + insights.length + '</span>';
  html += '</div>';

  html += '<div class="insights-summary">';
  if (counts.error > 0) html += '<div class="insights-summary-item"><div class="insights-summary-dot" style="background:#d44a32"></div>' + counts.error + ' errors</div>';
  if (counts.warning > 0) html += '<div class="insights-summary-item"><div class="insights-summary-dot" style="background:#e8a824"></div>' + counts.warning + ' warnings</div>';
  if (counts.info > 0) html += '<div class="insights-summary-item"><div class="insights-summary-dot" style="background:#5ab8a8"></div>' + counts.info + ' info</div>';
  html += '</div>';

  html += '<div class="insights-list">';
  for (var i = 0; i < insights.length; i++) {
    var ins = insights[i];
    var icon = _SEVERITY_ICONS[ins.severity] || '●';
    html += '<div class="insight-item" data-insight-index="' + i + '">' +
      '<div class="insight-severity-icon">' + icon + '</div>' +
      '<div class="insight-body">' +
        '<div class="insight-title ' + ins.severity + '">' + _escHtml(ins.title) + '</div>' +
        '<div class="insight-desc">' + _escHtml(ins.description) + '</div>' +
        '<div class="insight-rule">' + ins.rule_name.replace(/_/g, ' ') + '</div>' +
      '</div></div>';
  }
  html += '</div>';
  container.innerHTML = html;

  // Click handler for each insight
  container.querySelectorAll('.insight-item').forEach(function(el) {
    el.addEventListener('click', function() {
      var idx = parseInt(el.dataset.insightIndex, 10);
      _selectInsight(idx, container);
    });
  });
}

function _selectInsight(idx, container) {
  if (!_insightsData || idx < 0 || idx >= _insightsData.length) return;
  var ins = _insightsData[idx];
  _activeInsightIndex = idx;

  // Highlight the active row
  if (container) {
    container.querySelectorAll('.insight-item').forEach(function(el) {
      el.classList.toggle('active', parseInt(el.dataset.insightIndex, 10) === idx);
    });
  }

  // Highlight affected nodes on the graph
  _highlightInsightNodes(ins.affected_node_ids);

  // Show first affected node in the inspector
  if (ins.affected_node_ids.length > 0) {
    var nodeId = ins.affected_node_ids[0];
    var node = null;
    if (graphData && graphData.nodes) {
      node = graphData.nodes.find(function(n) { return n.id === nodeId; });
    }
    if (!node && fullGraphData && fullGraphData.nodes) {
      node = fullGraphData.nodes.find(function(n) { return n.id === nodeId; });
    }
    if (node) {
      _inspectorPinned = true;
      populatePanel(node);
      // Center the detail view on the node if it has coordinates
      if (node.x != null && node.y != null) {
        centerDetailOnGraphPoint(node.x, node.y, true);
      }
    }
  }
}

function _highlightInsightNodes(affectedIds) {
  if (!window._nodes || !window._links || !window._nodeData) return;

  var affectedSet = new Set(affectedIds);

  // ── Overview panel ──────────────────────────────────────────
  window._nodes.selectAll('.node-rect')
    .style('opacity', function(n) { return affectedSet.has(n.id) ? 1 : 0.12; })
    .style('filter', function(n) { return affectedSet.has(n.id) ? 'brightness(1.3) drop-shadow(0 0 10px rgba(212,74,50,.5))' : null; });
  window._nodes.selectAll('.node-title')
    .style('opacity', function(n) { return affectedSet.has(n.id) ? 1 : 0.12; });
  window._nodes.selectAll('.node-kind-inside')
    .style('opacity', function(n) { return affectedSet.has(n.id) ? 1 : 0.12; });

  // Highlight edges between affected nodes
  window._links.style('opacity', function(e) {
    var sid = _nid(e.source), tid = _nid(e.target);
    if (affectedSet.has(sid) && affectedSet.has(tid)) return 0.9;
    if (affectedSet.has(sid) || affectedSet.has(tid)) return 0.25;
    return 0.04;
  });

  // ── Detail panel ────────────────────────────────────────────
  var zoomSvg = d3.select('#zoom-svg');
  zoomSvg.selectAll('.node-group').each(function() {
    var el = d3.select(this);
    var nid = el.attr('data-node-id');
    if (!nid) return;
    var isAffected = affectedSet.has(nid);
    el.selectAll('.node-rect')
      .style('opacity', isAffected ? 1 : 0.12)
      .style('filter', isAffected ? 'brightness(1.3) drop-shadow(0 0 10px rgba(212,74,50,.5))' : null);
    el.selectAll('.node-title').style('opacity', isAffected ? 1 : 0.12);
    el.selectAll('.node-kind-inside').style('opacity', isAffected ? 1 : 0.12);
  });
  zoomSvg.selectAll('[data-edge-src]').each(function() {
    var el = d3.select(this);
    var sid = el.attr('data-edge-src'), tid = el.attr('data-edge-tgt');
    if (affectedSet.has(sid) && affectedSet.has(tid)) el.style('opacity', 0.9);
    else if (affectedSet.has(sid) || affectedSet.has(tid)) el.style('opacity', 0.25);
    else el.style('opacity', 0.04);
  });
}

function loadInsights(containerEl) {
  var container = containerEl || document.getElementById('insights-panel');
  if (!container) return;

  if (_insightsData) {
    _renderInsightsPanel(container, _insightsData);
    return;
  }

  if (_insightsLoading) return;
  _insightsLoading = true;
  container.innerHTML = '<div class="insights-loading">Detecting patterns…</div>';

  var apiBase = window.location.origin;
  fetch(apiBase + '/api/insights')
    .then(function(resp) {
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return resp.json();
    })
    .then(function(data) {
      _insightsData = data.insights || [];
      _insightsLoading = false;
      var c = document.getElementById('insights-panel') || container;
      if (c) _renderInsightsPanel(c, _insightsData);
    })
    .catch(function(err) {
      _insightsLoading = false;
      var c = document.getElementById('insights-panel') || container;
      if (c) c.innerHTML = '<div class="insights-error">Error: ' + err.message + '</div>';
    });
}

PanelRegistry.register({
  id: 'insights',
  title: 'Insights',
  icon: '⚠️',
  contentId: 'insights-panel',
  closable: true,
  floatable: true,
  render: function (content) {
    content.id = 'insights-panel';
    loadInsights(content);
  },
});

// ================================================================
// LLM CHAT PANEL
// ================================================================

var _chatMessages = [];        // {role, content} history sent to API
var _chatModel = 'gpt-4o-mini';
var _chatStreaming = false;
var _chatModels = [];

function _chatEscHtml(s) {
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

/**
 * Minimal Markdown → HTML converter (handles inline code, code blocks,
 * bold, italic, headings, lists, paragraphs).
 */
function _chatMarkdown(md) {
  if (!md) return '';
  // Code blocks
  var html = md.replace(/```(\w*)\n([\s\S]*?)```/g, function(_, lang, code) {
    return '<pre><code>' + _chatEscHtml(code.replace(/\n$/, '')) + '</code></pre>';
  });
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Italic
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Headings
  html = html.replace(/^##### (.+)$/gm, '<h5>$1</h5>');
  html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // Unordered lists
  html = html.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
  html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');
  // Paragraphs (split on double newlines)
  var parts = html.split(/\n{2,}/);
  html = parts.map(function(p) {
    p = p.trim();
    if (!p) return '';
    if (/^<[hupol]/.test(p)) return p; // already wrapped
    return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
  }).join('\n');
  return html;
}

function _chatRenderMessage(msg, messagesEl) {
  var div = document.createElement('div');
  div.className = 'chat-msg ' + msg.role;
  if (msg.role === 'assistant') {
    div.innerHTML = _chatMarkdown(msg.content);
  } else if (msg.role === 'user') {
    div.textContent = msg.content;
  } else if (msg.role === 'system' || msg.role === 'error') {
    div.className = 'chat-msg ' + msg.role;
    div.textContent = msg.content;
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function _chatRenderToolCall(name, args, messagesEl) {
  var div = document.createElement('div');
  div.className = 'chat-tool-call';
  var argsStr = '';
  if (args) {
    var keys = Object.keys(args);
    if (keys.length > 0) {
      argsStr = keys.map(function(k) {
        var v = args[k];
        if (typeof v === 'string' && v.length > 80) v = v.substring(0, 80) + '…';
        return k + '=' + JSON.stringify(v);
      }).join(', ');
    }
  }
  div.innerHTML = '⚡ <span class="tool-name">' + _chatEscHtml(name) + '</span>' +
    (argsStr ? ' <span class="tool-args">(' + _chatEscHtml(argsStr) + ')</span>' : '');
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function _chatHandleToolAction(result) {
  // Process tool results that contain UI actions (navigate, open file)
  try {
    var data = typeof result === 'string' ? JSON.parse(result) : result;
    if (data.action === 'navigate_to_node' && data.node_name) {
      // Trigger search + navigate
      if (typeof _selectSearchResult === 'function' && typeof _searchTrie !== 'undefined' && _searchTrie) {
        var results = _searchTrie.search(data.node_name.toLowerCase(), 1);
        if (results.length > 0) {
          _selectSearchResult(results[0]);
        }
      }
    } else if (data.action === 'open_file_in_editor' && data.path) {
      if (typeof openSourceFile === 'function') {
        openSourceFile(data.path, data.line_start || null, data.line_end || null);
      }
    }
  } catch (_) { /* not JSON or not an action */ }
}

async function _chatSendMessage() {
  var panel = document.getElementById('chat-panel');
  if (!panel) return;
  var input = panel.querySelector('.chat-input');
  var messagesEl = panel.querySelector('.chat-messages');
  var sendBtn = panel.querySelector('.chat-send-btn');
  if (!input || !messagesEl) return;

  var text = input.value.trim();
  if (!text || _chatStreaming) return;

  // If there's pending node context from a Query action, append it to the API message
  var apiText = text;
  if (_chatQueryNodeContext) {
    apiText = text + '\n\nNode context:\n' + _chatQueryNodeContext;
    _chatQueryNodeContext = null;
  }

  // Show user's typed text in the UI, but send the enriched version to the API
  _chatMessages.push({role: 'user', content: apiText});
  _chatRenderMessage({role: 'user', content: text}, messagesEl);
  input.value = '';
  input.style.height = 'auto';

  _chatStreaming = true;
  if (sendBtn) sendBtn.disabled = true;

  // Show typing indicator
  var typingDiv = document.createElement('div');
  typingDiv.className = 'chat-typing';
  typingDiv.textContent = 'Thinking…';
  messagesEl.appendChild(typingDiv);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  var assistantContent = '';
  var assistantDiv = null;

  try {
    var apiBase = window.location.origin;
    var resp = await fetch(apiBase + '/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        messages: _chatMessages,
        model: _chatModel,
      }),
    });

    if (!resp.ok) {
      throw new Error('HTTP ' + resp.status);
    }

    var reader = resp.body.getReader();
    var decoder = new TextDecoder();
    var buffer = '';

    while (true) {
      var chunk = await reader.read();
      if (chunk.done) break;
      buffer += decoder.decode(chunk.value, {stream: true});

      // Process complete lines
      var lines = buffer.split('\n');
      buffer = lines.pop(); // keep incomplete line

      for (var li = 0; li < lines.length; li++) {
        var line = lines[li].trim();
        if (!line) continue;

        try {
          var evt = JSON.parse(line);
        } catch (_) { continue; }

        if (evt.type === 'delta') {
          // Remove typing indicator
          if (typingDiv.parentNode) typingDiv.remove();
          // Start or append to assistant message
          if (!assistantDiv) {
            assistantDiv = document.createElement('div');
            assistantDiv.className = 'chat-msg assistant';
            messagesEl.appendChild(assistantDiv);
          }
          assistantContent += evt.content;
          assistantDiv.innerHTML = _chatMarkdown(assistantContent);
          messagesEl.scrollTop = messagesEl.scrollHeight;

        } else if (evt.type === 'tool_call') {
          if (typingDiv.parentNode) typingDiv.remove();
          _chatRenderToolCall(evt.name, evt.args, messagesEl);

        } else if (evt.type === 'tool_result') {
          // Check for UI actions
          _chatHandleToolAction(evt.content);
          // If a new assistant response follows tool results, reset the div
          if (assistantDiv && assistantContent) {
            _chatMessages.push({role: 'assistant', content: assistantContent});
            assistantDiv = null;
            assistantContent = '';
          }

        } else if (evt.type === 'error') {
          if (typingDiv.parentNode) typingDiv.remove();
          _chatRenderMessage({role: 'error', content: evt.content}, messagesEl);

        } else if (evt.type === 'done') {
          // Finalize
          if (assistantContent) {
            _chatMessages.push({role: 'assistant', content: assistantContent});
          }
        }
      }
    }
  } catch (err) {
    if (typingDiv.parentNode) typingDiv.remove();
    _chatRenderMessage({role: 'error', content: 'Error: ' + err.message}, messagesEl);
  }

  _chatStreaming = false;
  if (sendBtn) sendBtn.disabled = false;
  if (typingDiv.parentNode) typingDiv.remove();
}

function _chatLoadModels(selectEl) {
  var apiBase = window.location.origin;
  fetch(apiBase + '/api/chat/models')
    .then(function(resp) { return resp.json(); })
    .then(function(data) {

      selectEl.innerHTML = '';

    });
}

/**
 * Build a concise context string describing a graph node for the LLM.
 */
function _buildNodeContext(d) {
  var parts = [];
  parts.push('Node: ' + d.name);
  parts.push('Kind: ' + d.kind);
  if (d.qualified_name) parts.push('Qualified name: ' + d.qualified_name);
  if (d.file_path) parts.push('File: ' + d.file_path);
  if (d.line_start && d.line_end) parts.push('Lines: ' + d.line_start + '–' + d.line_end);
  if (d.bases && d.bases.length > 0) parts.push('Inherits from: ' + d.bases.join(', '));
  if (d.docstring) parts.push('Docstring: ' + d.docstring);
  if (d.methods && d.methods.length > 0) parts.push('Methods (' + d.methods.length + '): ' + d.methods.slice(0, 15).join(', ') + (d.methods.length > 15 ? '…' : ''));
  if (d.members && d.members.length > 0) parts.push('Grouped classes (' + d.members.length + '): ' + d.members.slice(0, 15).join(', ') + (d.members.length > 15 ? '…' : ''));

  // Add relationship info from current graph
  if (graphData && graphData.edges) {
    var incoming = graphData.edges.filter(function(e) { return _nid(e.target) === d.id; });
    var outgoing = graphData.edges.filter(function(e) { return _nid(e.source) === d.id; });
    var findName = function(id) { var rid = typeof id === 'object' ? id.id : id; var n = graphData.nodes.find(function(n) { return n.id === rid; }); return n ? n.name : rid; };
    if (outgoing.length > 0) {
      parts.push('Outgoing edges: ' + outgoing.slice(0, 10).map(function(e) { return e.kind + ' → ' + findName(e.target); }).join(', ') + (outgoing.length > 10 ? '…' : ''));
    }
    if (incoming.length > 0) {
      parts.push('Incoming edges: ' + incoming.slice(0, 10).map(function(e) { return findName(e.source) + ' ' + e.kind + ' →'; }).join(', ') + (incoming.length > 10 ? '…' : ''));
    }
  }
  return parts.join('\n');
}

      for (var li = 0; li < lines.length; li++) {

        if (evt.type === 'delta') {
